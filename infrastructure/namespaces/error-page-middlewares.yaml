apiVersion: v1
kind: Service
metadata:
  name: error-pages
  namespace: apps
spec:
  type: ExternalName
  externalName: error-pages.traefik.svc.cluster.local
  ports:
    - {name: http, port: 80}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: custom-errors
  namespace: apps
spec:
  errors:
    status: ["403"]
    query: /403.html
    service:
      kind: Service
      name: error-pages
      port: 80
      scheme: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-vpn-only
  namespace: apps
spec:
  ipAllowList:
    sourceRange:
      # Exclude both K3s node IPs (.2/.3). Cross-node pod-to-hostPort traffic
      # is SNATed to the peer node address and must not inherit LAN trust.
      - 192.168.1.0/31
      - 192.168.1.4/30
      - 192.168.1.8/29
      - 192.168.1.16/28
      - 192.168.1.32/27
      - 192.168.1.64/26
      - 192.168.1.128/25
      - 10.8.0.0/24
      # wg-easy masquerades VPN clients to the Pi's fixed node PodCIDR.
      # Scope this exception to that node; never trust 10.42.0.0/16.
      - 10.42.1.0/24
---
