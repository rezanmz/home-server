apiVersion: v1
kind: Service
metadata:
  name: error-pages
  namespace: apps
spec:
  type: ExternalName
  externalName: error-pages.traefik.svc.cluster.local
  ports:
    - {name: http, port: 80}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: custom-errors
  namespace: apps
spec:
  errors:
    status: ["403"]
    query: /403.html
    service:
      kind: Service
      name: error-pages
      port: 80
      scheme: http
---
