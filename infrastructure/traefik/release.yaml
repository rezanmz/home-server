apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: traefik
      version: 41.0.2
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    deployment:
      kind: DaemonSet
    ingressClass:
      enabled: false
      isDefaultClass: false
    providers:
      kubernetesCRD:
        # Required for Gateway API HTTPRoute ExtensionRef filters such as the
        # LAN/VPN IP allow-lists on network-service admin routes.
        enabled: true
        # The shared SWAG-compatible error page is exposed to each application
        # namespace through a tightly scoped ExternalName service alias.
        allowExternalNameServices: true
      kubernetesIngress:
        enabled: false
      kubernetesGateway:
        enabled: true
        experimentalChannel: false
        statusAddress:
          service:
            enabled: true
    gatewayClass:
      enabled: true
      name: traefik
    gateway:
      enabled: true
      name: home
      listeners:
        web:
          port: 8000
          protocol: HTTP
          namespacePolicy:
            from: All
        websecure:
          port: 8443
          protocol: HTTPS
          namespacePolicy:
            from: All
          certificateRefs:
            - name: reza-network-tls
    api:
      dashboard: false
      insecure: false
    ingressRoute:
      dashboard:
        enabled: false
    accessLog:
      enabled: true
      format: json
      fields:
        headers:
          defaultMode: drop
    ports:
      web:
        hostPort: 80
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        hostPort: 443
        expose:
          default: true
    service:
      annotations:
        metallb.io/address-pool: home-lan
        metallb.io/loadBalancerIPs: 192.168.1.240
      spec:
        type: LoadBalancer
        externalTrafficPolicy: Local
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
