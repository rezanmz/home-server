apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: traefik
      version: 41.0.2
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    deployment:
      replicas: 1
    ingressClass:
      enabled: false
      isDefaultClass: false
    providers:
      kubernetesCRD:
        enabled: false
      kubernetesIngress:
        enabled: false
      kubernetesGateway:
        enabled: true
        experimentalChannel: false
        statusAddress:
          service:
            enabled: true
    gatewayClass:
      enabled: true
      name: traefik
    gateway:
      enabled: true
      name: home
      listeners:
        web:
          port: 8000
          protocol: HTTP
          namespacePolicy:
            from: All
    api:
      dashboard: false
      insecure: false
    ingressRoute:
      dashboard:
        enabled: false
    accessLog:
      enabled: true
      format: json
      fields:
        headers:
          defaultMode: drop
    ports:
      websecure:
        expose:
          default: false
    service:
      annotations:
        metallb.io/address-pool: home-lan
        metallb.io/loadBalancerIPs: 192.168.1.240
      spec:
        type: LoadBalancer
        externalTrafficPolicy: Local
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
