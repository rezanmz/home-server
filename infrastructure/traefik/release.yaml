apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: traefik
    namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      strategy: rollback
  values:
    image:
      digest: sha256:9c3b91d5fb7770853ca5c1124a23c34bf2d9b47ffaebeab2614cbaf410dcb2ac
    versionOverride: v3.7.10
    deployment:
      kind: DaemonSet
    # Traefik binds host ports 80/443 on every node, so a surge pod cannot be
    # scheduled beside the existing pod during an update.
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    ingressClass:
      enabled: false
      isDefaultClass: false
    providers:
      kubernetesCRD:
        # Required for Gateway API HTTPRoute ExtensionRef filters such as the
        # LAN/VPN IP allow-lists on network-service admin routes.
        enabled: true
        # The shared SWAG-compatible error page is exposed to each application
        # namespace through a tightly scoped ExternalName service alias.
        allowExternalNameServices: true
      kubernetesIngress:
        enabled: false
      kubernetesGateway:
        enabled: true
        experimentalChannel: false
        # Only this namespace may bridge a Gateway API backendRef into a
        # TraefikService. Syncthing uses it for authenticated backend mTLS.
        crossProviderNamespaces:
          - network-services
        statusAddress:
          service:
            enabled: true
    gatewayClass:
      enabled: true
      name: traefik
    gateway:
      enabled: true
      name: home
      listeners:
        web:
          port: 8000
          protocol: HTTP
          namespacePolicy:
            from: All
        websecure:
          port: 8443
          protocol: HTTPS
          namespacePolicy:
            from: All
          certificateRefs:
            - name: reza-network-tls
    api:
      dashboard: false
      insecure: false
    ingressRoute:
      dashboard:
        enabled: false
    accessLog:
      enabled: true
      format: json
      fields:
        # Request paths can contain bearer credentials, including Home
        # Assistant webhook IDs. Retain routing/status metadata without URLs.
        names:
          RequestLine: drop
          RequestPath: drop
        headers:
          defaultMode: drop
        queryParameters:
          defaultMode: drop
    metrics:
      prometheus:
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
        service:
          enabled: true
          labels:
            observability.reza.network/scrape: traefik
    ports:
      web:
        hostPort: 80
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        hostPort: 443
        expose:
          default: true
    service:
      annotations:
        metallb.io/address-pool: home-lan
        metallb.io/loadBalancerIPs: 192.168.1.240
      spec:
        type: LoadBalancer
        externalTrafficPolicy: Local
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
