apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  labels:
    # Host ports are required so the existing router forwarding to the Pi can
    # terminate directly at the K3s Traefik DaemonSet after SWAG is retired.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
