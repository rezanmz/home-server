# Installed as /etc/netplan/00-installer-config.yaml.
# The Kubernetes node uses only its wired interface and static LAN address.
network:
  version: 2
  ethernets:
    enp1s0:
      match:
        macaddress: 78:55:36:07:5d:58
      set-name: enp1s0
      dhcp4: false
      dhcp6: false
      addresses:
        - 192.168.1.3/24
      routes:
        - to: default
          via: 192.168.1.1
      nameservers:
        # Cluster nodes must not depend on the Blocky workload they are
        # responsible for recreating. LAN clients still receive Blocky through
        # Kea; only the node host resolver uses independent public upstreams
        # from three distinct operators, so a single operator's blip cannot
        # take down cluster-wide external resolution (CoreDNS forwards to
        # this same list). Keep exactly three: kubelet caps the nameserver
        # list it copies into dnsPolicy=Default pods at three and warns
        # (DNSConfigForming) about any excess.
        addresses:
          - 1.1.1.1
          - 8.8.8.8
          - 9.9.9.9
