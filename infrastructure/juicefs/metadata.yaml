apiVersion: v1
kind: Service
metadata:
  name: juicefs-postgresql
  namespace: juicefs-system
  labels:
    app.kubernetes.io/name: juicefs-postgresql
    app.kubernetes.io/component: metadata
spec:
  selector:
    app.kubernetes.io/name: juicefs-postgresql
    app.kubernetes.io/component: metadata
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
    - name: metrics
      port: 9187
      targetPort: metrics
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: juicefs-postgresql
  namespace: juicefs-system
  labels:
    app.kubernetes.io/name: juicefs-postgresql
    app.kubernetes.io/component: metadata
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: juicefs-postgresql
  namespace: juicefs-system
  labels:
    app.kubernetes.io/name: juicefs-postgresql
    app.kubernetes.io/component: metadata
spec:
  serviceName: juicefs-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: juicefs-postgresql
      app.kubernetes.io/component: metadata
  template:
    metadata:
      labels:
        app.kubernetes.io/name: juicefs-postgresql
        app.kubernetes.io/component: metadata
    spec:
      automountServiceAccountToken: false
      # TEMPORARY: keep the metadata authority on Beelink while the Pi's root
      # filesystem also holds the pre-cutover media source. Remove this
      # selector only after the source library has been reclaimed, Pi free
      # space is above the normal kubelet threshold, and the second Longhorn
      # replica has rebuilt successfully.
      nodeSelector:
        kubernetes.io/hostname: beelink
      # A metadata restart makes every JuiceFS mount unavailable. Protect this
      # pod from ordinary pressure-based eviction without allowing it to evict
      # another workload.
      priorityClassName: juicefs-mount-priority-nonpreempting
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgresql
          image: docker.io/library/postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: POSTGRES_DB, value: juicefs}
            - {name: POSTGRES_USER, value: juicefs}
            # Longhorn formats the volume as ext4, whose mount root contains
            # lost+found. PostgreSQL requires an empty data directory.
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_INITDB_ARGS, value: --auth-host=scram-sha-256}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: juicefs-media-credentials
                  key: postgres-password
          ports:
            - {name: postgresql, containerPort: 5432, protocol: TCP}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "juicefs", "-d", "juicefs"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "juicefs", "-d", "juicefs"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              {cpu: 100m, memory: 256Mi, ephemeral-storage: 64Mi}
            limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1@sha256:e96064f876226d94bb6ce48a4c4b3dd76edba91168ec1ab024e5c4b959310b0f
          imagePullPolicy: IfNotPresent
          args: ["--web.listen-address=:9187"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          env:
            - {name: DATA_SOURCE_URI, value: "127.0.0.1:5432/juicefs?sslmode=disable"}
            - {name: DATA_SOURCE_USER, value: juicefs}
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: juicefs-media-credentials
                  key: postgres-password
          ports:
            - {name: metrics, containerPort: 9187, protocol: TCP}
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 20m, memory: 32Mi, ephemeral-storage: 16Mi}
            limits: {cpu: 250m, memory: 128Mi, ephemeral-storage: 64Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: juicefs-postgresql}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
