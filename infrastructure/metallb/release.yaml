apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: metallb
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    controller:
      image:
        tag: v0.16.2@sha256:34a6f107f29c4fc6e9d084a7f3bdb781aae7b5ee2b534195a2775ab68c09c503
      # The controller also serves the validating webhook used by every
      # MetalLB configuration reconciliation. Keep it out of BestEffort so a
      # busy storage/download node cannot starve the webhook during rollout.
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 250m, memory: 256Mi}
    speaker:
      image:
        tag: v0.16.2@sha256:01666518b091a6651d68891c802db84b2219495d7e0e41c2e61c46f9976be231
      resources:
        requests: {cpu: 25m, memory: 64Mi}
        limits: {cpu: 250m, memory: 256Mi}
    # This home LAN uses ARP/NDP L2 advertisements only; no BGP daemon is
    # required on either node.
    frrk8s:
      enabled: false
