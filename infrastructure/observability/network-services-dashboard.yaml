apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-network-services
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Home Server
data:
  network-services.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"mappings": [{"options": {"0": {"color": "red", "text": "DOWN"}, "1": {"color": "green", "text": "UP"}}, "type": "value"}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}},
          "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "targets": [{"expr": "max(up{namespace=\"network-services\",service=\"blocky-metrics\"})", "refId": "A"}],
          "title": "Blocky DNS scrape",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"mappings": [{"options": {"0": {"color": "red", "text": "DOWN"}, "1": {"color": "green", "text": "UP"}}, "type": "value"}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}},
          "gridPos": {"h": 5, "w": 6, "x": 6, "y": 0},
          "id": 2,
          "targets": [{"expr": "max(up{namespace=\"network-services\",service=\"kea-metrics\"})", "refId": "A"}],
          "title": "Kea DHCP scrape",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"decimals": 2, "unit": "reqps"}},
          "gridPos": {"h": 5, "w": 6, "x": 12, "y": 0},
          "id": 3,
          "targets": [{"expr": "sum(rate(blocky_query_total[5m]))", "refId": "A"}],
          "title": "DNS queries / second",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"decimals": 1, "max": 1, "min": 0, "unit": "percentunit"}},
          "gridPos": {"h": 5, "w": 6, "x": 18, "y": 0},
          "id": 4,
          "targets": [{"expr": "max(kea_dhcp4_addresses_assigned_total{pool!=\"\"} / kea_dhcp4_addresses_total{pool!=\"\"})", "refId": "A"}],
          "title": "DHCP pool utilization",
          "type": "gauge"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}},
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 5},
          "id": 5,
          "targets": [{"expr": "sum by (response_type) (rate(blocky_response_total[5m]))", "legendFormat": "{{response_type}}", "refId": "A"}],
          "title": "DNS responses by result",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "pps"}},
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 5},
          "id": 6,
          "targets": [
            {"expr": "sum by (operation) (rate(kea_dhcp4_packets_received_total[5m]))", "legendFormat": "received {{operation}}", "refId": "A"},
            {"expr": "sum by (operation) (rate(kea_dhcp4_packets_sent_total[5m]))", "legendFormat": "sent {{operation}}", "refId": "B"}
          ],
          "title": "DHCP packet activity",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"decimals": 0, "unit": "short"}},
          "gridPos": {"h": 7, "w": 8, "x": 0, "y": 14},
          "id": 7,
          "targets": [{"expr": "sum(blocky_denylist_cache_entries)", "refId": "A"}],
          "title": "Blocked-domain entries",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"decimals": 0, "unit": "s"}},
          "gridPos": {"h": 7, "w": 8, "x": 8, "y": 14},
          "id": 8,
          "targets": [{"expr": "time() - max(blocky_last_list_group_refresh_timestamp_seconds)", "refId": "A"}],
          "title": "Denylist refresh age",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"decimals": 0, "unit": "short"}},
          "gridPos": {"h": 7, "w": 8, "x": 16, "y": 14},
          "id": 9,
          "targets": [{"expr": "max(kea_dhcp4_addresses_assigned_total{pool!=\"\"})", "refId": "A"}],
          "title": "Active DHCP leases",
          "type": "stat"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 42,
      "tags": ["dns", "dhcp", "blocky", "kea"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "browser",
      "title": "DNS and DHCP",
      "uid": "home-server-dns-dhcp",
      "version": 1
    }
