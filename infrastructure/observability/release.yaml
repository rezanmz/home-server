apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: observability
  namespace: monitoring
spec:
  interval: 30m
  timeout: 20m
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
    namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      strategy: rollback
  values:
    fullnameOverride: observability

    defaultRules:
      create: true
      rules:
        # K3s embeds these control-plane components and does not expose the
        # standalone endpoints expected by the upstream kubeadm rules.
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        windows: false
      additionalRuleLabels:
        cluster: home-server
    kubeEtcd: {enabled: false}
    kubeControllerManager: {enabled: false}
    kubeProxy: {enabled: false}
    kubeScheduler: {enabled: false}

    additionalPrometheusRulesMap:
      home-server-storage:
        groups:
          - name: home-server.longhorn
            rules:
              - alert: LonghornVolumeDegraded
                expr: max by (pvc_namespace, pvc, volume) (longhorn_volume_robustness{state="degraded"}) == 1
                for: 10m
                labels:
                  severity: warning
                  cluster: home-server
                annotations:
                  summary: Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} is degraded
                  description: The volume has had fewer healthy replicas than intended for at least 10 minutes.
                  runbook_url: https://github.com/rezanmz/home-server/blob/main/docs/runbook.md#observability-and-alerting
              - alert: LonghornVolumeFaulted
                expr: max by (pvc_namespace, pvc, volume) (longhorn_volume_robustness{state="faulted"}) == 1
                for: 2m
                labels:
                  severity: critical
                  cluster: home-server
                annotations:
                  summary: Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} is faulted
                  description: Longhorn cannot provide the volume from its available replicas.
                  runbook_url: https://github.com/rezanmz/home-server/blob/main/docs/runbook.md#observability-and-alerting
              - alert: LonghornNodeNotReady
                expr: max by (node) (longhorn_node_status{condition="ready"}) == 0
                for: 10m
                labels:
                  severity: critical
                  cluster: home-server
                annotations:
                  summary: Longhorn node {{ $labels.node }} is not ready
                  description: Longhorn has reported the storage node as unavailable for at least 10 minutes.
                  runbook_url: https://github.com/rezanmz/home-server/blob/main/docs/runbook.md#observability-and-alerting
              - alert: LonghornNodeUnschedulable
                expr: max by (node) (longhorn_node_status{condition="schedulable"}) == 0
                for: 15m
                labels:
                  severity: warning
                  cluster: home-server
                annotations:
                  summary: Longhorn cannot schedule replicas on {{ $labels.node }}
                  description: Check disk free space, reservations, node readiness, and Longhorn scheduling conditions.
                  runbook_url: https://github.com/rezanmz/home-server/blob/main/docs/runbook.md#observability-and-alerting

    prometheusOperator:
      admissionWebhooks:
        enabled: false
      # Operator-native TLS reuses the admission-webhook certificate Secret.
      # Keep both disabled together so a webhook-free install does not wait for
      # a certificate-generation Job that is intentionally not deployed.
      tls:
        enabled: false
      namespaces:
        releaseNamespace: true
      automountServiceAccountToken: true
      image:
        tag: v0.93.1
        sha: e52bb28fd41c98dd407c7a8cba8bdcfe7eabd7447e250afaf1fe7bb816dedbff
      prometheusConfigReloader:
        image:
          tag: v0.93.1
          sha: 428f088fe6fe07ab138bda92113664b04848a1dc408e4d3680a60ecdb55d1a65
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
      thanosImage:
        tag: v0.42.4
        sha: b567818fe608067eb0f1d7c2c4fe361e7ad83c8a256234c97685f1d0bf670cc8
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {cpu: 500m, memory: 384Mi}

    kube-state-metrics:
      image:
        tag: v2.20.0
        sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
      # Backup coverage must distinguish active Longhorn claims from frozen
      # rollback volumes that explicitly opt out of the nightly job. Expose
      # only that one PVC label rather than the full, high-cardinality set.
      metricLabelsAllowlist:
        - persistentvolumeclaims=[recurring-job-group.longhorn.io/default]
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {cpu: 500m, memory: 384Mi}
      collectors:
        - cronjobs
        - daemonsets
        - deployments
        - endpointslices
        - horizontalpodautoscalers
        - jobs
        - namespaces
        - nodes
        - persistentvolumeclaims
        - persistentvolumes
        - poddisruptionbudgets
        - pods
        - replicasets
        - replicationcontrollers
        - resourcequotas
        - services
        - statefulsets
        - storageclasses
        - volumeattachments

    prometheus-node-exporter:
      namespaceOverride: kube-system
      image:
        tag: v1.12.1
        distroless: true
        digest: sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
      prometheus:
        monitor:
          enabled: false
      hostNetwork: false
      hostPID: false
      resources:
        requests: {cpu: 25m, memory: 48Mi}
        limits: {cpu: 250m, memory: 192Mi}
      tolerations:
        - operator: Exists

    prometheus:
      additionalServiceMonitors:
        - name: node-exporter
          namespaceSelector: {matchNames: [kube-system]}
          selector:
            matchLabels:
              app.kubernetes.io/name: prometheus-node-exporter
              app.kubernetes.io/instance: observability
          endpoints:
            - {port: http-metrics, path: /metrics, interval: 30s, scrapeTimeout: 10s}
        - name: longhorn
          namespaceSelector: {matchNames: [longhorn-system]}
          selector: {matchLabels: {app: longhorn-manager}}
          endpoints:
            - {port: manager, path: /metrics, interval: 30s, scrapeTimeout: 10s}
        - name: cert-manager
          namespaceSelector: {matchNames: [cert-manager]}
          selector:
            matchLabels:
              app.kubernetes.io/name: cert-manager
              app.kubernetes.io/component: controller
          endpoints:
            - {port: http-metrics, path: /metrics, interval: 30s, scrapeTimeout: 10s}
        - name: traefik
          namespaceSelector: {matchNames: [traefik]}
          selector:
            matchLabels:
              observability.reza.network/scrape: traefik
          endpoints:
            - {port: metrics, path: /metrics, interval: 30s, scrapeTimeout: 10s}
        - name: loggifly
          namespaceSelector: {matchNames: [monitoring]}
          selector: {matchLabels: {app.kubernetes.io/name: loggifly}}
          endpoints:
            - {port: metrics, path: /metrics, interval: 30s, scrapeTimeout: 10s}
        - name: headlamp
          namespaceSelector: {matchNames: [monitoring]}
          selector: {matchLabels: {app.kubernetes.io/name: headlamp}}
          endpoints:
            - {port: metrics, path: /metrics, interval: 30s, scrapeTimeout: 10s}
      additionalPodMonitors:
        - name: flux-controllers
          namespaceSelector: {matchNames: [flux-system]}
          selector:
            matchLabels:
              app.kubernetes.io/part-of: flux
          podMetricsEndpoints:
            - {port: http-prom, path: /metrics, interval: 30s, scrapeTimeout: 10s}
      prometheusSpec:
        image:
          tag: v3.14.0-distroless
          sha: 50c707e96da5ade383cb1707790576480485e93de06aa60ad8802cb5f744bd0a
        scrapeInterval: 30s
        evaluationInterval: 30s
        retention: 14d
        retentionSize: 20GB
        walCompression: true
        enableAdminAPI: false
        # Alert GeneratorURLs must stay usable now that Grafana is retired.
        # They open against the documented port forward
        # (`ssh beelink` then `kubectl -n monitoring port-forward
        # svc/observability-prometheus 9090:9090`), so an operator can click a
        # Telegram alert straight into the exact query. This is intentionally
        # a localhost URL: there is no public or LAN route to Prometheus.
        externalUrl: http://localhost:9090
        routePrefix: /
        resources:
          requests: {cpu: 350m, memory: 1Gi}
          limits: {cpu: "2", memory: 3Gi}
        # Prometheus is the largest single observability consumer (measured
        # 1.05 GiB working set). It already landed on the Pi under the
        # scheduler's own choice during the 2026-10-10 recovery and stayed
        # healthy there, which is where the node has ~9 GiB available while the
        # Beelink runs at 86% of allocatable. This is a PREFERENCE, not a pin:
        # the Pi is a 4-core LAN-services node, so if it ever cannot take
        # Prometheus the scheduler must be free to place it on the Beelink
        # instead of leaving it Pending.
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values: [raspberrypi]
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-observability
              accessModes: [ReadWriteOnce]
              resources:
                requests: {storage: 30Gi}

    alertmanager:
      alertmanagerSpec:
        useExistingSecret: true
        configSecret: observability-alertmanager
        automountServiceAccountToken: false
        image:
          tag: v0.34.0
          sha: 690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
        retention: 120h
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-observability
              accessModes: [ReadWriteOnce]
              resources:
                requests: {storage: 2Gi}

    # Grafana is retired (2026-10-11). Retiring it freed ~386Mi on the Beelink
    # and removed monitoring's only Gateway-routed ingress surface. The five
    # dashboard ConfigMaps remain in Git (dashboard.yaml, backup-dashboard.yaml,
    # media-storage-dashboard.yaml, network-services-dashboard.yaml,
    # ai-services-dashboard.yaml) so the UI can be re-enabled by restoring this
    # block and the route/access-proxy/secret manifests. Alerting does not
    # depend on it: Prometheus evaluates every rule, Alertmanager routes to
    # Telegram, and GeneratorURLs now point at the port-forwarded UI (see
    # docs/runbook.md "Observability and alerting").
    #
    # The former Grafana OIDC client and its blueprint entry are removed from
    # Git, so the catalog render drops them; the app-owned Grafana MCP
    # registration in MCPHub's database becomes non-functional and can be
    # removed from that UI (it is application state, not Git).
    grafana:
      enabled: false
