apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ai-services
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Home Server
data:
  ai-services.json: |
    {
      "annotations": {"list": []},
      "description": "Availability and resource health for Open WebUI, MCPHub, document extraction, and the cluster search backend. Per-tool activity and failures are inspected in MCPHub, which owns MCP runtime configuration and audit history.",
      "editable": false,
      "graphTooltip": 1,
      "links": [
        {"icon": "external link", "includeVars": false, "keepTime": false, "tags": [], "targetBlank": true, "title": "MCPHub activity", "type": "link", "url": "https://mcp.reza.network/#/activities"},
        {"icon": "doc", "includeVars": false, "keepTime": false, "tags": [], "targetBlank": true, "title": "Open WebUI operations", "type": "link", "url": "https://github.com/rezanmz/home-server/blob/main/docs/open-webui.md"}
      ],
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "description": "One means the MCPHub deployment has an available replica. GPT Researcher and personal tools run as MCPHub-managed child processes.",
          "fieldConfig": {"defaults": {"decimals": 0, "max": 1, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}, "unit": "short"}},
          "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "wideLayout": true},
          "targets": [{"expr": "max(kube_deployment_status_replicas_available{namespace=\"apps\",deployment=\"mcphub\"}) or vector(0)", "instant": true, "refId": "A"}],
          "title": "MCPHub available",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "description": "One means the Open WebUI deployment has an available replica.",
          "fieldConfig": {"defaults": {"decimals": 0, "max": 1, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}, "unit": "short"}},
          "gridPos": {"h": 5, "w": 6, "x": 6, "y": 0},
          "id": 2,
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "wideLayout": true},
          "targets": [{"expr": "max(kube_deployment_status_replicas_available{namespace=\"apps\",deployment=\"open-webui\"}) or vector(0)", "instant": true, "refId": "A"}],
          "title": "Open WebUI available",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "description": "Search requests that exhausted every configured provider during the last 24 hours.",
          "fieldConfig": {"defaults": {"decimals": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 3}]}, "unit": "short"}},
          "gridPos": {"h": 5, "w": 6, "x": 12, "y": 0},
          "id": 3,
          "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "wideLayout": true},
          "targets": [{"expr": "sum(increase(searxng_search_requests_total{outcome=\"failed\"}[24h])) or vector(0)", "instant": true, "refId": "A"}],
          "title": "Search failures (24h)",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "description": "Container restarts across the AI and MCP runtime during the last 24 hours.",
          "fieldConfig": {"defaults": {"decimals": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 3}]}, "unit": "short"}},
          "gridPos": {"h": 5, "w": 6, "x": 18, "y": 0},
          "id": 4,
          "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "wideLayout": true},
          "targets": [{"expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"apps\",pod=~\"(mcphub|open-webui|searxng)-.*\"}[24h])) or vector(0)", "instant": true, "refId": "A"}],
          "title": "AI/MCP restarts (24h)",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "description": "Sequential search-provider attempts. Brave and SerpAPI are paid fallbacks; each request goes to one provider at a time.",
          "fieldConfig": {"defaults": {"custom": {"drawStyle": "line", "fillOpacity": 8, "lineInterpolation": "stepAfter", "lineWidth": 2, "pointSize": 5, "showPoints": "never", "spanNulls": false}, "decimals": 0, "min": 0, "unit": "short"}, "overrides": []},
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 5},
          "id": 5,
          "options": {"legend": {"calcs": ["sum"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"hideZeros": false, "mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "sum by (provider, outcome) (increase(searxng_provider_requests_total[$__rate_interval]))", "legendFormat": "{{provider}} / {{outcome}}", "refId": "A"}],
          "title": "Search provider outcomes",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "description": "Cluster-observed use of paid search fallbacks over a rolling 30-day window; verify provider billing pages for calendar-month totals.",
          "fieldConfig": {"defaults": {"decimals": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 200}]}, "unit": "short"}},
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 5},
          "id": 6,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "horizontal", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "wideLayout": true},
          "targets": [{"expr": "sum by (provider) (increase(searxng_provider_requests_total{provider=~\"brave|serpapi\"}[30d]))", "instant": true, "legendFormat": "{{provider}}", "refId": "A"}],
          "title": "Paid fallback attempts (30d)",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "description": "CPU used by Open WebUI, MCPHub and supporting search/extraction containers.",
          "fieldConfig": {"defaults": {"custom": {"drawStyle": "line", "fillOpacity": 8, "lineInterpolation": "linear", "lineWidth": 2, "pointSize": 5, "showPoints": "never", "spanNulls": false}, "decimals": 3, "min": 0, "unit": "cores"}, "overrides": []},
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 14},
          "id": 7,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"hideZeros": false, "mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "sum by (pod, container) (rate(container_cpu_usage_seconds_total{namespace=\"apps\",pod=~\"(mcphub|open-webui|searxng)-.*\",container!=\"\",image!=\"\"}[$__rate_interval]))", "legendFormat": "{{pod}} / {{container}}", "refId": "A"}],
          "title": "AI/MCP CPU",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "description": "Working-set memory used by Open WebUI, MCPHub and supporting search/extraction containers.",
          "fieldConfig": {"defaults": {"custom": {"drawStyle": "line", "fillOpacity": 8, "lineInterpolation": "linear", "lineWidth": 2, "pointSize": 5, "showPoints": "never", "spanNulls": false}, "decimals": 1, "min": 0, "unit": "bytes"}, "overrides": []},
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 14},
          "id": 8,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"hideZeros": false, "mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "sum by (pod, container) (container_memory_working_set_bytes{namespace=\"apps\",pod=~\"(mcphub|open-webui|searxng)-.*\",container!=\"\",image!=\"\"})", "legendFormat": "{{pod}} / {{container}}", "refId": "A"}],
          "title": "AI/MCP memory",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 41,
      "tags": ["home-server", "open-webui", "mcphub", "search", "ai"],
      "templating": {"list": []},
      "time": {"from": "now-24h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "AI Services",
      "uid": "home-server-ai-services",
      "version": 3
    }
