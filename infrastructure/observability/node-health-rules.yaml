apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: home-server-node-health
  namespace: monitoring
  labels:
    app.kubernetes.io/name: home-server-node-health
    app.kubernetes.io/part-of: observability
    release: observability
spec:
  groups:
    - name: home-server.node-health-recording
      interval: 30s
      rules:
        # The node-exporter runs without host networking, so enrich its
        # namespace/pod identity with kube-state-metrics' Kubernetes node.
        - record: home_server_node_resource_pressure
          labels: {resource: io, unit: percent}
          expr: |
            100
            * rate(
                node_pressure_io_stalled_seconds_total{
                  job="observability-prometheus-node-exporter"
                }[5m]
              )
            * on (namespace, pod) group_left (node)
              max by (namespace, pod, node) (
                kube_pod_info{
                  namespace="kube-system",
                  pod=~"observability-prometheus-node-exporter-.*"
                }
              )
        - record: home_server_node_resource_pressure
          labels: {resource: memory, unit: percent}
          expr: |
            100
            * rate(
                node_pressure_memory_stalled_seconds_total{
                  job="observability-prometheus-node-exporter"
                }[5m]
              )
            * on (namespace, pod) group_left (node)
              max by (namespace, pod, node) (
                kube_pod_info{
                  namespace="kube-system",
                  pod=~"observability-prometheus-node-exporter-.*"
                }
              )
        - record: home_server_node_resource_pressure
          labels: {resource: swap, unit: bytes_per_second}
          expr: |
            (
              rate(
                node_vmstat_pswpin{
                  job="observability-prometheus-node-exporter"
                }[5m]
              )
              + rate(
                  node_vmstat_pswpout{
                    job="observability-prometheus-node-exporter"
                  }[5m]
                )
            )
            * 4096
            * on (namespace, pod) group_left (node)
              max by (namespace, pod, node) (
                kube_pod_info{
                  namespace="kube-system",
                  pod=~"observability-prometheus-node-exporter-.*"
                }
              )
        # Raspberry Pi OS does not currently expose /proc/pressure. Use
        # portable node-exporter signals only for instances where the matching
        # PSI metric is absent, avoiding duplicate alerts on Beelink.
        - record: home_server_node_resource_pressure
          labels: {resource: io-wait, unit: percent}
          expr: |
            (
              100
              * avg without (cpu, mode) (
                  rate(
                    node_cpu_seconds_total{
                      job="observability-prometheus-node-exporter",
                      mode="iowait"
                    }[5m]
                  )
                )
              unless on (instance)
                node_pressure_io_stalled_seconds_total{
                  job="observability-prometheus-node-exporter"
                }
            )
            * on (namespace, pod) group_left (node)
              max by (namespace, pod, node) (
                kube_pod_info{
                  namespace="kube-system",
                  pod=~"observability-prometheus-node-exporter-.*"
                }
              )
        # Unlike io-wait, memory-used must NOT be PSI-gated: the PSI memory
        # metric is a stall *rate*, not a memory-usage percentage, so it has no
        # counterpart to this rule. Gating on it would drop the metric for
        # exactly the nodes that report PSI (Beelink), leaving memory pressure
        # there unalerted.
        - record: home_server_node_resource_pressure
          labels: {resource: memory-used, unit: percent}
          expr: |
            (
              100
              * (
                  1
                  - node_memory_MemAvailable_bytes{
                      job="observability-prometheus-node-exporter"
                    }
                    / node_memory_MemTotal_bytes{
                        job="observability-prometheus-node-exporter"
                      }
                )
            )
            * on (namespace, pod) group_left (node)
              max by (namespace, pod, node) (
                kube_pod_info{
                  namespace="kube-system",
                  pod=~"observability-prometheus-node-exporter-.*"
                }
              )
    - name: home-server.node-health-alerting
      rules:
        - alert: HomeServerNodeResourcePressure
          expr: |
            home_server_node_resource_pressure{resource="io"} > 15
            or home_server_node_resource_pressure{resource="memory"} > 5
            or home_server_node_resource_pressure{resource="swap"} > 67108864
            or home_server_node_resource_pressure{resource="io-wait"} > 20
            or home_server_node_resource_pressure{resource="memory-used"} > 92
          for: 15m
          labels:
            severity: warning
            cluster: home-server
          annotations:
            summary: Node {{ $labels.node }} has sustained {{ $labels.resource }} pressure
            description: "Node {{ $labels.node }} has reported {{ $value | humanize }} {{ $labels.unit }} of sustained {{ $labels.resource }} pressure. Reduce concurrent downloads/imports first, then inspect PSI, swap, Longhorn, and kubelet latency."
            runbook_url: https://github.com/rezanmz/home-server/blob/main/docs/runbook.md#node-resource-pressure
        # Upstream Kubernetes filesystem alerts do not cover this failure mode.
        # NodeFilesystemSpaceFillingUp needs <15% free AND a negative 24h
        # prediction, and NodeFilesystemAlmostOutOfSpace needs <5%, so a node
        # parked at 25% free by a shared cache raises nothing at all. On Beelink
        # that band is exactly where kubelet's image GC already fires:
        # image-gc-high-threshold=70 means 70% USED (30% free), and once the
        # shared JuiceFS cache filled the disk, every GC cycle logged
        # FreeDiskSpaceFailed "freed 0 bytes" because no unused image remained.
        # The node stayed Ready and the only signal was a Kubernetes event.
        # This warns at the 30%-free line instead, before GC starts failing.
        - alert: HomeServerNodeFilesystemBudgetLow
          expr: |
            (
              100
              * node_filesystem_avail_bytes{
                  job="observability-prometheus-node-exporter",
                  fstype!="",
                  mountpoint="/"
                }
              / node_filesystem_size_bytes{
                  job="observability-prometheus-node-exporter",
                  fstype!="",
                  mountpoint="/"
                }
            )
            * on (namespace, pod) group_left (node)
              max by (namespace, pod, node) (
                kube_pod_info{
                  namespace="kube-system",
                  pod=~"observability-prometheus-node-exporter-.*"
                }
              )
            < 30
          for: 30m
          labels:
            severity: warning
            cluster: home-server
          annotations:
            summary: Node {{ $labels.node }} root filesystem is {{ $value | printf "%.1f" }}% free
            description: "Node {{ $labels.node }} is below 30% free on the root filesystem that backs the kubelet image store AND the Longhorn disk. kubelet image GC trips at 70% used, and Longhorn stops scheduling below 25% (storageMinimalAvailablePercentage). On Beelink the largest consumer is the disposable JuiceFS cache under /var/lib/juicefs-cache, which is bounded by cache-size and free-space-ratio. Check which is largest before deleting anything."
            runbook_url: https://github.com/rezanmz/home-server/blob/main/docs/runbook.md#node-resource-pressure
        # The 2026-10-10 incident was a budget failure the scheduler could not
        # see: pods were at 86% of allocatable while the k3s server working set
        # (1.7-4 GiB) and Longhorn instance-manager memory (no requests are
        # possible upstream) stayed invisible. This alert measures the part that
        # IS visible and warns long before the unaccounted remainder fills the
        # node. 75% is a deliberate floor, not a target: with roughly 4-6 GiB of
        # real demand outside pod requests, 75% of allocatable is already close
        # to the physical limit on the 16 GiB Beelink.
        - alert: HomeServerNodeMemoryRequestBudgetHigh
          expr: |
            (
              sum by (node) (
                kube_pod_container_resource_requests{
                  resource="memory",
                  unit="byte",
                  node!=""
                }
              )
              /
              on (node) group_left
              kube_node_status_allocatable{
                resource="memory",
                unit="byte"
              }
            ) > 0.75
          for: 30m
          labels:
            severity: warning
            cluster: home-server
          annotations:
            summary: Node {{ $labels.node }} pod memory requests are {{ $value | humanizePercentage }} of allocatable
            description: "Scheduled pod memory requests on {{ $labels.node }} exceed 75% of allocatable. The scheduler cannot see the k3s server working set or Longhorn instance-manager memory, so a high ratio means the node is close to the physical limit even though allocation looks valid. Rebalance requests, move a large workload to the peer node, or increase memory. This ratio was 86% before the 2026-10-10 swap-thrash incident."
            runbook_url: https://github.com/rezanmz/home-server/blob/main/docs/runbook.md#node-resource-pressure
