apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-access-proxy
  namespace: monitoring
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {}
    http {
      access_log /dev/stdout;
      error_log /dev/stderr warn;
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
      set_real_ip_from 10.42.0.0/16;
      set_real_ip_from 192.168.1.0/24;
      real_ip_header X-Forwarded-For;
      real_ip_recursive on;
      server {
        listen 16121;
        client_max_body_size 10m;
        allow 192.168.1.0/24;
        allow 10.8.0.0/24;
        allow 10.42.1.0/24; # wg-easy masqueraded clients on the Pi
        deny all;
        location / {
          proxy_pass http://127.0.0.1:3000;
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
          proxy_set_header X-Forwarded-Host $http_host;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
        }
      }
      # Cluster-only canonical-host bridge for the read-only Grafana MCP
      # client. NetworkPolicy restricts this listener to MCPHub.
      server {
        listen 16122;
        client_max_body_size 10m;
        location / {
          proxy_pass http://127.0.0.1:3000;
          proxy_http_version 1.1;
          proxy_set_header Host grafana.reza.network;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Host grafana.reza.network;
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-mcp
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/instance: observability
    app.kubernetes.io/name: grafana
  ports:
    - name: http-mcp
      port: 16122
      targetPort: 16122
      protocol: TCP
