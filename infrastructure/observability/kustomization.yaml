apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - source.yaml
  - storage-class.yaml
  # Grafana is retired (2026-10-11): its descriptor, route, access proxy,
  # OIDC client secret, and dashboard-reader Role are removed. The five
  # dashboard ConfigMaps below are deliberately KEPT so the UI can be restored
  # from Git by re-adding `grafana:` values, a route, and a secret.
  - alertmanager-config.sops.yaml
  - dashboard.yaml
  - network-services-dashboard.yaml
  - backup-dashboard.yaml
  - media-storage-dashboard.yaml
  - ai-services-dashboard.yaml
  - ai-services-monitoring.yaml
  - media-storage-exporter.yaml
  - backup-health-rules.yaml
  - node-health-rules.yaml
  - workload-health-rules.yaml
  - release.yaml
  - networkpolicy.yaml
