apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-downloads-network-services
spec:
  capacity:
    storage: 100Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-media
  mountOptions: [nfsvers=4.2, hard, noatime]
  nfs:
    server: 192.168.1.2
    path: /home/reza/media/downloads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-downloads
  namespace: network-services
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-media
  volumeName: media-downloads-network-services
  resources:
    requests:
      storage: 1Gi
