apiVersion: apps/v1
kind: Deployment
metadata:
  name: hindsight
  namespace: apps
  labels:
    app.kubernetes.io/name: hindsight
    app.kubernetes.io/component: application
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hindsight
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hindsight
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The image defines only uid 1000 (hindsight) and crashes under any
      # other uid with `getpwuid(): uid not found` (upstream docs).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # hindsight runs schema migrations on startup and treats a refused
      # connection as fatal (exit 3, "Database migration failed"). Its postgres
      # lives in a separate StatefulSet, so after a node reboot hindsight
      # routinely lost the race and crash-looped with `connection to server at
      # "hindsight-postgresql" ... failed: Connection refused` — 16 restarts in
      # one day, each one a HomeServerContainerRestarting alert. Wait for the
      # port to accept connections instead of crashing and retrying.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command:
            - sh
            - -ec
            - |
              host=hindsight-postgresql
              # Bounded: fail loudly after ~3 minutes rather than hang forever,
              # so a genuinely broken database still surfaces as a real error.
              for i in $(seq 1 90); do
                if nc -z -w 2 "$host" 5432; then
                  echo "postgres is accepting connections (attempt $i)"
                  exit 0
                fi
                sleep 2
              done
              echo "ERROR: $host:5432 did not accept connections within 180s" >&2
              exit 1
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      containers:
        - name: hindsight
          # v0.10.3 release 2026-10-08; OCI multi-arch index (linux/amd64 + linux/arm64).
          image: ghcr.io/vectorize-io/hindsight:0.10.3@sha256:b5da1a9aece1f53a15f12821fb1470f358ed6c74dfaa0c4b1a39c3f3ae93e002
          imagePullPolicy: IfNotPresent
          ports:
            - name: api
              containerPort: 8888
              protocol: TCP
            - name: cp
              containerPort: 9999
              protocol: TCP
          env:
            - name: TZ
              value: America/Toronto
            # Both local models are baked into the image, but
            # sentence-transformers still queries HuggingFace for hub
            # metadata at startup. The NetworkPolicy deliberately has no
            # internet egress, so run fully offline against the bundled
            # cache instead of waiting on a dropped connection.
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: HINDSIGHT_API_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hindsight-secrets
                  key: database-url
            - name: HINDSIGHT_API_VECTOR_EXTENSION
              value: pgvector
            - name: HINDSIGHT_API_LLM_PROVIDER
              value: openai
            # In-cluster 9Router /v1 surface (OpenAI-compatible).
            - name: HINDSIGHT_API_LLM_BASE_URL
              value: http://9router.apps.svc.cluster.local:20128/v1
            - name: HINDSIGHT_API_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-secrets
                  key: llm-api-key
            # 9Router serves the `chat`/`smart` combos as OpenAI-compatible
            # model ids; do not change without checking the 9Router dashboard.
            - name: HINDSIGHT_API_LLM_MODEL
              value: chat
            # Stable worker identity across restarts (upstream requirement).
            - name: HINDSIGHT_API_WORKER_ID
              value: hindsight-prod
            # ---- recall latency (2026-11-03) ----
            # Every recall was taking 60-92s and clients gave up at 30s, so MCP
            # recall in omp always failed with "recall request timed out after
            # 30s". Measured breakdown of a real recall: retrieval 1.0s,
            # embedding 0.1s, and [4] Reranking [cross-encoder] 300 candidates
            # in 59-91s -- i.e. ~97% of the wall time.
            #
            # Benchmarked the shipped cross-encoder/ms-marco-MiniLM-L-6-v2 in
            # this exact pod: 300 pairs cost 8.8s at 120 chars, 32.7s at 600
            # chars, and 118s at 2000 chars. The rerank cost is dominated by
            # candidate length, and these memories are long documents, so the
            # upstream note that "the shipped MiniLM scores 300 pairs in well
            # under a second" does not hold for this data shape on CPU.
            #
            # Truncating each candidate before scoring bounds that cost. The
            # knob is upstream's own advice for a CPU-only reranker. Ranking
            # quality is barely affected because the opening tokens carry most
            # of the signal for these short factual memories, and the full text
            # is still returned to the caller -- only the ranking input is cut.
            - name: HINDSIGHT_API_RERANKER_MAX_TOKENS_PER_CANDIDATE
              value: "128"
            # Length-sorted bucket batching, upstream-documented at 36-54%
            # faster for this local cross-encoder. Free win on top of the above.
            - name: HINDSIGHT_API_RERANKER_LOCAL_BUCKET_BATCHING
              value: "true"
            # Fewer candidates scored per recall. 300 is generous for this bank
            # size; 120 keeps recall quality while cutting the dominant cost
            # proportionally.
            - name: HINDSIGHT_API_RERANKER_MAX_CANDIDATES_MID
              value: "120"
            - name: HINDSIGHT_API_RERANKER_MAX_CANDIDATES_HIGH
              value: "180"
            # The recall admission queue waited up to 30s before refusing. With
            # reranking fast, a long wait only adds latency to a request the
            # caller has already abandoned; fail sooner so the client can retry.
            - name: HINDSIGHT_API_ADMISSION_RECALL_MAX_WAIT_MS
              value: "8000"
            - name: HINDSIGHT_API_TENANT_EXTENSION
              value: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
            - name: HINDSIGHT_API_TENANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-secrets
                  key: tenant-api-key
            - name: HINDSIGHT_API_MCP_INSTRUCTIONS
              value: "This is the shared long-term memory for all of Reza's agents (Hermes, omp, Open WebUI). Before answering, recall for task-relevant context. After learning anything durable (environment facts, preferences, decisions, incident lessons), retain it with a short `source:<client>` tag. Store facts, not transcripts."
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              # Raised from "2" on 2026-11-03. The pod was throttled in 25% of
              # CPU periods (975/3926, 34.6s of lost CPU) and the same rerank of
              # 120 candidates varied between 15.5s and 31.5s for identical
              # input -- the signature of CPU contention rather than input size.
              # Two causes compete for the same 2 cores: the cross-encoder
              # rerank on the recall path, and background consolidation LLM
              # batching. The host has 4 cores and beelink was not saturated
              # (74-76% idle at the time), so this is a quota problem, not a
              # capacity one. 4 cores lets a recall rerank proceed while
              # consolidation runs, which is what the earlier 30s client timeout
              # was really colliding with.
              cpu: "4"
              memory: 2.5Gi
          startupProbe:
            tcpSocket:
              port: api
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: api
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: api
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hindsight-postgresql
  namespace: apps
  labels:
    app.kubernetes.io/name: hindsight
    app.kubernetes.io/component: database
spec:
  replicas: 1
  serviceName: hindsight-postgresql
  selector:
    matchLabels:
      app.kubernetes.io/name: hindsight
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hindsight
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: prepare-postgres-data
          image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: [sh, -ec, "mkdir -p /var/lib/postgresql/data/pgdata && chown 999:999 /var/lib/postgresql/data/pgdata"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: pgvector/pgvector:pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
          command: [sh, -ec]
          args: ["export PGDATA=/var/lib/postgresql/data/pgdata; exec docker-entrypoint.sh postgres"]
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: hindsight
            - name: POSTGRES_USER
              value: hindsight
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hindsight-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              # Kept at 256Mi from the original sizing. The 1Gi request trialled in
              # PR #522 was reverted: it pushed beelink's pod memory requests to
              # 78.4% of allocatable and tripped HomeServerNodeMemoryRequestBudgetHigh
              # (75% floor, node-health-rules.yaml). The kill was governed by the
              # limit below, not the request.
              memory: 256Mi
            limits:
              cpu: 500m
              # Raised from 1Gi on 2026-11-13: the container was OOMKilled twice
              # (exit 137) while spiking to a 1023 MiB 14-day peak against a 1Gi
              # ceiling, on a saw-tooth that returns to a flat 263 MiB baseline
              # between periodic spikes (consolidation/autovacuum) rather than
              # climbing without settling. 2Gi is 2x the measured peak.
              memory: 2Gi
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hindsight-postgresql
