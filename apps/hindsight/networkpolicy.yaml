apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hindsight-application
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hindsight
      app.kubernetes.io/component: application
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Route traffic (memory.reza.network) arrives from Traefik.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 8888
          protocol: TCP
    # MCPHub dials the MCP endpoint in-cluster for Open WebUI.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcphub
              app.kubernetes.io/component: application
      ports:
        - port: 8888
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    # Fact extraction goes through 9Router's OpenAI-compatible /v1 surface.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: 9router
      ports:
        - {port: 20128, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hindsight
              app.kubernetes.io/component: database
      ports:
        - {port: 5432, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hindsight-database
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hindsight
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hindsight
              app.kubernetes.io/component: application
      ports:
        - port: 5432
          protocol: TCP
  egress: []
