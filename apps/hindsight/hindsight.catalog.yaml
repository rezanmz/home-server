# yaml-language-server: $schema=../../catalog/service.schema.json
apiVersion: catalog.reza.network/v1alpha1
kind: Service
metadata:
  name: hindsight
spec:
  name: Shared Memory
  workload:
    namespace: apps
    app: hindsight
  homepage:
    order: 35
    group: AI & Data
    icon: mdi-database-search-outline
    description: Shared long-term memory for all agents
  web:
    hostname: memory.reza.network
    route: apps/hindsight/route.yaml
    visibility: private
    accessMiddleware: lan-vpn-only
    dns:
      cloudflare: true
      splitHorizon: true
    auth:
      mode: none
      reason: The route exposes only the Hindsight MCP/REST API, which enforces its own bearer tenant API key; no browser login surface is routed.
  placement:
    mode: floating
  data:
    class: longhorn
    protection: longhorn-b2
    manifests: [apps/hindsight/pvc.yaml]
  observability:
    mode: kubernetes
