apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns
  namespace: apps
  labels:
    app.kubernetes.io/name: cloudflare-ddns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-ddns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflare-ddns
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflare-ddns
          image: favonia/cloudflare-ddns:1.17.0@sha256:61013368c8f95981c0bb8bf56d962078d8b4e95724a554fa2dabb20d6e478097
          imagePullPolicy: IfNotPresent
          env:
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-ddns-secrets
                  key: api-token
            - name: DOMAINS
              valueFrom:
                configMapKeyRef:
                  name: cloudflare-ddns-domains
                  key: DOMAINS
            - {name: PROXIED, value: "false"}
            - {name: UPDATE_CRON, value: "@every 5m"}
            - {name: UPDATE_ON_START, value: "true"}
            - {name: CACHE_EXPIRATION, value: 6h}
            - {name: TZ, value: America/Toronto}
            - {name: EMOJI, value: "true"}
            - {name: QUIET, value: "false"}
            - {name: DELETE_ON_STOP, value: "false"}
            - {name: IP4_PROVIDER, value: cloudflare.trace}
            # This network has no routed IPv6; disable the otherwise noisy
            # five-minute IPv6 detection attempt.
            - {name: IP6_PROVIDER, value: none}
            - {name: DETECTION_TIMEOUT, value: 5s}
            - {name: UPDATE_TIMEOUT, value: 30s}
            - {name: TTL, value: "1"}
            - {name: RECORD_COMMENT, value: Updated by home-server DDNS}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
