apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns
  namespace: apps
  labels:
    app.kubernetes.io/name: cloudflare-ddns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-ddns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflare-ddns
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflare-ddns
          image: favonia/cloudflare-ddns:1.16.2@sha256:bc53b40b13c8b2a84e9b93c21f65fcd7d574b741014fb93912eb9efd93015aa2
          imagePullPolicy: IfNotPresent
          env:
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-ddns-secrets
                  key: api-token
            - name: DOMAINS
              value: reza.network,auth.reza.network,audiobooks.reza.network,budget.reza.network,vpn.reza.network,homeassistant.reza.network,jellyfin.reza.network,radarr.reza.network,sonarr.reza.network,prowlarr.reza.network,jellyseerr.reza.network,qbittorrent.reza.network,homepage.reza.network,headlamp.reza.network,grafana.reza.network,speedtest.reza.network,mcphub.reza.network,chat.reza.network,argilla.reza.network,syncthing.reza.network,library.reza.network,shelfmark.reza.network,stork.reza.network
            - {name: PROXIED, value: "false"}
            - {name: UPDATE_CRON, value: "@every 5m"}
            - {name: UPDATE_ON_START, value: "true"}
            - {name: CACHE_EXPIRATION, value: 6h}
            - {name: TZ, value: America/Toronto}
            - {name: EMOJI, value: "true"}
            - {name: QUIET, value: "false"}
            - {name: DELETE_ON_STOP, value: "false"}
            - {name: IP4_PROVIDER, value: cloudflare.trace}
            # This network has no routed IPv6; disable the otherwise noisy
            # five-minute IPv6 detection attempt.
            - {name: IP6_PROVIDER, value: none}
            - {name: DETECTION_TIMEOUT, value: 5s}
            - {name: UPDATE_TIMEOUT, value: 30s}
            - {name: TTL, value: "1"}
            - {name: RECORD_COMMENT, value: Updated by home-server DDNS}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
