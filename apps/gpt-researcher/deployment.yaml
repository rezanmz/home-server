apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpt-researcher
  namespace: apps
  labels:
    app.kubernetes.io/name: gpt-researcher
    app.kubernetes.io/component: application
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gpt-researcher
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpt-researcher
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gpt-researcher
          image: docker.io/rezanmz/gpt-researcher-service:0.16.0-4@sha256:2f8ead835e69a1e877d215f4d99f1db2f7a9200a499ff1bef4da7e59b963f89c
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Toronto
            - name: HOME
              value: /tmp
            - name: CONFIG_PATH
              value: /config/researcher.json
            - name: SEARX_URL
              value: http://searxng.apps.svc.cluster.local:8080
            - name: OPENROUTER_LIMIT_RPS
              value: "1.0"
            - name: RESEARCH_TIMEOUT_SECONDS
              value: "900"
            - name: RESEARCH_MAX_QUERY_CHARS
              value: "4000"
            - name: RESEARCH_MAX_REPORT_CHARS
              value: "750000"
            - name: USER_AGENT
              value: GPTResearcher-home-server/0.16.0
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gpt-researcher-secrets
                  key: openrouter-api-key
            - name: RESEARCH_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gpt-researcher-secrets
                  key: api-token
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: gpt-researcher-config
            defaultMode: 0444
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
