apiVersion: v1
kind: Service
metadata: {name: lidarr, namespace: media}
spec:
  selector: {app.kubernetes.io/name: media-vpn}
  ports:
    - {name: http, port: 8686, targetPort: lidarr}
---
apiVersion: v1
kind: Service
metadata: {name: lidarr-access, namespace: media}
spec:
  selector: {app.kubernetes.io/name: media-vpn}
  ports:
    - {name: http, port: 80, targetPort: li-access}
