apiVersion: apps/v1
kind: Deployment
metadata:
  name: wg-easy
  namespace: network-services
  labels:
    app.kubernetes.io/name: wg-easy
spec:
  # The K3s pod owns UDP/1234 on the Pi.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wg-easy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wg-easy
    spec:
      automountServiceAccountToken: false
      # The router forwards UDP/1234 to this node; hostPort preserves that
      # contract without giving the whole pod the host network namespace.
      nodeSelector:
        kubernetes.io/hostname: raspberrypi
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        # These network-namespace settings are allowlisted only on the Pi
        # kubelet; declaring them here replaces the former privileged init.
        sysctls:
          - name: net.ipv4.ip_forward
            value: "1"
          - name: net.ipv4.conf.all.src_valid_mark
            value: "1"
      containers:
        - name: wg-easy
          image: ghcr.io/wg-easy/wg-easy:15.4.0@sha256:0e7bc9d34e86ddcaa92bc700d4d7dc9b33291dbc07ac8d13382f7c2095f949ec
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Toronto
            # wg-easy v15 stores endpoint, DNS, and AllowedIPs in its database.
            # The former v14 WG_* variables are ignored and must not imply that
            # these settings are declaratively enforced here.
          ports:
            - name: wireguard
              containerPort: 51820
              hostPort: 1234
              protocol: UDP
            - name: http
              containerPort: 51821
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                # iptables-legacy opens a raw control socket before applying
                # rules; wg-quick needs this alongside NET_ADMIN.
                - NET_RAW
          volumeMounts:
            - name: config
              mountPath: /etc/wireguard
            # wg-quick adds ip6tables-legacy NAT rules for the IPv6 address in
            # the wg-easy database. The container has no SYS_MODULE, so it can
            # never insert kernel modules; the Pi host must preload
            # ip6_tables and ip6table_nat at boot
            # (infrastructure/k3s/pi-modules-load.yaml, installed as
            # /etc/modules-load.d/wg-easy-ip6.conf). This read-only mount only
            # lets the container's modprobe resolve those already-loaded
            # modules instead of erroring on a missing module tree; wg-quick
            # rolls back and deletes wg0 when the host kernel lacks them.
            - name: modules
              mountPath: /lib/modules
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: wg-easy-config
        - name: modules
          hostPath:
            path: /lib/modules
            type: Directory
