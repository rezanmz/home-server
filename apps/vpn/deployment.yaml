apiVersion: apps/v1
kind: Deployment
metadata:
  name: wg-easy
  namespace: network-services
  labels:
    app.kubernetes.io/name: wg-easy
spec:
  # The K3s pod owns UDP/1234 on the Pi.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wg-easy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wg-easy
    spec:
      automountServiceAccountToken: false
      # The router forwards UDP/1234 to this node; hostPort preserves that
      # contract without giving the whole pod the host network namespace.
      nodeSelector:
        kubernetes.io/hostname: raspberrypi
      # Kubelet does not allow these two names through Pod sysctls by default.
      # A privileged init container sets them inside this pod's network
      # namespace before wg-easy starts.
      initContainers:
        - name: configure-network
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - sysctl -w net.ipv4.ip_forward=1 net.ipv4.conf.all.src_valid_mark=1
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 25m
              memory: 16Mi
      containers:
        - name: wg-easy
          image: ghcr.io/wg-easy/wg-easy:15.3.0
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Toronto
            # wg-easy v15 stores endpoint, DNS, and AllowedIPs in its database.
            # The former v14 WG_* variables are ignored and must not imply that
            # these settings are declaratively enforced here.
          ports:
            - name: wireguard
              containerPort: 51820
              hostPort: 1234
              protocol: UDP
            - name: http
              containerPort: 51821
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE
          volumeMounts:
            - name: config
              mountPath: /etc/wireguard
            - name: modules
              mountPath: /lib/modules
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: wg-easy-config
        - name: modules
          hostPath:
            path: /lib/modules
            type: Directory
