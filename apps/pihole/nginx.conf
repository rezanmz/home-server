pid /tmp/nginx.pid;
events {}
http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  # Variable certificate paths make nginx re-open cert-manager's atomic
  # Secret projection after the short cache lifetime instead of keeping a
  # 90-day leaf certificate in memory until the pod restarts.
  map $ssl_server_name $backend_certificate {
    default /etc/nginx/tls/tls.crt;
  }
  map $ssl_server_name $backend_certificate_key {
    default /etc/nginx/tls/tls.key;
  }
  ssl_certificate_cache max=4 inactive=2m valid=1m;
  set_real_ip_from 10.42.0.0/16;
  # Cross-node Service traffic is SNATed to the exact K3s node address.
  set_real_ip_from 192.168.1.2/32;
  set_real_ip_from 192.168.1.3/32;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  server {
    listen 18181 ssl;
    ssl_certificate $backend_certificate;
    ssl_certificate_key $backend_certificate_key;
    ssl_client_certificate /etc/nginx/ca/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_protocols TLSv1.3;
    ssl_session_tickets off;

    # mTLS proves the caller owns Traefik's private backend identity.
    # Only then trust its forwarded address and enforce the client range.
    allow 192.168.1.0/24;
    allow 10.8.0.0/24;
    allow 10.42.1.0/24; # wg-easy masqueraded clients on the Pi
    deny all;
    location / {
      proxy_pass http://127.0.0.1:8181;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
