apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: network-services
  labels:
    app.kubernetes.io/name: pihole
spec:
  # Pi-hole owns DNS/DHCP on the Pi; keep host-networking enabled.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pihole
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pihole
    spec:
      automountServiceAccountToken: false
      # DNS/DHCP clients must keep reaching the Pi's stable LAN address.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: raspberrypi
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pihole
          image: pihole/pihole:2026.07.2@sha256:f7d1be836e3bc608b56d82fc9904f5a831cdfbc0dc9c6d58f94e4c985c70038b
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Toronto
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: pihole-credentials
                  key: web-password
            - name: FTLCONF_dns_listeningMode
              value: ALL
            # Preserve the DHCP service that the former Compose deployment
            # stored only in pihole.toml. Declaring it here prevents a fresh
            # PVC or an incomplete state migration from silently disabling it.
            - name: FTLCONF_dhcp_active
              value: "true"
            - name: FTLCONF_dhcp_start
              value: 192.168.1.10
            - name: FTLCONF_dhcp_end
              value: 192.168.1.239
            - name: FTLCONF_dhcp_router
              value: 192.168.1.1
            - name: FTLCONF_webserver_port
              # Keep the host-network admin UI off the LAN; the colocated
              # access proxy is the only listener exposed to Traefik.
              value: "127.0.0.1:8181"
            - name: FTLCONF_webserver_domain
              value: pihole.reza.network
            # HTTP hostnames resolve to Traefik's stable MetalLB VIP. This
            # keeps internal DNS independent of which node runs an app pod.
            # Pi-specific protocols (DNS, DHCP, SMB, NFS, WireGuard UDP) still
            # use the Pi address directly and are not represented here.
            - name: FTLCONF_dns_hosts
              value: |-
                192.168.1.240 auth.reza.network
                192.168.1.240 budget.reza.network
                192.168.1.240 chat.reza.network
                192.168.1.240 duplicati.reza.network
                192.168.1.240 headlamp.reza.network
                192.168.1.240 homepage.reza.network
                192.168.1.240 jellyfin.reza.network
                192.168.1.240 jellyseerr.reza.network
                192.168.1.240 library.reza.network
                192.168.1.240 mcphub.reza.network
                192.168.1.240 pihole.reza.network
                192.168.1.240 prowlarr.reza.network
                192.168.1.240 qbittorrent.reza.network
                192.168.1.240 radarr.reza.network
                192.168.1.240 shelfmark.reza.network
                192.168.1.240 sonarr.reza.network
                192.168.1.240 speedtest.reza.network
                192.168.1.240 syncthing.reza.network
                192.168.1.240 vpn.reza.network
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dhcp
              containerPort: 67
              protocol: UDP
            - name: http
              containerPort: 8181
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            exec:
              command: [curl, -fsS, http://127.0.0.1:8181/api/info/login]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            exec:
              command: [curl, -fsS, http://127.0.0.1:8181/api/info/login]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            # Pi-hole's entrypoint drops from root to UID 1000 while retaining
            # low-port and DHCP capabilities; no-new-privileges blocks that.
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - NET_ADMIN
          volumeMounts:
            - name: config
              mountPath: /etc/pihole
        - name: access-proxy
          image: nginx:1.27.4-alpine@sha256:4ff102c5d78d254a6f0da062b3cf39eaf07f01eec0927fd21e219d0af8bc0591
          imagePullPolicy: IfNotPresent
          command: [nginx, -c, /etc/nginx-config/nginx.conf, -g, "daemon off;"]
          ports:
            - {name: access-https, containerPort: 18181, protocol: TCP}
          readinessProbe: {tcpSocket: {port: access-https}, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: access-https}, periodSeconds: 30}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: proxy-config, mountPath: /etc/nginx-config, readOnly: true}
            - {name: backend-tls, mountPath: /etc/nginx/tls, readOnly: true}
            - {name: backend-ca, mountPath: /etc/nginx/ca, readOnly: true}
            - {name: nginx-tmp, mountPath: /tmp}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: pihole-config
        - name: proxy-config
          configMap: {name: pihole-access-proxy}
        - name: backend-tls
          secret:
            secretName: pihole-mtls-server
            defaultMode: 0444
        - name: backend-ca
          secret:
            secretName: pihole-mtls-ca
            defaultMode: 0444
            items:
              - key: tls.crt
                path: ca.crt
        - {name: nginx-tmp, emptyDir: {}}
        - {name: nginx-cache, emptyDir: {}}
