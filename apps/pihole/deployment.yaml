apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: network-services
  labels:
    app.kubernetes.io/name: pihole
spec:
  # Pi-hole owns DNS/DHCP on the Pi; keep host-networking enabled.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pihole
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pihole
    spec:
      automountServiceAccountToken: false
      # DNS/DHCP clients must keep reaching the Pi's stable LAN address.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: raspberrypi
      containers:
        - name: pihole
          image: pihole/pihole:2026.07.2
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Toronto
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: pihole-credentials
                  key: web-password
            - name: FTLCONF_dns_listeningMode
              value: ALL
            - name: FTLCONF_webserver_port
              value: "8181"
            - name: FTLCONF_webserver_domain
              value: pihole.reza.network
            # HTTP hostnames resolve to Traefik's stable MetalLB VIP. This
            # keeps internal DNS independent of which node runs an app pod.
            # Pi-specific protocols (DNS, DHCP, SMB, NFS, WireGuard UDP) still
            # use the Pi address directly and are not represented here.
            - name: FTLCONF_dns_hosts
              value: |-
                192.168.1.240 auth.reza.network
                192.168.1.240 budget.reza.network
                192.168.1.240 chat.reza.network
                192.168.1.240 duplicati.reza.network
                192.168.1.240 headlamp.reza.network
                192.168.1.240 homepage.reza.network
                192.168.1.240 jellyfin.reza.network
                192.168.1.240 jellyseerr.reza.network
                192.168.1.240 library.reza.network
                192.168.1.240 mcphub.reza.network
                192.168.1.240 pihole.reza.network
                192.168.1.240 prowlarr.reza.network
                192.168.1.240 qbittorrent.reza.network
                192.168.1.240 radarr.reza.network
                192.168.1.240 shelfmark.reza.network
                192.168.1.240 sonarr.reza.network
                192.168.1.240 speedtest.reza.network
                192.168.1.240 syncthing.reza.network
                192.168.1.240 vpn.reza.network
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dhcp
              containerPort: 67
              protocol: UDP
            - name: http
              containerPort: 8181
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            # Pi-hole's entrypoint drops from root to UID 1000 while retaining
            # low-port and DHCP capabilities; no-new-privileges blocks that.
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - NET_ADMIN
          volumeMounts:
            - name: config
              mountPath: /etc/pihole
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: pihole-config
