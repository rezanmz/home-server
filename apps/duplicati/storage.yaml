apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: duplicati-config
  namespace: network-services
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests: {storage: 5Gi}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: duplicati-backups-network-services
spec:
  capacity: {storage: 50Gi}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-media
  mountOptions: [nfsvers=4.2, hard, noatime]
  nfs:
    server: 192.168.1.2
    path: /home/reza/persistent/duplicati/backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: duplicati-backups
  namespace: network-services
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-media
  volumeName: duplicati-backups-network-services
  resources:
    requests: {storage: 50Gi}
