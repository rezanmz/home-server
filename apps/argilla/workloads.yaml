apiVersion: apps/v1
kind: Deployment
metadata:
  name: argilla
  namespace: apps
  labels:
    app.kubernetes.io/name: argilla
    app.kubernetes.io/component: server
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: argilla
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argilla
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: argilla/argilla-server:v2.8.0
          imagePullPolicy: IfNotPresent
          env: &argilla-env
            - name: ARGILLA_HOME_PATH
              value: /var/lib/argilla
            - name: ARGILLA_ELASTICSEARCH
              value: http://argilla-elasticsearch:9200
            - name: ARGILLA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: argilla-secrets
                  key: database-url
            - name: ARGILLA_REDIS_URL
              value: redis://argilla-redis:6379/0
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: USERNAME
              value: argilla
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: argilla-secrets
                  key: password
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: argilla-secrets
                  key: api-key
            - name: WORKSPACE
              value: default
          ports:
            - name: http
              containerPort: 6900
          startupProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/argilla
        - name: worker
          image: argilla/argilla-server:v2.8.0
          imagePullPolicy: IfNotPresent
          command: [sh, -c]
          args: ["python -m argilla_server worker --num-workers 2"]
          env:
            - name: ARGILLA_HOME_PATH
              value: /var/lib/argilla
            - name: ARGILLA_ELASTICSEARCH
              value: http://argilla-elasticsearch:9200
            - name: ARGILLA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: argilla-secrets
                  key: database-url
            - name: ARGILLA_REDIS_URL
              value: redis://argilla-redis:6379/0
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 250m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/argilla
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: argilla-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argilla-postgres
  namespace: apps
  labels:
    app.kubernetes.io/name: argilla
    app.kubernetes.io/component: postgres
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: argilla
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argilla
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:14
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: argilla
            - name: POSTGRES_DB
              value: argilla
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: argilla-secrets
                  key: postgres-password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [sh, -c, "pg_isready -h 127.0.0.1 -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: [sh, -c, "pg_isready -h 127.0.0.1 -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: argilla-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argilla-elasticsearch
  namespace: apps
  labels:
    app.kubernetes.io/name: argilla
    app.kubernetes.io/component: elasticsearch
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: argilla
      app.kubernetes.io/component: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argilla
        app.kubernetes.io/component: elasticsearch
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
          imagePullPolicy: IfNotPresent
          env:
            - name: ES_JAVA_OPTS
              value: -Xms512m -Xmx512m -XX:UseSVE=0
            - name: CLI_JAVA_OPTS
              value: -XX:UseSVE=0
            - name: node.name
              value: argilla-elasticsearch
            - name: cluster.name
              value: argilla-home-server
            - name: discovery.type
              value: single-node
            - name: cluster.routing.allocation.disk.threshold_enabled
              value: "false"
            - name: xpack.security.enabled
              value: "false"
          ports:
            - name: http
              containerPort: 9200
          startupProbe:
            httpGet:
              path: /_cluster/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: argilla-elasticsearch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argilla-redis
  namespace: apps
  labels:
    app.kubernetes.io/name: argilla
    app.kubernetes.io/component: redis
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: argilla
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argilla
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.8.0
          imagePullPolicy: IfNotPresent
          args: [redis-server, --appendonly, "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [sh, -c, "redis-cli ping | grep -q PONG"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: [sh, -c, "redis-cli ping | grep -q PONG"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: argilla-redis
