apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-headlamp-outpost
  namespace: apps
  labels:
    app.kubernetes.io/name: authentik-headlamp-outpost
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-headlamp-outpost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-headlamp-outpost
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: ghcr.io/goauthentik/proxy:2026.5.2
          imagePullPolicy: IfNotPresent
          env:
            - name: AUTHENTIK_HOST
              value: http://authentik.apps.svc.cluster.local:9000
            - name: AUTHENTIK_HOST_BROWSER
              value: https://auth.reza.network
            - name: AUTHENTIK_INSECURE
              value: "true"
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: authentik-headlamp-outpost
                  key: token
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /outpost.goauthentik.io/ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /outpost.goauthentik.io/ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-headlamp-outpost
  namespace: apps
spec:
  selector:
    app.kubernetes.io/name: authentik-headlamp-outpost
  ports:
    - name: http
      port: 9000
      targetPort: http
      protocol: TCP
