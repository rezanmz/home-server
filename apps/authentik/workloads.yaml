apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik
  namespace: apps
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: application
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data
          image: docker.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          command:
            - sh
            - -ec
            - mkdir -p /state/data /state/certs /state/custom-templates
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /state
      containers:
        - name: server
          image: ghcr.io/goauthentik/server:2026.8.2@sha256:ff8489a5af4f4fe415ffd180a8e3c10b120bc2592d13d79dac050d977f7b9ecd
          imagePullPolicy: IfNotPresent
          args:
            - server
          env:
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: secret-key
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: authentik-postgresql
            - name: AUTHENTIK_POSTGRESQL__NAME
              value: authentik
            - name: AUTHENTIK_POSTGRESQL__USER
              value: authentik
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: postgres-password
            - name: AUTHENTIK_ERROR_REPORTING__ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /-/health/live/
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /-/health/ready/
              port: http
            periodSeconds: 10
            # Authentik can briefly pause while checking its database/cache.
            # Allow a short stall without withdrawing the pod from service.
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /-/health/live/
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: data
            - name: data
              mountPath: /templates
              subPath: custom-templates
            - name: server-shm
              mountPath: /dev/shm
        - name: worker
          image: ghcr.io/goauthentik/server:2026.8.2@sha256:ff8489a5af4f4fe415ffd180a8e3c10b120bc2592d13d79dac050d977f7b9ecd
          imagePullPolicy: IfNotPresent
          args:
            - worker
          env:
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: secret-key
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: authentik-postgresql
            - name: AUTHENTIK_POSTGRESQL__NAME
              value: authentik
            - name: AUTHENTIK_POSTGRESQL__USER
              value: authentik
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: postgres-password
            - name: AUTHENTIK_BOOTSTRAP_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: bootstrap-password-hash
            - name: AUTHENTIK_BOOTSTRAP_EMAIL
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: bootstrap-email
                  optional: true
            - name: AUTHENTIK_ERROR_REPORTING__ENABLED
              value: "false"
            # Server and worker share a pod network namespace; give the
            # worker's internal HTTP/metrics listeners distinct ports.
            - name: AUTHENTIK_LISTEN__HTTP
              value: 127.0.0.1:9001
            - name: AUTHENTIK_LISTEN__METRICS
              value: 127.0.0.1:9301
          resources:
            requests:
              cpu: 125m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
          startupProbe:
            exec:
              command:
                - ak
                - healthcheck
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - ak
                - healthcheck
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - ak
                - healthcheck
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: data
            - name: data
              mountPath: /certs
              subPath: certs
            - name: data
              mountPath: /templates
              subPath: custom-templates
            - name: worker-shm
              mountPath: /dev/shm
            - name: application-blueprints
              mountPath: /blueprints/custom
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: authentik-data
        # Each container's Rust core binds $TMPDIR/authentik.sock (TMPDIR is
        # /dev/shm in this image) and run_unix() unlinks that path before
        # binding, so a /dev/shm shared by both containers lets the worker's
        # healthcheck-only router and the server's full router race for one
        # socket path. When the worker wins, the embedded outpost's
        # get_outpost call 404s and every forward-auth host serves a 404.
        # Separate memory-backed volumes keep the two sockets in distinct
        # inodes; the size limit is halved so total tmpfs is unchanged.
        - name: server-shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: worker-shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        # Projected so the catalog-generated OIDC blueprints and the
        # hand-maintained SAML blueprint share /blueprints/custom.
        - name: application-blueprints
          projected:
            sources:
              - configMap:
                  name: authentik-application-blueprints
              - configMap:
                  name: authentik-saml-application-blueprints
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authentik-postgresql
  namespace: apps
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: database
spec:
  replicas: 1
  serviceName: authentik-postgresql
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: docker.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          command: [sh, -ec]
          args: ["export PGDATA=/var/lib/postgresql/data/pgdata; exec docker-entrypoint.sh postgres"]
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: authentik
            - name: POSTGRES_USER
              value: authentik
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              # PostgreSQL repeatedly reached the former 256 MiB limit and
              # was OOM-killed, briefly making Authentik return HTTP 500.
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: authentik-postgresql
