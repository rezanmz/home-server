# yaml-language-server: $schema=../../catalog/service.schema.json
apiVersion: catalog.reza.network/v1alpha1
kind: Service
metadata:
  name: speedtest-tracker
spec:
  name: Speedtest Tracker
  workload:
    namespace: apps
    app: speedtest-tracker
  homepage:
    order: 40
    group: Home & Identity
    icon: speedtest-tracker.png
    description: Internet performance history
  web:
    hostname: speedtest.reza.network
    route: apps/speedtest-tracker/route.yaml
    visibility: private
    accessMiddleware: lan-vpn-only
    dns:
      cloudflare: true
      splitHorizon: true
    auth:
      mode: native
      reason: Speedtest Tracker uses its built-in account; no supported native OIDC integration is configured.
  placement:
    mode: floating
  data:
    class: longhorn
    protection: longhorn-b2
    manifests: [apps/speedtest-tracker/pvc.yaml]
  observability:
    mode: kubernetes
