apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: speedtest-tracker-config
  namespace: apps
  labels:
    home-server.reza.network/retention: speedtest-tracker-retirement
  annotations:
    home-server.reza.network/review-after: "2026-12-01"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
