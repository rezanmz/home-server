apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: speedtest-tracker
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: speedtest-tracker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 18080
          protocol: TCP
  # Ookla test servers advertise endpoints on varying destination ports.
  egress:
    - {}
