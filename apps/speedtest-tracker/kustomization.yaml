apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Speedtest Tracker retired. Only its config PVC (SQLite speed-test history)
  # and the APP_KEY Secret that can decrypt that database's encrypted fields
  # remain reconciled as recovery artifacts. Runtime, route, and network
  # manifests are gone. The PVC stays in Longhorn's default nightly backup
  # group until a verified final export is taken; freeze it afterward.
  - secrets.sops.yaml
  - pvc.yaml
