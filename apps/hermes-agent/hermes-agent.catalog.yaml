# yaml-language-server: $schema=../../catalog/service.schema.json
apiVersion: catalog.reza.network/v1alpha1
kind: Service
metadata:
  name: hermes-agent
spec:
  name: Hermes Agent
  workload:
    namespace: apps
    app: hermes-agent
  homepage:
    order: 30
    group: AI & Data
    icon: mdi-robot-happy-outline
    description: Proactive personal companion
  web:
    hostname: hermes.reza.network
    route: apps/hermes-agent/route.yaml
    visibility: public
    dns:
      cloudflare: true
      splitHorizon: true
    auth:
      mode: oidc
      profile: authentik-oidc-v1
      blueprintName: Hermes Agent OIDC
      application:
        slug: hermes-agent
        launchUrl: https://hermes.reza.network/
      client:
        type: public
        id: hermes-dashboard
        grantTypes: [authorization_code]
        scopes: [openid, email, profile]
        redirectUris:
          - type: authorization
            url: https://hermes.reza.network/auth/callback
        pkce:
          verified: true
          evidence: Hermes Agent v0.19.0 documents and implements authorization code flow with PKCE S256 for its self-hosted OIDC dashboard.
  placement:
    mode: floating
  data:
    class: longhorn
    protection: longhorn-b2
    manifests: [apps/hermes-agent/pvc.yaml]
  observability:
    mode: kubernetes
