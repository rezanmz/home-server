pid /tmp/nginx.pid;
events {}
http {
  access_log off;
  error_log /dev/stderr warn;
  server {
    listen 18123;
    # A new or restored PVC is not publishable until the owner marker exists.
    # Direct loopback-only kubectl port-forwarding bypasses this proxy for safe
    # onboarding and recovery validation.
    return 503;
  }
}
