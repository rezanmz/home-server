apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: apps
  labels:
    app.kubernetes.io/name: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
      annotations:
        # The existing PVC contains an active native owner and its durable
        # marker. This annotation forces the activation rollout; the init
        # container still verifies the marker independently on every start.
        home-assistant.reza.network/owner-onboarded: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 300
      securityContext:
        appArmorProfile:
          type: RuntimeDefault
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Home Assistant executes third-party integrations and eventually needs
      # selected LAN access. Keep it off the Pi, whose host exports trusted NFS
      # data to node identities that Kubernetes policy cannot fully isolate.
      nodeSelector:
        kubernetes.io/hostname: beelink
      initContainers:
        - name: initialize-config
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              # The Home Assistant image runs as UID 0 with all capabilities
              # dropped, so it cannot bypass mode bits. Give the pod fsGroup
              # read/write access without making configuration world-readable.
              umask 007
              mkdir -p /config/themes
              for file in configuration.yaml automations.yaml scripts.yaml scenes.yaml; do
                if [ ! -e "/config/${file}" ]; then
                  cp "/bootstrap/${file}" "/config/${file}"
                  chmod 0660 "/config/${file}"
                fi
              done

              # Generate the sidecar's runtime configuration from durable data
              # state. An empty/replaced PVC therefore stays fail-closed even
              # if DNS and the HTTPRoute still exist from an earlier install.
              if [ -f /config/.owner-onboarded ] && [ ! -L /config/.owner-onboarded ]; then
                cp /proxy-source/nginx.conf /proxy-runtime/nginx.conf
              else
                cp /proxy-source/nginx-deny.conf /proxy-runtime/nginx.conf
              fi
              chmod 0640 /proxy-runtime/nginx.conf
          resources:
            requests: {cpu: 5m, memory: 8Mi, ephemeral-storage: 16Mi}
            limits: {cpu: 50m, memory: 32Mi, ephemeral-storage: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: bootstrap, mountPath: /bootstrap, readOnly: true}
            - {name: access-proxy-config, mountPath: /proxy-source, readOnly: true}
            - {name: nginx-runtime, mountPath: /proxy-runtime}
        - name: bootstrap-hacs
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          imagePullPolicy: IfNotPresent
          env:
            # This is a recovery/bootstrap floor, not an update pin. Once HACS
            # exists on the PVC, HACS owns its version and this container leaves
            # it untouched. Updating these values changes only future installs.
            - {name: HACS_VERSION, value: "2.0.5"}
            - name: HACS_URL
              value: https://github.com/hacs/integration/releases/download/2.0.5/hacs.zip
            - name: HACS_SHA256
              value: 97be6b824a4f38e683728cc6dd72367f6b8bad0a43428b1b3b987a3087adf413
          command:
            - sh
            - -ec
            - |
              umask 007
              components=/config/custom_components
              target="${components}/hacs"

              # Refuse unexpected filesystem objects instead of following a
              # PVC-resident symlink while running supply-chain bootstrap code.
              if [ -L "${components}" ] || { [ -e "${components}" ] && [ ! -d "${components}" ]; }; then
                echo "ERROR: ${components} is not a normal directory" >&2
                exit 1
              fi
              mkdir -p "${components}"

              if [ -L "${target}" ]; then
                echo "ERROR: refusing to use symlink at ${target}" >&2
                exit 1
              fi
              if [ -d "${target}" ]; then
                if [ ! -f "${target}/manifest.json" ] || [ -L "${target}/manifest.json" ]; then
                  echo "ERROR: existing HACS directory is incomplete or unsafe" >&2
                  exit 1
                fi
                echo "HACS is already present; leaving the PVC-managed version unchanged"
                exit 0
              fi
              if [ -e "${target}" ]; then
                echo "ERROR: ${target} exists but is not a directory" >&2
                exit 1
              fi

              workdir="$(mktemp -d "${components}/.hacs-bootstrap.XXXXXX")"
              cleanup() { rm -rf "${workdir}"; }
              trap cleanup EXIT HUP INT TERM

              archive="${workdir}/hacs.zip"
              wget -q -O "${archive}" "${HACS_URL}"
              printf '%s  %s\n' "${HACS_SHA256}" "${archive}" | sha256sum -c -

              mkdir "${workdir}/hacs"
              unzip -q "${archive}" -d "${workdir}/hacs"
              manifest="${workdir}/hacs/manifest.json"
              if [ ! -f "${manifest}" ] || [ -L "${manifest}" ]; then
                echo "ERROR: HACS archive does not contain a regular manifest.json" >&2
                exit 1
              fi
              if ! grep -Fq "\"version\": \"${HACS_VERSION}\"" "${manifest}"; then
                echo "ERROR: HACS archive version does not match ${HACS_VERSION}" >&2
                exit 1
              fi

              chmod -R u=rwX,g=rwX,o= "${workdir}/hacs"
              mv "${workdir}/hacs" "${target}"
              echo "Bootstrapped HACS ${HACS_VERSION} into ${target}"
          resources:
            requests: {cpu: 5m, memory: 8Mi, ephemeral-storage: 16Mi}
            limits: {cpu: 100m, memory: 64Mi, ephemeral-storage: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /config}
        - name: install-cafe
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          imagePullPolicy: IfNotPresent
          env:
            # C.A.F.E. is a beta visual editor with write access to native Home
            # Assistant automations. Keep the reviewed release reproducible;
            # an intentional version change must update the version, URL, and
            # checksum together.
            - {name: CAFE_VERSION, value: "0.6.0"}
            - name: CAFE_URL
              value: https://github.com/FezVrasta/cafe-hass/releases/download/v0.6.0/cafe.zip
            - name: CAFE_SHA256
              value: d7c5a3ecae09e4fd6b4d6814a94943ade58dabc894526294d003af4220180ab1
            # C.A.F.E. 0.6.0 tries the REST config endpoint only for numeric
            # automation IDs. Our descriptive string IDs then fall back to
            # catalog-only records with no triggers/actions. Apply the narrow
            # reviewed frontend fix below and pin its resulting bundle hash.
            - {name: CAFE_BUNDLE_PATH, value: www/assets/main-BIzscans.js}
            - name: CAFE_PATCHED_BUNDLE_SHA256
              value: febda7c0b51169398213d40b55960fc73fe4713d6afb2d6513828a8df9bdd07f
          command:
            - sh
            - -ec
            - |
              umask 007
              components=/config/custom_components
              target="${components}/cafe"

              # The release executes in Home Assistant's process, so refuse
              # ambiguous PVC objects and install only the checksum-pinned
              # archive reviewed with this manifest.
              if [ -L "${components}" ] || { [ -e "${components}" ] && [ ! -d "${components}" ]; }; then
                echo "ERROR: ${components} is not a normal directory" >&2
                exit 1
              fi
              mkdir -p "${components}"
              installed_bundle="${target}/${CAFE_BUNDLE_PATH}"

              if [ -L "${target}" ] || { [ -e "${target}" ] && [ ! -d "${target}" ]; }; then
                echo "ERROR: refusing unsafe C.A.F.E. target at ${target}" >&2
                exit 1
              fi
              if [ -d "${target}" ] &&
                 [ -f "${target}/manifest.json" ] &&
                 [ ! -L "${target}/manifest.json" ] &&
                 [ -f "${target}/www/assets/panel-wrapper.js" ] &&
                 [ -f "${installed_bundle}" ] &&
                 [ ! -L "${installed_bundle}" ] &&
                 grep -Fq "\"version\": \"${CAFE_VERSION}\"" "${target}/manifest.json" &&
                 printf '%s  %s\n' "${CAFE_PATCHED_BUNDLE_SHA256}" "${installed_bundle}" |
                   sha256sum -c - >/dev/null 2>&1; then
                echo "C.A.F.E. ${CAFE_VERSION} with the string-ID import fix is already installed"
                exit 0
              fi

              workdir="$(mktemp -d "${components}/.cafe-install.XXXXXX")"
              cleanup() { rm -rf "${workdir}"; }
              trap cleanup EXIT HUP INT TERM

              archive="${workdir}/cafe.zip"
              staged="${workdir}/cafe"
              wget -q -O "${archive}" "${CAFE_URL}"
              printf '%s  %s\n' "${CAFE_SHA256}" "${archive}" | sha256sum -c -
              mkdir "${staged}"
              unzip -q "${archive}" -d "${staged}"

              manifest="${staged}/manifest.json"
              if [ ! -f "${manifest}" ] || [ -L "${manifest}" ] ||
                 [ ! -f "${staged}/www/assets/panel-wrapper.js" ]; then
                echo "ERROR: C.A.F.E. archive is incomplete or unsafe" >&2
                exit 1
              fi
              if ! grep -Fq "\"version\": \"${CAFE_VERSION}\"" "${manifest}"; then
                echo "ERROR: C.A.F.E. archive version does not match ${CAFE_VERSION}" >&2
                exit 1
              fi

              # Upstream 0.6.0 restricts the direct config lookup to numeric
              # IDs. Home Assistant supports descriptive string IDs at the
              # same endpoint, and our automations intentionally use them.
              # Patch exactly one reviewed occurrence in the checksum-pinned
              # minified bundle; fail closed if upstream bytes ever differ.
              staged_bundle="${staged}/${CAFE_BUNDLE_PATH}"
              old_lookup='if(!i.startsWith("automation.")&&!Number.isNaN(Number(i)))try{'
              new_lookup='if(!i.startsWith("automation."))try{'
              old_create='mode:i.mode||"single",variables:i.variables||{}}'
              new_create='mode:i.mode||"single",max:i.max,max_exceeded:i.max_exceeded,variables:i.variables||{}}'
              old_update='mode:a.mode||"single",variables:a.variables||{}}'
              new_update='mode:a.mode||"single",max:a.max,max_exceeded:a.max_exceeded,variables:a.variables||{}}'
              if [ ! -f "${staged_bundle}" ] || [ -L "${staged_bundle}" ]; then
                echo "ERROR: expected regular C.A.F.E. bundle is missing" >&2
                exit 1
              fi
              old_count="$(grep -Fo "${old_lookup}" "${staged_bundle}" | wc -l | tr -d ' ')"
              new_count="$(grep -Fo "${new_lookup}" "${staged_bundle}" | wc -l | tr -d ' ')"
              old_create_count="$(grep -Fo "${old_create}" "${staged_bundle}" | wc -l | tr -d ' ')"
              new_create_count="$(grep -Fo "${new_create}" "${staged_bundle}" | wc -l | tr -d ' ')"
              old_update_count="$(grep -Fo "${old_update}" "${staged_bundle}" | wc -l | tr -d ' ')"
              new_update_count="$(grep -Fo "${new_update}" "${staged_bundle}" | wc -l | tr -d ' ')"
              if [ "${old_count}" -ne 1 ] || [ "${new_count}" -ne 0 ] ||
                 [ "${old_create_count}" -ne 1 ] || [ "${new_create_count}" -ne 0 ] ||
                 [ "${old_update_count}" -ne 1 ] || [ "${new_update_count}" -ne 0 ]; then
                echo "ERROR: C.A.F.E. compatibility patch precondition failed" >&2
                exit 1
              fi
              sed -i "s~${old_lookup}~${new_lookup}~" "${staged_bundle}"
              sed -i "s~${old_create}~${new_create}~" "${staged_bundle}"
              sed -i "s~${old_update}~${new_update}~" "${staged_bundle}"
              old_count="$(grep -Fo "${old_lookup}" "${staged_bundle}" | wc -l | tr -d ' ')"
              new_count="$(grep -Fo "${new_lookup}" "${staged_bundle}" | wc -l | tr -d ' ')"
              old_create_count="$(grep -Fo "${old_create}" "${staged_bundle}" | wc -l | tr -d ' ')"
              new_create_count="$(grep -Fo "${new_create}" "${staged_bundle}" | wc -l | tr -d ' ')"
              old_update_count="$(grep -Fo "${old_update}" "${staged_bundle}" | wc -l | tr -d ' ')"
              new_update_count="$(grep -Fo "${new_update}" "${staged_bundle}" | wc -l | tr -d ' ')"
              if [ "${old_count}" -ne 0 ] || [ "${new_count}" -ne 1 ] ||
                 [ "${old_create_count}" -ne 0 ] || [ "${new_create_count}" -ne 1 ] ||
                 [ "${old_update_count}" -ne 0 ] || [ "${new_update_count}" -ne 1 ]; then
                echo "ERROR: C.A.F.E. compatibility patch did not apply exactly once" >&2
                exit 1
              fi
              printf '%s  %s\n' "${CAFE_PATCHED_BUNDLE_SHA256}" "${staged_bundle}" |
                sha256sum -c -
              chmod -R u=rwX,g=rwX,o= "${staged}"

              # Replace an older installation only after the new tree is fully
              # verified. Both paths live on the PVC, so these moves are atomic.
              if [ -d "${target}" ]; then
                mv "${target}" "${workdir}/previous"
              fi
              if ! mv "${staged}" "${target}"; then
                if [ -d "${workdir}/previous" ]; then
                  mv "${workdir}/previous" "${target}"
                fi
                exit 1
              fi
              echo "Installed checksum-pinned C.A.F.E. ${CAFE_VERSION} with string-ID import fix"
          resources:
            requests: {cpu: 5m, memory: 8Mi, ephemeral-storage: 16Mi}
            limits: {cpu: 100m, memory: 64Mi, ephemeral-storage: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /config}
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.9.0@sha256:372d991e58882a1d8c68c07e9aa3f3b509276e695355f73ccdb03baa70407293
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Toronto
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 2Gi
          startupProbe:
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            # The official s6-based image has no non-root execution contract.
            # Keep that root requirement explicit and remove its usual power.
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
        - name: access-proxy
          image: nginx:1.31.5-alpine@sha256:34f40471dea485273c5e2a04dd5e97a682332ceb4a9adecd67de450dcb2fb390
          imagePullPolicy: IfNotPresent
          command: [nginx, -g, "daemon off;"]
          ports:
            - name: access-http
              containerPort: 18123
              protocol: TCP
          readinessProbe:
            tcpSocket: {port: access-http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: access-http}
            periodSeconds: 30
          resources:
            requests: {cpu: 10m, memory: 16Mi, ephemeral-storage: 16Mi}
            limits: {cpu: 100m, memory: 64Mi, ephemeral-storage: 128Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: nginx-runtime, mountPath: /etc/nginx, readOnly: true}
            - {name: nginx-tmp, mountPath: /tmp}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: bootstrap
          configMap:
            name: home-assistant-bootstrap
        - name: access-proxy-config
          configMap:
            name: home-assistant-access-proxy
        - name: nginx-runtime
          emptyDir:
            sizeLimit: 1Mi
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
