pid /tmp/nginx.pid;
events {}
http {
  # Home Assistant webhook IDs are bearer credentials embedded in paths.
  # Nginx error messages can also include the request line on upstream errors,
  # so discard both log streams rather than leaking path-borne credentials.
  access_log off;
  error_log /dev/null;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Only Traefik may reach this port under NetworkPolicy. Resolve the real
  # client address so Home Assistant's login throttling and IP bans operate on
  # the public client rather than the reverse proxy.
  set_real_ip_from 10.42.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  server {
    listen 18123;
    # This route is intentionally internet-accessible. Authentication belongs
    # to Home Assistant; the owner-onboarding marker still replaces this file
    # with the deny-only configuration after an empty or unsafe PVC restore.

    client_max_body_size 1g;

    location / {
      proxy_pass http://127.0.0.1:8123;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      # Discard any incoming chain after nginx has resolved the client
      # through the trusted Traefik hop. Home Assistant trusts nginx only.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
