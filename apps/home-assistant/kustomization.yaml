apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - bootstrap-config.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  # Home Assistant's first visitor can create the owner account. Keep the
  # normal route disabled until onboarding is completed through the documented
  # loopback-only SSH tunnel, then add route.yaml here in a reviewed change.
configMapGenerator:
  # A content-hashed name makes proxy-policy changes roll the pod. Root pruning
  # is disabled, so retire superseded generated ConfigMaps after reference checks.
  - name: home-assistant-access-proxy
    namespace: apps
    files:
      - nginx.conf
      - nginx-deny.conf
