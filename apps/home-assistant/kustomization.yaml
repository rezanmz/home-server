apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - bootstrap-config.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - route.yaml
configMapGenerator:
  # A content-hashed name makes proxy-policy changes roll the pod. Root pruning
  # is disabled, so retire superseded generated ConfigMaps after reference checks.
  - name: home-assistant-access-proxy
    namespace: apps
    files:
      - nginx.conf
      - nginx-deny.conf
