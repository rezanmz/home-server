apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: home-assistant
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        # Traefik reaches only the access proxy. Raw Home Assistant port 8123
        # is never an allowed pod-network ingress destination.
        - port: 18123
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    # Cloud integrations and package downloads get public HTTPS only and
    # cannot use this rule to pivot into private or reserved networks.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - {port: 443, protocol: TCP}
    # Permit Home Assistant to reach its own canonical HTTPS URL through the
    # Traefik MetalLB VIP. Callback-based integrations require the URL to be
    # reachable by both the server and the user's browser. Include the tightly
    # selected pre- and post-DNAT destinations used by K3s.
    - to:
        - ipBlock:
            cidr: 192.168.1.240/32
      ports:
        - {port: 443, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - {port: 8443, protocol: TCP}
    # TP-Link Kasa/Tapo discovery and local polling. The Archer's "IoT
    # Network" is an SSID on the main LAN rather than a separately routed
    # VLAN, so scope this exception by integration protocol instead of by
    # mutable device address. Other LAN services remain unreachable.
    - to:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - {port: 9999, protocol: UDP}
        - {port: 20002, protocol: UDP}
        - {port: 80, protocol: TCP}
        - {port: 9999, protocol: TCP}
