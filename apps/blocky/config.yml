blocking:
  denylists:
    ads:
      # HaGeZi Multi PRO++ expands the current balanced coverage while
      # avoiding Ultimate's documented app and website breakage. Use its
      # Blocky-compatible wildcard format so each rule covers subdomains.
      # Keep one all-in-one source so false-positive diagnosis stays clear.
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro.plus.txt
  clientGroupsBlock:
    default:
      - ads
  blockType: zeroIp
  blockTTL: 1m
  loading:
    refreshPeriod: 4h
    downloads:
      cachePath: /var/cache/blocky/lists
      timeout: 15s
      readTimeout: 30s
      readHeaderTimeout: 10s
      attempts: 3
      cooldown: 2s
    concurrency: 2
    # DNS must start even when GitHub is temporarily unreachable. The durable
    # download cache supplies the last good list while refresh retries happen.
    strategy: fast
    maxErrorsPerSource: 20

caching:
  minTime: 30s
  maxTime: 30m
  maxItemsCount: 10000
  prefetching: true
  prefetchExpires: 2h
  prefetchThreshold: 5
  prefetchMaxItemsCount: 2000
  cacheTimeNegative: 5m

prometheus:
  enable: true
  path: /metrics

bootstrapDns:
  - tcp+udp:8.8.8.8
  - tcp+udp:8.8.4.4

rebindingProtection:
  enable: true
  allowedDomains:
    - reza.network

specialUseDomains:
  enable: true
  rfc6762-appendixG: true

ports:
  dns:
    # The DaemonSet renders each node's LAN address into this template. A
    # specific address avoids colliding with systemd-resolved's loopback stub.
    - __HOST_IP__:53
  # Bind management and metrics to each node's cluster-only CNI gateway. There
  # is deliberately no LAN or HTTPRoute exposure for Blocky's control API.
  http:
    - __CNI_IP__:4000

log:
  level: info
  format: json
  timestamp: true
  privacy: true

ede:
  enable: true
