upstreams:
  init:
    strategy: fast
  groups:
    default:
      - tcp+udp:8.8.8.8
      - tcp+udp:8.8.4.4
  strategy: parallel_best
  timeout: 2s

# The LAN has IPv6 addressing but no routed IPv6 internet connection.
connectIPVersion: v4

