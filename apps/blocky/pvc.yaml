apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blocky-cache
  namespace: network-services
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
  # The downloaded denylist is reproducible. Keep redundant local replicas,
  # but do not spend B2 storage on it.
  storageClassName: longhorn-observability
