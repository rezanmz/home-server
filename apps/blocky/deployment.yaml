apiVersion: apps/v1
kind: Deployment
metadata:
  name: blocky
  namespace: network-services
  labels:
    app.kubernetes.io/name: blocky
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: blocky
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blocky
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: raspberrypi
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blocky
          image: ghcr.io/0xerr0r/blocky:v0.33.0@sha256:96c4ee1d4abee3e81475796403ffde0dfd0c53a6e263e2c35c867ba5563535d4
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /app/config/config.yml
          ports:
            - {name: dns-tcp, containerPort: 53, protocol: TCP}
            - {name: dns-udp, containerPort: 53, protocol: UDP}
            - {name: http-metrics, containerPort: 4000, protocol: TCP}
          startupProbe:
            exec:
              command: [/app/blocky, healthcheck]
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [/app/blocky, healthcheck]
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [/app/blocky, healthcheck]
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          volumeMounts:
            - {name: config, mountPath: /app/config, readOnly: true}
            - {name: cache, mountPath: /var/cache/blocky}
      volumes:
        - name: config
          configMap:
            name: blocky-config
            defaultMode: 0444
        - name: cache
          persistentVolumeClaim:
            claimName: blocky-cache
