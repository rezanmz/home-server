apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: blocky
  namespace: network-services
  labels:
    app.kubernetes.io/name: blocky
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: blocky
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blocky
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # LAN DNS is infrastructure-critical and must remain available when an
      # unrelated workload puts a node under resource pressure.
      priorityClassName: system-cluster-critical
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-node-config
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          imagePullPolicy: IfNotPresent
          command: [sh, -ec]
          args:
            - |-
              cni_ip="$(ip -4 -o address show dev cni0 | awk 'NR == 1 {sub(/\/.*/, "", $4); print $4}')"
              test -n "$HOST_IP"
              test -n "$cni_ip"
              sed \
                -e "s/__HOST_IP__/$HOST_IP/g" \
                -e "s/__CNI_IP__/$cni_ip/g" \
                /app/config-template/config.yml > /app/config/config.yml
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef: {fieldPath: status.hostIP}
          resources:
            requests: {cpu: 5m, memory: 8Mi, ephemeral-storage: 8Mi}
            limits: {cpu: 50m, memory: 32Mi, ephemeral-storage: 32Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 100
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config-template, mountPath: /app/config-template, readOnly: true}
            - {name: rendered-config, mountPath: /app/config}
            - {name: cache, mountPath: /var/cache/blocky}
      containers:
        - name: blocky
          image: ghcr.io/0xerr0r/blocky:v0.34.0@sha256:595136fb127f4c952b621113e668c09acdcf15ac054d96ee6d4c51a76c35f5fd
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /app/config/config.yml
          ports:
            - {name: dns-tcp, containerPort: 53, protocol: TCP}
            - {name: dns-udp, containerPort: 53, protocol: UDP}
            - {name: http-metrics, containerPort: 4000, protocol: TCP}
          startupProbe:
            tcpSocket:
              port: dns-tcp
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: dns-tcp
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 25m, memory: 64Mi, ephemeral-storage: 32Mi}
            limits: {cpu: 250m, memory: 256Mi, ephemeral-storage: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          volumeMounts:
            - {name: rendered-config, mountPath: /app/config, readOnly: true}
            - {name: cache, mountPath: /var/cache/blocky}
      volumes:
        - name: config-template
          configMap:
            name: blocky-config
            defaultMode: 0444
        - {name: rendered-config, emptyDir: {sizeLimit: 1Mi}}
        - name: cache
          emptyDir: {sizeLimit: 256Mi}
