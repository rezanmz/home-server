# yaml-language-server: $schema=../../catalog/service.schema.json
apiVersion: catalog.reza.network/v1alpha1
kind: Service
metadata:
  name: blocky
spec:
  name: Blocky DNS
  workload:
    namespace: network-services
    app: blocky
  homepage:
    order: 10
    group: Infrastructure
    icon: mdi-dns
    description: Filtering DNS on both cluster nodes
    link: false
  placement:
    mode: every-node
    reason: A host-network DaemonSet keeps LAN DNS available when either cluster node is unavailable.
  data:
    class: stateless
    protection: not-applicable
    note: Each node keeps only a bounded, reproducible, pod-local denylist cache.
  observability:
    mode: metrics
    manifests:
      - apps/blocky/metrics.yaml
      - infrastructure/observability/network-services-dashboard.yaml
