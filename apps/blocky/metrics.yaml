apiVersion: v1
kind: Service
metadata:
  name: blocky-metrics
  namespace: network-services
  labels:
    app.kubernetes.io/name: blocky
spec:
  ports:
    - {name: http-metrics, port: 4000, targetPort: 4000, protocol: TCP}
---
apiVersion: v1
kind: Endpoints
metadata:
  name: blocky-metrics
  namespace: network-services
  annotations:
    # Prometheus currently uses Endpoints discovery. Keep the separately
    # managed EndpointSlice below for a future discovery-role migration.
    endpoints.kubernetes.io/skip-mirror: "true"
subsets:
  - addresses: [{ip: 10.42.1.1}]
    ports: [{name: http-metrics, port: 4000, protocol: TCP}]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: blocky-metrics
  namespace: network-services
  labels:
    kubernetes.io/service-name: blocky-metrics
    endpointslice.kubernetes.io/managed-by: home-server
addressType: IPv4
ports:
  - {name: http-metrics, port: 4000, protocol: TCP}
endpoints:
  - addresses: [10.42.1.1]
    conditions: {ready: true}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: blocky
  namespace: network-services
  labels:
    release: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: blocky
  endpoints:
    - {port: http-metrics, path: /metrics, interval: 30s, scrapeTimeout: 10s}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: blocky
  namespace: network-services
  labels:
    release: observability
spec:
  groups:
    - name: home-server.blocky
      rules:
        - alert: BlockyUnavailable
          expr: absent(up{namespace="network-services",service="blocky-metrics"}) or max(up{namespace="network-services",service="blocky-metrics"}) == 0
          for: 2m
          labels: {severity: critical, cluster: home-server}
          annotations:
            summary: LAN DNS is unavailable
            description: Prometheus cannot scrape Blocky on the Raspberry Pi. Clients using 192.168.1.2 may be unable to resolve names.
            runbook_url: https://github.com/rezanmz/home-server/blob/main/docs/runbook.md#dns-and-dhcp
        - alert: BlockyQueryErrors
          expr: rate(blocky_error_total[5m]) > 0.05
          for: 10m
          labels: {severity: warning, cluster: home-server}
          annotations:
            summary: Blocky is returning DNS query errors
            description: Blocky has averaged more than one failed query every 20 seconds for at least 10 minutes.
            runbook_url: https://github.com/rezanmz/home-server/blob/main/docs/runbook.md#dns-and-dhcp
        - alert: BlockyDenylistStale
          expr: time() - max(blocky_last_list_group_refresh_timestamp_seconds) > 86400
          for: 30m
          labels: {severity: warning, cluster: home-server}
          annotations:
            summary: Blocky's denylist has not refreshed for more than one day
            description: DNS remains available from the durable list cache, but the StevenBlack source is stale.
            runbook_url: https://github.com/rezanmz/home-server/blob/main/docs/runbook.md#dns-and-dhcp
