apiVersion: v1
kind: ServiceAccount
metadata: {name: loggifly, namespace: monitoring}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: loggifly-event-reader}
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: loggifly-event-reader}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: loggifly-event-reader
subjects:
  - {kind: ServiceAccount, name: loggifly, namespace: monitoring}
