apiVersion: apps/v1
kind: Deployment
metadata: {name: loggifly, namespace: monitoring}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: loggifly}
  template:
    metadata:
      labels: {app.kubernetes.io/name: loggifly}
    spec:
      serviceAccountName: loggifly
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        # The distroless image declares USER by name ("nonroot"). Kubelet
        # cannot prove a named user is non-root, so pin its documented UID.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: event-exporter
          image: resmoio/kubernetes-event-exporter:v1.1@sha256:0fef715460ca7fd1a45f873601f95228c61ba4381cca9e44af29ce5c3fa4238c
          imagePullPolicy: IfNotPresent
          args: [-conf=/data/config.yaml]
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef: {name: loggifly-secrets, key: telegram-bot-token}
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef: {name: loggifly-secrets, key: telegram-chat-id}
          ports:
            - {name: metrics, containerPort: 2112}
          startupProbe: {httpGet: {path: /metrics, port: metrics}, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 24}
          readinessProbe: {httpGet: {path: /metrics, port: metrics}, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 6}
          livenessProbe: {httpGet: {path: /metrics, port: metrics}, periodSeconds: 30, timeoutSeconds: 3, failureThreshold: 3}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /data, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: loggifly}
        - {name: tmp, emptyDir: {}}
