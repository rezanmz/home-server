# yaml-language-server: $schema=../../catalog/service.schema.json
apiVersion: catalog.reza.network/v1alpha1
kind: Service
metadata:
  name: radarr
spec:
  name: Radarr
  workload:
    namespace: media
    app: media-vpn
  homepage:
    order: 30
    group: Downloads & Automation
    icon: radarr.png
    description: Movie automation
  web:
    hostname: radarr.reza.network
    route: apps/radarr/route.yaml
    visibility: private
    accessMiddleware: lan-vpn-only
    dns:
      cloudflare: true
      splitHorizon: true
    auth:
      mode: native
      reason: Radarr uses its built-in authentication behind the LAN/WireGuard boundary.
  placement:
    mode: beelink
    manifest: apps/downloads/deployment.yaml
    reason: Its container shares the downloads pod's Gluetun network namespace.
  data:
    class: mixed
    protection: longhorn-b2
    manifests:
      - apps/radarr/pvc.yaml
      - infrastructure/nfs-media/media.yaml
    note: Longhorn protects configuration; downloaded NFS media is reproducible.
  observability:
    mode: kubernetes
