# yaml-language-server: $schema=../../catalog/service.schema.json
apiVersion: catalog.reza.network/v1alpha1
kind: Service
metadata:
  name: 9router
spec:
  name: 9Router
  workload:
    namespace: apps
    app: 9router
  homepage:
    order: 21
    group: AI & Data
    icon: mdi-router-network
    description: AI model router with provider failover and usage tracking
  web:
    hostname: router.reza.network
    route: apps/9router/route.yaml
    visibility: private
    accessMiddleware: lan-vpn-only
    # The OpenAI-compatible surface is Internet-reachable so remote LLM clients
    # (the workstation omp/CLI profile, and any future off-LAN consumer) can use
    # it; 9Router authenticates every /v1 request itself with a per-app router
    # key and answers 401 without one. Dashboard, /api/*, and all other paths
    # stay behind the LAN/WireGuard allow-list.
    publicPaths:
      - path: /v1
        reason: Remote model clients call the OpenAI-compatible API with a per-app router key; 9Router rejects an unkeyed request with 401 before any provider is reached.
    dns:
      cloudflare: true
      splitHorizon: true
    auth:
      mode: native
      reason: 9Router has no OIDC; its dashboard uses native SAML SSO against Authentik (hand-maintained blueprint apps/authentik/saml-application-blueprints.yaml).
  placement:
    mode: beelink
    manifest: apps/9router/workloads.yaml
    reason: Single-writer SQLite data directory; pinned like the gateway it replaces.
  data:
    class: longhorn
    protection: longhorn-b2
    manifests: [apps/9router/pvc.yaml]
  observability:
    mode: kubernetes
