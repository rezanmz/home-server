apiVersion: apps/v1
kind: Deployment
metadata:
  name: 9router
  namespace: apps
  labels:
    app.kubernetes.io/name: 9router
    app.kubernetes.io/component: application
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: 9router
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: 9router
        app.kubernetes.io/component: application
    spec:
      # Single-writer SQLite data directory pinned to the server node.
      nodeSelector:
        kubernetes.io/hostname: beelink
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: 9router
          image: ghcr.io/decolua/9router:0.5.86@sha256:a2968fcbaa4ff4bf2d6dcdb09e0cacb67832d8959441bc1bcc75da401f8ae72c
          imagePullPolicy: IfNotPresent
          # The image entrypoint is `chown … && su-exec node …`, which needs
          # root (setgroups) and fails under this unprivileged pod. fsGroup
          # already owns the Longhorn volume, so run the server process the
          # entrypoint would exec, directly as the node user.
          command: ["node"]
          args: ["custom-server.js"]
          env:
            - name: DATA_DIR
              value: /app/data
            - name: PORT
              value: "20128"
            - name: HOSTNAME
              value: 0.0.0.0
            - name: NODE_ENV
              value: production
            - name: BASE_URL
              value: https://router.reza.network
            - name: NEXT_PUBLIC_BASE_URL
              value: https://router.reza.network
            # First-boot dashboard password; afterwards the value lives in the
            # SQLite data directory and is changed through the dashboard.
            - name: INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: 9router-secrets
                  key: initial-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: 9router-secrets
                  key: jwt-secret
            - name: API_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: 9router-secrets
                  key: api-key-secret
            - name: MACHINE_ID_SALT
              valueFrom:
                secretKeyRef:
                  name: 9router-secrets
                  key: machine-id-salt
            # Inert upstream: 0.5.75 reads REQUIRE_API_KEY only in its docs,
            # never in code. The real per-request gate is dashboardGuard, which
            # demands a router key for any non-loopback /v1 call regardless of
            # this variable. Kept only so a future image that does read it
            # cannot silently start unauthenticated; see docs/lessons-learned.md.
            - name: REQUIRE_API_KEY
              value: "true"
            - name: AUTH_COOKIE_SECURE
              value: "true"
            - name: ENABLE_REQUEST_LOGS
              value: "false"
            # The image ships no tzdata and defaults to UTC. Node's bundled ICU
            # still resolves the zone name, so dashboard times and the server's
            # day buckets match the household's real local day.
            - name: TZ
              value: America/New_York
          ports:
            - name: http
              containerPort: 20128
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 224Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
            # DATA_DIR above is authoritative; this fallback (~/.9router) is
            # mounted from tmp so a read-only root filesystem cannot break the
            # process if the code path is ever touched.
            - name: tmp
              mountPath: /app/data-home
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: 9router-data
        - name: tmp
          emptyDir: {}
