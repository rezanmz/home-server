apiVersion: apps/v1
kind: Deployment
metadata:
  name: 9router
  namespace: apps
  labels:
    app.kubernetes.io/name: 9router
    app.kubernetes.io/component: application
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: 9router
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: 9router
        app.kubernetes.io/component: application
    spec:
      # Single-writer SQLite data directory pinned to the server node.
      nodeSelector:
        kubernetes.io/hostname: beelink
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: 9router
          # 0.5.86 routed the chat/smart aliases to Xiaomi MiMo (new in that
          # release) and Hermes' cron runs began failing with
          # `Streaming response failed: [400] Invalid request parameters`; the
          # Morning Briefing succeeded the morning before that merge and failed
          # from the morning after, which is what isolated this upgrade. Its
          # notes name no MiMo or streaming fix, so 0.5.91 was shipped rather
          # than assumed. 0.5.95's changelog names only provider/model-registry,
          # Claude/Codex, and proxy TLS-fallback changes — no alias-routing
          # edits. If cron returns 400 again, revert to
          # 0.5.75@sha256:7c893bc2c27ecea2ae337abd5eacfec9e5763091b3a3b7862fc0625b770bb156,
          # the last version proven working.
          #
          # 0.5.109 skips 14 patches and DOES touch the routing layer, so the
          # 0.5.86 failure mode is the explicit post-rollout gate rather than
          # something assumed: chat/auto/smart must each answer through the
          # live combos, and the `:high`-effort streaming path the cron lanes
          # use must return 200 — otherwise this is reverted to the pin below.
          # Directly relevant fixes in this range: "fix(combo): advance past a
          # request-scoped 4xx instead of ending the combo" (previously one
          # provider 4xx killed the whole chain — with a single provider and no
          # failover that was fatal), "fix(opencode): honor low|high|max
          # reasoning efforts", "fix(capabilities): send reasoning_effort for
          # OpenCode's glm-5.3-flash-free" (we run exactly that model), and
          # "fix(db): strip NUL bytes from bound strings". Revert path above
          # still applies.
          #
          # 0.5.111 is a 2-patch hop (0.5.110 was never published — 404 on
          # GHCR, same phantom-tag pattern as 0.5.99). It adds OpenCode Go
          # Kimi K3.1 Pro (chat lane, vision/video, 1,048,576 context,
          # 131,072 max output) and fixes DeepSeek's upstream id mapping:
          # "send deepseek-flash upstream for deepseek-v4.1-flash, whose
          # catalog id the API rejects". Our Deepseek-Flash chain starts with
          # ds/deepseek-flash so it is already on the corrected id, and the
          # ocg/deepseek-v4.1-flash entry in slot 3 benefits from the mapping.
          # Same post-rollout gate as 0.5.109: chat/auto/smart must answer and
          # the :high streaming path must return 200.
          #
          # 0.5.112 is a single-patch hop with no schema change. Relevant here:
          # "Chat: surface upstream SSE error frames in non-streaming responses —
          # answer with the upstream status and message instead of swallowing them
          # into a generic 502". That 502-masking is exactly what hid the
          # OpenCode Go 429s behind a generic error earlier, so diagnosing quota
          # exhaustion should now be direct. Also: Docker bakes wreq-js and
          # playwright-core into the runner image (#5245) so OpenCode Free no
          # longer needs runtime downloads, and NVIDIA NIM reasoning-alias
          # normalization (not used here).
          image: ghcr.io/decolua/9router:0.5.112@sha256:fab111d99b23bde6c8944ca22982603ab0b09e917a0b1e4ce42a24b05753bec9
          imagePullPolicy: IfNotPresent
          # The image entrypoint is `chown … && su-exec node …`, which needs
          # root (setgroups) and fails under this unprivileged pod. fsGroup
          # already owns the Longhorn volume, so run the server process the
          # entrypoint would exec, directly as the node user.
          command: ["node"]
          args: ["custom-server.js"]
          env:
            - name: DATA_DIR
              value: /app/data
            - name: PORT
              value: "20128"
            - name: HOSTNAME
              value: 0.0.0.0
            - name: NODE_ENV
              value: production
            - name: BASE_URL
              value: https://router.reza.network
            - name: NEXT_PUBLIC_BASE_URL
              value: https://router.reza.network
            # First-boot dashboard password; afterwards the value lives in the
            # SQLite data directory and is changed through the dashboard.
            - name: INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: 9router-secrets
                  key: initial-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: 9router-secrets
                  key: jwt-secret
            - name: API_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: 9router-secrets
                  key: api-key-secret
            - name: MACHINE_ID_SALT
              valueFrom:
                secretKeyRef:
                  name: 9router-secrets
                  key: machine-id-salt
            # Inert upstream: 0.5.75 reads REQUIRE_API_KEY only in its docs,
            # never in code. The real per-request gate is dashboardGuard, which
            # demands a router key for any non-loopback /v1 call regardless of
            # this variable. Kept only so a future image that does read it
            # cannot silently start unauthenticated; see docs/lessons-learned.md.
            - name: REQUIRE_API_KEY
              value: "true"
            - name: AUTH_COOKIE_SECURE
              value: "true"
            - name: ENABLE_REQUEST_LOGS
              value: "false"
            # The image ships no tzdata and defaults to UTC. Node's bundled ICU
            # still resolves the zone name, so dashboard times and the server's
            # day buckets match the household's real local day.
            - name: TZ
              value: America/New_York
          ports:
            - name: http
              containerPort: 20128
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 224Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
            # DATA_DIR above is authoritative; this fallback (~/.9router) is
            # mounted from tmp so a read-only root filesystem cannot break the
            # process if the code path is ever touched.
            - name: tmp
              mountPath: /app/data-home
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: 9router-data
        - name: tmp
          emptyDir: {}
