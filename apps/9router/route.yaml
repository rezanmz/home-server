apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: 9router
  namespace: apps
spec:
  parentRefs:
    - name: home
      namespace: traefik
  hostnames:
    - router.reza.network
  rules:
    # The dashboard authenticates with 9Router's own password/cookie session;
    # the /v1 API authenticates separately with router keys. Both stay inside
    # the LAN/WireGuard allowlist, matching the gateway it replaces.
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: custom-errors
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: lan-vpn-only
      backendRefs:
        - name: 9router
          port: 20128
