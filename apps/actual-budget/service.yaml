apiVersion: v1
kind: Service
metadata:
  name: actual-budget
  namespace: apps
  labels:
    app.kubernetes.io/name: actual-budget
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: actual-budget
  ports:
    - name: http
      port: 5006
      targetPort: access-http
      protocol: TCP
---
# The browser-facing Service deliberately terminates at the LAN/VPN proxy.
# Headless readers use this internal Service to reach Actual's application
# container directly; NetworkPolicy limits it to reviewed consumers.
apiVersion: v1
kind: Service
metadata:
  name: actual-budget-api
  namespace: apps
  labels:
    app.kubernetes.io/name: actual-budget
    app.kubernetes.io/component: internal-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: actual-budget
  ports:
    - name: http
      port: 5006
      targetPort: http
      protocol: TCP
