apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual-budget
  namespace: apps
  labels:
    app.kubernetes.io/name: actual-budget
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: actual-budget
  template:
    metadata:
      labels:
        app.kubernetes.io/name: actual-budget
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: actual-budget
          image: actualbudget/actual-server:26.7.0@sha256:e18b7fbfec6157a368fad4146563f397502e9da70a120aeaeac63b4977405d1c
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Toronto
            - name: ACTUAL_LOGIN_METHOD
              value: openid
            - name: ACTUAL_ALLOWED_LOGIN_METHODS
              # The browser remains OpenID-only because enforcement is enabled.
              # Actual's official headless API cannot complete an interactive
              # OpenID flow, so MCPHub may explicitly select the inactive
              # password method with a separate, randomly generated credential.
              value: openid,password
            - name: ACTUAL_OPENID_DISCOVERY_URL
              # Use the public issuer URL through the exact Traefik VIP path.
              # Authentik derives issuer/browser endpoints from the request
              # host, so direct service discovery would publish an internal,
              # browser-unreachable issuer.
              value: https://auth.reza.network/application/o/actual-budget/.well-known/openid-configuration
            - name: ACTUAL_OPENID_AUTH_METHOD
              value: openid
            - name: ACTUAL_OPENID_ENFORCE
              value: "true"
            - name: ACTUAL_TOKEN_EXPIRATION
              value: openid-provider
            - name: ACTUAL_USER_CREATION_MODE
              value: login
            - name: ACTUAL_OPENID_SERVER_HOSTNAME
              value: https://budget.reza.network
            - name: ACTUAL_OPENID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: actual-budget-secrets
                  key: openid-client-id
            - name: ACTUAL_OPENID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: actual-budget-secrets
                  key: openid-client-secret
          ports:
            - name: http
              containerPort: 5006
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            exec:
              command:
                - node
                - /app/src/scripts/health-check.js
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command:
                - node
                - /app/src/scripts/health-check.js
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - node
                - /app/src/scripts/health-check.js
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
        - name: access-proxy
          image: nginx:1.31.3-alpine@sha256:2776cd5b70d8983e27e9f5c90abee3d24c690014ae8ecbb529572d954a459096
          imagePullPolicy: IfNotPresent
          command: [nginx, -g, "daemon off;"]
          ports:
            - name: access-http
              containerPort: 15006
          readinessProbe:
            tcpSocket:
              port: access-http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: access-http
            periodSeconds: 30
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: access-proxy-config, mountPath: /etc/nginx, readOnly: true}
            - {name: nginx-tmp, mountPath: /tmp}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: actual-budget-data
        - name: access-proxy-config
          configMap:
            name: actual-budget-access-proxy
        - {name: nginx-tmp, emptyDir: {}}
        - {name: nginx-cache, emptyDir: {}}
