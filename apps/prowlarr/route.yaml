apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: prowlarr, namespace: media}
spec:
  parentRefs:
    - {name: home, namespace: traefik}
  hostnames: [prowlarr.reza.network]
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: custom-errors
      backendRefs:
        - {name: prowlarr-access, port: 80}
