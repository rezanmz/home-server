apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
  namespace: apps
  labels:
    app.kubernetes.io/name: vikunja
    app.kubernetes.io/component: application
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vikunja
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vikunja
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data
          image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: [sh, -ec, "mkdir -p /state/db /state/files"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /state}
      containers:
        - name: vikunja
          image: vikunja/vikunja:2.7.0@sha256:e2204a1c1c6a81e833c2b3a5442be182ca2335b54c2e7e37578cc3fe12a27cfc
          imagePullPolicy: IfNotPresent
          env:
            - {name: TZ, value: America/Toronto}
            - {name: VIKUNJA_SERVICE_PUBLICURL, value: "https://tasks.reza.network/"}
            - {name: VIKUNJA_SERVICE_ENABLEREGISTRATION, value: "false"}
            - {name: VIKUNJA_AUTH_LOCAL_ENABLED, value: "false"}
            - {name: VIKUNJA_AUTH_OPENID_ENABLED, value: "true"}
            - {name: VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_NAME, value: Authentik}
            - name: VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_AUTHURL
              value: https://auth.reza.network/application/o/vikunja/
            - {name: VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_CLIENTID, value: vikunja}
            - name: VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: vikunja-secrets
                  key: oidc-client-secret
            - {name: VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_SCOPE, value: "openid email profile"}
            - {name: VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_REQUIREAVAILABILITY, value: "true"}
            - name: VIKUNJA_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: vikunja-secrets
                  key: service-secret
          ports:
            - {name: http, containerPort: 3456, protocol: TCP}
          startupProbe:
            httpGet: {path: /api/v1/info, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /api/v1/info, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /api/v1/info, port: http}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 25m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /db, subPath: db}
            - {name: data, mountPath: /app/vikunja/files, subPath: files}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vikunja-data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
