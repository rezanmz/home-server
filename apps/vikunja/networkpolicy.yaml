apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vikunja
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vikunja
      app.kubernetes.io/component: application
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - {port: 3456, protocol: TCP}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcphub
              app.kubernetes.io/component: application
      ports:
        - {port: 3456, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    # The wait-for-authentik init container polls the Authentik service on 9000
    # before the app starts. Without this rule the init container would burn its
    # whole 300s budget against a policy drop and then fail the rollout - a
    # self-inflicted outage in place of the crash loop it is meant to remove.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
      ports:
        - {port: 9000, protocol: TCP}
    - to:
        - ipBlock: {cidr: 192.168.1.240/32}
      ports:
        - {port: 443, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - {port: 8443, protocol: TCP}
