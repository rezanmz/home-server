# yaml-language-server: $schema=../../catalog/service.schema.json
apiVersion: catalog.reza.network/v1alpha1
kind: Service
metadata:
  name: vikunja
spec:
  name: Vikunja
  workload:
    namespace: apps
    app: vikunja
  homepage:
    order: 25
    group: Productivity
    icon: vikunja.png
    description: Tasks and personal planning
  web:
    hostname: tasks.reza.network
    route: apps/vikunja/route.yaml
    visibility: public
    dns:
      cloudflare: true
      splitHorizon: true
    auth:
      mode: oidc
      profile: authentik-oidc-v1
      blueprintName: Vikunja OIDC
      application:
        slug: vikunja
        launchUrl: https://tasks.reza.network/
      client:
        type: confidential
        id: vikunja
        grantTypes: [authorization_code, refresh_token]
        scopes: [openid, email, profile]
        redirectUris:
          - type: authorization
            url: https://tasks.reza.network/auth/openid/authentik
        secret:
          manifest: apps/vikunja/secrets.sops.yaml
          key: oidc-client-secret
  placement:
    mode: floating
  data:
    class: longhorn
    protection: longhorn-b2
    manifests: [apps/vikunja/pvc.yaml]
  observability:
    mode: kubernetes
