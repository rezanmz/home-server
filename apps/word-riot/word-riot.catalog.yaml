# yaml-language-server: $schema=../../catalog/service.schema.json
apiVersion: catalog.reza.network/v1alpha1
kind: Service
metadata:
  name: word-riot
spec:
  name: Word riot
  workload:
    namespace: apps
    app: word-riot
  homepage:
    order: 35
    group: Media
    icon: mdi-gamepad-variant
    description: One letter, one word each, then the room votes
  web:
    hostname: wordriot.reza.network
    route: apps/word-riot/route.yaml
    visibility: public
    dns:
      cloudflare: true
      splitHorizon: true
    auth:
      mode: native
      reason: Word riot has no accounts or upstream SSO; room-code join is its native access control, and the same-origin WebSocket plus QR join flow is incompatible with forward-auth.
  placement:
    mode: floating
  data:
    class: stateless
    protection: not-applicable
  observability:
    mode: kubernetes
