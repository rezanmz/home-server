apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jellyseerr
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jellyseerr
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 15055
          protocol: TCP
  # Jellyseerr connects to the user-configured Jellyfin and *arr endpoints.
  egress:
    - {}
