apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vocabet
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vocabet
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 3001
          protocol: TCP
  # No application egress: rooms live in process memory, there is no SSO,
  # and the server calls no external API. Only cluster DNS is permitted.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
