apiVersion: apps/v1
kind: Deployment
metadata:
  name: vocabet
  namespace: apps
  labels:
    app.kubernetes.io/name: vocabet
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vocabet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vocabet
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: vocabet-ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vocabet
          # Rooms live in process memory; a restart ends running games by
          # design, so the container is stateless and read-only.
          image: ghcr.io/rezanmz/categories:main@sha256:13f7c4f3b36cf8e6bef29e4584f960cb21addd957ca13507aa45dbd4ae8b8301
          imagePullPolicy: IfNotPresent
          env:
            - {name: PORT, value: "3001"}
            - {name: HOME, value: /tmp}
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
