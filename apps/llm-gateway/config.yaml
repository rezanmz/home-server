apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway-config
  namespace: apps
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/component: application
data:
  # Git owns the server contract: the master key, salt, database path, and
  # safety flags. Provider credentials, tier model lists, fallback chains,
  # and virtual keys are application-owned state in the gateway's own
  # database (docs/configuration-ownership.md) and are configured through
  # the admin UI or CLI. Provider credentials never enter Git.
  config.yaml: |
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      use_database: true
      store_model_in_db: true
    litellm_settings:
      drop_params: true
      set_verbose: false
