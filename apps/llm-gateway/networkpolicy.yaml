apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-gateway-application
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
      app.kubernetes.io/component: application
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Browser admin UI and /v1 API access through the split-horizon route.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 4000
          protocol: TCP
    # In-cluster API consumers reach the Service directly with a virtual key.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: open-webui
              app.kubernetes.io/component: application
      ports:
        - port: 4000
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcphub
              app.kubernetes.io/component: application
      ports:
        - port: 4000
          protocol: TCP
  # Upstream model providers are globally routed HTTPS endpoints. Keep
  # Kubernetes, LAN, loopback, link-local, and reserved networks unreachable,
  # matching the repository's searxng egress shape.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - {port: 443, protocol: TCP}
