apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-gateway
  namespace: apps
spec:
  parentRefs:
    - name: home
      namespace: traefik
  hostnames:
    - llm-gateway.reza.network
  rules:
    # The admin UI signs in with native LiteLLM OIDC against Authentik
    # (/sso/callback); the /v1 API authenticates separately with virtual
    # keys. Both stay inside the LAN/WireGuard allowlist, matching MCPHub.
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: custom-errors
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: lan-vpn-only
      backendRefs:
        - name: llm-gateway
          port: 4000
