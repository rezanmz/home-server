apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: apps
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/component: application
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/component: application
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
