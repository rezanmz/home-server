apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: apps
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/component: application
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/component: application
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway-postgresql
  namespace: apps
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/component: database
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
