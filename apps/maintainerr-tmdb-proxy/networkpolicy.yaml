apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: maintainerr-tmdb-proxy
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: maintainerr-tmdb-proxy
      app.kubernetes.io/component: egress-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the Maintainerr application pod may use this proxy.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
          podSelector:
            matchLabels:
              app.kubernetes.io/name: maintainerr
              app.kubernetes.io/component: application
      ports:
        - port: 3128
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    # Only public HTTPS destinations: all of the public internet on 443,
    # excluding private and special-use ranges.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - port: 443
          protocol: TCP
