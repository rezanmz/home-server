# Restricted egress forward proxy for Maintainerr: only api.themoviedb.org:443.
# Generated into a hash-suffixed ConfigMap; any change rolls the proxy pod.

http_port 3128
# Accept proxy clients from the cluster pod network only.
acl localnet src 10.42.0.0/16
acl CONNECT method CONNECT
acl Safe_ports port 443
acl SSL_ports port 443
# Anchored and case-insensitive for the canonical TMDB API host. Squid strips
# terminal DNS root dots before this ACL, treating those spellings as equivalent.
acl TMDB dstdom_regex -n -i ^api\.themoviedb\.org$

# No caching and no PID file; all state stays under /tmp.
cache deny all
# Squid defaults cache_mem to 256 MiB even when disk caching is disabled.
# This proxy tunnels only; keep both object storage and memory pools off.
cache_mem 0 MB
maximum_object_size_in_memory 0 KB
memory_pools off
# ICMP reachability is unnecessary for one HTTPS origin and requires raw sockets.
pinger_enable off
pid_filename none
# Explicit writable-state directives: coredumps land in /tmp; the netdb
# journal and store log are disabled so the RO rootfs is never written.
coredump_dir /tmp
netdb_filename none
cache_store_log none

# Logs go to container stdout/stderr for kubelet collection.
access_log stdio:/dev/stdout squid
cache_log stdio:/dev/stderr

# Deny any destination port outside 443 before anything else.
http_access deny !Safe_ports
# Only CONNECT (proxied TLS) is permitted; no plain-HTTP forwarding.
http_access deny !CONNECT
# CONNECT is only ever allowed to port 443.
http_access deny CONNECT !SSL_ports
# Single allow rule: pod network + CONNECT + TMDB + port 443.
http_access allow localnet CONNECT TMDB SSL_ports
# Default deny for everything else.
http_access deny all

# Never reveal the client or proxy identity to the origin.
forwarded_for delete
via off
