# yaml-language-server: $schema=../../catalog/service.schema.json
apiVersion: catalog.reza.network/v1alpha1
kind: Service
metadata:
  name: seerr
spec:
  name: Seerr
  workload:
    namespace: apps
    app: seerr
  homepage:
    order: 20
    group: Media
    icon: seerr.png
    description: Media requests
  web:
    hostname: seerr.reza.network
    route: apps/seerr/route.yaml
    visibility: public
    dns:
      cloudflare: true
      splitHorizon: true
    auth:
      mode: native
      reason: Seerr uses its supported Jellyfin/local login; native OIDC is not available.
  placement:
    mode: beelink
    manifest: apps/seerr/deployment.yaml
    reason: Keeps this Internet-facing workload from inheriting the Pi pod CIDR's private-route trust.
  data:
    class: longhorn
    protection: longhorn-b2
    manifests: [apps/seerr/pvc.yaml]
  observability:
    mode: kubernetes
