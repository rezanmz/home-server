apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seerr
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: seerr
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 15055
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcphub
              app.kubernetes.io/component: application
      ports:
        - port: 5055
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: omnifin
              app.kubernetes.io/component: gateway
      ports:
        - port: 5055
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: maintainerr
      ports:
        - port: 5055
          protocol: TCP
  # Seerr connects to the user-configured Jellyfin and *arr endpoints.
  egress:
    - {}
