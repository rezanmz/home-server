apiVersion: v1
kind: ConfigMap
metadata:
  name: audiobookshelf-bootstrap
  namespace: media
data:
  bootstrap.js: |
    'use strict'

    const crypto = require('node:crypto')
    const fs = require('node:fs/promises')

    const baseUrl = `http://127.0.0.1:${process.env.PORT || '13378'}`
    const markerPath = '/config/.gitops-bootstrap-complete'
    const requiredEnvironment = [
      'AUDIOBOOKSHELF_BOOTSTRAP_PASSWORD',
      'AUDIOBOOKSHELF_OIDC_CLIENT_ID',
      'AUDIOBOOKSHELF_OIDC_CLIENT_SECRET',
      'AUDIOBOOKSHELF_OIDC_DISCOVERY_URL',
      'AUDIOBOOKSHELF_ROOT_USERNAME'
    ]

    function sleep(milliseconds) {
      return new Promise((resolve) => setTimeout(resolve, milliseconds))
    }

    async function request(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        signal: AbortSignal.timeout(10000)
      })
      const body = await response.text()
      if (!response.ok) {
        throw new Error(`${options.method || 'GET'} ${url} returned ${response.status}: ${body.slice(0, 200)}`)
      }
      if (!body) return null
      try {
        return JSON.parse(body)
      } catch {
        return body
      }
    }

    async function waitForJson(url, description, attempts = 150) {
      let lastError
      for (let attempt = 1; attempt <= attempts; attempt += 1) {
        try {
          return await request(url)
        } catch (error) {
          lastError = error
          if (attempt < attempts) await sleep(2000)
        }
      }
      throw new Error(`${description} did not become ready: ${lastError}`)
    }

    async function authenticatedRequest(path, token, options = {}) {
      return request(`${baseUrl}${path}`, {
        ...options,
        headers: {
          Authorization: `Bearer ${token}`,
          'Content-Type': 'application/json',
          ...(options.headers || {})
        }
      })
    }

    function libraryUsesPath(library, path) {
      return (library.folders || library.libraryFolders || []).some((folder) =>
        (folder.fullPath || folder.path) === path
      )
    }

    async function main() {
      for (const name of requiredEnvironment) {
        if (!process.env[name]) throw new Error(`Required environment variable ${name} is empty`)
      }

      let status = await waitForJson(`${baseUrl}/status`, 'Audiobookshelf')
      const secretHash = crypto
        .createHash('sha256')
        .update(process.env.AUDIOBOOKSHELF_OIDC_CLIENT_SECRET)
        .digest('hex')
      const expectedMarker = `version=1\noidc-client-secret-sha256=${secretHash}\n`
      const marker = await fs.readFile(markerPath, 'utf8').catch(() => '')
      if (marker === expectedMarker && status.isInit && status.authMethods?.includes('openid')) {
        console.log('[bootstrap] Existing initialized OIDC configuration is healthy')
        return
      }

      const discovery = await waitForJson(
        process.env.AUDIOBOOKSHELF_OIDC_DISCOVERY_URL,
        'Authentik OIDC discovery'
      )
      for (const field of ['issuer', 'authorization_endpoint', 'token_endpoint', 'userinfo_endpoint', 'jwks_uri']) {
        if (!discovery[field]) throw new Error(`OIDC discovery response is missing ${field}`)
      }

      if (!status.isInit) {
        await request(`${baseUrl}/init`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            newRoot: {
              username: process.env.AUDIOBOOKSHELF_ROOT_USERNAME,
              password: process.env.AUDIOBOOKSHELF_BOOTSTRAP_PASSWORD
            }
          })
        })
        status = await request(`${baseUrl}/status`)
        if (!status.isInit) throw new Error('Audiobookshelf initialization did not persist')
        console.log('[bootstrap] Created the local recovery root account')
      }

      const login = await request(`${baseUrl}/login`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          username: process.env.AUDIOBOOKSHELF_ROOT_USERNAME,
          password: process.env.AUDIOBOOKSHELF_BOOTSTRAP_PASSWORD
        })
      })
      const token = login?.user?.accessToken
      if (!token) throw new Error('Local recovery login did not return an access token')

      await authenticatedRequest('/api/auth-settings', token, {
        method: 'PATCH',
        body: JSON.stringify({
          authActiveAuthMethods: ['local', 'openid'],
          authOpenIDIssuerURL: discovery.issuer,
          authOpenIDAuthorizationURL: discovery.authorization_endpoint,
          authOpenIDTokenURL: discovery.token_endpoint,
          authOpenIDUserInfoURL: discovery.userinfo_endpoint,
          authOpenIDJwksURL: discovery.jwks_uri,
          authOpenIDLogoutURL: discovery.end_session_endpoint || null,
          authOpenIDClientID: process.env.AUDIOBOOKSHELF_OIDC_CLIENT_ID,
          authOpenIDClientSecret: process.env.AUDIOBOOKSHELF_OIDC_CLIENT_SECRET,
          authOpenIDTokenSigningAlgorithm: 'RS256',
          authOpenIDButtonText: 'Login with Authentik',
          authOpenIDAutoLaunch: false,
          authOpenIDAutoRegister: false,
          authOpenIDMatchExistingBy: 'username',
          authOpenIDMobileRedirectURIs: ['audiobookshelf://oauth'],
          authOpenIDGroupClaim: '',
          authOpenIDAdvancedPermsClaim: '',
          authOpenIDSubfolderForRedirectURLs: ''
        })
      })
      console.log('[bootstrap] Enabled native Authentik OIDC for browser and mobile clients')

      const libraryResponse = await authenticatedRequest('/api/libraries', token)
      const libraries = libraryResponse?.libraries || []
      const desiredLibraries = [
        {name: 'Audiobooks', path: '/audiobooks', mediaType: 'book', icon: 'audiobookshelf', provider: 'google'},
        {name: 'Podcasts', path: '/podcasts', mediaType: 'podcast', icon: 'podcast', provider: 'itunes'},
        {name: 'Ebooks', path: '/ebooks', mediaType: 'book', icon: 'bookshelf', provider: 'google'}
      ]
      for (const desired of desiredLibraries) {
        if (libraries.some((library) => libraryUsesPath(library, desired.path))) continue
        await authenticatedRequest('/api/libraries', token, {
          method: 'POST',
          body: JSON.stringify({
            name: desired.name,
            folders: [{fullPath: desired.path}],
            mediaType: desired.mediaType,
            icon: desired.icon,
            provider: desired.provider
          })
        })
        console.log(`[bootstrap] Added the ${desired.name} library`)
      }

      await fs.writeFile(markerPath, expectedMarker, {mode: 0o600})
      status = await request(`${baseUrl}/status`)
      if (!status.authMethods?.includes('openid')) {
        throw new Error('Audiobookshelf did not report OIDC as an active authentication method')
      }
      console.log('[bootstrap] Bootstrap completed')
    }

    main().catch((error) => {
      console.error(`[bootstrap] ${error.stack || error}`)
      process.exit(1)
    })
