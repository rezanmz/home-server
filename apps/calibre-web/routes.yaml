apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: calibre-web, namespace: media}
spec:
  parentRefs:
    - {name: home, namespace: traefik}
  hostnames: [library.reza.network]
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: custom-errors
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: lan-vpn-only
      backendRefs:
        - {name: calibre-web, port: 8083}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: shelfmark, namespace: media}
spec:
  parentRefs:
    - {name: home, namespace: traefik}
  hostnames: [shelfmark.reza.network]
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: custom-errors
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: lan-vpn-only
      backendRefs:
        - {name: shelfmark-access, port: 80}
