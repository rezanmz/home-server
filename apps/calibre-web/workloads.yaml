apiVersion: apps/v1
kind: Deployment
metadata: {name: calibre-web, namespace: media}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: calibre-web}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calibre-web
        home-server.reza.network/internal-client: "true"
    spec:
      automountServiceAccountToken: false
      # Shelfmark in the downloads pod and Calibre-Web share the ingest RWO
      # claim. Follow that pod dynamically instead of pinning both workloads
      # to one physical node.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: media-vpn
              topologyKey: kubernetes.io/hostname
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: calibre-web
          image: crocodilestick/calibre-web-automated:v4.0.6@sha256:c31a738b6d5ec6982c050063dd3f063b6943eb1051fc81144789f840d9093a8d
          imagePullPolicy: IfNotPresent
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ, value: America/Toronto}
          ports:
            - {name: http, containerPort: 8083}
          startupProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8083/]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          readinessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8083/]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8083/]}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext: {allowPrivilegeEscalation: false}
          volumeMounts:
            - {name: config, mountPath: /config}
            - name: books
              mountPath: /calibre-library
              subPath: books
              mountPropagation: HostToContainer
            - {name: ingest, mountPath: /cwa-book-ingest}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: calibre-web-config}
        - name: books
          persistentVolumeClaim: {claimName: media-library-juicefs}
        - name: ingest
          persistentVolumeClaim: {claimName: calibre-web-ingest}
