apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: maintainerr
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: maintainerr
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # Both selectors form one peer: only the gateway pods may present the
        # X-Forwarded-For value that the same-pod proxy trusts.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-traefik
      ports:
        - port: 16246
          protocol: TCP
  # Maintainerr is connection-only: it reaches exactly the services it manages
  # (Jellyfin, the raw Radarr/Sonarr APIs on media-vpn, and Seerr) plus DNS.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
          podSelector:
            matchLabels:
              app.kubernetes.io/name: jellyfin
        # Jellyfin's hostNetwork endpoint resolves to a node address after
        # Service DNAT. Keep the pod selector for ordinary deployments and
        # permit only the two cluster nodes on Jellyfin's API port.
        - ipBlock:
            cidr: 192.168.1.2/32
        - ipBlock:
            cidr: 192.168.1.3/32
      ports:
        - {port: 8096, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
          podSelector:
            matchLabels:
              app.kubernetes.io/name: media-vpn
      ports:
        - {port: 7878, protocol: TCP}
        - {port: 8989, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
          podSelector:
            matchLabels:
              app.kubernetes.io/name: seerr
      ports:
        - {port: 5055, protocol: TCP}
