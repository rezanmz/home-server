apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintainerr
  namespace: apps
  labels:
    app.kubernetes.io/name: maintainerr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: maintainerr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maintainerr
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: maintainerr
          image: ghcr.io/maintainerr/maintainerr:3.31.0@sha256:33d86e5f03ed25204788b1e9cd9a2b3f0299cf49fae968220484b57008962399
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              value: info
            - name: TZ
              value: America/Toronto
            - name: HTTPS_PROXY
              value: http://maintainerr-tmdb-proxy.apps.svc.cluster.local:3128
            - name: NO_PROXY
              value: localhost,127.0.0.1,::1,[::1],.svc,.svc.cluster.local
          ports:
            - name: http
              containerPort: 6246
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 224Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
        - name: access-proxy
          image: nginx:1.31.8-alpine@sha256:1ef7ca94d7879df82421428ce13bd1eaa412404953859cf7a5b6512c25e67a60
          imagePullPolicy: IfNotPresent
          command: [nginx, -g, "daemon off;"]
          ports:
            - name: access-http
              containerPort: 16246
              protocol: TCP
          readinessProbe:
            tcpSocket: {port: access-http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: access-http}
            periodSeconds: 30
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: access-proxy-config, mountPath: /etc/nginx, readOnly: true}
            - {name: nginx-tmp, mountPath: /tmp}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: maintainerr-config
        - name: access-proxy-config
          configMap:
            name: maintainerr-access-proxy
        - {name: tmp, emptyDir: {}}
        - {name: nginx-tmp, emptyDir: {}}
        - {name: nginx-cache, emptyDir: {}}
