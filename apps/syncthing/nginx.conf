pid /tmp/nginx.pid;
events {}
http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $ssl_server_name $backend_certificate {
    default /etc/nginx/tls/tls.crt;
  }
  map $ssl_server_name $backend_certificate_key {
    default /etc/nginx/tls/tls.key;
  }
  # Re-open cert-manager's atomic Secret projection after the short cache
  # lifetime so ordinary leaf renewal does not require a pod restart.
  ssl_certificate_cache max=4 inactive=2m valid=1m;

  # Trust only authenticated Traefik hops when translating X-Forwarded-For.
  set_real_ip_from 10.42.0.0/16;
  set_real_ip_from 192.168.1.2/32;
  set_real_ip_from 192.168.1.3/32;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  server {
    listen 18384 ssl;
    ssl_certificate $backend_certificate;
    ssl_certificate_key $backend_certificate_key;
    ssl_client_certificate /etc/nginx/ca/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_protocols TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 0;
    # Exclude the two K3s node addresses because cross-node pod traffic can
    # be SNATed to them. The Pi pod CIDR is the documented wg-easy exception.
    allow 192.168.1.0/31;
    allow 192.168.1.4/30;
    allow 192.168.1.8/29;
    allow 192.168.1.16/28;
    allow 192.168.1.32/27;
    allow 192.168.1.64/26;
    allow 192.168.1.128/25;
    allow 10.8.0.0/24;
    allow 10.42.1.0/24;
    deny all;

    location / {
      # Syncthing owns a locally generated certificate on pod loopback.
      proxy_pass https://127.0.0.1:8384;
      proxy_ssl_verify off;
      proxy_http_version 1.1;
      # Keep Syncthing's DNS-rebinding protection enabled by presenting its
      # loopback host; preserve the browser host separately for logging.
      proxy_set_header Host 127.0.0.1;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
