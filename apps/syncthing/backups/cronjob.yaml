apiVersion: batch/v1
kind: CronJob
metadata:
  name: syncthing-backup
  namespace: network-services
  labels:
    app.kubernetes.io/name: syncthing-backup
    app.kubernetes.io/part-of: syncthing
spec:
  schedule: "43 7 * * *"
  timeZone: Etc/UTC
  # The repository ID is pinned below. Initial backup, full-data check, and an
  # isolated restore proof all passed on 2026-07-14.
  suspend: false
  concurrencyPolicy: Forbid
  # Catch up after a control-plane outage without launching more than one old
  # daily run when the cluster returns.
  startingDeadlineSeconds: 82800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 43200
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: syncthing-backup
            app.kubernetes.io/part-of: syncthing
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: raspberrypi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              image: ghcr.io/restic/restic:0.19.1@sha256:2f0373803493361f9304a57150d464677f69a9dad487afec202105aafb2592f2
              imagePullPolicy: IfNotPresent
              command: [/bin/sh, /opt/syncthing-backup/backup.sh, backup]
              env:
                - name: AWS_DEFAULT_REGION
                  value: ca-east-006
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.ca-east-006.backblazeb2.com/rezanmz-home-server-syncthing-backups/syncthing
                - name: RESTIC_HOST
                  value: home-server-syncthing-nfs
                - name: EXPECTED_REPOSITORY_ID
                  value: 49a95da0513b07815d69f6f42519e0b7cfaeab7912b89521bbbd059574cb4d1b
                - name: ALLOW_REPOSITORY_INIT
                  value: "false"
                - name: SOURCE_CANARY_SHA256
                  value: 6665ae1d8e206b61b16d6a199c5bb76a292e5ed4906337fb0dbcdaad5415d840
                - name: RESTIC_CACHE_DIR
                  value: /cache
                - name: TMPDIR
                  value: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: source
                  mountPath: /source
                  readOnly: true
                - name: syncthing-config
                  mountPath: /syncthing-config.xml
                  subPath: config.xml
                  readOnly: true
                - name: credentials
                  mountPath: /credentials
                  readOnly: true
                - name: policy
                  mountPath: /policy
                  readOnly: true
                - name: policy
                  mountPath: /opt/syncthing-backup/backup.sh
                  subPath: backup.sh
                  readOnly: true
                - name: cache
                  mountPath: /cache
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: source
              persistentVolumeClaim:
                claimName: syncthing-data
                readOnly: true
            - name: syncthing-config
              persistentVolumeClaim:
                claimName: syncthing-config
                readOnly: true
            - name: credentials
              secret:
                secretName: syncthing-backup-credentials
                defaultMode: 0400
            - name: policy
              configMap:
                name: syncthing-backup-policy
                defaultMode: 0444
            - name: cache
              emptyDir:
                sizeLimit: 1Gi
            - name: work
              emptyDir:
                sizeLimit: 16Mi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
