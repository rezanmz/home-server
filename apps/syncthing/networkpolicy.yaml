apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: syncthing
  namespace: network-services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: syncthing
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 8384
          protocol: TCP
    - from:
        - ipBlock:
            cidr: 192.168.1.0/24
        - ipBlock:
            cidr: 10.8.0.0/24
      ports:
        - port: 8384
          protocol: TCP
        - port: 21027
          protocol: UDP
    # Global discovery/relay peers may connect from arbitrary addresses.
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 22000
          protocol: TCP
        - port: 22000
          protocol: UDP
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
