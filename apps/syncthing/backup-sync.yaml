apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: syncthing-backups
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  wait: true
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: longhorn-ready
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/syncthing/backups
