apiVersion: v1
kind: ConfigMap
metadata:
  name: syncthing-access-proxy
  namespace: network-services
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {}
    http {
      access_log /dev/stdout;
      error_log /dev/stderr warn;
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
      # Trust the K3s pod network only as the Traefik proxy hop. The client
      # address still has to match the LAN or WireGuard ranges below.
      set_real_ip_from 10.42.0.0/16;
      real_ip_header X-Forwarded-For;
      real_ip_recursive on;
      server {
        listen 18384;
        client_max_body_size 0;
        allow 192.168.1.0/24;
        allow 10.8.0.0/24;
        allow 10.42.1.0/24; # wg-easy masqueraded clients on the Pi
        deny all;
        location / {
          # Syncthing owns a locally generated certificate. TLS stays on the
          # pod loopback; the public certificate is terminated by Traefik.
          proxy_pass https://127.0.0.1:8384;
          proxy_ssl_verify off;
          proxy_http_version 1.1;
          # Syncthing's DNS-rebinding protection accepts its loopback host.
          # Preserve the browser host separately for logs without weakening
          # Syncthing's global insecureSkipHostcheck setting.
          proxy_set_header Host 127.0.0.1;
          proxy_set_header X-Forwarded-Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
        }
      }
    }
