apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: syncthing-mtls-bootstrap
  namespace: network-services
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: syncthing-mtls-ca
  namespace: network-services
spec:
  secretName: syncthing-mtls-ca
  commonName: Syncthing backend CA
  isCA: true
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  usages:
    - cert sign
    - crl sign
  issuerRef:
    name: syncthing-mtls-bootstrap
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: syncthing-mtls-ca
  namespace: network-services
spec:
  ca:
    secretName: syncthing-mtls-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: syncthing-mtls-server
  namespace: network-services
spec:
  secretName: syncthing-mtls-server
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - syncthing.network-services.svc
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - server auth
  issuerRef:
    name: syncthing-mtls-ca
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: syncthing-mtls-client
  namespace: network-services
spec:
  secretName: syncthing-mtls-client
  commonName: traefik-syncthing
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - client auth
  issuerRef:
    name: syncthing-mtls-ca
    kind: Issuer
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: syncthing-mtls
  namespace: network-services
spec:
  serverName: syncthing.network-services.svc
  rootCAs:
    - secret: syncthing-mtls-ca
  certificatesSecrets:
    - syncthing-mtls-client
---
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: syncthing-mtls
  namespace: network-services
spec:
  weighted:
    services:
      - name: syncthing
        kind: Service
        port: 8384
        scheme: https
        serversTransport: syncthing-mtls
