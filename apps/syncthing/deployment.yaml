apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncthing
  namespace: network-services
  labels:
    app.kubernetes.io/name: syncthing
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: syncthing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: syncthing
    spec:
      automountServiceAccountToken: false
      # Host networking preserves LAN discovery and direct sync ports. Keep
      # this workload on the Pi so its direct-sync address remains stable;
      # relay-only mode is a separate opt-in configuration.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: raspberrypi
      containers:
        - name: syncthing
          image: lscr.io/linuxserver/syncthing:v2.1.1-ls221
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Toronto
          ports:
            - name: https
              containerPort: 8384
              protocol: TCP
            - name: sync-tcp
              containerPort: 22000
              protocol: TCP
            - name: sync-quic
              containerPort: 22000
              protocol: UDP
            - name: discovery
              containerPort: 21027
              protocol: UDP
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /rest/noauth/health
              port: https
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /rest/noauth/health
              port: https
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /rest/noauth/health
              port: https
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
        - name: access-proxy
          image: nginx:1.27.4-alpine
          command: [nginx, -g, "daemon off;"]
          ports:
            - {name: access-http, containerPort: 18384}
          readinessProbe: {tcpSocket: {port: access-http}, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: access-http}, periodSeconds: 30}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: proxy-config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: nginx-tmp, mountPath: /tmp}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: syncthing-config
        - name: data
          persistentVolumeClaim:
            claimName: syncthing-data
        - name: proxy-config
          configMap: {name: syncthing-access-proxy}
        - {name: nginx-tmp, emptyDir: {}}
        - {name: nginx-cache, emptyDir: {}}
