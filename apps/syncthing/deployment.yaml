apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncthing
  namespace: network-services
  labels:
    app.kubernetes.io/name: syncthing
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: syncthing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: syncthing
    spec:
      automountServiceAccountToken: false
      # Host networking preserves LAN discovery and direct sync ports. Keep
      # this workload on the Pi so its direct-sync address remains stable;
      # relay-only mode is a separate opt-in configuration.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: raspberrypi
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: syncthing
          image: lscr.io/linuxserver/syncthing:v2.1.2-ls226@sha256:ae909bee7c41f516be03fd7de72317a44f4a043bcba76884de941b99407b6957
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Toronto
          # LinuxServer's s6 wrapper forces the GUI onto 0.0.0.0. Run the
          # Syncthing binary directly so the host-network GUI is reachable
          # only by the colocated access proxy over TLS loopback.
          command: [/usr/bin/syncthing, serve]
          args:
            - --home=/config
            - --no-browser
            - --no-restart
            - --no-upgrade
            - --gui-address=https://127.0.0.1:8384
          ports:
            - name: https
              containerPort: 8384
              protocol: TCP
            - name: sync-tcp
              containerPort: 22000
              protocol: TCP
            - name: sync-quic
              containerPort: 22000
              protocol: UDP
            - name: discovery
              containerPort: 21027
              protocol: UDP
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          startupProbe:
            exec:
              command: [curl, -kfsS, https://127.0.0.1:8384/rest/noauth/health]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            exec:
              command: [curl, -kfsS, https://127.0.0.1:8384/rest/noauth/health]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [curl, -kfsS, https://127.0.0.1:8384/rest/noauth/health]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
        - name: access-proxy
          image: nginx:1.31.3-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
          command: [nginx, -c, /etc/nginx-config/nginx.conf, -g, "daemon off;"]
          ports:
            - {name: access-https, containerPort: 18384}
          readinessProbe: {tcpSocket: {port: access-https}, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: access-https}, periodSeconds: 30}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: proxy-config, mountPath: /etc/nginx-config, readOnly: true}
            - {name: backend-tls, mountPath: /etc/nginx/tls, readOnly: true}
            - {name: backend-ca, mountPath: /etc/nginx/ca, readOnly: true}
            - {name: nginx-tmp, mountPath: /tmp}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: syncthing-config
        - name: data
          persistentVolumeClaim:
            claimName: syncthing-data
        - name: proxy-config
          configMap: {name: syncthing-access-proxy}
        - name: backend-tls
          secret:
            secretName: syncthing-mtls-server
            defaultMode: 0444
        - name: backend-ca
          secret:
            secretName: syncthing-mtls-ca
            defaultMode: 0444
            items:
              - key: tls.crt
                path: ca.crt
        - {name: nginx-tmp, emptyDir: {}}
        - {name: nginx-cache, emptyDir: {}}
