apiVersion: v1
kind: Service
metadata:
  name: kea-metrics
  namespace: network-services
  labels:
    app.kubernetes.io/name: kea-dhcp4
spec:
  ports:
    - {name: http-metrics, port: 9547, targetPort: 9547, protocol: TCP}
---
apiVersion: v1
kind: Endpoints
metadata:
  name: kea-metrics
  namespace: network-services
  labels:
    # Prometheus currently uses Endpoints discovery. Keep the separately
    # managed EndpointSlice below for a future discovery-role migration.
    endpointslice.kubernetes.io/skip-mirror: "true"
subsets:
  - addresses: [{ip: 10.42.0.1}]
    ports: [{name: http-metrics, port: 9547, protocol: TCP}]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: kea-metrics
  namespace: network-services
  labels:
    kubernetes.io/service-name: kea-metrics
    endpointslice.kubernetes.io/managed-by: home-server
addressType: IPv4
ports:
  - {name: http-metrics, port: 9547, protocol: TCP}
endpoints:
  - addresses: [10.42.0.1]
    conditions: {ready: true}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kea-dhcp4
  namespace: monitoring
  labels:
    release: observability
spec:
  namespaceSelector:
    matchNames: [network-services]
  selector:
    matchLabels:
      app.kubernetes.io/name: kea-dhcp4
  endpoints:
    - {port: http-metrics, path: /metrics, interval: 30s, scrapeTimeout: 10s}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kea-dhcp4
  namespace: monitoring
  labels:
    release: observability
spec:
  groups:
    - name: home-server.kea-dhcp4
      rules:
        - alert: KeaDHCPUnavailable
          expr: absent(up{namespace="network-services",service="kea-metrics"}) or max(up{namespace="network-services",service="kea-metrics"}) == 0
          for: 3m
          labels: {severity: warning, cluster: home-server}
          annotations:
            summary: Kea DHCP is unavailable
            description: Existing clients keep their leases, but new clients and renewals may fail while Kea on the Beelink is unavailable.
            runbook_url: https://github.com/rezanmz/home-server/blob/main/docs/runbook.md#dns-and-dhcp
        - alert: KeaDHCPPoolNearlyFull
          expr: max(kea_dhcp4_addresses_assigned_total{pool!=""} / kea_dhcp4_addresses_total{pool!=""}) > 0.85
          for: 15m
          labels: {severity: warning, cluster: home-server}
          annotations:
            summary: The DHCP pool is more than 85% allocated
            description: Review active leases and the 192.168.1.10-192.168.1.239 pool before clients are unable to obtain an address.
            runbook_url: https://github.com/rezanmz/home-server/blob/main/docs/runbook.md#dns-and-dhcp
        - alert: KeaDHCPAllocationFailures
          expr: max(max_over_time(kea_dhcp4_allocations_failed_total[10m]) - min_over_time(kea_dhcp4_allocations_failed_total[10m])) > 0
          for: 5m
          labels: {severity: warning, cluster: home-server}
          annotations:
            summary: Kea has failed to allocate a DHCP lease
            description: Check pool usage, ping-check declines, lease storage, and Kea logs.
            runbook_url: https://github.com/rezanmz/home-server/blob/main/docs/runbook.md#dns-and-dhcp
