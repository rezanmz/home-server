{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": ["enp1s0"],
      "dhcp-socket-type": "raw",
      "service-sockets-require-all": true
    },
    "control-sockets": [
      {
        "socket-type": "unix",
        "socket-name": "/var/run/kea/kea4-ctrl-socket"
      }
    ],
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv",
      "lfc-interval": 3600
    },
    "valid-lifetime": 3600,
    "offer-lifetime": 60,
    "authoritative": true,
    "option-data": [
      {"name": "domain-name-servers", "data": "192.168.1.2"},
      {"name": "routers", "data": "192.168.1.1"},
      {"name": "domain-name", "data": "lan"},
      {"name": "broadcast-address", "data": "192.168.1.255"}
    ],
    "subnet4": [
      {
        "id": 1,
        "subnet": "192.168.1.0/24",
        "interface": "enp1s0",
        "pools": [
          {"pool": "192.168.1.10 - 192.168.1.239"}
        ]
      }
    ],
    "hooks-libraries": [
      {
        "library": "/usr/lib/kea/hooks/libdhcp_ping_check.so",
        "parameters": {
          "enable-ping-check": true,
          "min-ping-requests": 1,
          "reply-timeout": 150,
          "ping-cltt-secs": 60,
          "ping-channel-threads": 0
        }
      }
    ],
    "expired-leases-processing": {
      "reclaim-timer-wait-time": 10,
      "flush-reclaimed-timer-wait-time": 25,
      "hold-reclaimed-time": 3600,
      "max-reclaim-leases": 100,
      "max-reclaim-time": 250,
      "unwarned-reclaim-cycles": 5
    },
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output-options": [
          {"output": "stdout", "flush": true}
        ],
        "severity": "INFO",
        "debuglevel": 0
      }
    ]
  }
}
