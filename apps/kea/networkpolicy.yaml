apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kea-dhcp4
  namespace: network-services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kea-dhcp4
  policyTypes: [Ingress, Egress]
  ingress:
    # An unconfigured DHCP client legitimately sends from 0.0.0.0.
    - from:
        - ipBlock: {cidr: 0.0.0.0/32}
        - ipBlock: {cidr: 192.168.1.0/24}
      ports:
        - {port: 67, protocol: UDP}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
        - ipBlock: {cidr: 10.42.0.0/16}
      ports:
        - {port: 9547, protocol: TCP}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stork
              app.kubernetes.io/component: server
      ports:
        - {port: 8080, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stork
              app.kubernetes.io/component: server
      ports:
        - {port: 8080, protocol: TCP}
    # DHCP broadcasts and the conflict-detection ICMP ping stay on the LAN.
    - to:
        - ipBlock: {cidr: 192.168.1.0/24}
    - to:
        - ipBlock: {cidr: 255.255.255.255/32}
      ports:
        - {port: 68, protocol: UDP}
