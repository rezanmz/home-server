apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stork-server
  namespace: network-services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stork
      app.kubernetes.io/component: server
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: traefik}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports:
        - {port: 8081, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports:
        - {port: 8080, protocol: TCP}
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: kea-dhcp4}
        # The Stork agent is in Kea's host-network pod, so some policy engines
        # observe its fixed Beelink node source rather than its pod identity.
        - ipBlock: {cidr: 192.168.1.3/32}
      ports:
        - {port: 8080, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stork
              app.kubernetes.io/component: database
      ports:
        - {port: 5432, protocol: TCP}
    - to:
        - ipBlock: {cidr: 10.42.0.1/32}
      ports:
        - {port: 8080, protocol: TCP}
    # OIDC discovery and token exchange use Authentik through the split-horizon
    # Traefik VIP. Cover both the pre- and post-DNAT policy observations.
    - to:
        - ipBlock: {cidr: 192.168.1.240/32}
      ports:
        - {port: 443, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: traefik}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports:
        - {port: 8443, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stork-postgresql
  namespace: network-services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stork
      app.kubernetes.io/component: database
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stork
              app.kubernetes.io/component: server
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stork
              app.kubernetes.io/component: bootstrap
      ports:
        - {port: 5432, protocol: TCP}
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stork-bootstrap
  namespace: network-services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stork
      app.kubernetes.io/component: bootstrap
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stork
              app.kubernetes.io/component: database
      ports:
        - {port: 5432, protocol: TCP}
