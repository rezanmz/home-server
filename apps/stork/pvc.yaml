apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stork-postgresql
  namespace: network-services
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stork-agent-data
  namespace: network-services
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
