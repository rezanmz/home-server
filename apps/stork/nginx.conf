pid /tmp/nginx.pid;

events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  client_body_temp_path /tmp/client-body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  upstream stork_server {
    server 127.0.0.1:8080;
  }

  server {
    listen 8081;
    root /usr/share/stork/www;
    index index.html;

    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location ~ ^/(api|oidc)(/|$) {
      proxy_pass http://stork_server;
      proxy_buffering off;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /sse {
      proxy_pass http://stork_server;
      proxy_buffering off;
      proxy_cache off;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      chunked_transfer_encoding off;
    }

    # Prometheus reaches the server-only Service port. Never expose the
    # unauthenticated metrics, API schema, or agent installer through the UI.
    location = /metrics { return 404; }
    location = /swagger.json { return 404; }
    location = /stork-install-agent.sh { return 404; }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
