apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: glances, namespace: monitoring}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: glances}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: traefik}
      ports:
        - {port: 16120, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - ipBlock: {cidr: 10.43.0.0/16}
      ports:
        - {port: 443, protocol: TCP}
    - to:
        - ipBlock: {cidr: 192.168.1.0/24}
      ports:
        - {port: 6443, protocol: TCP}
