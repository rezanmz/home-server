apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: actual-horizon
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: actual-horizon
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 13001
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The Actual Budget sync API on its internal Service. Authentication to
    # Authentik happens in Traefik's forward-auth step, so this workload needs
    # no split-horizon issuer egress of its own.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: actual-budget
      ports:
        - port: 5006
          protocol: TCP
