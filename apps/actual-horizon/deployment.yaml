apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual-horizon
  namespace: apps
  labels:
    app.kubernetes.io/name: actual-horizon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: actual-horizon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: actual-horizon
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: beelink
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: actual-horizon
          # v1.2.3 also evaluates chart day boundaries in ACTUAL_TIMEZONE
          # instead of UTC (#53), defaulting to the container TZ. v1.2.2
          # fixes refresh (issue #50, incident 2026-09-13): the sync
          # job now pulls from Actual before recomputing snapshots, so a UI
          # refresh reflects server changes instead of the boot-time cache.
          # Keeps the v1.2.1 background single-flight split (#46) so refresh
          # no longer starves /api/health past probe timeouts (incident
          # 2026-09-11). No native login/callback routes yet, so browser SSO
          # is enforced by Traefik forward-auth and AUTH_MODE stays disabled.
          # Revisit native OIDC once upstream wires its auth module.
          image: ghcr.io/rezanmz/actual-horizon:v1.2.3@sha256:ecc2a98309f57e2aa262897bffa93090b10ca6a33fc437e76c60caf72126f514
          imagePullPolicy: IfNotPresent
          env:
            - {name: TZ, value: America/Toronto}
            - {name: PORT, value: "3001"}
            - {name: AUTH_MODE, value: disabled}
            - {name: DATA_DIR, value: /var/lib/horizon}
            - {name: ACTUAL_DATA_DIR, value: /var/lib/actual}
            # Loopback hop into the access-proxy sidecar's stream forwarder;
            # see its comment for why the internal Service URL cannot be used
            # directly. The host string is non-secret; credentials stay in the
            # Secret below.
            - {name: ACTUAL_SERVER_URL, value: "http://127.0.0.1:5007"}
            - name: ACTUAL_PASSWORD
              valueFrom:
                secretKeyRef: {name: actual-horizon-secrets, key: actual-password}
            - name: ACTUAL_BUDGET_ID
              valueFrom:
                secretKeyRef: {name: actual-horizon-secrets, key: actual-budget-id}
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            # Full budget download takes minutes; don't spam Unhealthy during boot.
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - {name: data, mountPath: /var/lib/horizon}
            - {name: actual-cache, mountPath: /var/lib/actual}
        - name: access-proxy
          image: nginx:1.31.6-alpine@sha256:d10753d9289b8e3f884386351f73554ce72b631378949deddd75e83ee296c427
          imagePullPolicy: IfNotPresent
          command: [nginx, -g, "daemon off;"]
          ports:
            - name: access-http
              containerPort: 13001
          readinessProbe:
            tcpSocket:
              port: access-http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: access-http
            periodSeconds: 30
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: access-proxy-config, mountPath: /etc/nginx, readOnly: true}
            - {name: nginx-tmp, mountPath: /tmp}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: actual-horizon-data
        - name: actual-cache
          emptyDir:
            # 37M budget + @actual-app/api backup zips + re-download spikes
            # evicted the pod at 64Mi. See incident 2026-09-06.
            sizeLimit: 512Mi
        - name: access-proxy-config
          configMap:
            name: actual-horizon-access-proxy
        - {name: nginx-tmp, emptyDir: {}}
        - {name: nginx-cache, emptyDir: {}}
