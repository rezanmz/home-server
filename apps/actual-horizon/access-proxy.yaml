apiVersion: v1
kind: ConfigMap
metadata:
  name: actual-horizon-access-proxy
  namespace: apps
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {}
    stream {
      # Localhost-only hop to Actual's internal sync API. Upstream Horizon
      # accepts plain http solely for loopback destinations, while the
      # cluster's private-route boundary deliberately distrusts pod-network
      # egress (see lan-vpn-only). Binding here keeps both properties: the
      # app sees loopback http and no cleartext leaves the pod; the cluster
      # leg stays under NetworkPolicy to the internal Service. Revisit if
      # upstream supports cluster-local http directly.
      server {
        listen 127.0.0.1:5007;
        proxy_pass actual-budget-api.apps.svc.cluster.local:5006;
      }
    }
    http {
      access_log /dev/stdout;
      error_log /dev/stderr warn;
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
      set_real_ip_from 10.42.0.0/16;
      real_ip_header X-Forwarded-For;
      real_ip_recursive on;
      server {
        listen 13001;
        client_max_body_size 1m;
        allow 192.168.1.0/24;
        allow 10.8.0.0/24;
        allow 10.42.1.0/24; # wg-easy masqueraded clients on the Pi
        deny all;
        location / {
          proxy_pass http://127.0.0.1:3001;
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
        }
      }
    }
