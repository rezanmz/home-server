apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyd-dashboard-ota
  namespace: apps
  labels:
    app.kubernetes.io/name: cyd-dashboard-ota
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cyd-dashboard-ota
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyd-dashboard-ota
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: upload-firmware
          image: ghcr.io/rezanmz/cyd-ota-updater:0.3.2@sha256:6c1053118d2fa23b3097d435d2f4d1a4abd86d28c91b971ce3dadcfe023d1037
          imagePullPolicy: IfNotPresent
          command: [sh, -ec]
          args:
            - |-
              cp -r /opt/cyd-cache/. /work/
              cp /inputs/dashboard.yaml /work/dashboard.yaml
              cp /inputs/secrets.yaml /work/secrets.yaml
              esphome compile /work/dashboard.yaml
              upload_status=0
              esphome upload /work/dashboard.yaml --device 192.168.1.18 || upload_status=$?
              esphome upload /work/dashboard.yaml --device 192.168.1.21 || upload_status=$?
              exit "$upload_status"
          env:
            - {name: HOME, value: /work}
            - {name: XDG_CACHE_HOME, value: /work/.cache}
            - {name: ESPHOME_ESP_IDF_PREFIX, value: /work/.cache/esphome/idf}
          volumeMounts:
            - {name: workspace, mountPath: /work}
            - {name: dashboard-config, mountPath: /inputs/dashboard.yaml, subPath: dashboard.yaml, readOnly: true}
            - {name: device-secrets, mountPath: /inputs/secrets.yaml, subPath: secrets.yaml, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 3Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      containers:
        - name: complete
          image: ghcr.io/rezanmz/cyd-ota-updater:0.3.2@sha256:6c1053118d2fa23b3097d435d2f4d1a4abd86d28c91b971ce3dadcfe023d1037
          imagePullPolicy: IfNotPresent
          command: [sleep, infinity]
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 25m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: workspace
          emptyDir: {}
        - name: dashboard-config
          configMap:
            name: cyd-dashboard-firmware
        - name: device-secrets
          secret:
            secretName: cyd-dashboard-ota-secrets
