substitutions:
  device_name: cyd-dashboard
  friendly_name: CYD Dashboard

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.2.0
  on_boot:
    priority: -100
    then:
      - script.execute: refresh_summary

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: WARN

json:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

http_request:
  useragent: ${device_name}
  timeout: 10s
  verify_ssl: true

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13

output:
  - platform: gpio
    pin: GPIO21
    id: display_backlight

light:
  - platform: binary
    output: display_backlight
    id: backlight
    restore_mode: ALWAYS_ON

font:
  - file:
      type: gfonts
      family: Audiowide
      weight: 400
    id: logo_font
    size: 15
    bpp: 2
  - file:
      type: gfonts
      family: Quicksand
      weight: 700
    id: amount_font
    size: 42
    bpp: 2
  - file:
      type: gfonts
      family: Quicksand
      weight: 700
    id: account_font
    size: 18
    bpp: 2
  - file:
      type: gfonts
      family: Space Mono
      weight: 400
    id: detail_font
    size: 11
    bpp: 2

globals:
  - id: net_worth_cents
    type: int64_t
    restore_value: no
    initial_value: '0'
  - id: currency
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: as_of
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: oldest_reconciled_account_name
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: oldest_reconciled_on
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: oldest_reconciled_days_ago
    type: int
    restore_value: no
    initial_value: '-1'
  - id: summary_stale
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: status
    type: std::string
    restore_value: no
    initial_value: '"Waiting for data"'

display:
  - platform: mipi_spi
    id: dashboard_display
    model: ILI9341
    cs_pin: GPIO15
    dc_pin: GPIO2
    reset_pin: GPIO4
    rotation: 90
    update_interval: never
    lambda: |-
      const Color night(0x07, 0x03, 0x1A);
      const Color violet_sky(0x16, 0x07, 0x35);
      const Color horizon(0x2A, 0x08, 0x4A);
      const Color panel(0x12, 0x08, 0x2D);
      const Color panel_inner(0x0D, 0x07, 0x24);
      const Color text(0xFF, 0xF7, 0xFE);
      const Color muted(0xB9, 0xA6, 0xD6);
      const Color cyan(0x32, 0xF6, 0xE8);
      const Color pink(0xFF, 0x4F, 0xC3);
      const Color hot_pink(0xFF, 0x2E, 0x93);
      const Color peach(0xFF, 0xA0, 0xC8);
      const Color warning(0xFF, 0xCB, 0x66);
      const Color negative(0xFF, 0x6B, 0x9D);
      const Color state_color = id(summary_stale) ? warning : cyan;

      // Tiny rounded cards and pills without bringing in a widget framework.
      auto fill_round_rect = [&](int x, int y, int width, int height, int radius, Color color) {
        it.filled_rectangle(x + radius, y, width - (radius * 2), height, color);
        it.filled_rectangle(x, y + radius, width, height - (radius * 2), color);
        it.filled_circle(x + radius, y + radius, radius, color);
        it.filled_circle(x + width - radius - 1, y + radius, radius, color);
        it.filled_circle(x + radius, y + height - radius - 1, radius, color);
        it.filled_circle(x + width - radius - 1, y + height - radius - 1, radius, color);
      };

      // Layered twilight sky.
      it.fill(night);
      it.filled_rectangle(0, 42, 320, 58, violet_sky);
      it.filled_rectangle(0, 100, 320, 65, horizon);

      // Stars and candy-colored sparkle crosses.
      it.draw_pixel_at(36, 31, muted);
      it.draw_pixel_at(87, 18, pink);
      it.draw_pixel_at(121, 35, cyan);
      it.draw_pixel_at(198, 23, muted);
      it.draw_pixel_at(231, 41, peach);
      it.line(51, 53, 51, 59, pink);
      it.line(48, 56, 54, 56, pink);
      it.line(213, 56, 213, 62, cyan);
      it.line(210, 59, 216, 59, cyan);

      // Striped synthwave sun, tucked behind the finance data.
      it.filled_circle(268, 93, 40, Color(0x37, 0x08, 0x55));
      it.filled_circle(268, 93, 34, peach);
      it.filled_rectangle(238, 84, 60, 3, horizon);
      it.filled_rectangle(235, 92, 66, 4, horizon);
      it.filled_rectangle(238, 101, 60, 5, horizon);
      it.filled_rectangle(245, 112, 46, 6, horizon);

      // Perspective grid rising toward the neon horizon.
      it.line(0, 166, 319, 166, hot_pink);
      it.line(0, 176, 319, 176, Color(0x62, 0x20, 0x83));
      it.line(0, 190, 319, 190, Color(0x62, 0x20, 0x83));
      it.line(0, 210, 319, 210, Color(0x62, 0x20, 0x83));
      it.line(0, 236, 319, 236, Color(0x62, 0x20, 0x83));
      it.line(160, 165, -36, 239, Color(0x24, 0x7A, 0x86));
      it.line(160, 165, 38, 239, Color(0x24, 0x7A, 0x86));
      it.line(160, 165, 102, 239, Color(0x24, 0x7A, 0x86));
      it.line(160, 165, 160, 239, Color(0x24, 0x7A, 0x86));
      it.line(160, 165, 218, 239, Color(0x24, 0x7A, 0x86));
      it.line(160, 165, 282, 239, Color(0x24, 0x7A, 0x86));
      it.line(160, 165, 356, 239, Color(0x24, 0x7A, 0x86));

      // Cute neon masthead and live/stale capsule.
      it.filled_circle(14, 17, 3, pink);
      it.line(14, 10, 14, 24, pink);
      it.line(7, 17, 21, 17, pink);
      it.printf(27, 9, id(logo_font), text, "NEON NEST");
      fill_round_rect(251, 10, 56, 18, 8, state_color);
      fill_round_rect(253, 12, 52, 14, 6, panel_inner);
      it.filled_circle(262, 19, 2, state_color);
      it.printf(299, 13, id(detail_font), state_color, TextAlign::TOP_RIGHT, id(summary_stale) ? "STALE" : "LIVE");

      it.printf(17, 38, id(detail_font), cyan, "PERSONAL FINANCE // NET WORTH");

      const int64_t cents = id(net_worth_cents);
      const uint64_t absolute_cents = cents < 0 ? static_cast<uint64_t>(-(cents + 1)) + 1 : cents;
      char whole[24];
      snprintf(whole, sizeof(whole), "%llu", static_cast<unsigned long long>(absolute_cents / 100));
      char amount[32];
      size_t cursor = 0;
      if (cents < 0) {
        amount[cursor++] = '-';
      }
      const size_t whole_length = strlen(whole);
      for (size_t index = 0; index < whole_length; index++) {
        if (index > 0 && (whole_length - index) % 3 == 0) {
          amount[cursor++] = ',';
        }
        amount[cursor++] = whole[index];
      }
      snprintf(
        amount + cursor,
        sizeof(amount) - cursor,
        ".%02llu",
        static_cast<unsigned long long>(absolute_cents % 100));
      it.printf(16, 53, id(amount_font), cents < 0 ? negative : text, "%s", amount);
      if (!id(currency).empty()) {
        fill_round_rect(18, 101, 44, 17, 7, pink);
        fill_round_rect(20, 103, 40, 13, 5, panel_inner);
        it.printf(52, 104, id(detail_font), pink, TextAlign::TOP_RIGHT, "%s", id(currency).c_str());
      }

      // Glassy reconciliation card with a neon crescent accent.
      fill_round_rect(11, 126, 298, 80, 10, pink);
      fill_round_rect(13, 128, 294, 76, 8, panel);
      fill_round_rect(17, 132, 286, 68, 6, panel_inner);
      it.filled_circle(28, 144, 7, cyan);
      it.filled_circle(31, 141, 7, panel_inner);
      it.printf(43, 136, id(detail_font), pink, "OLDEST OPEN ACCOUNT");
      it.printf(
        25,
        153,
        id(account_font),
        text,
        "%.25s",
        id(oldest_reconciled_account_name).empty() ? "Account unavailable" : id(oldest_reconciled_account_name).c_str());
      if (id(oldest_reconciled_on).empty()) {
        it.printf(25, 181, id(detail_font), muted, "NO RECONCILIATION RECORD");
      } else {
        it.printf(
          25,
          181,
          id(detail_font),
          muted,
          "RECONCILED %s",
          id(oldest_reconciled_on).c_str());
        fill_round_rect(223, 178, 72, 17, 7, state_color);
        fill_round_rect(225, 180, 68, 13, 5, panel_inner);
        it.printf(
          287,
          181,
          id(detail_font),
          state_color,
          TextAlign::TOP_RIGHT,
          "%d %s",
          id(oldest_reconciled_days_ago),
          id(oldest_reconciled_days_ago) == 1 ? "DAY" : "DAYS");
      }

      it.filled_circle(17, 221, 3, state_color);
      it.circle(17, 221, 6, Color(0x67, 0x35, 0x80));
      it.printf(29, 214, id(detail_font), muted, "%.35s", id(status).c_str());
      it.printf(304, 214, id(detail_font), pink, TextAlign::TOP_RIGHT, "KEEP GLOWING");

script:
  - id: refresh_summary
    mode: single
    then:
      - http_request.get:
          url: !secret finance_display_url
          request_headers:
            Authorization: !secret finance_display_authorization
          capture_response: true
          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - lambda: |-
                        const bool parsed = json::parse_json(body, [](JsonObject root) -> bool {
                          if (!root["netWorthCents"].is<int64_t>() || !root["asOf"].is<const char *>()) {
                            return false;
                          }
                          id(net_worth_cents) = root["netWorthCents"].as<int64_t>();
                          id(currency) = root["currency"].is<const char *>() ? root["currency"].as<const char *>() : "";
                          id(as_of) = root["asOf"].as<const char *>();
                          id(oldest_reconciled_account_name) = root["oldestReconciledAccountName"].is<const char *>() ? root["oldestReconciledAccountName"].as<const char *>() : "";
                          id(oldest_reconciled_on) = root["oldestReconciledOn"].is<const char *>() ? root["oldestReconciledOn"].as<const char *>() : "";
                          id(oldest_reconciled_days_ago) = root["oldestReconciledDaysAgo"].is<int>() ? root["oldestReconciledDaysAgo"].as<int>() : -1;
                          id(summary_stale) = root["stale"] | true;
                          id(status) = id(as_of).substr(0, 16) + " UTC";
                          return true;
                        });
                        if (!parsed) {
                          id(summary_stale) = true;
                          id(status) = "Invalid summary response";
                        }
                        id(dashboard_display).update();
                  else:
                    - lambda: |-
                        id(summary_stale) = true;
                        id(status) = "HTTP " + to_string(response->status_code);
                        id(dashboard_display).update();

interval:
  - interval: 15s
    then:
      - script.execute: refresh_summary
