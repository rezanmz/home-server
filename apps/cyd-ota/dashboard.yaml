substitutions:
  device_name: cyd-dashboard
  friendly_name: CYD Dashboard

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.2.0
  on_boot:
    priority: -100
    then:
      - script.execute: refresh_summary

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: WARN

json:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

http_request:
  useragent: ${device_name}
  timeout: 10s
  verify_ssl: true

spi:
  - id: display_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

output:
  - platform: gpio
    pin: GPIO21
    id: display_backlight

light:
  - platform: binary
    output: display_backlight
    id: backlight
    restore_mode: ALWAYS_ON

font:
  - file:
      type: gfonts
      family: Fredoka
      weight: 500
    id: label_font
    size: 13
    bpp: 4
  - file:
      type: gfonts
      family: Fredoka
      weight: 700
    id: amount_font
    size: 35
    bpp: 4
  - file:
      type: gfonts
      family: Fredoka
      weight: 700
    id: account_font
    size: 19
    bpp: 4
  - file:
      type: gfonts
      family: Fredoka
      weight: 700
    id: button_font
    size: 21
    bpp: 4
  - file:
      type: gfonts
      family: Fredoka
      weight: 700
    id: clock_font
    size: 32
    bpp: 4

globals:
  - id: net_worth_cents
    type: int64_t
    restore_value: no
    initial_value: '0'
  - id: currency
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: oldest_reconciled_account_name
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: oldest_reconciled_on
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: oldest_reconciled_days_ago
    type: int
    restore_value: no
    initial_value: '-1'
  - id: reconciliation_status
    type: std::string
    restore_value: no
    initial_value: '"unavailable"'
  - id: summary_stale
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: weather_available
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: weather_condition
    type: std::string
    restore_value: no
    initial_value: '"unknown"'
  - id: weather_label
    type: std::string
    restore_value: no
    initial_value: '"WEATHER WAITING"'
  - id: weather_is_day
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: weather_temperature_c
    type: int
    restore_value: no
    initial_value: '0'
  - id: weather_stale
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: local_time
    type: std::string
    restore_value: no
    initial_value: '"--:--"'
  - id: local_period
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: theme_darkness_percent
    type: int
    restore_value: no
    initial_value: '0'
  - id: focus_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: focus_sync_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: focus_sync_error
    type: bool
    restore_value: no
    initial_value: 'false'

display:
  - platform: mipi_spi
    id: dashboard_display
    model: ILI9341
    spi_id: display_spi
    cs_pin: GPIO15
    dc_pin: GPIO2
    reset_pin: GPIO4
    rotation: 90
    update_interval: never
    lambda: |-
      auto fill_round_rect = [&](int x, int y, int width, int height, int radius, Color color) {
        it.filled_rectangle(x + radius, y, width - (radius * 2), height, color);
        it.filled_rectangle(x, y + radius, width, height - (radius * 2), color);
        it.filled_circle(x + radius, y + radius, radius, color);
        it.filled_circle(x + width - radius - 1, y + radius, radius, color);
        it.filled_circle(x + radius, y + height - radius - 1, radius, color);
        it.filled_circle(x + width - radius - 1, y + height - radius - 1, radius, color);
      };

      auto smoothstep = [](float start, float end, float value) -> float {
        float position = (value - start) / (end - start);
        if (position < 0.0f) position = 0.0f;
        if (position > 1.0f) position = 1.0f;
        return position * position * (3.0f - (2.0f * position));
      };

      auto blend_rgb = [](uint32_t day, uint32_t night, float amount) -> uint32_t {
        const uint8_t day_red = (day >> 16) & 0xFF;
        const uint8_t day_green = (day >> 8) & 0xFF;
        const uint8_t day_blue = day & 0xFF;
        const uint8_t night_red = (night >> 16) & 0xFF;
        const uint8_t night_green = (night >> 8) & 0xFF;
        const uint8_t night_blue = night & 0xFF;
        const uint8_t red = day_red + ((static_cast<int>(night_red) - day_red) * amount);
        const uint8_t green = day_green + ((static_cast<int>(night_green) - day_green) * amount);
        const uint8_t blue = day_blue + ((static_cast<int>(night_blue) - day_blue) * amount);
        return (static_cast<uint32_t>(red) << 16) |
          (static_cast<uint32_t>(green) << 8) |
          static_cast<uint32_t>(blue);
      };

      auto as_color = [](uint32_t rgb) -> Color {
        return Color((rgb >> 16) & 0xFF, (rgb >> 8) & 0xFF, rgb & 0xFF);
      };

      float darkness = id(theme_darkness_percent) / 100.0f;
      if (darkness < 0.0f) darkness = 0.0f;
      if (darkness > 1.0f) darkness = 1.0f;
      const float surface_darkness = smoothstep(0.36f, 0.62f, darkness);
      const bool night_text = darkness >= 0.48f;

      const uint32_t sky_top = blend_rgb(0xCBEFFF, 0x111937, darkness);
      const uint32_t sky_middle = blend_rgb(0xDCEBFF, 0x20234E, darkness);
      const uint32_t sky_lower = blend_rgb(0xF8D6E5, 0x4A315A, darkness);
      const uint32_t sky_bottom = blend_rgb(0xFFE8F0, 0x673955, darkness);
      const Color primary = as_color(night_text
        ? blend_rgb(0xF7EDFF, 0xFBF2FF, smoothstep(0.48f, 1.0f, darkness))
        : blend_rgb(0x3F4E78, 0x344064, smoothstep(0.0f, 0.48f, darkness)));
      const Color secondary = as_color(night_text
        ? blend_rgb(0xE8E3F7, 0xDDD8F0, smoothstep(0.48f, 1.0f, darkness))
        : blend_rgb(0x5F6F94, 0x536183, smoothstep(0.0f, 0.48f, darkness)));
      const Color panel = as_color(blend_rgb(0xFFFAFF, 0x202044, surface_darkness));
      const Color panel_soft = as_color(blend_rgb(0xF3F9FF, 0x2A294F, surface_darkness));
      const Color panel_edge = as_color(blend_rgb(0xFFFFFF, 0xA8DDFF, darkness));
      const Color baby_blue = as_color(blend_rgb(0x8FDCFF, 0x68BDE8, darkness));
      const Color powder_pink = as_color(blend_rgb(0xF29AC1, 0xD966A6, darkness));
      const Color pale_yellow = as_color(blend_rgb(0xFFF2A8, 0xF5ECFF, darkness));
      const Color warning = as_color(night_text ? 0xFFD2E6 : 0xA95179);
      const Color negative = as_color(night_text ? 0xFFB6D4 : 0xB04F7A);

      // Pastel daylight softly blends into the deep periwinkle night palette.
      for (int y = 0; y < 240; y++) {
        uint32_t row;
        if (y < 118) {
          row = blend_rgb(sky_top, sky_middle, y / 118.0f);
        } else {
          row = blend_rgb(sky_lower, sky_bottom, (y - 118) / 122.0f);
        }
        it.filled_rectangle(0, y, 320, 1, as_color(row));
      }

      // Layered baby-blue and powder-pink edges imitate a soft neon haze.
      it.rectangle(0, 0, 320, 240, as_color(blend_rgb(0xA8DDF7, 0x57375F, darkness)));
      it.rectangle(2, 2, 316, 236, as_color(blend_rgb(0xF8D4E4, 0x8B507A, darkness)));
      it.rectangle(4, 4, 312, 232, panel_edge);
      it.line(6, 6, 126, 6, baby_blue);
      it.line(6, 7, 88, 7, as_color(blend_rgb(0xD7F3FF, 0x68BDE8, darkness)));
      it.line(194, 233, 313, 233, powder_pink);
      it.line(231, 232, 313, 232, as_color(blend_rgb(0xFFE2EF, 0xD966A6, darkness)));

      if (darkness > 0.25f) {
        const Color star = as_color(blend_rgb(0xFFFFFF, 0xFFF5C7, darkness));
        it.draw_pixel_at(164, 22, star);
        it.line(197, 35, 203, 35, star);
        it.line(200, 32, 200, 38, star);
        it.draw_pixel_at(133, 45, star);
      }

      // Time and weather share the open sky above the finance card.
      it.printf(15, 7, id(clock_font), primary, "%s", id(local_time).c_str());
      if (!id(local_period).empty()) {
        it.printf(89, 25, id(label_font), secondary, "%s", id(local_period).c_str());
      }

      std::string weather_text = id(weather_label);
      for (char &character : weather_text) {
        if (character >= 'A' && character <= 'Z') character += ('a' - 'A');
      }
      if (id(weather_available)) {
        it.printf(
          15,
          47,
          id(label_font),
          id(weather_stale) ? warning : secondary,
          "%d C - %.18s",
          id(weather_temperature_c),
          weather_text.c_str());
      } else {
        it.printf(15, 47, id(label_font), secondary, "weather waiting");
      }

      const int weather_x = 275;
      const int weather_y = 34;
      const std::string &condition = id(weather_condition);
      if (!id(weather_available)) {
        it.filled_circle(weather_x, weather_y, 20, panel_soft);
        it.circle(weather_x, weather_y, 15, powder_pink);
        it.line(weather_x - 5, weather_y, weather_x + 5, weather_y, secondary);
        it.line(weather_x, weather_y - 5, weather_x, weather_y + 5, secondary);
      } else if (condition == "clear" && darkness < 0.50f) {
        it.filled_circle(weather_x, weather_y, 22, as_color(blend_rgb(0xFFF8D4, 0x80668B, darkness)));
        it.filled_circle(weather_x, weather_y, 16, pale_yellow);
        it.circle(weather_x, weather_y, 18, panel_edge);
      } else if (condition == "clear") {
        it.filled_circle(weather_x, weather_y, 21, as_color(0x31315F));
        it.filled_circle(weather_x, weather_y, 15, as_color(0xF5ECFF));
        it.filled_circle(weather_x + 6, weather_y - 5, 15, as_color(sky_top));
      } else {
        const Color cloud_fill = as_color(blend_rgb(0xFDF9FC, 0xA8B5DD, darkness));
        const Color cloud_light = as_color(blend_rgb(0xFFFFFF, 0xCBD2EE, darkness));
        it.filled_circle(weather_x, weather_y, 22, as_color(blend_rgb(0xEAF7FF, 0x39375F, darkness)));
        it.filled_circle(weather_x - 9, weather_y + 3, 10, cloud_fill);
        it.filled_circle(weather_x + 3, weather_y - 4, 13, cloud_light);
        it.filled_circle(weather_x + 15, weather_y + 3, 9, cloud_fill);
        it.filled_rectangle(weather_x - 17, weather_y + 2, 40, 10, cloud_fill);

        if (condition == "rain") {
          it.line(weather_x - 11, weather_y + 15, weather_x - 14, weather_y + 20, baby_blue);
          it.line(weather_x, weather_y + 15, weather_x - 3, weather_y + 20, baby_blue);
          it.line(weather_x + 11, weather_y + 15, weather_x + 8, weather_y + 20, powder_pink);
        } else if (condition == "snow") {
          it.filled_circle(weather_x - 10, weather_y + 18, 1, baby_blue);
          it.filled_circle(weather_x + 1, weather_y + 20, 1, primary);
          it.filled_circle(weather_x + 12, weather_y + 18, 1, powder_pink);
        } else if (condition == "storm") {
          it.line(weather_x + 2, weather_y + 13, weather_x - 3, weather_y + 21, pale_yellow);
          it.line(weather_x - 3, weather_y + 21, weather_x + 3, weather_y + 20, pale_yellow);
          it.line(weather_x + 3, weather_y + 20, weather_x - 2, weather_y + 27, pale_yellow);
        } else if (condition == "fog") {
          it.line(weather_x - 18, weather_y + 16, weather_x + 18, weather_y + 16, baby_blue);
          it.line(weather_x - 13, weather_y + 21, weather_x + 14, weather_y + 21, powder_pink);
        }
      }

      // Compact finance card keeps room for status and the enlarged control.
      fill_round_rect(10, 64, 300, 69, 13, panel_edge);
      fill_round_rect(12, 66, 296, 65, 11, panel_soft);
      fill_round_rect(15, 69, 290, 59, 9, panel);
      it.printf(24, 69, id(label_font), secondary, "net worth");
      const int64_t cents = id(net_worth_cents);
      const uint64_t absolute_cents = cents < 0 ? static_cast<uint64_t>(-(cents + 1)) + 1 : cents;
      char whole[24];
      snprintf(whole, sizeof(whole), "%llu", static_cast<unsigned long long>(absolute_cents / 100));
      char amount[32];
      size_t cursor = 0;
      if (cents < 0) amount[cursor++] = '-';
      if (id(currency) == "CAD" || id(currency) == "USD" || id(currency) == "AUD") {
        amount[cursor++] = '$';
      }
      const size_t whole_length = strlen(whole);
      for (size_t index = 0; index < whole_length; index++) {
        if (index > 0 && (whole_length - index) % 3 == 0) amount[cursor++] = ',';
        amount[cursor++] = whole[index];
      }
      amount[cursor] = '\0';
      it.printf(23, 84, id(amount_font), cents < 0 ? negative : primary, "%s", amount);
      if (id(currency).empty()) {
        it.printf(294, 69, id(label_font), secondary, TextAlign::TOP_RIGHT, "OPEN-METEO");
      } else {
        it.printf(294, 69, id(label_font), secondary, TextAlign::TOP_RIGHT, "%s - OPEN-METEO", id(currency).c_str());
      }

      // A tiny hand-drawn heart keeps the visual cute without another font glyph.
      it.filled_circle(282, 91, 4, powder_pink);
      it.filled_circle(289, 91, 4, powder_pink);
      for (int row = 0; row < 7; row++) {
        it.line(278 + row, 93 + row, 293 - row, 93 + row, powder_pink);
      }

      // Explicit states preserve the account name when an account has never been reconciled.
      const std::string &reconciliation_state = id(reconciliation_status);
      const bool summary_is_stale = id(summary_stale);
      const bool all_clear = !summary_is_stale && reconciliation_state == "all-clear";
      const bool never_reconciled = !summary_is_stale && reconciliation_state == "never";
      const bool reconciliation_due = !summary_is_stale && reconciliation_state == "due";
      const Color reconciliation_accent = all_clear ? baby_blue : warning;
      fill_round_rect(10, 137, 300, 43, 12, panel_edge);
      fill_round_rect(12, 139, 296, 39, 10, panel_soft);
      fill_round_rect(15, 142, 290, 33, 8, panel);
      it.filled_circle(30, 158, 12, as_color(blend_rgb(0xD6F5FF, 0x31547B, surface_darkness)));
      it.circle(30, 158, 12, reconciliation_accent);
      if (summary_is_stale) {
        it.line(30, 151, 30, 160, reconciliation_accent);
        it.filled_circle(30, 166, 1, reconciliation_accent);
        it.printf(49, 146, id(account_font), primary, "Finance data stale");
        fill_round_rect(237, 147, 60, 24, 10, as_color(blend_rgb(0xFFDAEA, 0x743B64, surface_darkness)));
        it.printf(288, 152, id(label_font), reconciliation_accent, TextAlign::TOP_RIGHT, "stale");
      } else if (all_clear) {
        it.line(23, 158, 28, 163, reconciliation_accent);
        it.line(28, 163, 37, 151, reconciliation_accent);
        it.printf(49, 146, id(account_font), primary, "All clear");
        fill_round_rect(237, 147, 60, 24, 10, as_color(blend_rgb(0xD6F5FF, 0x31547B, surface_darkness)));
        it.printf(288, 152, id(label_font), reconciliation_accent, TextAlign::TOP_RIGHT, "today");
      } else if (never_reconciled) {
        it.line(30, 151, 30, 160, reconciliation_accent);
        it.filled_circle(30, 166, 1, reconciliation_accent);
        it.printf(49, 146, id(account_font), primary, "%.15s", id(oldest_reconciled_account_name).c_str());
        fill_round_rect(237, 147, 60, 24, 10, as_color(blend_rgb(0xFFDAEA, 0x743B64, surface_darkness)));
        it.printf(288, 152, id(label_font), reconciliation_accent, TextAlign::TOP_RIGHT, "never");
      } else if (reconciliation_due) {
        it.line(30, 151, 30, 160, reconciliation_accent);
        it.filled_circle(30, 166, 1, reconciliation_accent);
        it.printf(49, 146, id(account_font), primary, "%.15s", id(oldest_reconciled_account_name).c_str());
        fill_round_rect(232, 147, 65, 24, 10, as_color(blend_rgb(0xFFDAEA, 0x743B64, surface_darkness)));
        it.printf(
          288,
          152,
          id(label_font),
          reconciliation_accent,
          TextAlign::TOP_RIGHT,
          "%d day%s",
          id(oldest_reconciled_days_ago),
          id(oldest_reconciled_days_ago) == 1 ? "" : "s");
      } else {
        it.printf(25, 147, id(account_font), secondary, "?");
        it.printf(49, 146, id(account_font), primary, "Data unavailable");
      }

      // Focus Mode now occupies nearly a quarter of the screen and lights up fully.
      const Color focus_glow = id(focus_mode)
        ? as_color(blend_rgb(0xFFB4D5, 0xE867AA, darkness))
        : as_color(blend_rgb(0xC8EFFF, 0x39345F, surface_darkness));
      const Color focus_edge = id(focus_mode) ? powder_pink : panel_edge;
      const Color focus_fill = id(focus_mode)
        ? as_color(blend_rgb(0xB8CDFD, 0x4B3A78, darkness))
        : panel;
      fill_round_rect(9, 184, 302, 50, 16, focus_glow);
      fill_round_rect(12, 187, 296, 44, 14, focus_edge);
      fill_round_rect(15, 190, 290, 38, 12, focus_fill);
      const Color focus_text = id(focus_mode) ? as_color(0xFFFAFF) : primary;
      it.printf(26, 188, id(button_font), focus_text, "Focus Mode");
      const char *focus_note = id(focus_sync_pending)
        ? "syncing both CYDs..."
        : id(focus_sync_error)
          ? "sync failed - tap again"
          : id(focus_mode)
            ? "synced on both CYDs"
            : "tap to begin";
      it.printf(26, 213, id(label_font), id(focus_sync_error) ? warning : (id(focus_mode) ? as_color(0xFFF4FC) : secondary), "%s", focus_note);
      const Color state_fill = id(focus_mode)
        ? as_color(0xFFF8FD)
        : as_color(blend_rgb(0xFFFFFF, 0x29284E, surface_darkness));
      fill_round_rect(244, 193, 52, 31, 13, state_fill);
      it.printf(
        288,
        196,
        id(button_font),
        id(focus_mode) ? as_color(0xD65D9B) : primary,
        TextAlign::TOP_RIGHT,
        id(focus_mode) ? "ON" : "OFF");
      if (id(focus_sync_pending)) {
        it.filled_circle(301, 228, 2, powder_pink);
      } else if (id(focus_sync_error)) {
        it.line(298, 225, 304, 231, warning);
        it.line(304, 225, 298, 231, warning);
      }

touchscreen:
  - platform: xpt2046
    id: dashboard_touch
    display: dashboard_display
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    threshold: 400
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      swap_xy: true
      mirror_x: true

binary_sensor:
  - platform: touchscreen
    id: focus_button
    touchscreen_id: dashboard_touch
    internal: true
    x_min: 10
    x_max: 310
    y_min: 182
    y_max: 239
    on_press:
      then:
        - if:
            condition:
              lambda: return !id(focus_sync_pending);
            then:
              - lambda: |-
                  id(focus_mode) = !id(focus_mode);
                  id(focus_sync_pending) = true;
                  id(focus_sync_error) = false;
                  id(dashboard_display).update();
              - script.execute: publish_focus

script:
  - id: refresh_summary
    mode: single
    then:
      - http_request.get:
          url: !secret finance_display_url
          request_headers:
            Authorization: !secret finance_display_authorization
          capture_response: true
          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - lambda: |-
                        const bool parsed = json::parse_json(body, [](JsonObject root) -> bool {
                          if (!root["netWorthCents"].is<int64_t>() || !root["asOf"].is<const char *>()) {
                            return false;
                          }
                          id(net_worth_cents) = root["netWorthCents"].as<int64_t>();
                          id(currency) = root["currency"].is<const char *>() ? root["currency"].as<const char *>() : "";
                          id(oldest_reconciled_account_name) = root["oldestReconciledAccountName"].is<const char *>() ? root["oldestReconciledAccountName"].as<const char *>() : "";
                          id(oldest_reconciled_on) = root["oldestReconciledOn"].is<const char *>() ? root["oldestReconciledOn"].as<const char *>() : "";
                          id(oldest_reconciled_days_ago) = root["oldestReconciledDaysAgo"].is<int>() ? root["oldestReconciledDaysAgo"].as<int>() : -1;
                          if (root["reconciliationStatus"].is<const char *>()) {
                            id(reconciliation_status) = root["reconciliationStatus"].as<const char *>();
                          } else if (!id(oldest_reconciled_account_name).empty() && id(oldest_reconciled_on).empty()) {
                            id(reconciliation_status) = "never";
                          } else if (id(oldest_reconciled_days_ago) == 0) {
                            id(reconciliation_status) = "all-clear";
                          } else if (id(oldest_reconciled_days_ago) > 0) {
                            id(reconciliation_status) = "due";
                          } else {
                            id(reconciliation_status) = "unavailable";
                          }
                          id(summary_stale) = root["stale"] | true;

                          if (!id(focus_sync_pending) && root["focusMode"].is<bool>()) {
                            id(focus_mode) = root["focusMode"].as<bool>();
                            id(focus_sync_error) = false;
                          }

                          if (root["weather"].is<JsonObject>()) {
                            JsonObject weather = root["weather"].as<JsonObject>();
                            if (
                              weather["condition"].is<const char *>() &&
                              weather["label"].is<const char *>() &&
                              weather["isDay"].is<bool>() &&
                              weather["temperatureC"].is<int>()) {
                              id(weather_condition) = weather["condition"].as<const char *>();
                              id(weather_label) = weather["label"].as<const char *>();
                              id(weather_is_day) = weather["isDay"].as<bool>();
                              id(weather_temperature_c) = weather["temperatureC"].as<int>();
                              id(weather_stale) = weather["stale"] | true;
                              id(weather_available) = true;

                              if (weather["theme"].is<JsonObject>()) {
                                JsonObject theme = weather["theme"].as<JsonObject>();
                                if (
                                  theme["localTime"].is<const char *>() &&
                                  theme["localPeriod"].is<const char *>() &&
                                  theme["darknessPercent"].is<int>()) {
                                  id(local_time) = theme["localTime"].as<const char *>();
                                  id(local_period) = theme["localPeriod"].as<const char *>();
                                  int darkness = theme["darknessPercent"].as<int>();
                                  if (darkness < 0) darkness = 0;
                                  if (darkness > 100) darkness = 100;
                                  id(theme_darkness_percent) = darkness;
                                }
                              } else {
                                id(theme_darkness_percent) = id(weather_is_day) ? 0 : 100;
                              }
                            }
                          } else {
                            id(weather_available) = false;
                            id(weather_stale) = true;
                          }
                          return true;
                        });
                        if (!parsed) id(summary_stale) = true;
                        id(dashboard_display).update();
                  else:
                    - lambda: |-
                        id(summary_stale) = true;
                        id(dashboard_display).update();
          on_error:
            then:
              - lambda: |-
                  id(summary_stale) = true;
                  id(dashboard_display).update();

  - id: publish_focus
    mode: single
    then:
      - http_request.send:
          method: PUT
          url: !secret finance_display_url
          request_headers:
            Authorization: !secret finance_display_authorization
            Content-Type: application/json
          body: !lambda |-
            return id(focus_mode) ? std::string("{\"focusMode\":true}") : std::string("{\"focusMode\":false}");
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  bool accepted = false;
                  if (response->status_code == 200) {
                    accepted = json::parse_json(body, [](JsonObject root) -> bool {
                      if (!root["focusMode"].is<bool>()) return false;
                      id(focus_mode) = root["focusMode"].as<bool>();
                      return true;
                    });
                  }
                  id(focus_sync_pending) = false;
                  id(focus_sync_error) = !accepted;
                  id(dashboard_display).update();
          on_error:
            then:
              - lambda: |-
                  id(focus_sync_pending) = false;
                  id(focus_sync_error) = true;
                  id(dashboard_display).update();

interval:
  # Finance data remains server-cached for 15 seconds; the faster device poll
  # makes a focus change appear on the other CYD within about five seconds.
  - interval: 5s
    then:
      - script.execute: refresh_summary
