substitutions:
  device_name: cyd-dashboard
  friendly_name: CYD Dashboard

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.2.0
  on_boot:
    priority: -100
    then:
      - script.execute: refresh_summary

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: WARN

json:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

http_request:
  useragent: ${device_name}
  timeout: 10s
  verify_ssl: true

spi:
  - id: display_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

output:
  - platform: gpio
    pin: GPIO21
    id: display_backlight

light:
  - platform: binary
    output: display_backlight
    id: backlight
    restore_mode: ALWAYS_ON

font:
  - file:
      type: gfonts
      family: Quicksand
      weight: 500
    id: label_font
    size: 12
    bpp: 2
  - file:
      type: gfonts
      family: Quicksand
      weight: 700
    id: amount_font
    size: 40
    bpp: 2
  - file:
      type: gfonts
      family: Quicksand
      weight: 700
    id: account_font
    size: 18
    bpp: 2
  - file:
      type: gfonts
      family: Quicksand
      weight: 700
    id: button_font
    size: 14
    bpp: 2

globals:
  - id: net_worth_cents
    type: int64_t
    restore_value: no
    initial_value: '0'
  - id: currency
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: oldest_reconciled_account_name
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: oldest_reconciled_on
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: oldest_reconciled_days_ago
    type: int
    restore_value: no
    initial_value: '-1'
  - id: summary_stale
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: weather_available
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: weather_condition
    type: std::string
    restore_value: no
    initial_value: '"unknown"'
  - id: weather_label
    type: std::string
    restore_value: no
    initial_value: '"WEATHER WAITING"'
  - id: weather_is_day
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: weather_temperature_c
    type: int
    restore_value: no
    initial_value: '0'
  - id: weather_stale
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: focus_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: focus_sync_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: focus_sync_error
    type: bool
    restore_value: no
    initial_value: 'false'

display:
  - platform: mipi_spi
    id: dashboard_display
    model: ILI9341
    spi_id: display_spi
    cs_pin: GPIO15
    dc_pin: GPIO2
    reset_pin: GPIO4
    rotation: 90
    update_interval: never
    lambda: |-
      const Color panel(0x10, 0x06, 0x27);
      const Color panel_soft(0x18, 0x0A, 0x35);
      const Color text(0xFF, 0xF8, 0xFE);
      const Color muted(0xC7, 0xB4, 0xDD);
      const Color cyan(0x35, 0xF4, 0xE7);
      const Color pink(0xFF, 0x58, 0xC7);
      const Color peach(0xFF, 0xA3, 0xC9);
      const Color warning(0xFF, 0xCC, 0x70);
      const Color negative(0xFF, 0x74, 0xA4);
      const Color dim_cyan(0x0B, 0x53, 0x60);
      const Color dim_pink(0x69, 0x18, 0x62);
      const Color cloud_fill(0x76, 0x50, 0x9D);
      const Color cloud_light(0xC8, 0xA8, 0xE8);
      const Color state_color = id(summary_stale) ? warning : cyan;

      auto fill_round_rect = [&](int x, int y, int width, int height, int radius, Color color) {
        it.filled_rectangle(x + radius, y, width - (radius * 2), height, color);
        it.filled_rectangle(x, y + radius, width, height - (radius * 2), color);
        it.filled_circle(x + radius, y + radius, radius, color);
        it.filled_circle(x + width - radius - 1, y + radius, radius, color);
        it.filled_circle(x + radius, y + height - radius - 1, radius, color);
        it.filled_circle(x + width - radius - 1, y + height - radius - 1, radius, color);
      };

      auto mix_channel = [](uint8_t from, uint8_t to, float amount) -> uint8_t {
        return static_cast<uint8_t>(from + ((static_cast<int>(to) - from) * amount));
      };

      // A continuous two-stage dusk gradient replaces the old visible color bands.
      for (int y = 0; y < 240; y++) {
        float amount;
        uint8_t red;
        uint8_t green;
        uint8_t blue;
        if (y < 132) {
          amount = y / 132.0f;
          red = mix_channel(0x05, 0x13, amount);
          green = mix_channel(0x02, 0x04, amount);
          blue = mix_channel(0x16, 0x2C, amount);
        } else {
          amount = (y - 132) / 108.0f;
          red = mix_channel(0x13, 0x2B, amount);
          green = mix_channel(0x04, 0x08, amount);
          blue = mix_channel(0x2C, 0x47, amount);
        }
        it.filled_rectangle(0, y, 320, 1, Color(red, green, blue));
      }

      // Low-contrast haze and asymmetric neon edge bloom.
      it.rectangle(0, 0, 320, 240, Color(0x42, 0x0D, 0x50));
      it.rectangle(2, 2, 316, 236, Color(0x25, 0x0B, 0x43));
      it.rectangle(4, 4, 312, 232, Color(0x12, 0x18, 0x3C));
      it.line(5, 5, 112, 5, dim_cyan);
      it.line(5, 6, 82, 6, Color(0x0A, 0x37, 0x48));
      it.line(207, 234, 314, 234, dim_pink);
      it.line(238, 233, 314, 233, Color(0x42, 0x0E, 0x50));
      it.line(5, 6, 5, 98, Color(0x0B, 0x3C, 0x50));
      it.line(314, 135, 314, 233, Color(0x4D, 0x10, 0x55));

      // Current conditions become the decorative sky element.
      const int weather_x = 271;
      const int weather_y = 53;
      const std::string &condition = id(weather_condition);
      if (!id(weather_available)) {
        it.filled_circle(weather_x, weather_y, 27, Color(0x18, 0x0A, 0x37));
        it.circle(weather_x, weather_y, 20, dim_pink);
        it.line(weather_x - 7, weather_y, weather_x + 7, weather_y, muted);
        it.line(weather_x, weather_y - 7, weather_x, weather_y + 7, muted);
      } else if (condition == "clear" && id(weather_is_day)) {
        it.filled_circle(weather_x, weather_y, 31, Color(0x32, 0x09, 0x4B));
        it.filled_circle(weather_x, weather_y, 25, Color(0x6C, 0x1C, 0x66));
        it.filled_circle(weather_x, weather_y, 19, peach);
        it.circle(weather_x, weather_y, 21, pink);
      } else if (condition == "clear") {
        it.filled_circle(weather_x, weather_y, 29, Color(0x12, 0x15, 0x48));
        it.filled_circle(weather_x, weather_y, 18, cyan);
        it.filled_circle(weather_x + 7, weather_y - 6, 18, Color(0x13, 0x05, 0x2D));
        it.draw_pixel_at(weather_x - 31, weather_y - 15, pink);
        it.line(weather_x + 27, weather_y - 22, weather_x + 27, weather_y - 16, cyan);
        it.line(weather_x + 24, weather_y - 19, weather_x + 30, weather_y - 19, cyan);
      } else {
        // Cloud halo shared by cloudy, rain, snow, fog, and storm states.
        it.filled_circle(weather_x, weather_y, 31, Color(0x20, 0x0A, 0x42));
        it.filled_circle(weather_x - 8, weather_y + 2, 16, dim_pink);
        it.filled_circle(weather_x + 7, weather_y - 5, 19, dim_cyan);
        it.filled_circle(weather_x - 9, weather_y, 12, cloud_fill);
        it.filled_circle(weather_x + 5, weather_y - 6, 16, cloud_light);
        it.filled_circle(weather_x + 18, weather_y + 1, 11, cloud_fill);
        it.filled_rectangle(weather_x - 19, weather_y, 47, 13, cloud_fill);

        if (condition == "rain") {
          it.line(weather_x - 13, weather_y + 18, weather_x - 17, weather_y + 25, cyan);
          it.line(weather_x, weather_y + 18, weather_x - 4, weather_y + 25, cyan);
          it.line(weather_x + 13, weather_y + 18, weather_x + 9, weather_y + 25, pink);
        } else if (condition == "snow") {
          it.filled_circle(weather_x - 12, weather_y + 22, 2, cyan);
          it.filled_circle(weather_x + 1, weather_y + 25, 2, text);
          it.filled_circle(weather_x + 14, weather_y + 21, 2, pink);
        } else if (condition == "storm") {
          it.line(weather_x + 3, weather_y + 14, weather_x - 3, weather_y + 24, warning);
          it.line(weather_x - 3, weather_y + 24, weather_x + 4, weather_y + 23, warning);
          it.line(weather_x + 4, weather_y + 23, weather_x - 2, weather_y + 32, warning);
        } else if (condition == "fog") {
          it.line(weather_x - 24, weather_y + 19, weather_x + 24, weather_y + 19, cyan);
          it.line(weather_x - 17, weather_y + 25, weather_x + 18, weather_y + 25, pink);
        }
      }

      it.filled_circle(18, 20, 2, state_color);
      it.printf(27, 12, id(label_font), muted, "NET WORTH");

      const int64_t cents = id(net_worth_cents);
      const uint64_t absolute_cents = cents < 0 ? static_cast<uint64_t>(-(cents + 1)) + 1 : cents;
      char whole[24];
      snprintf(whole, sizeof(whole), "%llu", static_cast<unsigned long long>(absolute_cents / 100));
      char amount[32];
      size_t cursor = 0;
      if (cents < 0) amount[cursor++] = '-';
      const size_t whole_length = strlen(whole);
      for (size_t index = 0; index < whole_length; index++) {
        if (index > 0 && (whole_length - index) % 3 == 0) amount[cursor++] = ',';
        amount[cursor++] = whole[index];
      }
      snprintf(
        amount + cursor,
        sizeof(amount) - cursor,
        ".%02llu",
        static_cast<unsigned long long>(absolute_cents % 100));
      it.printf(15, 32, id(amount_font), cents < 0 ? negative : text, "%s", amount);

      if (!id(currency).empty()) {
        fill_round_rect(17, 82, 45, 19, 8, dim_pink);
        fill_round_rect(19, 84, 41, 15, 6, panel);
        it.printf(52, 85, id(label_font), pink, TextAlign::TOP_RIGHT, "%s", id(currency).c_str());
      }
      if (id(weather_available)) {
        it.printf(
          304,
          87,
          id(label_font),
          id(weather_stale) ? warning : muted,
          TextAlign::TOP_RIGHT,
          "%d C  %.18s  OPEN-METEO",
          id(weather_temperature_c),
          id(weather_label).c_str());
      } else {
        it.printf(304, 87, id(label_font), muted, TextAlign::TOP_RIGHT, "WEATHER WAITING");
      }

      // Soft reconciliation card; there is no perspective grid behind it.
      fill_round_rect(11, 110, 298, 82, 11, Color(0x4D, 0x13, 0x5A));
      fill_round_rect(13, 112, 294, 78, 9, panel_soft);
      fill_round_rect(17, 116, 286, 70, 7, panel);
      it.filled_circle(27, 130, 7, dim_cyan);
      it.filled_circle(27, 130, 4, cyan);
      it.printf(42, 121, id(label_font), pink, "OLDEST OPEN ACCOUNT");
      it.printf(
        24,
        140,
        id(account_font),
        text,
        "%.25s",
        id(oldest_reconciled_account_name).empty() ? "Account unavailable" : id(oldest_reconciled_account_name).c_str());
      if (id(oldest_reconciled_on).empty()) {
        it.printf(24, 169, id(label_font), muted, "NO RECONCILIATION RECORD");
      } else {
        it.printf(24, 169, id(label_font), muted, "RECONCILED %s", id(oldest_reconciled_on).c_str());
        fill_round_rect(227, 165, 68, 19, 8, id(summary_stale) ? warning : dim_cyan);
        fill_round_rect(229, 167, 64, 15, 6, panel);
        it.printf(
          287,
          168,
          id(label_font),
          state_color,
          TextAlign::TOP_RIGHT,
          "%d %s",
          id(oldest_reconciled_days_ago),
          id(oldest_reconciled_days_ago) == 1 ? "DAY" : "DAYS");
      }

      // The full-width illuminated control is also a generous touch target.
      const Color focus_glow = id(focus_mode) ? Color(0x73, 0x1B, 0x74) : Color(0x2A, 0x10, 0x45);
      const Color focus_edge = id(focus_mode) ? pink : Color(0x55, 0x31, 0x70);
      const Color focus_fill = id(focus_mode) ? Color(0x3A, 0x0D, 0x49) : panel;
      fill_round_rect(11, 200, 298, 34, 12, focus_glow);
      fill_round_rect(14, 203, 292, 28, 10, focus_edge);
      fill_round_rect(16, 205, 288, 24, 8, focus_fill);
      it.filled_circle(31, 217, id(focus_mode) ? 7 : 5, id(focus_mode) ? cyan : Color(0x66, 0x54, 0x7A));
      if (id(focus_mode)) it.circle(31, 217, 9, dim_cyan);
      it.printf(49, 207, id(button_font), id(focus_mode) ? text : muted, "FOCUS MODE");
      it.printf(
        288,
        208,
        id(button_font),
        id(focus_mode) ? cyan : muted,
        TextAlign::TOP_RIGHT,
        id(focus_mode) ? "ON" : "OFF");
      if (id(focus_sync_pending)) {
        it.filled_circle(298, 217, 3, pink);
      } else if (id(focus_sync_error)) {
        it.line(295, 214, 301, 220, warning);
        it.line(301, 214, 295, 220, warning);
      }

touchscreen:
  - platform: xpt2046
    id: dashboard_touch
    display: dashboard_display
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    threshold: 400
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      swap_xy: true
      mirror_x: true

binary_sensor:
  - platform: touchscreen
    id: focus_button
    touchscreen_id: dashboard_touch
    internal: true
    x_min: 10
    x_max: 310
    y_min: 198
    y_max: 239
    on_press:
      then:
        - if:
            condition:
              lambda: return !id(focus_sync_pending);
            then:
              - lambda: |-
                  id(focus_mode) = !id(focus_mode);
                  id(focus_sync_pending) = true;
                  id(focus_sync_error) = false;
                  id(dashboard_display).update();
              - script.execute: publish_focus

script:
  - id: refresh_summary
    mode: single
    then:
      - http_request.get:
          url: !secret finance_display_url
          request_headers:
            Authorization: !secret finance_display_authorization
          capture_response: true
          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - lambda: |-
                        const bool parsed = json::parse_json(body, [](JsonObject root) -> bool {
                          if (!root["netWorthCents"].is<int64_t>() || !root["asOf"].is<const char *>()) {
                            return false;
                          }
                          id(net_worth_cents) = root["netWorthCents"].as<int64_t>();
                          id(currency) = root["currency"].is<const char *>() ? root["currency"].as<const char *>() : "";
                          id(oldest_reconciled_account_name) = root["oldestReconciledAccountName"].is<const char *>() ? root["oldestReconciledAccountName"].as<const char *>() : "";
                          id(oldest_reconciled_on) = root["oldestReconciledOn"].is<const char *>() ? root["oldestReconciledOn"].as<const char *>() : "";
                          id(oldest_reconciled_days_ago) = root["oldestReconciledDaysAgo"].is<int>() ? root["oldestReconciledDaysAgo"].as<int>() : -1;
                          id(summary_stale) = root["stale"] | true;

                          if (!id(focus_sync_pending) && root["focusMode"].is<bool>()) {
                            id(focus_mode) = root["focusMode"].as<bool>();
                            id(focus_sync_error) = false;
                          }

                          if (root["weather"].is<JsonObject>()) {
                            JsonObject weather = root["weather"].as<JsonObject>();
                            if (
                              weather["condition"].is<const char *>() &&
                              weather["label"].is<const char *>() &&
                              weather["isDay"].is<bool>() &&
                              weather["temperatureC"].is<int>()) {
                              id(weather_condition) = weather["condition"].as<const char *>();
                              id(weather_label) = weather["label"].as<const char *>();
                              id(weather_is_day) = weather["isDay"].as<bool>();
                              id(weather_temperature_c) = weather["temperatureC"].as<int>();
                              id(weather_stale) = weather["stale"] | true;
                              id(weather_available) = true;
                            }
                          } else {
                            id(weather_available) = false;
                            id(weather_stale) = true;
                          }
                          return true;
                        });
                        if (!parsed) id(summary_stale) = true;
                        id(dashboard_display).update();
                  else:
                    - lambda: |-
                        id(summary_stale) = true;
                        id(dashboard_display).update();
          on_error:
            then:
              - lambda: |-
                  id(summary_stale) = true;
                  id(dashboard_display).update();

  - id: publish_focus
    mode: single
    then:
      - http_request.send:
          method: PUT
          url: !secret finance_display_url
          request_headers:
            Authorization: !secret finance_display_authorization
            Content-Type: application/json
          body: !lambda |-
            return id(focus_mode) ? std::string("{\"focusMode\":true}") : std::string("{\"focusMode\":false}");
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  bool accepted = false;
                  if (response->status_code == 200) {
                    accepted = json::parse_json(body, [](JsonObject root) -> bool {
                      if (!root["focusMode"].is<bool>()) return false;
                      id(focus_mode) = root["focusMode"].as<bool>();
                      return true;
                    });
                  }
                  id(focus_sync_pending) = false;
                  id(focus_sync_error) = !accepted;
                  id(dashboard_display).update();
          on_error:
            then:
              - lambda: |-
                  id(focus_sync_pending) = false;
                  id(focus_sync_error) = true;
                  id(dashboard_display).update();

interval:
  # Finance data remains server-cached for 15 seconds; the faster device poll
  # makes a focus change appear on the other CYD within about five seconds.
  - interval: 5s
    then:
      - script.execute: refresh_summary
