apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cyd-dashboard-ota
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cyd-dashboard-ota
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    # OTA is the sole workload capability: two reserved CYD addresses over
    # ESPHome's native authenticated OTA listener. The updater has no internet,
    # cluster API, Actual, or DNS access.
    - to:
        - ipBlock: {cidr: 192.168.1.18/32}
        - ipBlock: {cidr: 192.168.1.21/32}
      ports:
        - {port: 3232, protocol: TCP}
