apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cyd-dashboard-ota
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cyd-dashboard-ota
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    # ESP-IDF resolves its pinned component manifest through Espressif's public
    # registry during a credential-specific build. Registry addresses are CDN
    # backed and cannot be represented as stable CIDRs; limit this exception to
    # DNS and HTTPS. No public ingress or cluster API access is permitted.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {port: 443, protocol: TCP}
    # Authenticated OTA is restricted to the two reserved CYD addresses.
    - to:
        - ipBlock: {cidr: 192.168.1.18/32}
        - ipBlock: {cidr: 192.168.1.21/32}
      ports:
        - {port: 3232, protocol: TCP}
