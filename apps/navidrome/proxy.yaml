apiVersion: v1
kind: ConfigMap
metadata:
  name: navidrome-proxy
  namespace: media
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {}
    http {
      access_log /dev/stdout;
      error_log /dev/stderr warn;
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }

      # Browser traffic arrives only through Traefik. Preserve the identity
      # header that its Authentik middleware supplies, except for the Subsonic
      # API where clients authenticate directly with Navidrome.
      server {
        listen 14533;
        location ^~ /rest/ {
          proxy_set_header X-authentik-username "";
          proxy_pass http://127.0.0.1:4533;
          include /etc/nginx/proxy-common.conf;
        }
        location / {
          proxy_set_header X-authentik-username $http_x_authentik_username;
          proxy_pass http://127.0.0.1:4533;
          include /etc/nginx/proxy-common.conf;
        }
      }

      # MCP clients use native Navidrome/Subsonic credentials. Strip any
      # caller-supplied external-auth header at this separate policy boundary.
      server {
        listen 14534;
        location / {
          proxy_set_header X-authentik-username "";
          proxy_pass http://127.0.0.1:4533;
          include /etc/nginx/proxy-common.conf;
        }
      }

      # Prometheus receives only the custom metrics endpoint on its own port.
      server {
        listen 14535;
        location = /metrics-internal {
          proxy_set_header X-authentik-username "";
          proxy_pass http://127.0.0.1:4533;
          include /etc/nginx/proxy-common.conf;
        }
        location / { return 404; }
      }
    }
  proxy-common.conf: |
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
