apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: navidrome
  namespace: monitoring
  labels: {release: observability}
spec:
  namespaceSelector:
    matchNames: [media]
  selector:
    matchLabels:
      app.kubernetes.io/name: navidrome
  endpoints:
    - {port: metrics, path: /metrics-internal, interval: 30s, scrapeTimeout: 10s}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: navidrome
  namespace: monitoring
  labels: {release: observability}
spec:
  groups:
    - name: home-server.navidrome
      rules:
        - alert: NavidromeUnavailable
          expr: absent(up{namespace="media",service="navidrome"}) or max(up{namespace="media",service="navidrome"}) == 0
          for: 5m
          labels: {severity: warning, cluster: home-server}
          annotations:
            summary: Navidrome is unavailable
            description: Music streaming and its MCP library integration are unavailable. Check the Navidrome pod, NFS mount, and media namespace events.
            runbook_url: https://github.com/rezanmz/home-server/blob/main/docs/runbook.md#navidrome-and-lidarr
