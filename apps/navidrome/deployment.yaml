apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: media
  labels:
    app.kubernetes.io/name: navidrome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: navidrome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: navidrome
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: beelink
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: navidrome
          image: deluan/navidrome:0.63.2@sha256:9012939114fbb1bb641b81cf96dec5ded15f0aafefe8d47a511d7cb919658e40
          imagePullPolicy: IfNotPresent
          env:
            - {name: ND_ADDRESS, value: 127.0.0.1}
            - {name: ND_PORT, value: "4533"}
            - {name: ND_DATAFOLDER, value: /data}
            - {name: ND_MUSICFOLDER, value: /music}
            - {name: ND_LOGLEVEL, value: info}
            - {name: ND_ENFORCENONROOTUSER, value: "true"}
            - {name: ND_ENABLEINSIGHTSCOLLECTOR, value: "false"}
            # NFS does not provide reliable filesystem notifications to every
            # client, so retain a bounded reconciliation scan for new imports.
            - {name: ND_SCANNER_SCHEDULE, value: "@every 1m"}
            - {name: ND_PROMETHEUS_ENABLED, value: "true"}
            - {name: ND_PROMETHEUS_METRICSPATH, value: /metrics-internal}
            # Navidrome listens only on loopback. The local proxy creates
            # separate public, native-API, and metrics trust boundaries.
            - {name: ND_EXTAUTH_TRUSTEDSOURCES, value: 127.0.0.1/32}
            - {name: ND_EXTAUTH_USERHEADER, value: X-authentik-username}
            - name: ND_EXTAUTH_LOGOUTURL
              value: https://music.reza.network/outpost.goauthentik.io/sign_out
            - name: ND_PASSWORDENCRYPTIONKEY
              valueFrom:
                secretKeyRef:
                  name: navidrome-secrets
                  key: password-encryption-key
          ports:
            - {name: http, containerPort: 4533, protocol: TCP}
          startupProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: music, mountPath: /music, readOnly: true}
            - {name: tmp, mountPath: /tmp}
        - name: policy-proxy
          image: nginx:1.31.3-alpine@sha256:2776cd5b70d8983e27e9f5c90abee3d24c690014ae8ecbb529572d954a459096
          imagePullPolicy: IfNotPresent
          command: [nginx, -g, "daemon off;"]
          ports:
            - {name: public-http, containerPort: 14533, protocol: TCP}
            - {name: api-http, containerPort: 14534, protocol: TCP}
            - {name: metrics-http, containerPort: 14535, protocol: TCP}
          readinessProbe:
            tcpSocket: {port: public-http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: public-http}
            periodSeconds: 30
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: proxy-config, mountPath: /etc/nginx, readOnly: true}
            - {name: nginx-tmp, mountPath: /tmp}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: navidrome-data}
        - name: music
          persistentVolumeClaim: {claimName: media-music}
        - name: tmp
          emptyDir: {sizeLimit: 2Gi}
        - name: proxy-config
          configMap: {name: navidrome-proxy}
        - {name: nginx-tmp, emptyDir: {}}
        - {name: nginx-cache, emptyDir: {}}
