apiVersion: batch/v1
kind: CronJob
metadata:
  name: omnifin-maintenance
  namespace: apps
  labels:
    app.kubernetes.io/name: omnifin
    app.kubernetes.io/component: maintenance
spec:
  schedule: "17 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 82800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: omnifin
            app.kubernetes.io/component: maintenance
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: omnifin
                      app.kubernetes.io/component: gateway
                  namespaces: [apps]
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: maintenance
              image: ghcr.io/rezanmz/omnifin@sha256:d651b0fa39230077b70b181a652ec831987d3cd1e4dcc3698e1998f9543f41df
              imagePullPolicy: IfNotPresent
              command: ['/nodejs/bin/node', '/opt/omnifin/bin/entrypoint.mjs', 'maintenance']
              args: ['backup-retained', '--retain', '14']
              env:
                - {name: OMNIFIN_BASE_URL, value: https://omnifin.reza.network}
                - {name: OMNIFIN_DATABASE_URL, value: /data/omnifin.db}
                - {name: OMNIFIN_BACKUP_DIRECTORY, value: /data/backups}
                - {name: OMNIFIN_IMAGE_REF, value: ghcr.io/rezanmz/omnifin@sha256:d651b0fa39230077b70b181a652ec831987d3cd1e4dcc3698e1998f9543f41df}
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {cpu: 500m, memory: 512Mi}
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - {name: data, mountPath: /data}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: omnifin-data
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
