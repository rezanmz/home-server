apiVersion: v1
kind: Service
metadata:
  name: omnifin
  namespace: apps
  labels:
    app.kubernetes.io/name: omnifin
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: omnifin
    app.kubernetes.io/component: web
  ports:
    - {name: http, port: 3000, targetPort: http, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: omnifin-gateway
  namespace: apps
  labels:
    app.kubernetes.io/name: omnifin
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: omnifin
    app.kubernetes.io/component: gateway
  ports:
    - {name: http, port: 4000, targetPort: http, protocol: TCP}
