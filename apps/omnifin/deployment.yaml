apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnifin-gateway
  namespace: apps
  labels:
    app.kubernetes.io/name: omnifin
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: omnifin
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omnifin
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Kubernetes mounts a fresh Longhorn filesystem as root. Omnifin
        # deliberately refuses data or backup directories that do not belong
        # exclusively to its runtime identity. Normalize both paths before
        # every gateway start without relying on a recursive fsGroup remount.
        - name: prepare-data-directory
          image: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command:
            - sh
            - -ec
            - |
              if [ -L /data ] || [ ! -d /data ]; then
                echo "/data must be a non-symlink directory" >&2
                exit 1
              fi
              if [ -L /data/backups ]; then
                echo "/data/backups must not be a symlink" >&2
                exit 1
              fi
              if [ -e /data/backups ] && [ ! -d /data/backups ]; then
                echo "/data/backups must be a directory" >&2
                exit 1
              fi
              for database_file in /data/omnifin.db /data/omnifin.db-wal /data/omnifin.db-shm; do
                if [ -L "$database_file" ]; then
                  echo "$database_file must not be a symlink" >&2
                  exit 1
                fi
                if [ -e "$database_file" ] && [ ! -f "$database_file" ]; then
                  echo "$database_file must be a regular file" >&2
                  exit 1
                fi
              done
              if [ ! -e /data/backups ]; then
                mkdir /data/backups
              fi
              chown 65532:65532 /data/backups
              chmod 0700 /data/backups
              for database_file in /data/omnifin.db /data/omnifin.db-wal /data/omnifin.db-shm; do
                if [ -f "$database_file" ]; then
                  chown 65532:65532 "$database_file"
                  chmod 0600 "$database_file"
                fi
              done
              chown 65532:65532 /data
              chmod 0700 /data
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER, DAC_OVERRIDE]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      containers:
        - name: gateway
          image: ghcr.io/rezanmz/omnifin@sha256:d651b0fa39230077b70b181a652ec831987d3cd1e4dcc3698e1998f9543f41df
          imagePullPolicy: IfNotPresent
          args:
            - gateway
          env:
            - {name: NODE_ENV, value: production}
            - {name: OMNIFIN_BACKUP_DIRECTORY, value: /data/backups}
            - {name: OMNIFIN_BASE_URL, value: https://omnifin.reza.network}
            - {name: OMNIFIN_DATABASE_URL, value: /data/omnifin.db}
            - {name: OMNIFIN_ENCRYPTION_KEY_FILE, value: /run/secrets/omnifin_encryption_key}
            - {name: OMNIFIN_GATEWAY_HEALTH_URL, value: http://127.0.0.1:4000/healthz}
            - {name: OMNIFIN_HOST, value: 0.0.0.0}
            - {name: OMNIFIN_INSECURE_LOOPBACK_PREVIEW, value: "false"}
            - {name: OMNIFIN_IMAGE_REF, value: ghcr.io/rezanmz/omnifin@sha256:d651b0fa39230077b70b181a652ec831987d3cd1e4dcc3698e1998f9543f41df}
            # The direct cluster path is isolated by NetworkPolicy and avoids
            # sending service credentials through Jellyfin's browser proxy.
            - {name: OMNIFIN_JELLYFIN_INSECURE_HTTP_APPROVED, value: "true"}
            - {name: OMNIFIN_JELLYFIN_URL, value: http://jellyfin.media.svc.cluster.local:8096}
            - {name: OMNIFIN_LOG_LEVEL, value: info}
            - {name: OMNIFIN_PORT, value: "4000"}
            - {name: OMNIFIN_RECOVERY_SECRET_FILE, value: /run/secrets/omnifin_recovery_secret}
            - {name: OMNIFIN_GATEWAY_READY_URL, value: http://127.0.0.1:4000/readyz}
            - {name: OMNIFIN_SECURE_COOKIES, value: "true"}
            - {name: OMNIFIN_TRUST_PROXY_HOPS, value: "1"}
          ports:
            - {name: http, containerPort: 4000, protocol: TCP}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            timeoutSeconds: 4
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - name: encryption-key
              mountPath: /run/secrets/omnifin_encryption_key
              subPath: encryption-key
              readOnly: true
            - name: recovery-secret
              mountPath: /run/secrets/omnifin_recovery_secret
              subPath: recovery-secret
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: omnifin-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: encryption-key
          secret:
            secretName: omnifin-secrets
            defaultMode: 0444
            items:
              - {key: encryption-key, path: encryption-key}
        - name: recovery-secret
          secret:
            secretName: omnifin-secrets
            defaultMode: 0444
            items:
              - {key: recovery-secret, path: recovery-secret}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnifin-web
  namespace: apps
  labels:
    app.kubernetes.io/name: omnifin
    app.kubernetes.io/component: web
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: omnifin
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omnifin
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/rezanmz/omnifin@sha256:d651b0fa39230077b70b181a652ec831987d3cd1e4dcc3698e1998f9543f41df
          imagePullPolicy: IfNotPresent
          args:
            - web
          env:
            - {name: HOSTNAME, value: 0.0.0.0}
            - {name: NODE_ENV, value: production}
            - {name: OMNIFIN_BASE_URL, value: https://omnifin.reza.network}
            - {name: OMNIFIN_DISPLAY_PROFILE, value: standard}
            - {name: OMNIFIN_GATEWAY_URL, value: http://omnifin-gateway.apps.svc.cluster.local:4000}
            - {name: OMNIFIN_WEB_TRUST_PROXY_HOPS, value: "1"}
            - {name: PORT, value: "3000"}
          ports:
            - {name: http, containerPort: 3000, protocol: TCP}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            timeoutSeconds: 4
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: next-cache, mountPath: /opt/omnifin/web/.next/cache}
            - {name: nested-next-cache, mountPath: /opt/omnifin/web/apps/web/.next/cache}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: nested-next-cache
          emptyDir:
            sizeLimit: 256Mi
