apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnifin-gateway
  namespace: apps
  labels:
    app.kubernetes.io/name: omnifin
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: omnifin
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omnifin
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Kubernetes mounts a fresh Longhorn filesystem as root. Omnifin
        # deliberately refuses a database directory not owned by its runtime
        # identity, so make that one ownership transition before startup.
        - name: prepare-data-directory
          image: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command:
            - sh
            - -ec
            - |
              chmod 0700 /data
              chown 65532:65532 /data
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      containers:
        - name: gateway
          image: ghcr.io/rezanmz/omnifin:v0.5.2@sha256:74a9c315a4e0fa78cda9421237618d5f3c5a7847233ddf644f790bcabfbbce42
          imagePullPolicy: IfNotPresent
          args:
            - gateway
          env:
            - {name: NODE_ENV, value: production}
            - {name: OMNIFIN_BASE_URL, value: https://omnifin.reza.network}
            - {name: OMNIFIN_DATABASE_URL, value: /data/omnifin.db}
            - {name: OMNIFIN_ENCRYPTION_KEY_FILE, value: /run/secrets/omnifin_encryption_key}
            - {name: OMNIFIN_HOST, value: 0.0.0.0}
            - {name: OMNIFIN_INSECURE_LOOPBACK_PREVIEW, value: "false"}
            # The direct cluster path is isolated by NetworkPolicy and avoids
            # sending service credentials through Jellyfin's browser proxy.
            - {name: OMNIFIN_JELLYFIN_INSECURE_HTTP_APPROVED, value: "true"}
            - {name: OMNIFIN_JELLYFIN_URL, value: http://jellyfin.media.svc.cluster.local:8096}
            - {name: OMNIFIN_LOG_LEVEL, value: info}
            - {name: OMNIFIN_PORT, value: "4000"}
            - {name: OMNIFIN_RECOVERY_SECRET_FILE, value: /run/secrets/omnifin_recovery_secret}
            - {name: OMNIFIN_SECURE_COOKIES, value: "true"}
            - {name: OMNIFIN_TRUST_PROXY_HOPS, value: "1"}
          ports:
            - {name: http, containerPort: 4000, protocol: TCP}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            timeoutSeconds: 4
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - name: encryption-key
              mountPath: /run/secrets/omnifin_encryption_key
              subPath: encryption-key
              readOnly: true
            - name: recovery-secret
              mountPath: /run/secrets/omnifin_recovery_secret
              subPath: recovery-secret
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: omnifin-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: encryption-key
          secret:
            secretName: omnifin-secrets
            defaultMode: 0440
            items:
              - {key: encryption-key, path: encryption-key}
        - name: recovery-secret
          secret:
            secretName: omnifin-secrets
            defaultMode: 0440
            items:
              - {key: recovery-secret, path: recovery-secret}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnifin-web
  namespace: apps
  labels:
    app.kubernetes.io/name: omnifin
    app.kubernetes.io/component: web
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: omnifin
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omnifin
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/rezanmz/omnifin:v0.5.2@sha256:74a9c315a4e0fa78cda9421237618d5f3c5a7847233ddf644f790bcabfbbce42
          imagePullPolicy: IfNotPresent
          args:
            - web
          env:
            - {name: HOSTNAME, value: 0.0.0.0}
            - {name: NODE_ENV, value: production}
            - {name: OMNIFIN_BASE_URL, value: https://omnifin.reza.network}
            - {name: OMNIFIN_DISPLAY_PROFILE, value: standard}
            - {name: OMNIFIN_GATEWAY_URL, value: http://omnifin-gateway.apps.svc.cluster.local:4000}
            - {name: OMNIFIN_WEB_TRUST_PROXY_HOPS, value: "1"}
            - {name: PORT, value: "3000"}
          ports:
            - {name: http, containerPort: 3000, protocol: TCP}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            timeoutSeconds: 4
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: next-cache, mountPath: /opt/omnifin/web/.next/cache}
            - {name: nested-next-cache, mountPath: /opt/omnifin/web/apps/web/.next/cache}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: nested-next-cache
          emptyDir:
            sizeLimit: 256Mi
