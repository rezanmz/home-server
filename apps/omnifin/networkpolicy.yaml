apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omnifin-web
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: omnifin
      app.kubernetes.io/component: web
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - {port: 3000, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: omnifin
              app.kubernetes.io/component: gateway
      ports:
        - {port: 4000, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omnifin-gateway
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: omnifin
      app.kubernetes.io/component: gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: omnifin
              app.kubernetes.io/component: web
      ports:
        - {port: 4000, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    # Authentik, Jellyfin, and other public connector endpoints resolve to the
    # split-horizon Traefik VIP. Account for both pre- and post-DNAT paths.
    - to:
        - ipBlock:
            cidr: 192.168.1.240/32
      ports:
        - {port: 443, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - {port: 8443, protocol: TCP}
    # Omnifin's gateway is the sole credential-bearing media control plane.
    # These raw APIs are intentionally unreachable from its public web pod.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: seerr
      ports:
        - {port: 5055, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
          podSelector:
            matchLabels:
              app.kubernetes.io/name: jellyfin
        # Jellyfin uses hostNetwork for DLNA/discovery. After Service DNAT its
        # endpoint is a node address rather than a pod-CIDR address, so retain
        # the selector above for ordinary pods and permit only the two cluster
        # nodes on Jellyfin's API port for the host-network deployment.
        - ipBlock:
            cidr: 192.168.1.2/32
        - ipBlock:
            cidr: 192.168.1.3/32
      ports:
        - {port: 8096, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
          podSelector:
            matchLabels:
              app.kubernetes.io/name: media-vpn
      ports:
        - {port: 7878, protocol: TCP}
        - {port: 8080, protocol: TCP}
        - {port: 8989, protocol: TCP}
        - {port: 9696, protocol: TCP}
