apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: media-vpn
  namespace: media
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: media-vpn
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - {port: 17878, protocol: TCP}
        - {port: 18080, protocol: TCP}
        - {port: 18084, protocol: TCP}
        - {port: 18989, protocol: TCP}
        - {port: 19696, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
      ports:
        - {port: 7878, protocol: TCP}
        - {port: 8080, protocol: TCP}
        - {port: 8084, protocol: TCP}
        - {port: 8191, protocol: TCP}
        - {port: 8989, protocol: TCP}
        - {port: 9696, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - ipBlock: {cidr: 10.42.0.0/16}
        - ipBlock: {cidr: 10.43.0.0/16}
        - ipBlock: {cidr: 192.168.1.0/24}
      ports:
        - {port: 80, protocol: TCP}
        - {port: 443, protocol: TCP}
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {port: 443, protocol: TCP}
        - {protocol: UDP}
