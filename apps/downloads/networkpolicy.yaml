apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: media-vpn
  namespace: media
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: media-vpn
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - {port: 5030, protocol: TCP}
        - {port: 17878, protocol: TCP}
        - {port: 18080, protocol: TCP}
        - {port: 18084, protocol: TCP}
        - {port: 8265, protocol: TCP}
        - {port: 18686, protocol: TCP}
        - {port: 18989, protocol: TCP}
        - {port: 19696, protocol: TCP}
    - from:
        # Seerr calls the raw Radarr and Sonarr APIs. Other browser-facing
        # UIs must continue through their access proxy and Traefik boundary.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
          podSelector:
            matchLabels:
              app.kubernetes.io/name: seerr
      ports:
        - {port: 7878, protocol: TCP}
        - {port: 8989, protocol: TCP}
    - from:
        # Maintainerr drives collection cleanup through the raw Radarr and
        # Sonarr APIs. Its UI stays behind its own access proxy and the
        # Authentik-protected Traefik route.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
          podSelector:
            matchLabels:
              app.kubernetes.io/name: maintainerr
      ports:
        - {port: 7878, protocol: TCP}
        - {port: 8989, protocol: TCP}
    - from:
        # MCPHub launches the reviewed Arr MCP server. It receives only raw API
        # access; client-visible tools remain constrained by MCPHub groups.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mcphub
              app.kubernetes.io/component: application
      ports:
        - {port: 7878, protocol: TCP}
        - {port: 8686, protocol: TCP}
        - {port: 8989, protocol: TCP}
        - {port: 9696, protocol: TCP}
    - from:
        # Cleanuparr inspects qBittorrent payload metadata and tells the Arr
        # applications to reject malicious releases. Its UI is not exposed.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cleanuparr
              app.kubernetes.io/component: download-safety
      ports:
        - {port: 7878, protocol: TCP}
        - {port: 8080, protocol: TCP}
        - {port: 8686, protocol: TCP}
        - {port: 8989, protocol: TCP}
    - from:
        # Omnifin keeps connector credentials in its private gateway and uses
        # these raw APIs to provide one authenticated media control surface.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
          podSelector:
            matchLabels:
              app.kubernetes.io/name: omnifin
              app.kubernetes.io/component: gateway
      ports:
        - {port: 7878, protocol: TCP}
        - {port: 8080, protocol: TCP}
        - {port: 8989, protocol: TCP}
        - {port: 9696, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - {port: 5030, protocol: TCP}
  egress:
    # Gluetun owns this Pod's routes, firewall and VPN kill switch. Kubernetes
    # egress filtering here interferes with its tunnel and encrypted DNS.
    - {}
