apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: media-vpn
  namespace: media
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: media-vpn
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - {port: 17878, protocol: TCP}
        - {port: 18080, protocol: TCP}
        - {port: 18084, protocol: TCP}
        - {port: 18989, protocol: TCP}
        - {port: 19696, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
      ports:
        - {port: 7878, protocol: TCP}
        - {port: 8080, protocol: TCP}
        - {port: 8084, protocol: TCP}
        - {port: 8191, protocol: TCP}
        - {port: 8989, protocol: TCP}
        - {port: 9696, protocol: TCP}
  egress:
    # Gluetun owns this Pod's routes, firewall and VPN kill switch. Kubernetes
    # egress filtering here interferes with its tunnel and encrypted DNS.
    - {}
