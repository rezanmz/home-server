apiVersion: apps/v1
kind: Deployment
metadata:
  name: downloads
  namespace: media
  labels:
    app.kubernetes.io/name: media-vpn
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: media-vpn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-vpn
        home-server.reza.network/internal-client: "true"
    spec:
      automountServiceAccountToken: false
      # Keep acquisition work away from the single control-plane node when a
      # worker has capacity, without making any physical node mandatory. The
      # Pi-hosted NFS claim remains reachable from either node.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      # Keep service-name URLs in the migrated application databases working.
      # These names all resolved to Gluetun's shared namespace in Docker.
      hostAliases:
        - ip: 127.0.0.1
          hostnames:
            - gluetun
            - qbittorrent
            - flaresolverr
            - prowlarr
            - radarr
            - sonarr
            - lidarr
            - slskd
            - soularr
            - shelfmark
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-soulseek-state
          image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command:
            - sh
            - -ec
            - |
              chown 1000:1000 /slskd-state /soularr-data
              chmod 0770 /slskd-state /soularr-data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          volumeMounts:
            - {name: slskd-state, mountPath: /slskd-state}
            - {name: soularr-data, mountPath: /soularr-data}
        - name: prepare-soulseek-downloads
          image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command: [sh, -ec, "mkdir -p /downloads/slskd/complete /downloads/slskd/incomplete"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          volumeMounts:
            - {name: media-downloads, mountPath: /downloads}
        - name: validate-download-storage
          image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command:
            - sh
            - -ec
            - |
              filesystem_type="$(stat -f -c %T /downloads)"
              if [ "$filesystem_type" != nfs ]; then
                echo "Refusing to start: /downloads is $filesystem_type, expected nfs" >&2
                exit 1
              fi
              probe="/downloads/.storage-contract-${HOSTNAME}"
              trap 'rm -f "$probe"' EXIT
              : > "$probe"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          volumeMounts:
            - {name: media-downloads, mountPath: /downloads}
        # Native sidecar: every application container below shares this network
        # namespace, preserving the old Docker `network_mode: container:gluetun`
        # topology and a single Proton WireGuard session.
        - name: gluetun
          image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          env:
            - {name: VPN_SERVICE_PROVIDER, value: protonvpn}
            - {name: VPN_TYPE, value: wireguard}
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: media-vpn
                  key: wireguard-private-key
            - {name: PORT_FORWARD_ONLY, value: "on"}
            - {name: VPN_PORT_FORWARDING, value: "on"}
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: >-
                /bin/sh -c 'wget -qO- --retry-connrefused --post-data
                "json={\"listen_port\":{{PORT}},\"random_port\":false,\"upnp\":false}"
                http://127.0.0.1:8080/api/v2/app/setPreferences'
            - name: VPN_PORT_FORWARDING_DOWN_COMMAND
              value: >-
                /bin/sh -c 'wget -qO- --retry-connrefused --post-data
                "json={\"listen_port\":0}"
                http://127.0.0.1:8080/api/v2/app/setPreferences'
            - {name: TZ, value: America/Toronto}
            - {name: DNS_UPSTREAM_RESOLVER_TYPE, value: doh}
            - {name: DNS_UPSTREAM_RESOLVERS, value: "cloudflare,google"}
            - name: FIREWALL_INPUT_PORTS
              value: |
                5030,7878,8080,8084,8191,8265,8686,8989,9696,17878,18080,18084,18686,18989,19696
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.42.0.0/16,10.43.0.0/16,192.168.1.0/24"
          startupProbe:
            exec:
              command: [wget, -qO-, http://127.0.0.1:8000/v1/vpn/status]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            exec:
              command: [wget, -qO-, http://127.0.0.1:8000/v1/vpn/status]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, NET_ADMIN, NET_BIND_SERVICE, NET_RAW, SETGID, SETUID]
          volumeMounts:
            - {name: dev-net-tun, mountPath: /dev/net/tun}
            - {name: gluetun-config, mountPath: /gluetun}
      containers:
        - name: qbittorrent
          image: linuxserver/qbittorrent:5.2.3_v2.0.14-ls476@sha256:2be038f3421f60f62e8e4bf201f66f385b68e4fbc9ed3ab79051069ea22e2650
          imagePullPolicy: IfNotPresent
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ, value: America/Toronto}
            - {name: WEBUI_PORT, value: "8080"}
          ports:
            - {name: qbittorrent, containerPort: 8080, protocol: TCP}
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - 'test "$(stat -f -c %T /media/downloads)" = nfs && curl -fsS http://127.0.0.1:8080/'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - 'test "$(stat -f -c %T /media/downloads)" = nfs && curl -fsS http://127.0.0.1:8080/'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - 'test "$(stat -f -c %T /media/downloads)" = nfs && curl -fsS http://127.0.0.1:8080/'
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Hundreds of unrestricted torrents can push libtorrent above the
            # old 512 MiB cgroup ceiling even while the node has ample memory.
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: 500m, memory: 3Gi}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: qbittorrent-config, mountPath: /config}
            # Do not mount JuiceFS in this container. A propagated FUSE remount
            # can cover a nested NFS mount and make torrents write to B2 or fail.
            - {name: media-downloads, mountPath: /media/downloads}
        - name: downloads-storage-guard
          image: linuxserver/qbittorrent:5.2.3_v2.0.14-ls476@sha256:2be038f3421f60f62e8e4bf201f66f385b68e4fbc9ed3ab79051069ea22e2650
          imagePullPolicy: IfNotPresent
          command: [sh, /opt/storage-guard/storage-guard.sh]
          env:
            - {name: CHECK_INTERVAL_SECONDS, value: "60"}
            - {name: MIN_FREE_BYTES, value: "214748364800"}
            - {name: MIN_FREE_PERCENT, value: "20"}
            - {name: RESUME_FREE_BYTES, value: "322122547200"}
            - {name: RESUME_FREE_PERCENT, value: "30"}
          readinessProbe:
            exec:
              command: [sh, -ec, "find /tmp/guard-heartbeat -mmin -3 -print -quit | grep -q ."]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [sh, -ec, "find /tmp/guard-heartbeat -mmin -3 -print -quit | grep -q ."]
            initialDelaySeconds: 90
            periodSeconds: 60
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            # Do not set a container-local ephemeral-storage limit here. Kubelet
            # treats it as the aggregate pod ceiling when the legacy sibling
            # containers have no matching limits, which can evict all 17
            # containers for a few dozen MiB of ordinary logs.
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: storage-guard, mountPath: /opt/storage-guard, readOnly: true}
            - {name: storage-guard-state, mountPath: /tmp}
            - {name: import-cleaner-state, mountPath: /import-cleaner-state, readOnly: true}
            - {name: media-downloads, mountPath: /media/downloads}
        - name: downloads-mediacover-pruner
          image: linuxserver/qbittorrent:5.2.3_v2.0.14-ls476@sha256:2be038f3421f60f62e8e4bf201f66f385b68e4fbc9ed3ab79051069ea22e2650
          imagePullPolicy: IfNotPresent
          command: [sh, /opt/mediacover-pruner/mediacover-pruner.sh]
          env:
            - {name: PRUNE_INTERVAL_SECONDS, value: "86400"}
            - {name: MEDIACOVER_AGE_DAYS, value: "30"}
          readinessProbe:
            exec:
              command: [sh, -ec, "find /tmp/pruner-heartbeat -mmin -3 -print -quit | grep -q ."]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: mediacover-pruner, mountPath: /opt/mediacover-pruner, readOnly: true}
            - {name: pruner-state, mountPath: /tmp}
            - {name: lidarr-config, mountPath: /config}
        - name: downloads-import-cleaner
          image: linuxserver/qbittorrent:5.2.3_v2.0.14-ls476@sha256:2be038f3421f60f62e8e4bf201f66f385b68e4fbc9ed3ab79051069ea22e2650
          imagePullPolicy: IfNotPresent
          command: [sh, /opt/import-cleaner/import-cleaner.sh]
          env:
            - {name: CHECK_INTERVAL_SECONDS, value: "60"}
            - {name: CONFIRMATIONS_REQUIRED, value: "2"}
            - {name: DELETE_ENABLED, value: "true"}
          readinessProbe:
            exec: {command: [sh, -ec, "find /state/import-cleaner-heartbeat -mmin -3 -print -quit | grep -q ."]}
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec: {command: [sh, -ec, "find /state/import-cleaner-heartbeat -mmin -3 -print -quit | grep -q ."]}
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: import-cleaner, mountPath: /opt/import-cleaner, readOnly: true}
            - {name: import-cleaner-state, mountPath: /state}
            - {name: sonarr-config, mountPath: /arr-config/sonarr, readOnly: true}
            - {name: radarr-config, mountPath: /arr-config/radarr, readOnly: true}
            - {name: lidarr-config, mountPath: /arr-config/lidarr, readOnly: true}
            - {name: media-downloads, mountPath: /media/downloads, readOnly: true}
            - name: media-library
              mountPath: /media/tv
              subPath: tv
              readOnly: true
              mountPropagation: HostToContainer
            - name: media-library
              mountPath: /media/movies
              subPath: movies
              readOnly: true
              mountPropagation: HostToContainer
            - name: media-library
              mountPath: /media/music
              subPath: music
              readOnly: true
              mountPropagation: HostToContainer
        - name: flaresolverr
          image: flaresolverr/flaresolverr:v3.5.0@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
          imagePullPolicy: IfNotPresent
          env:
            - {name: LOG_LEVEL, value: info}
            - {name: TZ, value: America/Toronto}
          ports:
            - {name: flaresolverr, containerPort: 8191, protocol: TCP}
          readinessProbe:
            exec:
              command: [curl, -fsS, http://127.0.0.1:8191/health]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: [curl, -fsS, http://127.0.0.1:8191/health]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
        - name: prowlarr
          image: linuxserver/prowlarr:2.5.2.5491-ls159@sha256:c7502a75b021d964481c129c84590b9cbc40f83aadd4e553f173871bc0deaa3c
          imagePullPolicy: IfNotPresent
          env: &linuxserver-env
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ, value: America/Toronto}
          ports:
            - {name: prowlarr, containerPort: 9696, protocol: TCP}
          startupProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:9696/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:9696/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:9696/ping]}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # A multi-indexer search is this container's heaviest work. Under the
            # previous 256 MiB / 250m ceiling its working set plateaued at
            # 212-254 MiB, so it sat against the memory limit and was OOMKilled
            # six times; the same searches drove its 2m CPU rate to 0.226 cores
            # against the 250m cap, with 40% of CFS periods throttled. Both
            # surfaced upstream as 60 s MCP tool timeouts and `fetch failed`.
            # The request follows the 14-day p95 (85m) so the reservation covers
            # the load it is sized to carry; the limit stays above the measured
            # peak. Sibling Arr containers carry 512-768 MiB; this one queries
            # every indexer they use, so it needs the larger headroom, not a leak
            # fix, and the higher ceiling is what keeps search bursts off the cap.
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false}
          volumeMounts:
            - {name: prowlarr-config, mountPath: /config}
        - name: radarr
          image: linuxserver/radarr:6.3.0.10514-ls316@sha256:fe051413dfd91b383ba04910552e83fb0306895fefee275c48dafe7bb90807dc
          imagePullPolicy: IfNotPresent
          env: *linuxserver-env
          ports:
            - {name: radarr, containerPort: 7878, protocol: TCP}
          startupProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:7878/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:7878/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:7878/ping]}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false}
          volumeMounts:
            - {name: radarr-config, mountPath: /config}
            - name: media-library
              mountPath: /media/movies
              subPath: movies
              mountPropagation: HostToContainer
            - {name: media-downloads, mountPath: /media/downloads}
        - name: sonarr
          image: linuxserver/sonarr:4.0.19.2979-ls324@sha256:82172b363f9eddc02aca544f880a044f2ceb9aaf190bc87e4454e2f705eb91d0
          imagePullPolicy: IfNotPresent
          env: *linuxserver-env
          ports:
            - {name: sonarr, containerPort: 8989, protocol: TCP}
          startupProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8989/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8989/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8989/ping]}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false}
          volumeMounts:
            - {name: sonarr-config, mountPath: /config}
            - name: media-library
              mountPath: /media/tv
              subPath: tv
              mountPropagation: HostToContainer
            - {name: media-downloads, mountPath: /media/downloads}
        - name: lidarr
          # linuxserver's stable channel (3.1.0.4875) is OLDER than the develop
          # build that first migrated lidarr.db on 2026-07-22. Migration 043
          # ("flexible_delay_profiles") replaced the EnableUsenet/EnableTorrent/
          # PreferredProtocol/UsenetDelay/TorrentDelay columns with a Name+Items
          # pair, and the stable binary still queries the dropped columns: every
          # delay-profile read returns both protocols disabled, so every release
          # is rejected with "Torrent|Usenet is not enabled for this artist".
          # Lidarr grabbed 94 releases up to 2026-08-11 and zero after the
          # stable image took over on 2026-08-12, while its DB continues to
          # record allowed=true for both protocols. The database is
          # authoritative and already forward-migrated, so the binary must move
          # forward to match; this is the exact pre-downgrade reference. Do not
          # "upgrade" this pin back to the 3.1.0.4875 stable tag: for this
          # volume that is a downgrade, and renovate.json disables automated
          # updates here so it cannot happen silently again.
          image: linuxserver/lidarr:develop-3.1.3.4975-ls257@sha256:8a0536cfb61a7b6759f689e3fa553e90b8ee5ecc761b19885578a33282692d91
          imagePullPolicy: IfNotPresent
          env: *linuxserver-env
          ports:
            - {name: lidarr, containerPort: 8686, protocol: TCP}
          startupProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8686/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          readinessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8686/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8686/ping]}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 750m, memory: 768Mi}
          securityContext: {allowPrivilegeEscalation: false}
          volumeMounts:
            - {name: lidarr-config, mountPath: /config}
            - name: media-library
              mountPath: /media/music
              subPath: music
              mountPropagation: HostToContainer
            - {name: media-downloads, mountPath: /media/downloads}
        - name: slskd
          image: slskd/slskd:0.26.0@sha256:ecd4026d4f8fb504e2cc55323efa2c1f5b56d20d3686b018249cc36b48ea17a6
          imagePullPolicy: IfNotPresent
          env:
            - {name: TZ, value: America/Toronto}
            - {name: SLSKD_REMOTE_CONFIGURATION, value: "true"}
            - {name: SLSKD_METRICS, value: "true"}
            - {name: SLSKD_METRICS_NO_AUTH, value: "true"}
            - {name: SLSKD_UMASK, value: "002"}
          ports:
            - {name: slskd, containerPort: 5030, protocol: TCP}
          startupProbe:
            httpGet: {path: /health, port: slskd}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /health, port: slskd}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /health, port: slskd}
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: 750m, memory: 2Gi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: slskd-state, mountPath: /app}
            - {name: media-downloads, mountPath: /downloads}
        - name: soularr
          image: mrusse08/soularr:v1.2.2@sha256:c4f97924fabfce4e0de539d821ea7d20519b95c4815a707bacfc9d7212597f20
          imagePullPolicy: IfNotPresent
          env:
            - {name: TZ, value: America/Toronto}
            - {name: SCRIPT_INTERVAL, value: "300"}
            - {name: WEBUI_ENABLED, value: "true"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          ports:
            - {name: soularr, containerPort: 8265, protocol: TCP}
          startupProbe:
            httpGet: {path: /, port: soularr}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /, port: soularr}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /, port: soularr}
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
