apiVersion: apps/v1
kind: Deployment
metadata:
  name: downloads
  namespace: media
  labels:
    app.kubernetes.io/name: media-vpn
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: media-vpn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-vpn
        home-server.reza.network/internal-client: "true"
    spec:
      automountServiceAccountToken: false
      # Pinned to the Pi, because the Pi's NFS export makes the "floating" claim
      # false. `media-downloads` is a plain NFS PV served by 192.168.1.2 (the Pi
      # itself, see infrastructure/nfs-media/media.yaml) and every one of the 12
      # containers below mounts it. Losing the Pi therefore breaks this stack on
      # EITHER node, so the former soft "prefer not control-plane" preference
      # bought no failover while it let the pod drift back onto Beelink after
      # every reboot. docs/architecture.md already states the position plainly:
      # "The Pi remains a single point of failure for active downloads and
      # seeding only."
      #
      # Measured cost of that drift (14-day natural experiment, 2026-11-04..18):
      # this stack is 2,976 MiB of memory requests and Beelink has 14,372 MiB
      # allocatable, so landing there pushed node requests to 90-96% of
      # allocatable against a 75% alert floor and fired
      # HomeServerNodeMemoryRequestBudgetHigh in 11 of 11 windows in which the
      # pod sat on Beelink (174 h total, including one unbroken 23 h hold). In
      # the 4 windows totalling 153 h that it sat on the Pi the alert did not
      # fire for a single sample. Pinned, Beelink rests at 72.8% and the Pi at
      # 51.1% with 7.69 GiB of request headroom.
      #
      # PR #382 previously pinned this to Beelink and was reverted because the
      # Pi then had 3950m of 4000m of CPU requested and this stack's 885m starved
      # authentik. The CPU requests below were since right-sized 885m -> 525m, so
      # the Pi lands at 75.6% CPU requests with authentik's own request intact;
      # how the Pi behaves under that load is the one thing this pin must be
      # watched for.
      nodeSelector:
        kubernetes.io/hostname: raspberrypi
      # Keep service-name URLs in the migrated application databases working.
      # These names all resolved to Gluetun's shared namespace in Docker.
      hostAliases:
        - ip: 127.0.0.1
          hostnames:
            - gluetun
            - qbittorrent
            - flaresolverr
            - prowlarr
            - radarr
            - sonarr
            - lidarr
            - slskd
            - soularr
            - shelfmark
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-soulseek-state
          image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command:
            - sh
            - -ec
            - |
              chown 1000:1000 /slskd-state /soularr-data
              chmod 0770 /slskd-state /soularr-data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          volumeMounts:
            - {name: slskd-state, mountPath: /slskd-state}
            - {name: soularr-data, mountPath: /soularr-data}
        - name: prepare-soulseek-downloads
          image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: [sh, -ec, "mkdir -p /downloads/slskd/complete /downloads/slskd/incomplete"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          volumeMounts:
            - {name: media-downloads, mountPath: /downloads}
        - name: validate-download-storage
          image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command:
            - sh
            - -ec
            - |
              filesystem_type="$(stat -f -c %T /downloads)"
              if [ "$filesystem_type" != nfs ]; then
                echo "Refusing to start: /downloads is $filesystem_type, expected nfs" >&2
                exit 1
              fi
              probe="/downloads/.storage-contract-${HOSTNAME}"
              trap 'rm -f "$probe"' EXIT
              : > "$probe"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          volumeMounts:
            - {name: media-downloads, mountPath: /downloads}
        # Native sidecar: every application container below shares this network
        # namespace, preserving the old Docker `network_mode: container:gluetun`
        # topology and a single Proton WireGuard session.
        - name: gluetun
          image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          env:
            - {name: VPN_SERVICE_PROVIDER, value: protonvpn}
            - {name: VPN_TYPE, value: wireguard}
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: media-vpn
                  key: wireguard-private-key
            - {name: PORT_FORWARD_ONLY, value: "on"}
            - {name: VPN_PORT_FORWARDING, value: "on"}
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: >-
                /bin/sh -c 'wget -qO- --retry-connrefused --post-data
                "json={\"listen_port\":{{PORT}},\"random_port\":false,\"upnp\":false}"
                http://127.0.0.1:8080/api/v2/app/setPreferences'
            - name: VPN_PORT_FORWARDING_DOWN_COMMAND
              value: >-
                /bin/sh -c 'wget -qO- --retry-connrefused --post-data
                "json={\"listen_port\":0}"
                http://127.0.0.1:8080/api/v2/app/setPreferences'
            - {name: TZ, value: America/Toronto}
            - {name: DNS_UPSTREAM_RESOLVER_TYPE, value: doh}
            - {name: DNS_UPSTREAM_RESOLVERS, value: "cloudflare,google"}
            - name: FIREWALL_INPUT_PORTS
              value: |
                5030,7878,8080,8084,8191,8265,8686,8989,9696,17878,18080,18084,18686,18989,19696
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.42.0.0/16,10.43.0.0/16,192.168.1.0/24"
          startupProbe:
            exec:
              command: [wget, -qO-, http://127.0.0.1:8000/v1/vpn/status]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            exec:
              command: [wget, -qO-, http://127.0.0.1:8000/v1/vpn/status]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, NET_ADMIN, NET_BIND_SERVICE, NET_RAW, SETGID, SETUID]
          volumeMounts:
            - {name: dev-net-tun, mountPath: /dev/net/tun}
            - {name: gluetun-config, mountPath: /gluetun}
      containers:
        - name: qbittorrent
          image: linuxserver/qbittorrent:5.3.0_v2.0.15-ls482@sha256:745260e962c5f2ce6976550214f70a1c5f319bb4cecb07957365f2653b0506ab
          imagePullPolicy: IfNotPresent
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ, value: America/Toronto}
            - {name: WEBUI_PORT, value: "8080"}
          ports:
            - {name: qbittorrent, containerPort: 8080, protocol: TCP}
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - 'test "$(stat -f -c %T /media/downloads)" = nfs && curl -fsS http://127.0.0.1:8080/'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - 'test "$(stat -f -c %T /media/downloads)" = nfs && curl -fsS http://127.0.0.1:8080/'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - 'test "$(stat -f -c %T /media/downloads)" = nfs && curl -fsS http://127.0.0.1:8080/'
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Hundreds of unrestricted torrents can push libtorrent above the
            # old 512 MiB cgroup ceiling even while the node has ample memory.
            requests: {cpu: 40m, memory: 512Mi}
            limits: {cpu: 500m, memory: 3Gi}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: qbittorrent-config, mountPath: /config}
            # Do not mount JuiceFS in this container. A propagated FUSE remount
            # can cover a nested NFS mount and make torrents write to B2 or fail.
            - {name: media-downloads, mountPath: /media/downloads}
        - name: downloads-storage-guard
          image: linuxserver/qbittorrent:5.3.0_v2.0.15-ls482@sha256:745260e962c5f2ce6976550214f70a1c5f319bb4cecb07957365f2653b0506ab
          imagePullPolicy: IfNotPresent
          command: [sh, /opt/storage-guard/storage-guard.sh]
          env:
            - {name: CHECK_INTERVAL_SECONDS, value: "60"}
            - {name: MIN_FREE_BYTES, value: "214748364800"}
            - {name: MIN_FREE_PERCENT, value: "20"}
            - {name: RESUME_FREE_BYTES, value: "322122547200"}
            - {name: RESUME_FREE_PERCENT, value: "30"}
          readinessProbe:
            exec:
              command: [sh, -ec, "find /tmp/guard-heartbeat -mmin -3 -print -quit | grep -q ."]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [sh, -ec, "find /tmp/guard-heartbeat -mmin -3 -print -quit | grep -q ."]
            initialDelaySeconds: 90
            periodSeconds: 60
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            # Do not set a container-local ephemeral-storage limit here. Kubelet
            # treats it as the aggregate pod ceiling when the legacy sibling
            # containers have no matching limits, which can evict all 17
            # containers for a few dozen MiB of ordinary logs.
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: storage-guard, mountPath: /opt/storage-guard, readOnly: true}
            - {name: storage-guard-state, mountPath: /tmp}
            - {name: import-cleaner-state, mountPath: /import-cleaner-state, readOnly: true}
            - {name: media-downloads, mountPath: /media/downloads}
        - name: downloads-mediacover-pruner
          image: linuxserver/qbittorrent:5.3.0_v2.0.15-ls482@sha256:745260e962c5f2ce6976550214f70a1c5f319bb4cecb07957365f2653b0506ab
          imagePullPolicy: IfNotPresent
          command: [sh, /opt/mediacover-pruner/mediacover-pruner.sh]
          env:
            - {name: PRUNE_INTERVAL_SECONDS, value: "86400"}
            - {name: MEDIACOVER_AGE_DAYS, value: "30"}
          readinessProbe:
            exec:
              command: [sh, -ec, "find /tmp/pruner-heartbeat -mmin -3 -print -quit | grep -q ."]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: mediacover-pruner, mountPath: /opt/mediacover-pruner, readOnly: true}
            - {name: pruner-state, mountPath: /tmp}
            - {name: lidarr-config, mountPath: /config}
        - name: downloads-import-cleaner
          image: linuxserver/qbittorrent:5.3.0_v2.0.15-ls482@sha256:745260e962c5f2ce6976550214f70a1c5f319bb4cecb07957365f2653b0506ab
          imagePullPolicy: IfNotPresent
          command: [sh, /opt/import-cleaner/import-cleaner.sh]
          env:
            - {name: CHECK_INTERVAL_SECONDS, value: "60"}
            - {name: CONFIRMATIONS_REQUIRED, value: "2"}
            - {name: DELETE_ENABLED, value: "true"}
          readinessProbe:
            exec: {command: [sh, -ec, "find /state/import-cleaner-heartbeat -mmin -3 -print -quit | grep -q ."]}
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec: {command: [sh, -ec, "find /state/import-cleaner-heartbeat -mmin -3 -print -quit | grep -q ."]}
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests: {cpu: 5m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: import-cleaner, mountPath: /opt/import-cleaner, readOnly: true}
            - {name: import-cleaner-state, mountPath: /state}
            - {name: sonarr-config, mountPath: /arr-config/sonarr, readOnly: true}
            - {name: radarr-config, mountPath: /arr-config/radarr, readOnly: true}
            - {name: lidarr-config, mountPath: /arr-config/lidarr, readOnly: true}
            - {name: media-downloads, mountPath: /media/downloads, readOnly: true}
            - name: media-library
              mountPath: /media/tv
              subPath: tv
              readOnly: true
              mountPropagation: HostToContainer
            - name: media-library
              mountPath: /media/movies
              subPath: movies
              readOnly: true
              mountPropagation: HostToContainer
            - name: media-library
              mountPath: /media/music
              subPath: music
              readOnly: true
              mountPropagation: HostToContainer
        - name: flaresolverr
          image: flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
          imagePullPolicy: IfNotPresent
          env:
            - {name: LOG_LEVEL, value: info}
            - {name: TZ, value: America/Toronto}
          ports:
            - {name: flaresolverr, containerPort: 8191, protocol: TCP}
          readinessProbe:
            exec:
              command: [curl, -fsS, http://127.0.0.1:8191/health]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: [curl, -fsS, http://127.0.0.1:8191/health]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Chromium sits exactly at the old 512 MiB ceiling while solving a
            # Cloudflare challenge (cgroup memory.peak 536887296 B == memory.max
            # during a 45 s bt.etree challenge) and the 500m cap throttled 263
            # of ~450 CFS periods in that same window, so /health stopped
            # answering within the 5 s probe timeout and kubelet restarted the
            # container on the liveness probe (2026-10-08 21:01). A challenge
            # session then failed with "Error solving the challenge", leaving
            # Prowlarr's Cloudflare-backed indexers (BT.etree, EZTV) unable to
            # fetch. 1Gi/1000m keeps that session off both caps; steady usage
            # was 161Mi/2m and the Pi allocates 4 CPU / 16Gi.
            # 2026-10-11 23:40–00:40 ET: OOMKilled twice at the 1Gi ceiling
            # during a hard Cloudflare challenge; raised to 2Gi (sweep fix,
            # 2026-10-12).
            requests: {cpu: 40m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
        - name: prowlarr
          image: linuxserver/prowlarr:2.7.0.5723-ls168@sha256:6660787a99b2e58203539583663c973b48979fc00ff2cb78dc0ea17429e1f6ef
          imagePullPolicy: IfNotPresent
          env: &linuxserver-env
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ, value: America/Toronto}
          ports:
            - {name: prowlarr, containerPort: 9696, protocol: TCP}
          startupProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:9696/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:9696/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:9696/ping]}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # A multi-indexer search is this container's heaviest work. Under the
            # previous 256 MiB / 250m ceiling its working set plateaued at
            # 212-254 MiB, so it sat against the memory limit and was OOMKilled
            # six times; the same searches drove its 2m CPU rate to 0.226 cores
            # against the 250m cap, with 40% of CFS periods throttled. Both
            # surfaced upstream as 60 s MCP tool timeouts and `fetch failed`.
            # The request follows the 14-day p95 (85m) so the reservation covers
            # the load it is sized to carry; the limit stays above the measured
            # peak. Sibling Arr containers carry 512-768 MiB; this one queries
            # every indexer they use, so it needs the larger headroom, not a leak
            # fix, and the higher ceiling is what keeps search bursts off the cap.
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false}
          volumeMounts:
            - {name: prowlarr-config, mountPath: /config}
        - name: radarr
          image: linuxserver/radarr:6.4.4.10685-ls327@sha256:7a20f20de63706eee2ff6e4ac1f989a70c961f456aa47ccb6c78f2bb7657d9ae
          imagePullPolicy: IfNotPresent
          env: *linuxserver-env
          ports:
            - {name: radarr, containerPort: 7878, protocol: TCP}
          startupProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:7878/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:7878/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:7878/ping]}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 25m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false}
          volumeMounts:
            - {name: radarr-config, mountPath: /config}
            - name: media-library
              mountPath: /media/movies
              subPath: movies
              mountPropagation: HostToContainer
            - {name: media-downloads, mountPath: /media/downloads}
        - name: sonarr
          image: linuxserver/sonarr:4.0.20.3014-ls6@sha256:339814bbf50599ac3b59077c252f29833d0138b59a062d0e82ce37bdc7f04f86
          imagePullPolicy: IfNotPresent
          env: *linuxserver-env
          ports:
            - {name: sonarr, containerPort: 8989, protocol: TCP}
          startupProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8989/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8989/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8989/ping]}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 25m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false}
          volumeMounts:
            - {name: sonarr-config, mountPath: /config}
            - name: media-library
              mountPath: /media/tv
              subPath: tv
              mountPropagation: HostToContainer
            - {name: media-downloads, mountPath: /media/downloads}
        - name: lidarr
          # linuxserver's stable channel (3.1.0.4875) is OLDER than the develop
          # build that first migrated lidarr.db on 2026-07-22. Migration 043
          # ("flexible_delay_profiles") replaced the EnableUsenet/EnableTorrent/
          # PreferredProtocol/UsenetDelay/TorrentDelay columns with a Name+Items
          # pair, and the stable binary still queries the dropped columns: every
          # delay-profile read returns both protocols disabled, so every release
          # is rejected with "Torrent|Usenet is not enabled for this artist".
          # Lidarr grabbed 94 releases up to 2026-08-11 and zero after the
          # stable image took over on 2026-08-12, while its DB continues to
          # record allowed=true for both protocols. The database is
          # authoritative and already forward-migrated, so the binary must move
          # forward to match; this is the exact pre-downgrade reference. Do not
          # "upgrade" this pin back to the 3.1.0.4875 stable tag: for this
          # volume that is a downgrade, and renovate.json disables automated
          # updates here so it cannot happen silently again.
          image: linuxserver/lidarr:develop-3.1.3.4975-ls257@sha256:8a0536cfb61a7b6759f689e3fa553e90b8ee5ecc761b19885578a33282692d91
          imagePullPolicy: IfNotPresent
          env: *linuxserver-env
          ports:
            - {name: lidarr, containerPort: 8686, protocol: TCP}
          startupProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8686/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          readinessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8686/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8686/ping]}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # 2026-10-08: 768Mi OOM-killed lidarr during a music-sweeper run
            # that combined bulk artist adds (metadata refresh) with large
            # API reads; spikes exceeded the old limit and restarted the
            # container mid-search. 2Gi matches slskd's headroom so refresh
            # bursts and API queries cannot kill it.
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: 750m, memory: 2Gi}
          securityContext: {allowPrivilegeEscalation: false}
          volumeMounts:
            - {name: lidarr-config, mountPath: /config}
            - name: media-library
              mountPath: /media/music
              subPath: music
              mountPropagation: HostToContainer
            - {name: media-downloads, mountPath: /media/downloads}
        - name: slskd
          image: slskd/slskd:0.26.2@sha256:d0963a3e5b16facd295bf4f2156dad0182f246b1b21a032cae12f5494c694843
          imagePullPolicy: IfNotPresent
          env:
            - {name: TZ, value: America/Toronto}
            - {name: SLSKD_REMOTE_CONFIGURATION, value: "true"}
            - {name: SLSKD_METRICS, value: "true"}
            - {name: SLSKD_METRICS_NO_AUTH, value: "true"}
