apiVersion: apps/v1
kind: Deployment
metadata:
  name: downloads
  namespace: media
  labels:
    app.kubernetes.io/name: media-vpn
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: media-vpn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-vpn
        home-server.reza.network/internal-client: "true"
    spec:
      automountServiceAccountToken: false
      # Keep acquisition work away from the single control-plane node when a
      # worker has capacity, without making any physical node mandatory. The
      # Pi-hosted NFS claim remains reachable from either node.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      # Keep service-name URLs in the migrated application databases working.
      # These names all resolved to Gluetun's shared namespace in Docker.
      hostAliases:
        - ip: 127.0.0.1
          hostnames:
            - gluetun
            - qbittorrent
            - flaresolverr
            - prowlarr
            - radarr
            - sonarr
            - lidarr
            - slskd
            - soularr
            - shelfmark
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-soulseek-state
          image: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command:
            - sh
            - -ec
            - |
              chown 1000:1000 /slskd-state /soularr-data
              chmod 0770 /slskd-state /soularr-data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          volumeMounts:
            - {name: slskd-state, mountPath: /slskd-state}
            - {name: soularr-data, mountPath: /soularr-data}
        - name: prepare-soulseek-downloads
          image: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command: [sh, -ec, "mkdir -p /downloads/slskd/complete /downloads/slskd/incomplete"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          volumeMounts:
            - {name: media-downloads, mountPath: /downloads}
        - name: validate-download-storage
          image: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command:
            - sh
            - -ec
            - |
              filesystem_type="$(stat -f -c %T /downloads)"
              if [ "$filesystem_type" != nfs ]; then
                echo "Refusing to start: /downloads is $filesystem_type, expected nfs" >&2
                exit 1
              fi
              probe="/downloads/.storage-contract-${HOSTNAME}"
              trap 'rm -f "$probe"' EXIT
              : > "$probe"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          volumeMounts:
            - {name: media-downloads, mountPath: /downloads}
        # Native sidecar: every application container below shares this network
        # namespace, preserving the old Docker `network_mode: container:gluetun`
        # topology and a single Proton WireGuard session.
        - name: gluetun
          image: qmcgaw/gluetun:v3.41.1@sha256:1a5bf4b4820a879cdf8d93d7ef0d2d963af56670c9ebff8981860b6804ebc8ab
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          env:
            - {name: VPN_SERVICE_PROVIDER, value: protonvpn}
            - {name: VPN_TYPE, value: wireguard}
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: media-vpn
                  key: wireguard-private-key
            - {name: PORT_FORWARD_ONLY, value: "on"}
            - {name: VPN_PORT_FORWARDING, value: "on"}
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: >-
                /bin/sh -c 'wget -qO- --retry-connrefused --post-data
                "json={\"listen_port\":{{PORT}},\"random_port\":false,\"upnp\":false}"
                http://127.0.0.1:8080/api/v2/app/setPreferences'
            - name: VPN_PORT_FORWARDING_DOWN_COMMAND
              value: >-
                /bin/sh -c 'wget -qO- --retry-connrefused --post-data
                "json={\"listen_port\":0}"
                http://127.0.0.1:8080/api/v2/app/setPreferences'
            - {name: TZ, value: America/Toronto}
            - {name: DNS_UPSTREAM_RESOLVER_TYPE, value: doh}
            - {name: DNS_UPSTREAM_RESOLVERS, value: "cloudflare,google"}
            - name: FIREWALL_INPUT_PORTS
              value: |
                5030,7878,8080,8084,8191,8265,8686,8989,9696,17878,18080,18084,18686,18989,19696
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.42.0.0/16,10.43.0.0/16,192.168.1.0/24"
          startupProbe:
            exec:
              command: [wget, -qO-, http://127.0.0.1:8000/v1/vpn/status]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            exec:
              command: [wget, -qO-, http://127.0.0.1:8000/v1/vpn/status]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, NET_ADMIN, NET_BIND_SERVICE, NET_RAW, SETGID, SETUID]
          volumeMounts:
            - {name: dev-net-tun, mountPath: /dev/net/tun}
            - {name: gluetun-config, mountPath: /gluetun}
      containers:
        - name: qbittorrent
          image: linuxserver/qbittorrent:5.2.3@sha256:b024436f8ca665d16d9a997d26fd27fdf867ee5566ba09f32764e7b2976d3e02
          imagePullPolicy: IfNotPresent
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ, value: America/Toronto}
            - {name: WEBUI_PORT, value: "8080"}
          ports:
            - {name: qbittorrent, containerPort: 8080, protocol: TCP}
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - 'test "$(stat -f -c %T /media/downloads)" = nfs && curl -fsS http://127.0.0.1:8080/'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - 'test "$(stat -f -c %T /media/downloads)" = nfs && curl -fsS http://127.0.0.1:8080/'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - 'test "$(stat -f -c %T /media/downloads)" = nfs && curl -fsS http://127.0.0.1:8080/'
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Hundreds of unrestricted torrents can push libtorrent above the
            # old 512 MiB cgroup ceiling even while the node has ample memory.
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: 500m, memory: 3Gi}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: qbittorrent-config, mountPath: /config}
            # Do not mount JuiceFS in this container. A propagated FUSE remount
            # can cover a nested NFS mount and make torrents write to B2 or fail.
            - {name: media-downloads, mountPath: /media/downloads}
        - name: flaresolverr
          image: flaresolverr/flaresolverr:v3.5.0@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
          imagePullPolicy: IfNotPresent
          env:
            - {name: LOG_LEVEL, value: info}
            - {name: TZ, value: America/Toronto}
          ports:
            - {name: flaresolverr, containerPort: 8191, protocol: TCP}
          readinessProbe:
            exec:
              command: [curl, -fsS, http://127.0.0.1:8191/health]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: [curl, -fsS, http://127.0.0.1:8191/health]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
        - name: prowlarr
          image: linuxserver/prowlarr:2.5.2-develop@sha256:8a0501025d6039c8c335415ee9aad499cb0d196b79d8cae7a66a566e6bcf6cd0
          imagePullPolicy: IfNotPresent
          env: &linuxserver-env
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ, value: America/Toronto}
          ports:
            - {name: prowlarr, containerPort: 9696, protocol: TCP}
          startupProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:9696/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:9696/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:9696/ping]}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false}
          volumeMounts:
            - {name: prowlarr-config, mountPath: /config}
        - name: radarr
          image: linuxserver/radarr:6.4.0-develop@sha256:0a001aa6d45ea3ad1efaadae8593838a74e5431f33b71e74bf695ddb702791fb
          imagePullPolicy: IfNotPresent
          env: *linuxserver-env
          ports:
            - {name: radarr, containerPort: 7878, protocol: TCP}
          startupProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:7878/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:7878/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:7878/ping]}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false}
          volumeMounts:
            - {name: radarr-config, mountPath: /config}
            - name: media-library
              mountPath: /media/movies
              subPath: movies
              mountPropagation: HostToContainer
            - {name: media-downloads, mountPath: /media/downloads}
        - name: sonarr
          image: linuxserver/sonarr:4.0.19.2979-ls320@sha256:24acea2956a0ccb11f103877d9f4f8576600fb34bff34820ed749c2256dab89f
          imagePullPolicy: IfNotPresent
          env: *linuxserver-env
          ports:
            - {name: sonarr, containerPort: 8989, protocol: TCP}
          startupProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8989/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8989/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8989/ping]}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false}
          volumeMounts:
            - {name: sonarr-config, mountPath: /config}
            - name: media-library
              mountPath: /media/tv
              subPath: tv
              mountPropagation: HostToContainer
            - {name: media-downloads, mountPath: /media/downloads}
        - name: lidarr
          image: linuxserver/lidarr:3.1.3-develop@sha256:17a94b05bb92474052b78a581275a858690d8b1babf695be5388c86bd473940b
          imagePullPolicy: IfNotPresent
          env: *linuxserver-env
          ports:
            - {name: lidarr, containerPort: 8686, protocol: TCP}
          startupProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8686/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          readinessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8686/ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8686/ping]}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 750m, memory: 768Mi}
          securityContext: {allowPrivilegeEscalation: false}
          volumeMounts:
            - {name: lidarr-config, mountPath: /config}
            - name: media-library
              mountPath: /media/music
              subPath: music
              mountPropagation: HostToContainer
            - {name: media-downloads, mountPath: /media/downloads}
        - name: slskd
          image: slskd/slskd:0.26.0@sha256:ecd4026d4f8fb504e2cc55323efa2c1f5b56d20d3686b018249cc36b48ea17a6
          imagePullPolicy: IfNotPresent
          env:
            - {name: TZ, value: America/Toronto}
            - {name: SLSKD_REMOTE_CONFIGURATION, value: "true"}
            - {name: SLSKD_METRICS, value: "true"}
            - {name: SLSKD_METRICS_NO_AUTH, value: "true"}
            - {name: SLSKD_UMASK, value: "002"}
          ports:
            - {name: slskd, containerPort: 5030, protocol: TCP}
          startupProbe:
            httpGet: {path: /health, port: slskd}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /health, port: slskd}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /health, port: slskd}
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 750m, memory: 768Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: slskd-state, mountPath: /app}
            - {name: media-downloads, mountPath: /downloads}
        - name: soularr
          image: mrusse08/soularr:v1.2.2@sha256:c4f97924fabfce4e0de539d821ea7d20519b95c4815a707bacfc9d7212597f20
          imagePullPolicy: IfNotPresent
          env:
            - {name: TZ, value: America/Toronto}
            - {name: SCRIPT_INTERVAL, value: "300"}
            - {name: WEBUI_ENABLED, value: "true"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          ports:
            - {name: soularr, containerPort: 8265, protocol: TCP}
          startupProbe:
            httpGet: {path: /, port: soularr}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /, port: soularr}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /, port: soularr}
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: soularr-data, mountPath: /data}
            - {name: media-downloads, mountPath: /downloads}
        - name: shelfmark
          image: ghcr.io/calibrain/shelfmark:v1.3.2@sha256:8700c1d3b6bb94e1b5f9482bac12e39652ed737de02f256920e1ad982a7ac0f1
          imagePullPolicy: IfNotPresent
          env: *linuxserver-env
          ports:
            - {name: shelfmark, containerPort: 8084, protocol: TCP}
          startupProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8084/api/health]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8084/api/health]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8084/api/health]}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false}
          volumeMounts:
            - {name: shelfmark-config, mountPath: /config}
            - {name: calibre-web-ingest, mountPath: /books}
            - {name: media-downloads, mountPath: /media/downloads}
        - &access-proxy
          name: qbittorrent-access-proxy
          image: nginx:1.31.3-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
          imagePullPolicy: IfNotPresent
          command: [nginx, -g, "daemon off;"]
          ports:
            - {name: qb-access, containerPort: 18080, protocol: TCP}
          readinessProbe:
            exec: {command: [sh, -c, "kill -0 1"]}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [sh, -c, "kill -0 1"]}
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext: &access-proxy-security
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: qb-access-config, mountPath: /etc/nginx, readOnly: true}
            - {name: qb-nginx-tmp, mountPath: /tmp}
            - {name: qb-nginx-cache, mountPath: /var/cache/nginx}
        - <<: *access-proxy
          name: prowlarr-access-proxy
          ports:
            - {name: pr-access, containerPort: 19696, protocol: TCP}
          readinessProbe:
            exec: {command: [sh, -c, "kill -0 1"]}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [sh, -c, "kill -0 1"]}
            periodSeconds: 30
            timeoutSeconds: 3
          volumeMounts:
            - {name: pr-access-config, mountPath: /etc/nginx, readOnly: true}
            - {name: pr-nginx-tmp, mountPath: /tmp}
            - {name: pr-nginx-cache, mountPath: /var/cache/nginx}
        - <<: *access-proxy
          name: radarr-access-proxy
          ports:
            - {name: ra-access, containerPort: 17878, protocol: TCP}
          readinessProbe:
            exec: {command: [sh, -c, "kill -0 1"]}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [sh, -c, "kill -0 1"]}
            periodSeconds: 30
            timeoutSeconds: 3
          volumeMounts:
            - {name: ra-access-config, mountPath: /etc/nginx, readOnly: true}
            - {name: ra-nginx-tmp, mountPath: /tmp}
            - {name: ra-nginx-cache, mountPath: /var/cache/nginx}
        - <<: *access-proxy
          name: sonarr-access-proxy
          ports:
            - {name: so-access, containerPort: 18989, protocol: TCP}
          readinessProbe:
            exec: {command: [sh, -c, "kill -0 1"]}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [sh, -c, "kill -0 1"]}
            periodSeconds: 30
            timeoutSeconds: 3
          volumeMounts:
            - {name: so-access-config, mountPath: /etc/nginx, readOnly: true}
            - {name: so-nginx-tmp, mountPath: /tmp}
            - {name: so-nginx-cache, mountPath: /var/cache/nginx}
        - <<: *access-proxy
          name: lidarr-access-proxy
          ports:
            - {name: li-access, containerPort: 18686, protocol: TCP}
          readinessProbe:
            exec: {command: [sh, -c, "kill -0 1"]}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [sh, -c, "kill -0 1"]}
            periodSeconds: 30
            timeoutSeconds: 3
          volumeMounts:
            - {name: li-access-config, mountPath: /etc/nginx, readOnly: true}
            - {name: li-nginx-tmp, mountPath: /tmp}
            - {name: li-nginx-cache, mountPath: /var/cache/nginx}
        - <<: *access-proxy
          name: shelfmark-access-proxy
          ports:
            - {name: sh-access, containerPort: 18084, protocol: TCP}
          readinessProbe:
            exec: {command: [sh, -c, "kill -0 1"]}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [sh, -c, "kill -0 1"]}
            periodSeconds: 30
            timeoutSeconds: 3
          volumeMounts:
            - {name: sh-access-config, mountPath: /etc/nginx, readOnly: true}
            - {name: sh-nginx-tmp, mountPath: /tmp}
            - {name: sh-nginx-cache, mountPath: /var/cache/nginx}
      volumes:
        - name: dev-net-tun
          hostPath: {path: /dev/net/tun, type: CharDevice}
        - name: gluetun-config
          persistentVolumeClaim: {claimName: gluetun-config}
        - name: qbittorrent-config
          persistentVolumeClaim: {claimName: qbittorrent-config}
        - name: prowlarr-config
          persistentVolumeClaim: {claimName: prowlarr-config}
        - name: radarr-config
          persistentVolumeClaim: {claimName: radarr-config}
        - name: sonarr-config
          persistentVolumeClaim: {claimName: sonarr-config}
        - name: lidarr-config
          persistentVolumeClaim: {claimName: lidarr-config}
        - name: slskd-state
          persistentVolumeClaim: {claimName: slskd-state}
        - name: soularr-data
          persistentVolumeClaim: {claimName: soularr-data}
        - name: shelfmark-config
          persistentVolumeClaim: {claimName: shelfmark-config}
        - name: calibre-web-ingest
          persistentVolumeClaim: {claimName: calibre-web-ingest-rwx}
        - name: media-library
          persistentVolumeClaim: {claimName: media-library-juicefs}
        - name: media-downloads
          persistentVolumeClaim: {claimName: media-downloads}
