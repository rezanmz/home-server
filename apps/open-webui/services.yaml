apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: apps
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: application
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: application
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: apps
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: searxng
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: searxng
  ports:
    - name: http
      port: 8080
      targetPort: search
      protocol: TCP
    - name: provider-metrics
      port: 8081
      targetPort: metrics
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: open-terminal
  namespace: apps
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: open-terminal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: open-terminal
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
