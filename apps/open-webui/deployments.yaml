apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: apps
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: application
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.10.2@sha256:9fcea9c6e32ab60b0498f3986c6cdf651ddbe61db48d2213a3d28048ddd673d4
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - /app/backend/start.sh
          args:
            - --workers
            - "1"
            - --no-access-log
          env:
            - name: TZ
              value: America/Toronto
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /app/backend/data/cache
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            # The image's bundled static directory is root-owned. Keep generated
            # customizations on the writable data volume when running non-root.
            - name: STATIC_DIR
              value: /app/backend/data/static
            # Open WebUI re-attaches Uvicorn's access logger for audit capture by
            # default, which can expose OAuth callback query parameters in pod logs.
            - name: AUDIT_UVICORN_LOGGER_NAMES
              value: uvicorn.error
            # Loguru's diagnostic tracebacks include local variable values. OAuth
            # callback errors can otherwise disclose the authorization code/state.
            - name: LOGURU_DIAGNOSE
              value: "false"
            # Custom Functions are arbitrary backend code. Reviewed native
            # features replace the retired database-only Functions.
            - name: SAFE_MODE
              value: "True"
            - name: ENABLE_VALVE_ENCRYPTION
              value: "True"
            - name: THREAD_POOL_SIZE
              value: "8"
            # Bound agentic tool loops. The upstream default of 256 can turn a
            # bad search result into a large burst of provider requests.
            - name: CHAT_RESPONSE_MAX_TOOL_CALL_ITERATIONS
              value: "12"
            # v0.10.2 treats unset aiohttp pool values and the total timeout as
            # unlimited despite documenting bounded defaults.
            - name: AIOHTTP_POOL_CONNECTIONS
              value: "20"
            - name: AIOHTTP_POOL_CONNECTIONS_PER_HOST
              value: "10"
            - name: AIOHTTP_CLIENT_TIMEOUT
              value: "120"
            # GPT Researcher is intentionally a long-running, explicit tool.
            # Keep ordinary provider requests bounded by the shorter timeout.
            - name: AIOHTTP_CLIENT_TIMEOUT_TOOL_SERVER
              value: "900"
            - name: USER_AGENT
              value: OpenWebUI home-server (+https://chat.reza.network)
            - name: ENABLE_ADMIN_CHAT_ACCESS
              value: "False"
            - name: ENABLE_ADMIN_EXPORT
              value: "False"
            - name: ENABLE_ADMIN_WORKSPACE_CONTENT_ACCESS
              value: "False"
            - name: BYPASS_ADMIN_ACCESS_CONTROL
              # Keep ownership checks for notes, files, tools, knowledge, and
              # other users' workspace content. The catalog reconciler creates
              # administrator-owned model records instead of using this broad
              # bypass to expose provider models.
              value: "False"
            - name: ENABLE_ADMIN_ANALYTICS
              value: "False"
            - name: SHOW_ADMIN_DETAILS
              value: "False"
            - name: ENABLE_API_KEYS
              value: "False"
            - name: JWT_EXPIRES_IN
              value: 7d
            # Secure rendered model/user HTML while retaining ordinary
            # self-contained artifacts. Network access from srcdoc is blocked.
            - name: IFRAME_CSP
              value: "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
            - name: HSTS
              value: max-age=31536000;includeSubDomains
            - name: XFRAME_OPTIONS
              value: DENY
            - name: XCONTENT_TYPE
              value: nosniff
            - name: XDOWNLOAD_OPTIONS
              value: noopen
            - name: XPERMITTED_CROSS_DOMAIN_POLICIES
              value: none
            - name: REFERRER_POLICY
              value: strict-origin-when-cross-origin
            - name: PERMISSIONS_POLICY
              value: "camera=(),microphone=(self),geolocation=(self),clipboard-read=(self),clipboard-write=(self),fullscreen=(self)"
            - name: CROSS_ORIGIN_OPENER_POLICY
              value: same-origin
            - name: CROSS_ORIGIN_RESOURCE_POLICY
              value: same-origin
            - name: ENABLE_OLLAMA_API
              value: "False"
            - name: CONTENT_EXTRACTION_ENGINE
              value: tika
            - name: TIKA_SERVER_URL
              value: http://tika:9998
            - name: BYPASS_MODEL_ACCESS_CONTROL
              value: "False"
            - name: WEBUI_URL
              value: https://chat.reza.network
            - name: CORS_ALLOW_ORIGIN
              value: https://chat.reza.network
            - name: WEBUI_SESSION_COOKIE_SECURE
              value: "True"
            - name: WEBUI_AUTH_COOKIE_SECURE
              value: "True"
            - name: WEBUI_SESSION_COOKIE_SAME_SITE
              value: lax
            - name: WEBUI_AUTH_COOKIE_SAME_SITE
              value: lax
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: webui-secret-key
            - name: ENABLE_SIGNUP
              value: "False"
            - name: ENABLE_INITIAL_ADMIN_SIGNUP
              value: "False"
            - name: ENABLE_LOGIN_FORM
              value: "False"
            - name: ENABLE_PASSWORD_AUTH
              value: "False"
            # v0.10.2 promotes the first OAuth-created account to administrator
            # before applying role gates. Keep creation closed until a trusted
            # administrator is restored or explicitly pre-provisioned.
            - name: ENABLE_OAUTH_SIGNUP
              value: "False"
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "True"
            - name: ENABLE_OAUTH_PERSISTENT_CONFIG
              value: "False"
            - name: ENABLE_OAUTH_ID_TOKEN_COOKIE
              value: "False"
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: oauth-client-id
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: oauth-client-secret
            - name: OPENID_PROVIDER_URL
              value: https://auth.reza.network/application/o/open-webui/.well-known/openid-configuration
            - name: OAUTH_PROVIDER_NAME
              value: Authentik
            - name: OAUTH_SCOPES
              value: openid email profile offline_access
            - name: OPENID_REDIRECT_URI
              value: https://chat.reza.network/oauth/oidc/callback
            - name: ENABLE_OAUTH_ROLE_MANAGEMENT
              value: "True"
            - name: OAUTH_ROLES_CLAIM
              value: groups
            - name: OAUTH_ALLOWED_ROLES
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: oauth-allowed-roles
            - name: OAUTH_ADMIN_ROLES
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: oauth-admin-roles
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika
  namespace: apps
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: tika
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
      app.kubernetes.io/component: tika
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/component: tika
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tika
          image: apache/tika:3.3.1.0-full@sha256:d8e6ed96260ad89307a93195a1b856102987a818ac648502f8efbaf313d32470
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9998
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /tika
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /tika
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /tika
              port: http
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: apps
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
      app.kubernetes.io/component: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/component: searxng
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 977
        runAsGroup: 977
        fsGroup: 977
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: search-provider-proxy
          image: ghcr.io/searxng/searxng:2026.7.26-b060c780d@sha256:d0aaeb14880e6e92bde1518fcc7261e995783367d63d95203383607bef9c6516
          imagePullPolicy: IfNotPresent
          command: [python, /provider/search-provider-proxy.py]
          env:
            - name: SEARXNG_INTERNAL_SEARCH_URL
              value: http://127.0.0.1:8082/search
            - name: BRAVE_SEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: searxng-provider-secrets
                  key: brave-api-key
            - name: SERPAPI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: searxng-provider-secrets
                  key: serpapi-api-key
          ports:
            - name: search
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 8081
              protocol: TCP
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 150m, memory: 128Mi}
          startupProbe:
            httpGet: {path: /healthz, port: search}
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          readinessProbe:
            httpGet: {path: /healthz, port: search}
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: search}
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 977
            runAsGroup: 977
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: config
              mountPath: /provider
              readOnly: true
            - name: provider-tmp
              mountPath: /tmp
        - name: searxng-free-engines
          image: ghcr.io/searxng/searxng:2026.7.26-b060c780d@sha256:d0aaeb14880e6e92bde1518fcc7261e995783367d63d95203383607bef9c6516
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Toronto
            - name: HOME
              value: /var/cache/searxng
            - name: XDG_CACHE_HOME
              value: /var/cache/searxng
            - name: FORCE_OWNERSHIP
              value: "false"
            - name: GRANIAN_WORKERS
              value: "1"
            - name: GRANIAN_BLOCKING_THREADS
              value: "3"
            - name: SEARXNG_PORT
              value: "8082"
            - name: SEARXNG_BASE_URL
              value: http://127.0.0.1:8082/
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: open-webui-searxng-secrets
                  key: searxng-secret-key
          ports:
            - name: free-search
              containerPort: 8082
              protocol: TCP
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          startupProbe:
            httpGet: {path: /healthz, port: free-search}
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          readinessProbe:
            httpGet: {path: /healthz, port: free-search}
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: free-search}
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 977
            runAsGroup: 977
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: fallback-config
              mountPath: /etc/searxng
              readOnly: true
            - name: fallback-cache
              mountPath: /var/cache/searxng
            - name: fallback-tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: open-webui-searxng-config
            defaultMode: 0444
        - name: provider-tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: fallback-config
          configMap:
            name: open-webui-searxng-config
            defaultMode: 0444
            items:
              - key: fallback-settings.yml
                path: settings.yml
        - name: fallback-cache
          emptyDir:
            sizeLimit: 128Mi
        - name: fallback-tmp
          emptyDir:
            sizeLimit: 32Mi
