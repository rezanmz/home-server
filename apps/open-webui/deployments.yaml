apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: apps
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: application
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: reconcile-security-policy
          image: ghcr.io/open-webui/open-webui:v0.10.2@sha256:9fcea9c6e32ab60b0498f3986c6cdf651ddbe61db48d2213a3d28048ddd673d4
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /policy/reconcile.py
          env:
            - name: HOME
              value: /tmp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: GPT_RESEARCHER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gpt-researcher-secrets
                  key: api-token
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
            - name: security-policy
              mountPath: /policy
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: migrate-gemini-embeddings
          image: ghcr.io/open-webui/open-webui:v0.10.2@sha256:9fcea9c6e32ab60b0498f3986c6cdf651ddbe61db48d2213a3d28048ddd673d4
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /policy/migrate_embeddings.py
          env:
            - name: TZ
              value: America/Toronto
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /app/backend/data/cache
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            # Running an absolute script sets sys.path[0] to /policy. Make the
            # application's backend package importable for JWT generation and
            # the temporary loopback server.
            - name: PYTHONPATH
              value: /app/backend
            - name: STATIC_DIR
              value: /app/backend/data/static
            - name: SAFE_MODE
              value: "True"
            - name: ENABLE_OLLAMA_API
              value: "False"
            - name: ENABLE_SIGNUP
              value: "False"
            - name: ENABLE_LOGIN_FORM
              value: "False"
            - name: ENABLE_OAUTH_SIGNUP
              value: "False"
            - name: CONTENT_EXTRACTION_ENGINE
              value: tika
            - name: TIKA_SERVER_URL
              value: http://tika:9998
            - name: RAG_EMBEDDING_TIMEOUT
              value: "300"
            # v0.10.2 reads these prefixes directly from the environment rather
            # than from its database-backed ConfigVars.
            - name: RAG_EMBEDDING_CONTENT_PREFIX
              value: "title: none | text: "
            - name: RAG_EMBEDDING_QUERY_PREFIX
              value: "task: question answering | query: "
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: webui-secret-key
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
            - name: security-policy
              mountPath: /policy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.10.2@sha256:9fcea9c6e32ab60b0498f3986c6cdf651ddbe61db48d2213a3d28048ddd673d4
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - /app/backend/start.sh
          args:
            - --workers
            - "1"
            - --no-access-log
          env:
            - name: TZ
              value: America/Toronto
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /app/backend/data/cache
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            # The image's bundled static directory is root-owned. Keep generated
            # customizations on the writable data volume when running non-root.
            - name: STATIC_DIR
              value: /app/backend/data/static
            # Open WebUI re-attaches Uvicorn's access logger for audit capture by
            # default, which can expose OAuth callback query parameters in pod logs.
            - name: AUDIT_UVICORN_LOGGER_NAMES
              value: uvicorn.error
            # Loguru's diagnostic tracebacks include local variable values. OAuth
            # callback errors can otherwise disclose the authorization code/state.
            - name: LOGURU_DIAGNOSE
              value: "false"
            # Custom Functions are arbitrary backend code. Reviewed native
            # features replace the retired database-only Functions.
            - name: SAFE_MODE
              value: "True"
            - name: ENABLE_VALVE_ENCRYPTION
              value: "True"
            - name: THREAD_POOL_SIZE
              value: "8"
            # v0.10.2 treats unset aiohttp pool values and the total timeout as
            # unlimited despite documenting bounded defaults.
            - name: AIOHTTP_POOL_CONNECTIONS
              value: "20"
            - name: AIOHTTP_POOL_CONNECTIONS_PER_HOST
              value: "10"
            - name: AIOHTTP_CLIENT_TIMEOUT
              value: "120"
            # GPT Researcher is intentionally a long-running, explicit tool.
            # Keep ordinary provider requests bounded by the shorter timeout.
            - name: AIOHTTP_CLIENT_TIMEOUT_TOOL_SERVER
              value: "900"
            - name: USER_AGENT
              value: OpenWebUI home-server (+https://chat.reza.network)
            - name: ENABLE_ADMIN_CHAT_ACCESS
              value: "False"
            - name: ENABLE_ADMIN_EXPORT
              value: "False"
            - name: ENABLE_ADMIN_WORKSPACE_CONTENT_ACCESS
              value: "False"
            - name: BYPASS_ADMIN_ACCESS_CONTROL
              value: "False"
            - name: ENABLE_ADMIN_ANALYTICS
              value: "False"
            - name: SHOW_ADMIN_DETAILS
              value: "False"
            - name: ENABLE_API_KEYS
              value: "False"
            - name: JWT_EXPIRES_IN
              value: 7d
            # Secure rendered model/user HTML while retaining ordinary
            # self-contained artifacts. Network access from srcdoc is blocked.
            - name: IFRAME_CSP
              value: "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
            - name: HSTS
              value: max-age=31536000;includeSubDomains
            - name: XFRAME_OPTIONS
              value: DENY
            - name: XCONTENT_TYPE
              value: nosniff
            - name: XDOWNLOAD_OPTIONS
              value: noopen
            - name: XPERMITTED_CROSS_DOMAIN_POLICIES
              value: none
            - name: REFERRER_POLICY
              value: strict-origin-when-cross-origin
            - name: PERMISSIONS_POLICY
              value: "camera=(),microphone=(self),geolocation=(self),clipboard-read=(self),clipboard-write=(self),fullscreen=(self)"
            - name: CROSS_ORIGIN_OPENER_POLICY
              value: same-origin
            - name: CROSS_ORIGIN_RESOURCE_POLICY
              value: same-origin
            - name: ENABLE_OLLAMA_API
              value: "False"
            - name: CONTENT_EXTRACTION_ENGINE
              value: tika
            - name: TIKA_SERVER_URL
              value: http://tika:9998
            # Gemini Embedding 2 recommends distinct retrieval-document and
            # question-answering query task prefixes.
            - name: RAG_EMBEDDING_CONTENT_PREFIX
              value: "title: none | text: "
            - name: RAG_EMBEDDING_QUERY_PREFIX
              value: "task: question answering | query: "
            - name: BYPASS_MODEL_ACCESS_CONTROL
              value: "False"
            - name: WEBUI_URL
              value: https://chat.reza.network
            - name: CORS_ALLOW_ORIGIN
              value: https://chat.reza.network
            - name: WEBUI_SESSION_COOKIE_SECURE
              value: "True"
            - name: WEBUI_AUTH_COOKIE_SECURE
              value: "True"
            - name: WEBUI_SESSION_COOKIE_SAME_SITE
              value: lax
            - name: WEBUI_AUTH_COOKIE_SAME_SITE
              value: lax
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: webui-secret-key
            - name: ENABLE_SIGNUP
              value: "False"
            - name: ENABLE_INITIAL_ADMIN_SIGNUP
              value: "False"
            - name: ENABLE_LOGIN_FORM
              value: "False"
            - name: ENABLE_PASSWORD_AUTH
              value: "False"
            # v0.10.2 promotes the first OAuth-created account to administrator
            # before applying role gates. Keep creation closed until a trusted
            # administrator is restored or explicitly pre-provisioned.
            - name: ENABLE_OAUTH_SIGNUP
              value: "False"
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "True"
            - name: ENABLE_OAUTH_PERSISTENT_CONFIG
              value: "False"
            - name: ENABLE_OAUTH_ID_TOKEN_COOKIE
              value: "False"
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: oauth-client-id
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: oauth-client-secret
            - name: OPENID_PROVIDER_URL
              value: https://auth.reza.network/application/o/open-webui/.well-known/openid-configuration
            - name: OAUTH_PROVIDER_NAME
              value: Authentik
            - name: OAUTH_SCOPES
              value: openid email profile offline_access
            - name: OPENID_REDIRECT_URI
              value: https://chat.reza.network/oauth/oidc/callback
            - name: ENABLE_OAUTH_ROLE_MANAGEMENT
              value: "True"
            - name: OAUTH_ROLES_CLAIM
              value: groups
            - name: OAUTH_ALLOWED_ROLES
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: oauth-allowed-roles
            - name: OAUTH_ADMIN_ROLES
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: oauth-admin-roles
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
        - name: security-policy
          configMap:
            name: open-webui-security-policy
            defaultMode: 0444
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika
  namespace: apps
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: tika
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
      app.kubernetes.io/component: tika
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/component: tika
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tika
          image: apache/tika:3.3.1.0-full@sha256:d8e6ed96260ad89307a93195a1b856102987a818ac648502f8efbaf313d32470
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9998
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /tika
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /tika
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /tika
              port: http
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: apps
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
      app.kubernetes.io/component: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/component: searxng
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 977
        runAsGroup: 977
        fsGroup: 977
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searxng
          image: ghcr.io/searxng/searxng:2026.7.19-6da6eee26@sha256:b8ca38ba06eea544d7555e88321e212ddc0d5c3c7de055419cfb2e5c6bf30812
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Toronto
            - name: HOME
              value: /var/cache/searxng
            - name: XDG_CACHE_HOME
              value: /var/cache/searxng
            - name: FORCE_OWNERSHIP
              value: "false"
            - name: GRANIAN_WORKERS
              value: "1"
            - name: GRANIAN_BLOCKING_THREADS
              value: "4"
            - name: SEARXNG_BASE_URL
              value: http://searxng.apps.svc.cluster.local:8080/
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: open-webui-searxng-secrets
                  key: searxng-secret-key
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 977
            runAsGroup: 977
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/searxng
              readOnly: true
            - name: cache
              mountPath: /var/cache/searxng
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: open-webui-searxng-config
            defaultMode: 0444
        - name: cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
