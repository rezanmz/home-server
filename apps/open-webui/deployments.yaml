apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: apps
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: application
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: false
      hostAliases:
        - ip: 192.168.1.3
          hostnames:
            - host.docker.internal
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.10.2
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Toronto
            - name: ENABLE_OLLAMA_API
              value: "False"
            - name: CONTENT_EXTRACTION_ENGINE
              value: tika
            - name: TIKA_SERVER_URL
              value: http://tika:9998
            - name: BYPASS_MODEL_ACCESS_CONTROL
              value: "True"
            - name: WEBUI_URL
              value: https://chat.reza.network
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: webui-secret-key
            - name: ENABLE_SIGNUP
              value: "False"
            - name: ENABLE_LOGIN_FORM
              value: "False"
            - name: ENABLE_PASSWORD_AUTH
              value: "False"
            - name: ENABLE_OAUTH_SIGNUP
              value: "True"
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "True"
            - name: ENABLE_OAUTH_PERSISTENT_CONFIG
              value: "False"
            - name: ENABLE_OAUTH_ID_TOKEN_COOKIE
              value: "False"
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: oauth-client-id
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: oauth-client-secret
            - name: OPENID_PROVIDER_URL
              value: https://auth.reza.network/application/o/open-webui/.well-known/openid-configuration
            - name: OAUTH_PROVIDER_NAME
              value: Authentik
            - name: OAUTH_SCOPES
              value: openid email profile
            - name: OPENID_REDIRECT_URI
              value: https://chat.reza.network/oauth/oidc/callback
            - name: ENABLE_OAUTH_ROLE_MANAGEMENT
              value: "True"
            - name: OAUTH_ROLES_CLAIM
              value: groups
            - name: OAUTH_ALLOWED_ROLES
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: oauth-allowed-roles
            - name: OAUTH_ADMIN_ROLES
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: oauth-admin-roles
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika
  namespace: apps
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: tika
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
      app.kubernetes.io/component: tika
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/component: tika
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tika
          image: apache/tika:3.3.1.0-full
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9998
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /tika
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /tika
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /tika
              port: http
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
