apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: open-webui
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: open-webui
      app.kubernetes.io/component: application
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 8080
          protocol: TCP
  # Model backends and OpenAI-compatible endpoints are user-configured.
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tika
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: open-webui
      app.kubernetes.io/component: tika
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: open-webui
              app.kubernetes.io/component: application
      ports:
        - port: 9998
          protocol: TCP
  egress: []
