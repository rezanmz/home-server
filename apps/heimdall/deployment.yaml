apiVersion: apps/v1
kind: Deployment
metadata:
  name: heimdall
  namespace: apps
  labels:
    app.kubernetes.io/name: heimdall
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: heimdall
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heimdall
    spec:
      automountServiceAccountToken: false
      containers:
        - name: heimdall
          image: linuxserver/heimdall:2.7.6
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Toronto
            - name: ALLOW_INTERNAL_REQUESTS
              value: "true"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /config
        - name: access-proxy
          image: nginx:1.27.4-alpine
          imagePullPolicy: IfNotPresent
          command: [nginx, -g, "daemon off;"]
          ports:
            - name: access-http
              containerPort: 18081
          readinessProbe:
            tcpSocket: {port: access-http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: access-http}
            periodSeconds: 30
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: access-proxy-config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: nginx-tmp, mountPath: /tmp}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: heimdall-config
        - name: access-proxy-config
          configMap:
            name: heimdall-access-proxy
        - {name: nginx-tmp, emptyDir: {}}
        - {name: nginx-cache, emptyDir: {}}
