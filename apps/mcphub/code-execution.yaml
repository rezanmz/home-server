apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-v8
  namespace: apps
  labels:
    app.kubernetes.io/name: mcp-v8
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-v8
      app.kubernetes.io/component: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-v8
        app.kubernetes.io/component: mcp-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-v8
          image: docker.io/rezanmz/mcp-v8:0.18.1-1@sha256:8fa4ce93b04b206dfb44cf9981f643fbafc0dc5c7bb6fb11d38f9fd1b106f350
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/mcp-v8
          args:
            # The upstream Streamable HTTP transport accepts loopback Host
            # headers only and does not expose its allow-list in the release
            # CLI. Use its supported SSE transport for Kubernetes service DNS.
            - --sse-port
            - "8080"
            - --heap-memory-max
            - "8"
            - --execution-timeout
            - "5"
            - --max-concurrent-executions
            - "1"
            - --wasm-default-max-memory
            - 4m
            - --harden-freeze-ops
            - --harden-neutralize-proxy-details
            - --harden-neutralize-introspection
            - --harden-remove-bootstrap
            - --harden-remove-shared-memory
          ports:
            - name: mcp
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
              ephemeral-storage: 8Mi
            limits:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 32Mi
          startupProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 30
            timeoutSeconds: 1
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-v8
  namespace: apps
  labels:
    app.kubernetes.io/name: mcp-v8
    app.kubernetes.io/component: mcp-server
spec:
  selector:
    app.kubernetes.io/name: mcp-v8
    app.kubernetes.io/component: mcp-server
  ports:
    - name: mcp
      port: 8080
      targetPort: mcp
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-v8
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-v8
      app.kubernetes.io/component: mcp-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcphub
              app.kubernetes.io/component: application
      ports:
        - port: 8080
          protocol: TCP
  egress: []
