apiVersion: v1
kind: Service
metadata:
  name: mcphub
  namespace: apps
  labels:
    app.kubernetes.io/name: mcphub
    app.kubernetes.io/component: application
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcphub
    app.kubernetes.io/component: application
  ports:
    - name: http
      port: 3000
      targetPort: access-http
      protocol: TCP
    # Cluster clients use the authenticated MCP API directly. The browser UI
    # remains behind the LAN/VPN allowlist and MCPHub's native Authentik OIDC.
    - name: mcp
      port: 3001
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: mcphub-postgresql
  namespace: apps
  labels:
    app.kubernetes.io/name: mcphub
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcphub
    app.kubernetes.io/component: database
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
