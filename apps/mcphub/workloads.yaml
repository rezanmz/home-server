apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcphub
  namespace: apps
  labels:
    app.kubernetes.io/name: mcphub
    app.kubernetes.io/component: application
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mcphub
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcphub
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data
          image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
          command:
            - sh
            - -ec
            - >-
              mkdir -p /state/data;
              touch /state/.env;
              if [ ! -s /state/mcp_settings.json ]; then
                printf '{ "mcpServers": {} }\n' > /state/mcp_settings.json;
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /state
      containers:
        - name: mcphub
          # The -full variant adds Docker-in-Docker, Rust, and browsers. This
          # deployment needs none of those host-like facilities.
          image: samanhappy/mcphub:1.0.23@sha256:8506357765ad7322bf1ef2cceaef31f0e4f1e6b7595e25643ebd46fe124c0a63
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /tmp/mcphub
            - name: NPM_CONFIG_USERCONFIG
              value: /tmp/mcphub/.npmrc
            - name: XDG_CACHE_HOME
              value: /tmp/mcphub/.cache
            - name: COREPACK_HOME
              value: /tmp/mcphub/.cache/corepack
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: mcphub-secrets
                  key: database-url
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcphub-secrets
                  key: admin-password
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 18
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/.env
              subPath: .env
            - name: data
              mountPath: /app/mcp_settings.json
              subPath: mcp_settings.json
            - name: data
              mountPath: /app/data
              subPath: data
        - name: access-proxy
          image: nginx:1.27.4-alpine@sha256:4ff102c5d78d254a6f0da062b3cf39eaf07f01eec0927fd21e219d0af8bc0591
          imagePullPolicy: IfNotPresent
          command: [nginx, -g, "daemon off;"]
          ports:
            - name: access-http
              containerPort: 13000
          readinessProbe:
            tcpSocket: {port: access-http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: access-http}
            periodSeconds: 30
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: access-proxy-config, mountPath: /etc/nginx, readOnly: true}
            - {name: nginx-tmp, mountPath: /tmp}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mcphub-data
        - name: access-proxy-config
          configMap:
            name: mcphub-access-proxy
        - {name: nginx-tmp, emptyDir: {}}
        - {name: nginx-cache, emptyDir: {}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mcphub-postgresql
  namespace: apps
  labels:
    app.kubernetes.io/name: mcphub
    app.kubernetes.io/component: database
spec:
  replicas: 1
  serviceName: mcphub-postgresql
  selector:
    matchLabels:
      app.kubernetes.io/name: mcphub
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcphub
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: prepare-postgres-data
          image: busybox:1.37.0@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
          command: [sh, -ec, "mkdir -p /var/lib/postgresql/data/pgdata && chown 999:999 /var/lib/postgresql/data/pgdata"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
          command: [sh, -ec]
          args: ["export PGDATA=/var/lib/postgresql/data/pgdata; exec docker-entrypoint.sh postgres"]
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: mcphub
            - name: POSTGRES_USER
              value: mcphub
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcphub-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mcphub-postgresql
