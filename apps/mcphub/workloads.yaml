apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcphub
  namespace: apps
  labels:
    app.kubernetes.io/name: mcphub
    app.kubernetes.io/component: application
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mcphub
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcphub
        app.kubernetes.io/component: application
    spec:
      serviceAccountName: mcphub-observer
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data
          image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
          command:
            - sh
            - -ec
            - >-
              mkdir -p /state/data/oauth/google/gmail-state;
              chmod 0700 /state/data/oauth /state/data/oauth/google /state/data/oauth/google/gmail-state;
              touch /state/.env;
              if [ ! -s /state/mcp_settings.json ]; then
                printf '{ "mcpServers": {} }\n' > /state/mcp_settings.json;
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /state
      containers:
        - name: mcphub
          # Extends the ordinary (not -full) MCPHub image with pinned, reviewed
          # MCP packages. Server registrations and all runtime settings remain
          # application-owned state in MCPHub's PostgreSQL database.
          image: ghcr.io/rezanmz/mcphub-gptr:1.0.26-63884773685b-actual-24925803dff2-assistant-suite-6@sha256:25e5f4598f3fdaecb4edb80785fb2dc915159ff2e9963757fd984999b0c9fe59
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /tmp/mcphub
            - name: NPM_CONFIG_USERCONFIG
              value: /tmp/mcphub/.npmrc
            - name: XDG_CACHE_HOME
              value: /tmp/mcphub/.cache
            - name: COREPACK_HOME
              value: /tmp/mcphub/.cache/corepack
            - name: FASTMCP_CHECK_FOR_UPDATES
              value: "off"
            - name: NPM_CONFIG_UPDATE_NOTIFIER
              value: "false"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: mcphub-secrets
                  key: database-url
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcphub-secrets
                  key: admin-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mcphub-secrets
                  key: jwt-secret
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: mcphub-secrets
                  key: better-auth-secret
            - {name: BETTER_AUTH_ENABLED, value: "true"}
            - {name: BETTER_AUTH_URL, value: "https://mcphub.reza.network"}
            - {name: BETTER_AUTH_TRUSTED_ORIGINS, value: "https://mcphub.reza.network"}
            - {name: BETTER_AUTH_OIDC_ENABLED, value: "true"}
            - {name: BETTER_AUTH_OIDC_PROVIDER_ID, value: oidc}
            - name: BETTER_AUTH_OIDC_DISCOVERY_URL
              value: https://auth.reza.network/application/o/mcphub/.well-known/openid-configuration
            - {name: OIDC_CLIENT_ID, value: mcphub}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mcphub-secrets
                  key: oidc-client-secret
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 3Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 18
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/.env
              subPath: .env
            - name: data
              mountPath: /app/mcp_settings.json
              subPath: mcp_settings.json
            - name: data
              mountPath: /app/data
              subPath: data
            # The official filesystem MCP sees the complete vault read-only.
            # Only Inbox and Daily are over-mounted writable, so the operating
            # system enforces the intended note-creation boundary.
            - name: obsidian-vault
              mountPath: /vault
              subPath: vault
              readOnly: true
            - name: obsidian-vault
              mountPath: /vault/Inbox
              subPath: vault/Inbox
            - name: obsidian-vault
              mountPath: /vault/Daily
              subPath: vault/Daily
            # A short-lived projected token is available only for the official
            # Kubernetes MCP server. Its ClusterRole is read-only and excludes
            # Secrets, exec, attach, port-forward, and every mutation verb.
            - name: kubernetes-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        - name: access-proxy
          image: nginx:1.31.3-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
          imagePullPolicy: IfNotPresent
          command: [nginx, -g, "daemon off;"]
          ports:
            - name: access-http
              containerPort: 13000
          readinessProbe:
            tcpSocket: {port: access-http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: access-http}
            periodSeconds: 30
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: access-proxy-config, mountPath: /etc/nginx, readOnly: true}
            - {name: nginx-tmp, mountPath: /tmp}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mcphub-data
        - name: access-proxy-config
          configMap:
            name: mcphub-access-proxy
        - name: obsidian-vault
          persistentVolumeClaim:
            claimName: syncthing-data
        - name: kubernetes-api-access
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - {key: ca.crt, path: ca.crt}
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef: {fieldPath: metadata.namespace}
        - {name: nginx-tmp, emptyDir: {}}
        - {name: nginx-cache, emptyDir: {}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mcphub-postgresql
  namespace: apps
  labels:
    app.kubernetes.io/name: mcphub
    app.kubernetes.io/component: database
spec:
  replicas: 1
  serviceName: mcphub-postgresql
  selector:
    matchLabels:
      app.kubernetes.io/name: mcphub
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcphub
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: prepare-postgres-data
          image: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command: [sh, -ec, "mkdir -p /var/lib/postgresql/data/pgdata && chown 999:999 /var/lib/postgresql/data/pgdata"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
          command: [sh, -ec]
          args: ["export PGDATA=/var/lib/postgresql/data/pgdata; exec docker-entrypoint.sh postgres"]
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: mcphub
            - name: POSTGRES_USER
              value: mcphub
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcphub-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mcphub-postgresql
