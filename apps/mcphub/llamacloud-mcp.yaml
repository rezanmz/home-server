apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamacloud-mcp
  namespace: apps
  labels:
    app.kubernetes.io/name: llamacloud-mcp
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llamacloud-mcp
      app.kubernetes.io/component: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llamacloud-mcp
        app.kubernetes.io/component: mcp-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llamacloud-mcp
          # This is the unmodified, pinned LlamaIndex MCP package. API keys,
          # parsing tier, model/version, and provider policy remain editable in
          # MCPHub's backed-up application state rather than this manifest.
          image: docker.io/rezanmz/llamacloud-mcp:2.11.0@sha256:84930f9ace045ef44f6ae79898c8fef1cfaf483a5ea6863bf6affe218724c7a8
          imagePullPolicy: IfNotPresent
          env:
            - {name: HOME, value: /tmp}
            - {name: DENO_DIR, value: /tmp/deno}
          ports:
            - {name: http, containerPort: 3000, protocol: TCP}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # Stainless Code Mode permits local reads only beneath its package
            # tree. Mount the Obsidian vault there, read-only, so agents can
            # upload a requested PDF but cannot alter the vault.
            - name: obsidian-vault
              mountPath: /app/node_modules/@llamaindex/vault
              subPath: vault
              readOnly: true
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: obsidian-vault
          persistentVolumeClaim:
            claimName: syncthing-data
        - {name: tmp, emptyDir: {sizeLimit: 1Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: llamacloud-mcp
  namespace: apps
  labels:
    app.kubernetes.io/name: llamacloud-mcp
    app.kubernetes.io/component: mcp-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: llamacloud-mcp
    app.kubernetes.io/component: mcp-server
  ports:
    - {name: http, port: 3000, targetPort: http, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llamacloud-mcp
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: llamacloud-mcp
      app.kubernetes.io/component: mcp-server
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcphub
              app.kubernetes.io/component: application
      ports:
        - {port: 3000, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    # The server only needs the public LlamaCloud API. Private networks stay
    # unreachable, preventing the Code Mode tool from becoming an SSRF path.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - {port: 443, protocol: TCP}
