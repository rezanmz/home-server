apiVersion: v1
kind: ServiceAccount
metadata: {name: headlamp, namespace: monitoring}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: headlamp-view}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - {kind: User, apiGroup: rbac.authorization.k8s.io, name: authentik:rezanamazi23@gmail.com}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: headlamp-metrics-reader}
rules:
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: headlamp-metrics-reader}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-metrics-reader
subjects:
  - {kind: User, apiGroup: rbac.authorization.k8s.io, name: authentik:rezanamazi23@gmail.com}
