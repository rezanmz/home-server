apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headlamp-lan-only
  namespace: monitoring
spec:
  ipAllowList:
    sourceRange:
      - 192.168.1.0/24
      - 10.8.0.0/24
      # wg-easy is a pod, so VPN-to-LAN traffic is SNATed to the K3s pod CIDR.
      - 10.42.0.0/16
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: headlamp, namespace: monitoring}
spec:
  parentRefs:
    - {name: home, namespace: traefik}
  hostnames: [headlamp.reza.network]
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: custom-errors
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: headlamp-lan-only
      backendRefs:
        - {name: headlamp, port: 80}
