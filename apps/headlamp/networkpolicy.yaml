apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: headlamp, namespace: monitoring}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: headlamp}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: traefik}
      ports:
        - {port: 16120, protocol: TCP}
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports:
        - {port: 4466, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - ipBlock: {cidr: 10.43.0.0/16}
      ports:
        - {port: 443, protocol: TCP}
    - to:
        - ipBlock: {cidr: 192.168.1.3/32}
      ports:
        - {port: 6443, protocol: TCP}
    # Headlamp exchanges the OIDC authorization code with Authentik through the
    # Traefik MetalLB VIP returned by Pi-hole's local DNS override.
    - to:
        - ipBlock: {cidr: 192.168.1.240/32}
      ports:
        - {port: 443, protocol: TCP}
    # The MetalLB service translates HTTPS to Traefik pod port 8443 before the
    # NetworkPolicy egress rule is evaluated.
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: traefik}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports:
        - {port: 8443, protocol: TCP}
