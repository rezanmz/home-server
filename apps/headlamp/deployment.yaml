apiVersion: apps/v1
kind: Deployment
metadata: {name: headlamp, namespace: monitoring}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: headlamp}
  template:
    metadata:
      labels: {app.kubernetes.io/name: headlamp}
    spec:
      serviceAccountName: headlamp
      automountServiceAccountToken: true
      hostAliases:
        # Keep the OIDC issuer URL stable while resolving it through the LAN
        # Traefik VIP from inside the cluster (avoid WAN hairpinning).
        - ip: 192.168.1.240
          hostnames: [auth.reza.network]
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.46.0@sha256:8a0ef97527544baa2b35825940ddf4db6e2d09c30cd5aa31fd269ff604cc8b75
          imagePullPolicy: IfNotPresent
          args: [-in-cluster, -plugins-dir=/headlamp/plugins, -metrics-enabled]
          env:
            - {name: HEADLAMP_CONFIG_OIDC_CLIENT_ID, value: headlamp}
            - name: HEADLAMP_CONFIG_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: headlamp-oidc
                  key: client-secret
            - name: HEADLAMP_CONFIG_OIDC_IDP_ISSUER_URL
              value: https://auth.reza.network/application/o/headlamp/
            - {name: HEADLAMP_CONFIG_OIDC_SCOPES, value: "openid,email,profile"}
          ports:
            - {name: http, containerPort: 4466}
          startupProbe: {httpGet: {path: /, port: http}, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 24}
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6}
          livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 30, timeoutSeconds: 5, failureThreshold: 3}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: headlamp-tmp, mountPath: /tmp}
        - name: access-proxy
          image: nginx:1.31.8-alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
          command: [nginx, -g, "daemon off;"]
          ports:
            - {name: access-http, containerPort: 16120}
          readinessProbe: {tcpSocket: {port: access-http}, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: access-http}, periodSeconds: 30}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: proxy-config, mountPath: /etc/nginx, readOnly: true}
            - {name: nginx-tmp, mountPath: /tmp}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
      volumes:
        - {name: headlamp-tmp, emptyDir: {}}
        - name: proxy-config
          configMap: {name: headlamp-access-proxy}
        - {name: nginx-tmp, emptyDir: {}}
        - {name: nginx-cache, emptyDir: {}}
