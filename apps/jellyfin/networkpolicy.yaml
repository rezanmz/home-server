apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: jellyfin, namespace: media}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: jellyfin}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: traefik}
      ports:
        - {port: 18096, protocol: TCP}
    - from:
        # Jellyseerr is the only workload that needs Jellyfin's raw API.
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: apps}
          podSelector:
            matchLabels: {app.kubernetes.io/name: jellyseerr}
      ports:
        - {port: 8096, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {port: 80, protocol: TCP}
        - {port: 443, protocol: TCP}
