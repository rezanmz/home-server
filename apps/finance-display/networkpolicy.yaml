apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finance-display
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: finance-display
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: actual-budget
      ports:
        - port: 5006
          protocol: TCP
