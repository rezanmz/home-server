apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-display
  namespace: apps
  labels:
    app.kubernetes.io/name: finance-display
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finance-display
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finance-display
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: finance-display
          image: ghcr.io/rezanmz/finance-display:0.2.0@sha256:f8e80e4108ecfe9dbf1e251e20d327a86b0a4538b58f0e4d12ca74492ed53f4d
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ACTUAL_SERVER_URL
              valueFrom:
                secretKeyRef: {name: finance-display-secrets, key: actual-server-url}
            - name: ACTUAL_PASSWORD
              valueFrom:
                secretKeyRef: {name: finance-display-secrets, key: actual-password}
            - name: ACTUAL_BUDGET_SYNC_ID
              valueFrom:
                secretKeyRef: {name: finance-display-secrets, key: actual-budget-sync-id}
            - name: CYD_API_TOKEN
              valueFrom:
                secretKeyRef: {name: finance-display-secrets, key: cyd-api-token}
            # Location and calendar timezone are explicit, non-secret settings.
            # They keep weather, sunset transitions, and reconciliation days aligned.
            - {name: WEATHER_LATITUDE, value: "43.6532"}
            - {name: WEATHER_LONGITUDE, value: "-79.3832"}
            - {name: LOCAL_TIME_ZONE, value: America/Toronto}
            - name: ACTUAL_DATA_DIR
              value: /var/lib/actual
            - name: FOCUS_STATE_PATH
              value: /var/lib/finance-display/focus-state.json
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: actual-data, mountPath: /var/lib/actual}
            - {name: focus-state, mountPath: /var/lib/finance-display}
      volumes:
        - name: actual-data
          emptyDir:
            sizeLimit: 64Mi
        - name: focus-state
          persistentVolumeClaim:
            claimName: finance-display-state
