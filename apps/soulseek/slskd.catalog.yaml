# yaml-language-server: $schema=../../catalog/service.schema.json
apiVersion: catalog.reza.network/v1alpha1
kind: Service
metadata:
  name: slskd
spec:
  name: slskd
  workload:
    namespace: media
    app: media-vpn
  homepage:
    order: 60
    group: Downloads & Automation
    icon: slskd.png
    description: Soulseek search and download client
  web:
    hostname: slskd.reza.network
    route: apps/soulseek/route.yaml
    visibility: private
    accessMiddleware: lan-vpn-only
    dns:
      cloudflare: true
      splitHorizon: true
    auth:
      mode: forward-auth
      profile: authentik-forward-single-v1
      blueprintName: slskd proxy authentication
      application:
        slug: slskd
        launchUrl: https://slskd.reza.network/
      middleware: slskd-authentik
  placement:
    mode: beelink
    manifest: apps/downloads/deployment.yaml
    reason: Shares the existing Gluetun network namespace and Proton connection so Soulseek traffic remains behind the VPN kill switch.
  data:
    class: mixed
    protection: longhorn-b2
    manifests:
      - apps/soulseek/pvc.yaml
      - infrastructure/nfs-media/media.yaml
    note: Longhorn protects slskd state; completed downloads on NFS are reproducible acquisition data.
  observability:
    mode: metrics
    manifests: [apps/soulseek/monitoring.yaml]
