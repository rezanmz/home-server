apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sabnzbd-vpn
  namespace: media
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sabnzbd-vpn
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: media-vpn
      ports:
        - {port: 8080, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - {port: 18081, protocol: TCP}
  egress:
    # Gluetun owns the VPN routes, firewall and kill switch for this pod.
    - {}
