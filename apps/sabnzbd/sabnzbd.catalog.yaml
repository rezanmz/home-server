# yaml-language-server: $schema=../../catalog/service.schema.json
apiVersion: catalog.reza.network/v1alpha1
kind: Service
metadata:
  name: sabnzbd
spec:
  name: SABnzbd
  workload:
    namespace: media
    app: sabnzbd-vpn
  homepage:
    order: 15
    group: Downloads & Automation
    icon: sabnzbd.png
    description: Usenet downloads
  web:
    hostname: sabnzbd.reza.network
    route: apps/sabnzbd/route.yaml
    visibility: private
    accessMiddleware: lan-vpn-only
    dns:
      cloudflare: false
      splitHorizon: true
    auth:
      mode: native
      reason: SABnzbd uses its native application authentication behind the LAN/WireGuard boundary.
  placement:
    mode: floating
    manifest: apps/sabnzbd/deployment.yaml
    reason: Its singleton pod owns a dedicated Gluetun network namespace and Proton WireGuard session.
  data:
    class: mixed
    protection: longhorn-b2
    manifests:
      - apps/sabnzbd/pvc.yaml
      - infrastructure/nfs-media/media.yaml
    note: Longhorn protects SABnzbd and Gluetun state; downloaded NFS media remains reproducible acquisition data.
  observability:
    mode: kubernetes
