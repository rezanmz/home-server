name: GPT Researcher model maintenance

on:
  workflow_dispatch:
    inputs:
      fast_model:
        description: "FAST_LLM OpenRouter ID; blank keeps the current model"
        required: false
        type: string
      smart_model:
        description: "SMART_LLM OpenRouter ID; blank keeps the current model"
        required: false
        type: string
      strategic_model:
        description: "STRATEGIC_LLM OpenRouter ID; blank keeps the current model"
        required: false
        type: string
  schedule:
    # Catalog-only check. It opens no issue or PR unless a human dispatches an
    # update, so normal healthy runs do not create notification noise.
    - cron: "17 13 * * 1"

permissions:
  contents: read

concurrency:
  group: gpt-researcher-models-${{ github.event_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate-current:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Validate current role models against OpenRouter
        run: >-
          python3 scripts/update_gpt_researcher_models.py
          --github-summary

  propose-update:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      FAST_MODEL: ${{ inputs.fast_model }}
      SMART_MODEL: ${{ inputs.smart_model }}
      STRATEGIC_MODEL: ${{ inputs.strategic_model }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: true

      - name: Validate and apply requested role mappings
        id: update
        run: |
          set -euo pipefail
          python3 scripts/update_gpt_researcher_models.py \
            --fast-model "$FAST_MODEL" \
            --smart-model "$SMART_MODEL" \
            --strategic-model "$STRATEGIC_MODEL" \
            --github-summary
          if git diff --quiet -- apps/gpt-researcher/config/researcher.json; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify updater and repository policy
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 -m unittest discover --start-directory scripts/ci --pattern 'test_*.py'
          python3 scripts/ci/validate-secrets.py
          git diff --check

      - name: Push reviewed update candidate
        if: steps.update.outputs.changed == 'true'
        id: candidate
        run: |
          set -euo pipefail
          branch="automation/gpt-researcher-models-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add apps/gpt-researcher/config/researcher.json
          git commit -m "chore(gpt-researcher): update role models"
          git push --set-upstream origin "$branch"
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"

      - name: Run full cluster validation on candidate
        if: steps.update.outputs.changed == 'true'
        id: validation
        env:
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.branch }}
        run: |
          set -euo pipefail
          gh workflow run validate-cluster.yml --ref "$CANDIDATE_BRANCH"
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(
              gh run list \
                --workflow validate-cluster.yml \
                --branch "$CANDIDATE_BRANCH" \
                --event workflow_dispatch \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty'
            )"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            printf 'Unable to locate dispatched validation run.\n' >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status
          printf 'url=%s\n' "$(gh run view "$run_id" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: Open approval pull request
        if: steps.update.outputs.changed == 'true'
        env:
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.branch }}
          VALIDATION_URL: ${{ steps.validation.outputs.url }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          {
            printf '%s\n' '## Summary'
            printf '\n%s\n' '- update the explicitly requested GPT Researcher LLM role mappings'
            printf '%s\n' '- preserve embedding configuration and all research depth/cost limits'
            printf '%s\n' '- validate model availability, text output, context, output limit, parameters, expiration, and catalog pricing'
            printf '\n%s\n' '## Approval boundary'
            printf '\n%s\n' 'This workflow does not recommend, benchmark, merge, or deploy a model. Review the Model Steward evidence and this diff before merging.'
            printf '\nFull cluster validation: %s\n' "$VALIDATION_URL"
          } > "$body"
          gh pr create \
            --base main \
            --head "$CANDIDATE_BRANCH" \
            --title "chore(gpt-researcher): update role models" \
            --body-file "$body"

      - name: Report no change
        if: steps.update.outputs.changed != 'true'
        run: >-
          printf '%s\n'
          'All submitted values were blank or already matched the Git-managed configuration; no PR was created.'
