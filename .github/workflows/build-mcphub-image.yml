name: Build MCPHub image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/**
    paths:
      - .github/workflows/build-mcphub-image.yml
      - images/mcphub-gptr/**
      - scripts/build-mcphub-gptr-image.sh

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install multi-architecture emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Configure Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, test, attest, and push MCPHub
        env:
          MCPHUB_IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
          MCPHUB_BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: scripts/build-mcphub-gptr-image.sh
