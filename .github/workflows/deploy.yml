name: Deploy Services

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Deploy all services (full stack redeploy)'
        required: false
        type: boolean
        default: true

jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      changed-services: ${{ steps.changed-services.outputs.changed_services }}
      deleted-services: ${{ steps.changed-services.outputs.deleted_services }}
      all-services: ${{ steps.changed-services.outputs.all_services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: services/**
          dir_names: true
          dir_names_max_depth: 2

      - name: Detect changed services
        id: changed-services
        # Security: use env vars instead of ${{ }} interpolation in run blocks
        # to prevent script injection via crafted filenames/branch names.
        env:
          CHANGED_DIRS: ${{ steps.changed-files.outputs.all_changed_files }}
          DELETED_DIRS: ${{ steps.changed-files.outputs.deleted_files }}
          DEPLOY_ALL: ${{ github.event.inputs.deploy_all }}
        run: |
          # Get all changed directories in services/
          changed_dirs="$CHANGED_DIRS"
          deleted_dirs="$DELETED_DIRS"

          # Initialize arrays
          changed_services=()
          deleted_services=()
          all_services=()

          # Get all existing services
          if [ -d "services" ]; then
            for service_dir in services/*/; do
              if [ -d "$service_dir" ]; then
                service_name=$(basename "$service_dir")
                all_services+=("$service_name")
              fi
            done
          fi

          # Manual trigger with deploy_all: treat ALL services as changed
          if [ "$DEPLOY_ALL" = "true" ]; then
            echo "Manual deploy-all triggered — marking all services as changed"
            changed_services=("${all_services[@]}")
          else
            # Process changed directories (existing services that changed)
            for dir in $changed_dirs; do
              if [[ "$dir" == services/* ]]; then
                # Extract service name (first subdirectory under services/)
                service_path=${dir#services/}
                service_name=${service_path%%/*}
                
                if [ -n "$service_name" ] && [ "$service_name" != "services" ]; then
                  if [ -d "services/$service_name" ]; then
                    # Service still exists, it's changed
                    if [[ ! " ${changed_services[@]} " =~ " ${service_name} " ]]; then
                      changed_services+=("$service_name")
                    fi
                  fi
                fi
              fi
            done

            # Process deleted directories (services that were removed)
            for dir in $deleted_dirs; do
              if [[ "$dir" == services/* ]]; then
                # Extract service name (first subdirectory under services/)
                service_path=${dir#services/}
                service_name=${service_path%%/*}
                
                if [ -n "$service_name" ] && [ "$service_name" != "services" ]; then
                  # Add to deleted services if not already present
                  if [[ ! " ${deleted_services[@]} " =~ " ${service_name} " ]]; then
                    deleted_services+=("$service_name")
                  fi
                fi
              fi
            done
          fi

          # Convert arrays to JSON (compact format for GitHub Actions)
          if [ ${#changed_services[@]} -eq 0 ]; then
            changed_services_json="[]"
          else
            changed_services_json=$(printf '%s\n' "${changed_services[@]}" | jq -R . | jq -s -c .)
          fi

          if [ ${#deleted_services[@]} -eq 0 ]; then
            deleted_services_json="[]"
          else
            deleted_services_json=$(printf '%s\n' "${deleted_services[@]}" | jq -R . | jq -s -c .)
          fi

          if [ ${#all_services[@]} -eq 0 ]; then
            all_services_json="[]"
          else
            all_services_json=$(printf '%s\n' "${all_services[@]}" | jq -R . | jq -s -c .)
          fi

          echo "changed_services=$changed_services_json" >> $GITHUB_OUTPUT
          echo "deleted_services=$deleted_services_json" >> $GITHUB_OUTPUT
          echo "all_services=$all_services_json" >> $GITHUB_OUTPUT

          echo "Changed services: $changed_services_json"
          echo "Deleted services: $deleted_services_json"
          echo "All services: $all_services_json"

  stop-deleted-services:
    runs-on: self-hosted
    needs: detect-changes
    if: needs.detect-changes.outputs.deleted-services != '[]'
    steps:
      - name: Stop and remove deleted services
        # Security: avoid direct interpolation in shell to prevent script injection.
        env:
          DELETED_SERVICES: ${{ needs.detect-changes.outputs.deleted-services }}
        run: |
          deleted_services="$DELETED_SERVICES"

          # Parse JSON array and process each service
          echo "$deleted_services" | jq -r '.[]' | while read -r service; do
            if [ -n "$service" ]; then
              echo "Stopping and removing service: $service"

              # Stop and remove containers
              docker compose -p "$service" down --remove-orphans || true

              # Remove unused volumes (optional, be careful with this)
              # docker volume prune -f

              echo "Service $service has been stopped and removed"
            fi
          done

  deploy-changed-services:
    runs-on: self-hosted
    needs: [detect-changes, stop-deleted-services]
    if: always() && needs.detect-changes.outputs.changed-services != '[]'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy changed services
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROTONVPN_WIREGUARD_PRIVATE_KEY: ${{ secrets.PROTONVPN_WIREGUARD_PRIVATE_KEY }}
          PIHOLE_PASSWORD: ${{ secrets.PIHOLE_PASSWORD }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
          SAMBA_PASSWORD: ${{ secrets.SAMBA_PASSWORD }}
          DUPLICATI_ENCRYPTION_KEY: ${{ secrets.DUPLICATI_ENCRYPTION_KEY }}
          SPEEDTEST_TRACKER_APP_KEY: ${{ secrets.SPEEDTEST_TRACKER_APP_KEY }}
          VIKUNJA_JWT_SECRET: ${{ secrets.VIKUNJA_JWT_SECRET }}
          # Security: pass job outputs via env to prevent script injection.
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.changed-services }}
        run: |
          changed_services="$CHANGED_SERVICES"

          # Auto-detect deployment order from docker-compose dependencies.
          # Scans for `network_mode: container:<name>` to find cross-service
          # dependencies, then topologically sorts so dependencies deploy first.
          # No hard-coded order needed — it's derived from the actual configs.

          declare -A container_to_service  # maps container_name -> service directory name
          declare -A service_deps          # maps service -> space-separated list of dependency services

          # Step 1: Build a map of container_name -> service for ALL services (not just changed ones)
          for service_dir in services/*/; do
            if [ -d "$service_dir" ]; then
              svc=$(basename "$service_dir")
              compose_file="$service_dir/docker-compose.yml"
              [ ! -f "$compose_file" ] && compose_file="$service_dir/docker-compose.yaml"
              [ ! -f "$compose_file" ] && continue

              # Extract container_name values from the compose file
              while IFS= read -r cname; do
                [ -n "$cname" ] && container_to_service["$cname"]="$svc"
              done < <(grep -E '^\s+container_name:' "$compose_file" | sed 's/.*container_name:\s*//' | tr -d '"' | tr -d "'" | xargs -n1)
            fi
          done

          # Step 2: Build dependency map for ALL services (not just changed ones)
          for service_dir in services/*/; do
            if [ -d "$service_dir" ]; then
              service=$(basename "$service_dir")
              compose_file="$service_dir/docker-compose.yml"
              [ ! -f "$compose_file" ] && compose_file="$service_dir/docker-compose.yaml"
              [ ! -f "$compose_file" ] && continue

              while IFS= read -r dep_container; do
                dep_container=$(echo "$dep_container" | xargs)  # trim whitespace
                [ -z "$dep_container" ] && continue
                dep_service="${container_to_service[$dep_container]:-}"
                if [ -n "$dep_service" ] && [ "$dep_service" != "$service" ]; then
                  service_deps["$service"]+="$dep_service "
                fi
              done < <(grep -E '^\s+network_mode:\s*container:' "$compose_file" | sed 's/.*network_mode:\s*container://' | tr -d '"' | tr -d "'")
            fi
          done

          # Step 2b: Reverse dependency resolution — if a base service changed,
          # auto-include all services that depend on it (they need redeployment
          # because the base container gets recreated with a new ID).
          changed_containers=()
          for service in $(echo "$changed_services" | jq -r '.[]'); do
            compose_file="services/$service/docker-compose.yml"
            [ ! -f "$compose_file" ] && compose_file="services/$service/docker-compose.yaml"
            [ ! -f "$compose_file" ] && continue
            while IFS= read -r cname; do
              [ -n "$cname" ] && changed_containers+=("$cname")
            done < <(grep -E '^\s+container_name:' "$compose_file" | sed 's/.*container_name:\s*//' | tr -d '"' | tr -d "'" | xargs -n1)
          done

          for svc in "${!service_deps[@]}"; do
            for dep in ${service_deps[$svc]}; do
              # Check if any container from the dependency service was changed
              for cc in "${changed_containers[@]}"; do
                dep_svc="${container_to_service[$cc]:-}"
                if [ "$dep_svc" = "$dep" ]; then
                  # This service depends on a changed container — auto-include it
                  if ! echo "$changed_services" | jq -e --arg s "$svc" 'index($s) != null' > /dev/null 2>&1; then
                    echo "Auto-including '$svc' (depends on changed container '$cc' from '$dep')"
                    changed_services=$(echo "$changed_services" | jq --arg s "$svc" '. + [$s]')
                  fi
                  break 2
                fi
              done
            done
          done

          # Step 3: Topological sort — deploy dependencies before dependents
          sorted_services=()
          visited=()

          topo_visit() {
            local svc="$1"
            # Skip if already visited
            for v in "${visited[@]}"; do
              [ "$v" = "$svc" ] && return
            done
            visited+=("$svc")

            # Visit dependencies first (only if they're in the changed set)
            for dep in ${service_deps[$svc]:-}; do
              if echo "$changed_services" | jq -e --arg s "$dep" 'index($s) != null' > /dev/null 2>&1; then
                topo_visit "$dep"
              fi
            done

            sorted_services+=("$svc")
          }

          # Visit services with dependencies first, then the rest (alphabetically)
          for service in $(echo "$changed_services" | jq -r '.[]' | sort); do
            if [ -n "${service_deps[$service]:-}" ]; then
              topo_visit "$service"
            fi
          done
          for service in $(echo "$changed_services" | jq -r '.[]' | sort); do
            topo_visit "$service"
          done

          echo "Deployment order (auto-detected): ${sorted_services[*]}"

          # Deploy each service in order
          for service in "${sorted_services[@]}"; do
            if [ -n "$service" ]; then
              echo "=== Processing service: $service ==="
              
              service_dir="services/$service"

              # Validate service configuration
              echo "Validating service configuration for: $service"
              if [ ! -d "$service_dir" ]; then
                echo "Error: Service directory $service_dir does not exist"
                exit 1
              fi

              if [ ! -f "$service_dir/docker-compose.yml" ] && [ ! -f "$service_dir/docker-compose.yaml" ]; then
                echo "Error: No docker-compose file found in $service_dir"
                exit 1
              fi

              echo "Service $service configuration is valid"

              # Deploy the service
              echo "Deploying service: $service"
              cd "$service_dir"

              # Check for and run pre-deploy script
              echo "Checking for pre-deploy script for service: $service"
              for script_name in "pre-deploy.sh" "setup.sh" "init.sh"; do
                if [ -f "$script_name" ]; then
                  echo "Found $script_name, executing..."
                  chmod +x "$script_name"
                  if ./"$script_name"; then
                    echo "✅ Pre-deploy script $script_name executed successfully"
                  else
                    echo "❌ Pre-deploy script $script_name failed with exit code $?"
                    exit 1
                  fi
                  break
                fi
              done

              # Stop existing containers
              docker compose -p "$service" down || true

              # Pull latest images
              docker compose -p "$service" pull

              # Start the service
              docker compose -p "$service" up -d

              # Wait a moment for the service to start
              sleep 5

              # Check if containers are running
              if docker compose -p "$service" ps --services --filter "status=running" | grep -q .; then
                echo "✅ Service $service deployed successfully"
              else
                echo "⚠️ Warning: Some containers in service $service may not be running"
                docker compose -p "$service" ps
              fi

              echo "Completed deployment of service: $service"
              echo ""
              cd - > /dev/null
            fi
          done

  health-check-and-recovery:
    runs-on: self-hosted
    needs: [detect-changes, deploy-changed-services, stop-deleted-services]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Health check and recovery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROTONVPN_WIREGUARD_PRIVATE_KEY: ${{ secrets.PROTONVPN_WIREGUARD_PRIVATE_KEY }}
          PIHOLE_PASSWORD: ${{ secrets.PIHOLE_PASSWORD }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
          SAMBA_PASSWORD: ${{ secrets.SAMBA_PASSWORD }}
          DUPLICATI_ENCRYPTION_KEY: ${{ secrets.DUPLICATI_ENCRYPTION_KEY }}
          SPEEDTEST_TRACKER_APP_KEY: ${{ secrets.SPEEDTEST_TRACKER_APP_KEY }}
          VIKUNJA_JWT_SECRET: ${{ secrets.VIKUNJA_JWT_SECRET }}
        run: |
          echo "=== Health Check and Recovery ==="

          # Check all services in the services directory
          for service_dir in services/*/; do
            if [ -d "$service_dir" ]; then
              service=$(basename "$service_dir")
              echo "Checking health of service: $service"
              
              cd "$service_dir"
              
              # Check if any containers are supposed to be running
              if [ -f "docker-compose.yml" ] || [ -f "docker-compose.yaml" ]; then
                # Get list of services that should be running
                running_services=$(docker compose -p "$service" ps --services --filter "status=running" 2>/dev/null || echo "")
                expected_services=$(docker compose -p "$service" config --services 2>/dev/null || echo "")
                
                if [ -n "$expected_services" ]; then
                  if [ -z "$running_services" ]; then
                    echo "⚠️ Service $service has no running containers. Attempting recovery..."
                    
                    # Check for and run pre-deploy script before recovery
                    echo "Checking for pre-deploy script during recovery for service: $service"
                    for script_name in "pre-deploy.sh" "setup.sh" "init.sh"; do
                      if [ -f "$script_name" ]; then
                        echo "Found $script_name, executing for recovery..."
                        chmod +x "$script_name"
                        if ./"$script_name"; then
                          echo "✅ Pre-deploy script $script_name executed successfully during recovery"
                        else
                          echo "❌ Pre-deploy script $script_name failed during recovery with exit code $?"
                          continue  # Don't exit, try to recover anyway
                        fi
                        break
                      fi
                    done
                    
                    docker compose -p "$service" up -d
                    sleep 10
                    
                    # Check again
                    running_services=$(docker compose -p "$service" ps --services --filter "status=running" 2>/dev/null || echo "")
                    if [ -n "$running_services" ]; then
                      echo "✅ Service $service recovered successfully"
                    else
                      echo "❌ Service $service failed to recover"
                      docker compose -p "$service" logs --tail=20
                    fi
                  else
                    echo "✅ Service $service is running"
                  fi
                fi
              fi
              
              cd - > /dev/null
            fi
          done

          echo "=== Health check completed ==="
