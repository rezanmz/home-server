name: Build CYD OTA updater image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/**
      - omos/**
    paths:
      - .github/workflows/build-cyd-ota-image.yml
      - apps/cyd-ota/dashboard.yaml
      - images/cyd-ota/**
      - scripts/build-cyd-ota-image.sh

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure Buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker-container

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CYD OTA updater
        env:
          CYD_OTA_IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
          CYD_OTA_BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: scripts/build-cyd-ota-image.sh
