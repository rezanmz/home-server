services:
  actual-budget:
    image: actualbudget/actual-server:26.3.0
    user: "1000:1000"
    container_name: actual-budget
    # No ports exposed to host - only accessible via internal network
    expose:
      - "5006"
    volumes:
      - ~/persistent/actual-budget:/data
    networks:
      - home-server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - ACTUAL_LOGIN_METHOD=openid
      - ACTUAL_OPENID_DISCOVERY_URL=https://accounts.google.com/.well-known/openid-configuration
      - ACTUAL_OPENID_AUTH_METHOD=openid
      - ACTUAL_OPENID_ENFORCE=true
      - ACTUAL_TOKEN_EXPIRATION=7200
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5006/ || exit 1
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1G

networks:
  home-server:
    external: true
