services:
  actual-budget:
    image: actualbudget/actual-server:26.6.0
    user: "1000:1000"
    container_name: actual-budget
    # No ports exposed to host - only accessible via internal network
    expose:
      - "5006"
    volumes:
      - ~/persistent/actual-budget:/data
    networks:
      - home-server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=America/Toronto
      - ACTUAL_LOGIN_METHOD=openid
      - ACTUAL_ALLOWED_LOGIN_METHODS=openid
      - ACTUAL_OPENID_DISCOVERY_URL=https://accounts.google.com/.well-known/openid-configuration
      - ACTUAL_OPENID_AUTH_METHOD=openid
      - ACTUAL_TOKEN_EXPIRATION=7200
      - ACTUAL_OPENID_SERVER_HOSTNAME=https://budget.reza.network
      - ACTUAL_OPENID_CLIENT_ID=${ACTUAL_OPENID_CLIENT_ID}
      - ACTUAL_OPENID_CLIENT_SECRET=${ACTUAL_OPENID_CLIENT_SECRET}
    healthcheck:
      test: node /app/src/scripts/health-check.js || exit 1
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1G

networks:
  home-server:
    external: true
