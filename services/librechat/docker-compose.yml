services:
  api:
    container_name: librechat
    image: ghcr.io/danny-avila/librechat:v0.8.4
    restart: unless-stopped
    ports:
      - "3080:3080"
    depends_on:
      - librechat-mongodb
      - librechat-rag_api
      - librechat-meilisearch
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://librechat-mongodb:27017/LibreChat
      - MEILI_HOST=http://librechat-meilisearch:7700
      - RAG_PORT=8000
      - RAG_API_URL=http://librechat-rag_api:8000
    volumes:
      - ~/persistent/librechat/.env:/app/.env
      - ~/persistent/librechat/librechat.yaml:/app/librechat.yaml
      - ~/persistent/librechat/images:/app/client/public/images
      - ~/persistent/librechat/uploads:/app/uploads
      - ~/persistent/librechat/logs:/app/logs
    networks:
      - home-server

  librechat-mongodb:
    container_name: librechat-mongodb
    image: mongo:4.4.18
    restart: unless-stopped
    volumes:
      - ~/persistent/librechat/data-node:/data/db
    command: mongod --noauth
    networks:
      - home-server

  librechat-meilisearch:
    container_name: librechat-meilisearch
    image: getmeili/meilisearch:v1.35.1
    restart: unless-stopped
    environment:
      - MEILI_HOST=http://librechat-meilisearch:7700
      - MEILI_NO_ANALYTICS=true
    env_file:
      - ~/persistent/librechat/.env
    volumes:
      - ~/persistent/librechat/meili_data_v1.35.1:/meili_data
    networks:
      - home-server

  librechat-vectordb:
    container_name: librechat-vectordb
    image: pgvector/pgvector:0.8.0-pg15-trixie
    environment:
      - POSTGRES_DB=librechat_rag
      - POSTGRES_USER=librechat
      - POSTGRES_PASSWORD=librechat_pass
    restart: unless-stopped
    volumes:
      - ~/persistent/librechat/pgdata2:/var/lib/postgresql/data
    networks:
      - home-server

  librechat-rag_api:
    container_name: librechat-rag_api
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest
    environment:
      - DB_HOST=librechat-vectordb
      - RAG_PORT=8000
      - POSTGRES_DB=librechat_rag
      - POSTGRES_USER=librechat
      - POSTGRES_PASSWORD=librechat_pass
    restart: unless-stopped
    depends_on:
      - librechat-vectordb
    env_file:
      - ~/persistent/librechat/.env
    networks:
      - home-server

networks:
  home-server:
    external: true
