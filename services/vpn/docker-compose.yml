services:
  vpn:
    image: ghcr.io/wg-easy/wg-easy:15.2.2
    container_name: wg-easy
    environment:
      - WG_HOST=vpn.reza.network
      - WG_ALLOWED_IPS=192.168.2.0/24,10.8.0.0/24
      - WG_DEFAULT_DNS=192.168.2.2

    volumes:
      - ~/persistent/vpn/config:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "1234:51820/udp" # The VPN Tunnel
      # We do NOT expose 51821 directly to the host; we use the home-server network to proxy it via Swag
    networks:
      - home-server
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  home-server:
    external: true