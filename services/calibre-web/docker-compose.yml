services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:0.6.26-ls388
    container_name: calibre-web
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - ~/persistent/calibre-web/config:/config
      - ~/media/books:/books
    # Web UI is internal-only, accessed via SWAG reverse proxy
    expose:
      - "8083"
    networks:
      - home-server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: curl -f http://localhost:8083 || exit 1
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  home-server:
    external: true
