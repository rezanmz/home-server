services:
  hermes:
    build:
      context: ~/persistent/hermes/agent-source
    image: hermes-agent:v2026.4.3
    container_name: hermes
    command: gateway run
    volumes:
      - ~/persistent/hermes/data:/opt/data
    shm_size: "1g"
    networks:
      - home-server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:0.36.2
    container_name: hermes-webui
    expose:
      - "8787"
    command: >
      sh -c "pip install --user -r /opt/hermes-agent/requirements.txt && python server.py"
    volumes:
      - ~/persistent/hermes/webui-data:/data
      - ~/persistent/hermes/webui-local:/root/.local
      - ~/persistent/hermes/agent-source:/opt/hermes-agent:ro
      - ~/.hermes:/root/.hermes
    environment:
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/data
      - HERMES_WEBUI_AGENT_DIR=/opt/hermes-agent
      - HERMES_WEBUI_PASSWORD=${HERMES_WEBUI_PASSWORD}
    networks:
      - home-server
    restart: unless-stopped

networks:
  home-server:
    external: true
