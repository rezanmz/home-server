services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.10
    container_name: jellyfin
    user: "1000:1000"
    environment:
      - TZ=America/Toronto
    expose:
      - "8096"
    ports:
      - '192.168.1.2:7359:7359/udp' # Client discovery (LAN)
      - '192.168.1.2:1900:1900/udp' # DLNA service (LAN)
    volumes:
      - ~/persistent/jellyfin/config:/config
      - ~/persistent/jellyfin/cache:/cache
      - type: bind
        source: ~/media/movies
        target: /media/movies
        read_only: true
      - type: bind
        source: ~/media/tv
        target: /media/tv
        read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/dri:/dev/dri
    networks:
      - home-server
    healthcheck:
      test: curl -f http://localhost:8096/health || exit 1
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 4G

networks:
  home-server:
    external: true