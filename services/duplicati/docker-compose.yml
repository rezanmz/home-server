services:
  duplicati:
    image: linuxserver/duplicati:v2.3.0.3_stable_2026-06-10-ls298
    container_name: duplicati
    # Root is required to read/write all service configs for backup and restore
    # (e.g. Pi-hole, VPN, SWAG configs have varying ownership).
    # cap_drop: [ALL] strips dangerous root capabilities (module loading, raw
    # sockets, etc.) so a compromised container has far less power.
    cap_drop: [ALL]
    cap_add:
      - SETUID
      - SETGID
      - DAC_READ_SEARCH
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Toronto
      - SETTINGS_ENCRYPTION_KEY=${DUPLICATI_ENCRYPTION_KEY}
    volumes:
      - ~/persistent/duplicati/config:/config
      - ~/persistent/duplicati/backups:/backups
      - ~/persistent:/source
    expose:
      - "8200"
    networks:
      - home-server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: curl -f http://localhost:8200 || exit 1
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

networks:
  home-server:
    external: true
