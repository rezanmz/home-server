services:
  duplicati:
    image: lscr.io/linuxserver/duplicati:2.2.0
    container_name: duplicati
    environment:
      # Run as root to read all service configs regardless of ownership (e.g. Pi-hole, VPN).
      # Safe because /source is mounted read-only and no-new-privileges is set.
      - PUID=0
      - PGID=0
      - TZ=EST
      - SETTINGS_ENCRYPTION_KEY=${DUPLICATI_ENCRYPTION_KEY}
    volumes:
      - ~/persistent/duplicati/config:/config
      - ~/persistent/duplicati/backups:/backups
      - ~/persistent:/source
    expose:
      - "8200"
    networks:
      - home-server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

networks:
  home-server:
    external: true
