services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.1
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    expose:
      - "8080"
    volumes:
      - ~/persistent/gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${NORD_WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=Switzerland
      - TZ=EST
      # - DOT=off
      - DNS_ADDRESS=1.1.1.1
      - FIREWALL_OUTBOUND_SUBNETS=192.168.0.0/24
    networks:
      - home-server
    restart: always
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1

  qbittorrent:
    image: linuxserver/qbittorrent:5.1.4
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=EST
      - WEBUI_PORT=8080
    volumes:
      - ~/persistent/qbittorrent/config:/config
      - ~/media:/media
    network_mode: service:gluetun
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy

networks:
  home-server:
    external: true