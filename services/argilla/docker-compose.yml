x-argilla-common-variables: &argilla-common-variables
  ARGILLA_HOME_PATH: /var/lib/argilla
  ARGILLA_ELASTICSEARCH: http://argilla-elasticsearch:9200
  ARGILLA_DATABASE_URL: postgresql+asyncpg://argilla:argilla-postgres-pass@argilla-postgres:5432/argilla
  ARGILLA_REDIS_URL: redis://argilla-redis:6379/0
  HF_HUB_DISABLE_TELEMETRY: "1"

services:
  argilla:
    image: argilla/argilla-server:v2.8.0
    container_name: argilla
    restart: unless-stopped
    expose:
      - "6900"
    environment:
      <<: *argilla-common-variables
      USERNAME: ${ARGILLA_USERNAME:-argilla}
      PASSWORD: ${ARGILLA_PASSWORD}
      API_KEY: ${ARGILLA_API_KEY}
      WORKSPACE: default
    volumes:
      - ~/persistent/argilla/data:/var/lib/argilla
    networks:
      - home-server
    depends_on:
      argilla-postgres:
        condition: service_healthy
      argilla-elasticsearch:
        condition: service_healthy
      argilla-redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:6900/api/v1/status', timeout=5)\" || exit 1"]
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 1G

  argilla-worker:
    image: argilla/argilla-server:v2.8.0
    container_name: argilla-worker
    restart: unless-stopped
    environment:
      <<: *argilla-common-variables
      BACKGROUND_NUM_WORKERS: 2
    command: sh -c 'python -m argilla_server worker --num-workers $${BACKGROUND_NUM_WORKERS}'
    volumes:
      - ~/persistent/argilla/data:/var/lib/argilla
    networks:
      - home-server
    depends_on:
      argilla-postgres:
        condition: service_healthy
      argilla-elasticsearch:
        condition: service_healthy
      argilla-redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  argilla-postgres:
    image: postgres:18
    container_name: argilla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: argilla
      POSTGRES_PASSWORD: argilla-postgres-pass
      POSTGRES_DB: argilla
    volumes:
      - ~/persistent/argilla/postgres:/var/lib/postgresql/data
    networks:
      - home-server
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  argilla-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: argilla-elasticsearch
    restart: unless-stopped
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m -XX:UseSVE=0
      - CLI_JAVA_OPTS=-XX:UseSVE=0
      - node.name=argilla-elasticsearch
      - cluster.name=argilla-home-server
      - discovery.type=single-node
      - cluster.routing.allocation.disk.threshold_enabled=false
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ~/persistent/argilla/elasticsearch:/usr/share/elasticsearch/data
    networks:
      - home-server
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 768M

  argilla-redis:
    image: redis:8.8.0
    container_name: argilla-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ~/persistent/argilla/redis:/data
    networks:
      - home-server
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

networks:
  home-server:
    external: true
