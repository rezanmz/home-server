services:
  samba:
    image: ghcr.io/servercontainers/samba:a3.23.3-s4.22.8-r0
    container_name: samba
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "192.168.1.2:139:139"     # NetBIOS Session Service
      - "192.168.1.2:445:445"     # SMB over TCP
      - "192.168.1.2:137:137/udp" # NetBIOS Name Service
      - "192.168.1.2:138:138/udp" # NetBIOS Datagram Service
      # - "5353:5353/udp" # mDNS for service discovery
    environment:
      # Server identification
      MODEL: 'TimeCapsule'
      AVAHI_NAME: HomeServer
      TZ: America/Toronto
      
      # Samba configuration
      SAMBA_CONF_LOG_LEVEL: 1
      SAMBA_CONF_WORKGROUP: WORKGROUP
      SAMBA_CONF_SERVER_STRING: Home Media Server
      
      # Create a media user group
      GROUP_media: 1500
      
      # Create a media user account
      ACCOUNT_pi: ${SAMBA_PASSWORD}
      UID_pi: 1000
      GROUPS_pi: media
      
      # Media shares configuration
      SAMBA_VOLUME_CONFIG_media: "[Media]; path=/media; valid users = pi; guest ok = no; read only = no; browseable = yes; force group = media"
      
      # Optional: Public read-only access (uncomment if you want guest access)
      # SAMBA_VOLUME_CONFIG_movies_public: "[Movies (Public)]; path=/media/movies; guest ok = yes; read only = yes; browseable = yes"
      # SAMBA_VOLUME_CONFIG_tv_public: "[TV Shows (Public)]; path=/media/tv; guest ok = yes; read only = yes; browseable = yes"
      
    volumes:
      - type: bind
        source: ~/media
        target: /media
      
      # Avahi service discovery (optional - for automatic network discovery)
      - /etc/avahi/services/:/external/avahi

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
