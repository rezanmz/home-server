services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.8.12
    container_name: open-webui
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ~/persistent/open-webui/data:/app/backend/data
    environment:
      - TZ=America/Toronto
    networks:
      - home-server
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: curl -fs http://localhost:8080/health || exit 1
      start_period: 30s
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

networks:
  home-server:
    external: true
