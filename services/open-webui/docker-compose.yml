services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.10.2
    container_name: open-webui
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ~/persistent/open-webui/data:/app/backend/data
    environment:
      - TZ=America/Toronto
      - ENABLE_OLLAMA_API=False
      - CONTENT_EXTRACTION_ENGINE=tika
      - TIKA_SERVER_URL=http://tika:9998
      - BYPASS_MODEL_ACCESS_CONTROL=True
      - WEBUI_URL=https://chat.reza.network
      - WEBUI_SECRET_KEY=${OPEN_WEBUI_SECRET_KEY:?OPEN_WEBUI_SECRET_KEY must be set}
      - ENABLE_SIGNUP=False
      - ENABLE_LOGIN_FORM=False
      - ENABLE_PASSWORD_AUTH=False
      - ENABLE_OAUTH_SIGNUP=True
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=True
      - ENABLE_OAUTH_PERSISTENT_CONFIG=False
      - ENABLE_OAUTH_ID_TOKEN_COOKIE=False
      - OAUTH_CLIENT_ID=${OPEN_WEBUI_OAUTH_CLIENT_ID:?OPEN_WEBUI_OAUTH_CLIENT_ID must be set}
      - OAUTH_CLIENT_SECRET=${OPEN_WEBUI_OAUTH_CLIENT_SECRET:?OPEN_WEBUI_OAUTH_CLIENT_SECRET must be set}
      - OPENID_PROVIDER_URL=https://auth.reza.network/application/o/open-webui/.well-known/openid-configuration
      - OAUTH_PROVIDER_NAME=Authentik
      - OAUTH_SCOPES=openid email profile
      - OPENID_REDIRECT_URI=https://chat.reza.network/oauth/oidc/callback
      - ENABLE_OAUTH_ROLE_MANAGEMENT=True
      - OAUTH_ROLES_CLAIM=groups
      - OAUTH_ALLOWED_ROLES=${OPEN_WEBUI_OAUTH_ALLOWED_ROLES:-open-webui-users}
      - OAUTH_ADMIN_ROLES=${OPEN_WEBUI_OAUTH_ADMIN_ROLES:-open-webui-admins}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - home-server
    depends_on:
      tika:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: curl -fs http://localhost:8080/health || exit 1
      start_period: 30s
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1536M
        reservations:
          memory: 768M

  tika:
    image: apache/tika:3.3.1.0-full
    container_name: tika
    restart: unless-stopped
    expose:
      - "9998"
    networks:
      - home-server
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9998/tika | grep -q 'Apache Tika' || exit 1"]
      start_period: 30s
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  home-server:
    external: true
