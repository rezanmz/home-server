services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.8.12
    container_name: open-webui
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ~/persistent/open-webui/data:/app/backend/data
    environment:
      - TZ=America/Toronto
      - ENABLE_OLLAMA_API=False
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - home-server
    depends_on:
      tika:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: curl -fs http://localhost:8080/health || exit 1
      start_period: 30s
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  tika:
    image: apache/tika:3.2.3.0-full
    container_name: tika
    restart: unless-stopped
    expose:
      - "9998"
    networks:
      - home-server
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9998/tika || exit 1"]
      start_period: 30s
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  home-server:
    external: true
