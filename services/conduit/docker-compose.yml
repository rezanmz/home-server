services:
  conduit:
    image: ghcr.io/psiphon-inc/conduit/cli:latest
    container_name: conduit
    restart: unless-stopped
    
    # Host networking for proxy traffic relay
    network_mode: host
    
    volumes:
      # Persistent storage for keys and state
      - ~/persistent/conduit/data:/data
      
    command:
      - start
      - --max-clients=25 # Maximum concurrent clients
      - --bandwidth=40 # Bandwidth limit per peer in Mbps
      - --data-dir=/data # Directory for keys and state
      
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
