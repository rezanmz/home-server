services:
  loggifly:
    image: ghcr.io/clemcer/loggifly:v2.0.1
    container_name: loggifly
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=America/Toronto
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ~/persistent/loggifly/config:/config
    networks:
      - home-server
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

networks:
  home-server:
    external: true
