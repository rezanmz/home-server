services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:v2.1.1-ls221
    container_name: syncthing
    hostname: syncthing
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - ~/persistent/syncthing/config:/config
      - ~/persistent/syncthing/data:/data
    # Web UI (8384) is internal-only, accessed via SWAG reverse proxy
    expose:
      - "8384"
    # Sync protocol ports must be exposed directly to the host
    ports:
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    networks:
      - home-server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: curl -fsk https://localhost:8384/rest/noauth/health || exit 1
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

networks:
  home-server:
    external: true
