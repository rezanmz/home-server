services:
  mcphub:
    image: samanhappy/mcphub:1.0.17-full
    container_name: mcphub
    environment:
      - DB_URL=postgresql://mcphub:mcphub_pass@mcphub-postgres:5432/mcphub
      - PORT=3000
      - NODE_ENV=production
      - ADMIN_PASSWORD=${MCPHUB_ADMIN_PASSWORD:?MCPHUB_ADMIN_PASSWORD must be set}
    expose:
      - "3000"
    depends_on:
      mcphub-postgres:
        condition: service_healthy
    volumes:
      - ~/persistent/mcphub/.env:/app/.env
      - ~/persistent/mcphub/mcp_settings.json:/app/mcp_settings.json
      - ~/persistent/mcphub/data:/app/data
    restart: unless-stopped
    networks:
      - home-server
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  mcphub-postgres:
    image: pgvector/pgvector:pg16
    container_name: mcphub-postgres
    environment:
      POSTGRES_DB: mcphub
      POSTGRES_USER: mcphub
      POSTGRES_PASSWORD: mcphub_pass
    volumes:
      - ~/persistent/mcphub/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcphub"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - home-server
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

networks:
  home-server:
    external: true
