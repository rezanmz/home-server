server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name chat.*;

    include /config/nginx/ssl.conf;
    
    # Move proxy config up to the server block so we can override specific directives below
    include /config/nginx/proxy.conf;
    include /config/nginx/resolver.conf;

    client_max_body_size 0;

    error_page 403 /403.html;
    location = /403.html {
        root /config/www;
        internal;
    }

    location / {
        # Restrict access to Local LAN and VPN only
        allow 192.168.2.0/24;
        allow 10.8.0.0/24;
        allow 172.16.0.0/12;
        deny all;

        set $upstream_app open-webui;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # WebSockets support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Disable buffering and extend timeouts to fix 'invalid JSON' errors for long LLM generations
        proxy_buffering off;
        proxy_read_timeout 86400s; 
        proxy_send_timeout 86400s;
        proxy_connect_timeout 86400s;
    }
}
