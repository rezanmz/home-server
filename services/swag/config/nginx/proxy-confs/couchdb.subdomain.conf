server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name couchdb.*;

    include /config/nginx/ssl.conf;

    # Allow large sync payloads (Obsidian vault attachments)
    client_max_body_size 50m;

    error_page 403 /403.html;
    location = /403.html {
        root /config/www;
        internal;
    }

    location / {
        # Publicly accessible — CouchDB enforces its own authentication
        # (require_valid_user = true in local.ini)
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        # WebSocket support for CouchDB _changes feed
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        set $upstream_app couchdb;
        set $upstream_port 5984;
        set $upstream_proto http;

        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
