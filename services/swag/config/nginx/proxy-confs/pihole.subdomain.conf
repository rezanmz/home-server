server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name pihole.*;

    include /config/nginx/ssl.conf;
    client_max_body_size 5m;

    location / {
        # Restrict access to Local LAN and VPN only
        allow 192.168.2.0/24;
        allow 10.8.0.0/24;
        allow 172.16.0.0/12;
        deny all;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        # Direct proxy pass bypasses SWAG's internal DNS resolver 
        proxy_pass http://192.168.2.2:8181;
    }
}
