# Drop connections from unrecognized Host headers (e.g. direct IP access,
# scanners, or bots). Without this, nginx routes unknown hosts to the
# alphabetically-first server block, leaking the existence of the proxy.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    include /config/nginx/ssl.conf;

    # 444 is nginx-specific: silently close the connection with no response.
    return 444;
}
