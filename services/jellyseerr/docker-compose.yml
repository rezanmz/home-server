services:
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:v3.1.0
    init: true
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=EST
    volumes:
      - ~/persistent/jellyseerr/config:/app/config
    ports:
      - "5055:5055"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    networks:
      - home-server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  home-server:
    external: true