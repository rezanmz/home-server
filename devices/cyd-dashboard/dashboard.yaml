substitutions:
  device_name: cyd-dashboard
  friendly_name: CYD Dashboard

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.2.0
  on_boot:
    priority: -100
    then:
      - script.execute: refresh_summary

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: WARN

json:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

http_request:
  useragent: ${device_name}
  timeout: 10s
  verify_ssl: true

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13

output:
  - platform: gpio
    pin: GPIO21
    id: display_backlight

light:
  - platform: binary
    output: display_backlight
    id: backlight
    restore_mode: ALWAYS_ON

font:
  - file: gfonts://Roboto
    id: title_font
    size: 28
  - file: gfonts://Roboto
    id: amount_font
    size: 52
  - file: gfonts://Roboto
    id: detail_font
    size: 16

globals:
  - id: net_worth_cents
    type: int64_t
    restore_value: no
    initial_value: '0'
  - id: currency
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: as_of
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: summary_stale
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: status
    type: std::string
    restore_value: no
    initial_value: '"Waiting for data"'

display:
  - platform: mipi_spi
    id: dashboard_display
    model: ILI9341
    cs_pin: GPIO15
    dc_pin: GPIO2
    reset_pin: GPIO4
    rotation: 90
    update_interval: never
    lambda: |-
      it.fill(Color::BLACK);
      it.printf(16, 18, id(title_font), Color(0x00, 0xB8, 0xD4), "NET WORTH");

      const int64_t cents = id(net_worth_cents);
      const uint64_t absolute_cents = cents < 0 ? static_cast<uint64_t>(-(cents + 1)) + 1 : cents;
      char amount[32];
      snprintf(
        amount,
        sizeof(amount),
        "%s%llu.%02llu",
        cents < 0 ? "-" : "",
        static_cast<unsigned long long>(absolute_cents / 100),
        static_cast<unsigned long long>(absolute_cents % 100));
      it.printf(16, 78, id(amount_font), cents < 0 ? Color(0xFF, 0x6B, 0x6B) : Color(0xF8, 0xF8, 0xF2), "%s", amount);

      if (!id(currency).empty()) {
        it.printf(18, 140, id(detail_font), Color(0x9A, 0xA0, 0xA6), "%s", id(currency).c_str());
      }

      const char *state = id(summary_stale) ? "STALE" : "CURRENT";
      const Color state_color = id(summary_stale) ? Color(0xFF, 0xB8, 0x6C) : Color(0x63, 0xD4, 0x71);
      it.printf(16, 190, id(detail_font), state_color, "%s", state);
      it.printf(16, 214, id(detail_font), Color(0x9A, 0xA0, 0xA6), "%s", id(status).c_str());

script:
  - id: refresh_summary
    mode: single
    then:
      - http_request.get:
          url: !secret finance_display_url
          request_headers:
            Authorization: !secret finance_display_authorization
          capture_response: true
          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - lambda: |-
                        const bool parsed = json::parse_json(body, [](JsonObject root) -> bool {
                          if (!root["netWorthCents"].is<int64_t>() || !root["asOf"].is<const char *>()) {
                            return false;
                          }
                          id(net_worth_cents) = root["netWorthCents"].as<int64_t>();
                          id(currency) = root["currency"].is<const char *>() ? root["currency"].as<const char *>() : "";
                          id(as_of) = root["asOf"].as<const char *>();
                          id(summary_stale) = root["stale"] | true;
                          id(status) = id(as_of).substr(0, 16) + " UTC";
                          return true;
                        });
                        if (!parsed) {
                          id(summary_stale) = true;
                          id(status) = "Invalid summary response";
                        }
                        id(dashboard_display).update();
                  else:
                    - lambda: |-
                        id(summary_stale) = true;
                        id(status) = "HTTP " + to_string(response->status_code);
                        id(dashboard_display).update();

interval:
  - interval: 60s
    then:
      - script.execute: refresh_summary
