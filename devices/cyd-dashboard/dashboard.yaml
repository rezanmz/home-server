substitutions:
  device_name: cyd-dashboard
  friendly_name: CYD Dashboard

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.2.0
  on_boot:
    priority: -100
    then:
      - script.execute: refresh_summary

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: WARN

json:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

http_request:
  useragent: ${device_name}
  timeout: 10s
  verify_ssl: true

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13

output:
  - platform: gpio
    pin: GPIO21
    id: display_backlight

light:
  - platform: binary
    output: display_backlight
    id: backlight
    restore_mode: ALWAYS_ON

font:
  - file: gfonts://Roboto+Condensed
    id: title_font
    size: 30
  - file: gfonts://Roboto+Condensed
    id: amount_font
    size: 50
  - file: gfonts://Roboto+Condensed
    id: account_font
    size: 20
  - file: gfonts://Roboto+Mono
    id: detail_font
    size: 14

globals:
  - id: net_worth_cents
    type: int64_t
    restore_value: no
    initial_value: '0'
  - id: currency
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: as_of
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: oldest_reconciled_account_name
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: oldest_reconciled_on
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: oldest_reconciled_days_ago
    type: int
    restore_value: no
    initial_value: '-1'
  - id: summary_stale
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: status
    type: std::string
    restore_value: no
    initial_value: '"Waiting for data"'

display:
  - platform: mipi_spi
    id: dashboard_display
    model: ILI9341
    cs_pin: GPIO15
    dc_pin: GPIO2
    reset_pin: GPIO4
    rotation: 90
    update_interval: never
    lambda: |-
      const Color background(0x08, 0x0D, 0x18);
      const Color surface(0x10, 0x18, 0x2A);
      const Color text(0xF3, 0xF7, 0xFF);
      const Color muted(0x8B, 0x99, 0xAF);
      const Color accent(0x43, 0xD9, 0xC3);
      const Color warning(0xFF, 0xB8, 0x6C);
      const Color negative(0xFF, 0x78, 0x8B);
      const Color state_color = id(summary_stale) ? warning : accent;

      it.fill(background);
      it.filled_rectangle(0, 0, 320, 5, accent);
      it.printf(16, 16, id(detail_font), muted, "PERSONAL FINANCE");
      it.printf(236, 16, id(detail_font), state_color, id(summary_stale) ? "STALE" : "LIVE");
      it.printf(16, 38, id(title_font), accent, "NET WORTH");

      const int64_t cents = id(net_worth_cents);
      const uint64_t absolute_cents = cents < 0 ? static_cast<uint64_t>(-(cents + 1)) + 1 : cents;
      char whole[24];
      snprintf(whole, sizeof(whole), "%llu", static_cast<unsigned long long>(absolute_cents / 100));
      char amount[32];
      size_t cursor = 0;
      if (cents < 0) {
        amount[cursor++] = '-';
      }
      const size_t whole_length = strlen(whole);
      for (size_t index = 0; index < whole_length; index++) {
        if (index > 0 && (whole_length - index) % 3 == 0) {
          amount[cursor++] = ',';
        }
        amount[cursor++] = whole[index];
      }
      snprintf(
        amount + cursor,
        sizeof(amount) - cursor,
        ".%02llu",
        static_cast<unsigned long long>(absolute_cents % 100));
      it.printf(16, 66, id(amount_font), cents < 0 ? negative : text, "%s", amount);
      if (!id(currency).empty()) {
        it.printf(18, 116, id(detail_font), muted, "%s", id(currency).c_str());
      }

      it.filled_rectangle(16, 134, 288, 1, Color(0x25, 0x35, 0x4D));
      it.filled_rectangle(12, 146, 4, 58, warning);
      it.filled_rectangle(16, 146, 292, 58, surface);
      it.printf(28, 152, id(detail_font), warning, "RECONCILIATION / OLDEST OPEN ACCOUNT");
      it.printf(
        28,
        169,
        id(account_font),
        text,
        "%.24s",
        id(oldest_reconciled_account_name).empty() ? "Account unavailable" : id(oldest_reconciled_account_name).c_str());
      if (id(oldest_reconciled_on).empty()) {
        it.printf(28, 190, id(detail_font), muted, "NO RECONCILIATION RECORD");
      } else {
        it.printf(
          28,
          190,
          id(detail_font),
          muted,
          "LAST RECONCILED %s / %d DAYS AGO",
          id(oldest_reconciled_on).c_str(),
          id(oldest_reconciled_days_ago));
      }

      it.filled_circle(18, 222, 3, state_color);
      it.printf(28, 214, id(detail_font), muted, "%s", id(status).c_str());

script:
  - id: refresh_summary
    mode: single
    then:
      - http_request.get:
          url: !secret finance_display_url
          request_headers:
            Authorization: !secret finance_display_authorization
          capture_response: true
          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - lambda: |-
                        const bool parsed = json::parse_json(body, [](JsonObject root) -> bool {
                          if (!root["netWorthCents"].is<int64_t>() || !root["asOf"].is<const char *>()) {
                            return false;
                          }
                          id(net_worth_cents) = root["netWorthCents"].as<int64_t>();
                          id(currency) = root["currency"].is<const char *>() ? root["currency"].as<const char *>() : "";
                          id(as_of) = root["asOf"].as<const char *>();
                          id(oldest_reconciled_account_name) = root["oldestReconciledAccountName"].is<const char *>() ? root["oldestReconciledAccountName"].as<const char *>() : "";
                          id(oldest_reconciled_on) = root["oldestReconciledOn"].is<const char *>() ? root["oldestReconciledOn"].as<const char *>() : "";
                          id(oldest_reconciled_days_ago) = root["oldestReconciledDaysAgo"].is<int>() ? root["oldestReconciledDaysAgo"].as<int>() : -1;
                          id(summary_stale) = root["stale"] | true;
                          id(status) = id(as_of).substr(0, 16) + " UTC";
                          return true;
                        });
                        if (!parsed) {
                          id(summary_stale) = true;
                          id(status) = "Invalid summary response";
                        }
                        id(dashboard_display).update();
                  else:
                    - lambda: |-
                        id(summary_stale) = true;
                        id(status) = "HTTP " + to_string(response->status_code);
                        id(dashboard_display).update();

interval:
  - interval: 15s
    then:
      - script.execute: refresh_summary
