version: 1

# This catalog owns cross-service integration intent. Kubernetes manifests
# remain the runtime source of truth; generated aggregate files are committed
# so their changes remain visible in pull requests.
dns:
  splitHorizonAddress: 192.168.1.240
  extraPublicNames:
    - reza.network

homepage:
  groups:
    - Home & Identity
    - Media
    - Downloads & Automation
    - AI & Data
    - Operations
    - Infrastructure

registrationExclusions:
  - path: apps/duplicati
    reason: Retired workload; only its rollback PVC remains in the root reconciliation.

services:
  - id: home-assistant
    name: Home Assistant
    path: apps/home-assistant
    workload:
      namespace: apps
      app: home-assistant
    homepage:
      group: Home & Identity
      icon: home-assistant.png
      description: Home automation
    web:
      hostname: homeassistant.reza.network
      route: apps/home-assistant/route.yaml
      visibility: public
      dns: {cloudflare: true, splitHorizon: true}
      auth:
        mode: native
        reason: Upstream Home Assistant has no built-in OIDC provider; use its native authentication.
    placement:
      mode: beelink
      manifest: apps/home-assistant/deployment.yaml
      reason: Keeps third-party integrations and selected LAN egress off the Pi's trusted NFS host.
    data:
      class: longhorn
      protection: longhorn-b2
      manifests: [apps/home-assistant/pvc.yaml]
    observability: {mode: kubernetes}

  - id: homepage
    name: Homepage
    path: apps/homepage
    workload:
      namespace: apps
      app: homepage
    homepage:
      enabled: false
      reason: The dashboard does not need a card linking back to itself.
    web:
      hostname: homepage.reza.network
      route: apps/homepage/route.yaml
      visibility: private
      accessMiddleware: lan-vpn-only
      dns: {cloudflare: true, splitHorizon: true}
      auth:
        mode: forward-auth
        blueprint: homepage.yaml
        application: homepage
        middleware: homepage-authentik
    placement: {mode: floating}
    data: {class: stateless, protection: not-applicable}
    observability: {mode: kubernetes}

  - id: authentik
    name: Authentik
    path: apps/authentik
    workload:
      namespace: apps
      app: authentik
    homepage:
      group: Home & Identity
      icon: authentik.png
      description: Identity and single sign-on
    web:
      hostname: auth.reza.network
      route: apps/authentik/route.yaml
      visibility: public
      dns: {cloudflare: true, splitHorizon: true}
      auth:
        mode: native
        reason: Authentik is the cluster identity provider and authenticates its own administrative UI.
    placement: {mode: floating}
    data:
      class: longhorn
      protection: longhorn-b2
      manifests: [apps/authentik/pvc.yaml]
    observability: {mode: kubernetes}

  - id: actual-budget
    name: Actual Budget
    path: apps/actual-budget
    workload:
      namespace: apps
      app: actual-budget
    homepage:
      group: Home & Identity
      icon: actual-budget.png
      description: Personal finance
    web:
      hostname: budget.reza.network
      route: apps/actual-budget/route.yaml
      visibility: private
      accessMiddleware: lan-vpn-only
      dns: {cloudflare: true, splitHorizon: true}
      auth:
        mode: oidc
        blueprint: actual-budget.yaml
        application: actual-budget
        client: confidential
        secretEnv: AUTHENTIK_OIDC_ACTUAL_BUDGET_CLIENT_SECRET
        secretFiles:
          - path: apps/authentik/oidc-client-secrets.sops.yaml
            key: AUTHENTIK_OIDC_ACTUAL_BUDGET_CLIENT_SECRET
          - path: apps/actual-budget/secrets.sops.yaml
            key: openid-client-secret
    placement: {mode: floating}
    data:
      class: longhorn
      protection: longhorn-b2
      manifests: [apps/actual-budget/pvc.yaml]
    observability: {mode: kubernetes}

  - id: speedtest-tracker
    name: Speedtest Tracker
    path: apps/speedtest-tracker
    workload:
      namespace: apps
      app: speedtest-tracker
    homepage:
      group: Home & Identity
      icon: speedtest-tracker.png
      description: Internet performance history
    web:
      hostname: speedtest.reza.network
      route: apps/speedtest-tracker/route.yaml
      visibility: private
      accessMiddleware: lan-vpn-only
      dns: {cloudflare: true, splitHorizon: true}
      auth:
        mode: native
        reason: Speedtest Tracker uses its built-in account; no supported native OIDC integration is configured.
    placement: {mode: floating}
    data:
      class: longhorn
      protection: longhorn-b2
      manifests: [apps/speedtest-tracker/pvc.yaml]
    observability: {mode: kubernetes}

  - id: jellyfin
    name: Jellyfin
    path: apps/jellyfin
    workload:
      namespace: media
      app: jellyfin
    homepage:
      group: Media
      icon: jellyfin.png
      description: Movies and television
    web:
      hostname: jellyfin.reza.network
      route: apps/jellyfin/route.yaml
      visibility: private
      accessMiddleware: lan-vpn-only
      dns: {cloudflare: true, splitHorizon: true}
      auth:
        mode: native
        reason: Jellyfin uses its supported local user authentication and official clients.
    placement:
      mode: beelink
      manifest: apps/jellyfin/deployment.yaml
      reason: Requires the Beelink AMD GPU for hardware transcoding and LAN discovery.
    data:
      class: mixed
      protection: longhorn-b2
      manifests:
        - apps/jellyfin/pvc.yaml
        - infrastructure/nfs-media/media.yaml
      note: Longhorn protects configuration; the NFS media library is deliberately reproducible.
    observability: {mode: kubernetes}

  - id: jellyseerr
    name: Jellyseerr
    path: apps/jellyseerr
    workload:
      namespace: apps
      app: jellyseerr
    homepage:
      group: Media
      icon: jellyseerr.png
      description: Media requests
    web:
      hostname: jellyseerr.reza.network
      route: apps/jellyseerr/route.yaml
      visibility: private
      accessMiddleware: lan-vpn-only
      dns: {cloudflare: true, splitHorizon: true}
      auth:
        mode: native
        reason: Jellyseerr uses its supported Jellyfin/local login; native OIDC is not available.
    placement: {mode: floating}
    data:
      class: longhorn
      protection: longhorn-b2
      manifests: [apps/jellyseerr/pvc.yaml]
    observability: {mode: kubernetes}

  - id: audiobookshelf
    name: Audiobookshelf
    path: apps/audiobookshelf
    workload:
      namespace: media
      app: audiobookshelf
    homepage:
      group: Media
      icon: audiobookshelf.png
      description: Audiobooks and podcasts
    web:
      hostname: audiobooks.reza.network
      route: apps/audiobookshelf/route.yaml
      visibility: public
      dns: {cloudflare: true, splitHorizon: true}
      auth:
        mode: oidc
        blueprint: audiobookshelf.yaml
        application: audiobookshelf
        client: confidential
        secretEnv: AUTHENTIK_OIDC_AUDIOBOOKSHELF_CLIENT_SECRET
        secretFiles:
          - path: apps/authentik/oidc-client-secrets.sops.yaml
            key: AUTHENTIK_OIDC_AUDIOBOOKSHELF_CLIENT_SECRET
          - path: apps/audiobookshelf/secrets.sops.yaml
            key: oidc-client-secret
    placement:
      mode: beelink
      manifest: apps/audiobookshelf/deployment.yaml
      reason: Prevents a public workload from inheriting the Pi pod CIDR's private-route trust.
    data:
      class: mixed
      protection: longhorn-b2
      manifests:
        - apps/audiobookshelf/pvc.yaml
        - infrastructure/nfs-media/media.yaml
      note: Configuration and metadata are backed up; NFS audiobooks and downloaded podcast media are outside Longhorn.
    observability: {mode: kubernetes}

  - id: calibre-web
    name: Calibre-Web
    path: apps/calibre-web
    workload:
      namespace: media
      app: calibre-web
    homepage:
      group: Media
      icon: calibre-web.png
      description: Ebook library
    web:
      hostname: library.reza.network
      route: apps/calibre-web/routes.yaml
      visibility: private
      accessMiddleware: lan-vpn-only
      dns: {cloudflare: true, splitHorizon: true}
      auth:
        mode: native
        reason: Calibre-Web uses its built-in account authentication; the route is LAN/WireGuard-only.
    placement:
      mode: beelink
      manifest: apps/calibre-web/workloads.yaml
      reason: Shares the calibre-web-ingest Longhorn RWO claim with the downloads pod.
    data:
      class: mixed
      protection: longhorn-b2
      manifests:
        - apps/calibre-web/pvc.yaml
        - infrastructure/nfs-media/media.yaml
      note: Longhorn protects configuration and ingest state; the NFS book library is treated as reproducible.
    observability: {mode: kubernetes}

  - id: qbittorrent
    name: qBittorrent
    path: apps/downloads
    workload:
      namespace: media
      app: media-vpn
    homepage:
      group: Downloads & Automation
      icon: qbittorrent.png
      description: VPN-routed downloads
    web:
      hostname: qbittorrent.reza.network
      route: apps/downloads/route.yaml
      visibility: private
      accessMiddleware: lan-vpn-only
      dns: {cloudflare: true, splitHorizon: true}
      auth:
        mode: native
        reason: qBittorrent uses its built-in Web UI authentication behind the LAN/WireGuard boundary.
    placement:
      mode: beelink
      manifest: apps/downloads/deployment.yaml
      reason: Runs in the shared Gluetun network namespace and mounts shared Longhorn RWO claims.
    data:
      class: mixed
      protection: longhorn-b2
      manifests:
        - apps/downloads/pvc.yaml
        - infrastructure/nfs-media/media.yaml
      note: Longhorn protects application configuration; downloaded NFS media is reproducible.
    observability: {mode: kubernetes}

  - id: prowlarr
    name: Prowlarr
    path: apps/prowlarr
    workload:
      namespace: media
      app: media-vpn
    homepage:
      group: Downloads & Automation
      icon: prowlarr.png
      description: Indexer management
    web:
      hostname: prowlarr.reza.network
      route: apps/prowlarr/route.yaml
      visibility: private
      accessMiddleware: lan-vpn-only
      dns: {cloudflare: true, splitHorizon: true}
      auth:
        mode: native
        reason: Prowlarr uses its built-in authentication behind the LAN/WireGuard boundary.
    placement:
      mode: beelink
      manifest: apps/downloads/deployment.yaml
      reason: Its container shares the downloads pod's Gluetun network namespace.
    data:
      class: longhorn
      protection: longhorn-b2
      manifests: [apps/prowlarr/pvc.yaml]
    observability: {mode: kubernetes}

  - id: radarr
