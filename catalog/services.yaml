      app: kea-dhcp4
    homepage:
      group: Infrastructure
      icon: mdi-router-network
      description: Authoritative LAN DHCP
      link: false
    placement:
      mode: beelink
      manifest: apps/kea/deployment.yaml
      reason: Official image is amd64-only and DHCP requires the Beelink LAN interface.
    data:
      class: longhorn
      protection: longhorn-b2
      manifests: [apps/kea/pvc.yaml]
    observability:
      mode: metrics
      manifests:
        - apps/kea/metrics.yaml
