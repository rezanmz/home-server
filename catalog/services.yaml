  - id: shelfmark
    name: Shelfmark
    path: apps/calibre-web
    workload:
      namespace: media
      app: media-vpn
    homepage:
      group: Downloads & Automation
      icon: mdi-bookshelf
      description: Ebook acquisition
    web:
      hostname: shelfmark.reza.network
      route: apps/calibre-web/routes.yaml
      visibility: private
      accessMiddleware: lan-vpn-only
      dns: {cloudflare: true, splitHorizon: true}
      auth:
        mode: none
        reason: Shelfmark has no supported native SSO; both route and in-pod proxy restrict it to LAN/WireGuard clients.
    placement:
      mode: beelink
      manifest: apps/downloads/deployment.yaml
      reason: Its container shares the downloads pod and calibre-web-ingest Longhorn RWO claim.
    data:
      class: mixed
      protection: longhorn-b2
      manifests:
        - apps/calibre-web/pvc.yaml
        - infrastructure/nfs-media/media.yaml
      note: Longhorn protects configuration and ingest state; the NFS book library is reproducible.
    observability: {mode: kubernetes}

  - id: open-webui
    name: Open WebUI
    path: apps/open-webui
    workload:
      namespace: apps
      app: open-webui
    homepage:
      group: AI & Data
      icon: open-webui.png
      description: Local AI chat
    web:
      hostname: chat.reza.network
      route: apps/open-webui/route.yaml
      visibility: public
      dns: {cloudflare: true, splitHorizon: true}
      auth:
        mode: oidc
        blueprint: open-webui.yaml
        application: open-webui
        client: confidential
        secretEnv: AUTHENTIK_OIDC_OPEN_WEBUI_CLIENT_SECRET
        secretFiles:
          - path: apps/authentik/oidc-client-secrets.sops.yaml
            key: AUTHENTIK_OIDC_OPEN_WEBUI_CLIENT_SECRET
          - path: apps/open-webui/secrets.sops.yaml
            key: oauth-client-secret
    placement: {mode: floating}
    data:
      class: longhorn
      protection: longhorn-b2
      manifests: [apps/open-webui/pvc.yaml]
    observability: {mode: kubernetes}

  - id: mcphub
    name: MCPHub
    path: apps/mcphub
    workload:
      namespace: apps
      app: mcphub
    homepage:
      group: AI & Data
      icon: mdi-hubspot
      description: MCP service registry
    web:
      hostname: mcphub.reza.network
      route: apps/mcphub/route.yaml
      visibility: private
