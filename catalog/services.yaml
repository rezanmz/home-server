  - id: argilla
    name: Argilla
    path: apps/argilla
    workload:
      namespace: apps
      app: argilla
    homepage:
      group: AI & Data
      icon: mdi-database-edit
      description: Dataset curation and annotation
    web:
      hostname: argilla.reza.network
      route: apps/argilla/route.yaml
      visibility: public
      dns: {cloudflare: true, splitHorizon: true}
      auth:
        mode: native
        reason: Argilla uses its supported application users and API authentication; native OIDC is unavailable.
    placement: {mode: floating}
    data:
      class: longhorn
      protection: longhorn-b2
      manifests: [apps/argilla/pvc.yaml]
    observability: {mode: kubernetes}

  - id: grafana
    name: Grafana
    path: infrastructure/observability
    workload:
      namespace: monitoring
      app: grafana
    homepage:
      group: Operations
      icon: grafana.png
      description: Metrics, alerts, and backup health
    web:
      hostname: grafana.reza.network
      route: infrastructure/observability/route.yaml
      visibility: private
      accessMiddleware: grafana-lan-only
      dns: {cloudflare: true, splitHorizon: true}
      auth:
        mode: oidc
        blueprint: grafana.yaml
        application: grafana
        client: confidential
        secretEnv: AUTHENTIK_OIDC_GRAFANA_CLIENT_SECRET
        secretFiles:
          - path: apps/authentik/oidc-client-secrets.sops.yaml
            key: AUTHENTIK_OIDC_GRAFANA_CLIENT_SECRET
          - path: infrastructure/observability/grafana-secrets.sops.yaml
            key: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
    placement: {mode: floating}
    data:
      class: longhorn-observability
      protection: excluded-observability
      manifests:
        - infrastructure/observability/storage-class.yaml
        - infrastructure/observability/release.yaml
      note: UI preferences are expendable; repository-managed dashboards remain in Git.
    observability:
      mode: platform
      manifests:
        - infrastructure/observability/release.yaml
        - infrastructure/observability/dashboard.yaml
        - infrastructure/observability/backup-dashboard.yaml

