          - path: apps/headlamp/secrets.sops.yaml
            key: client-secret
    placement: {mode: floating}
    data: {class: stateless, protection: not-applicable}
    observability: {mode: kubernetes}

  - id: stork
    name: ISC Stork
    path: apps/stork
    workload:
      namespace: network-services
      podSelector: app.kubernetes.io/name=stork, app.kubernetes.io/component in (server,database)
    homepage:
      group: Operations
      icon: mdi-bird
      description: Read-only DHCP inventory
    web:
      hostname: stork.reza.network
      route: apps/stork/route.yaml
      visibility: private
      accessMiddleware: lan-vpn-only
      dns: {cloudflare: true, splitHorizon: true}
      auth:
        mode: oidc
        blueprint: stork.yaml
        application: stork
        client: public
    placement:
      mode: beelink
      manifest: apps/stork/workloads.yaml
      reason: Audited Stork images are amd64 and the agent monitors Beelink-hosted Kea.
    data:
      class: longhorn
      protection: longhorn-b2
      manifests: [apps/stork/pvc.yaml]
    observability:
      mode: metrics
      manifests:
        - apps/stork/monitoring.yaml
        - infrastructure/observability/network-services-dashboard.yaml

  - id: syncthing
    name: Syncthing
    path: apps/syncthing
    workload:
      namespace: network-services
      app: syncthing
    homepage:
      group: Operations
      icon: syncthing.png
      description: File synchronization
    web:
      hostname: syncthing.reza.network
      route: apps/syncthing/route.yaml
      visibility: private
      accessMiddleware: syncthing-lan-only
      dns: {cloudflare: true, splitHorizon: true}
      auth:
        mode: native
        reason: Syncthing uses native GUI authentication behind a backend-mTLS and LAN/WireGuard boundary.
    placement:
      mode: raspberrypi
      manifest: apps/syncthing/deployment.yaml
      reason: Requires stable LAN discovery/direct-sync ports and Pi-local NFS data.
    data:
      class: mixed
      protection: longhorn-and-restic-b2
      manifests:
        - apps/syncthing/storage.yaml
        - apps/syncthing/backups/cronjob.yaml
      note: Longhorn protects configuration while selected NFS folders use the independent Restic B2 policy.
    observability: {mode: kubernetes}

  - id: wireguard
    name: WireGuard
    path: apps/vpn
    workload:
      namespace: network-services
      app: wg-easy
    homepage:
      group: Operations
      icon: wireguard.png
      description: Remote access VPN
    web:
      hostname: vpn.reza.network
      route: apps/vpn/route.yaml
      visibility: private
      accessMiddleware: wg-easy-lan-only
      dns: {cloudflare: true, splitHorizon: true}
      auth:
        mode: native
        reason: wg-easy uses its native administrative authentication and is LAN/WireGuard-only.
    placement:
      mode: raspberrypi
      manifest: apps/vpn/deployment.yaml
      reason: The router forwards UDP 1234 to the Pi and the workload uses that host port.
    data:
      class: longhorn
      protection: longhorn-b2
      manifests: [apps/vpn/pvc.yaml]
    observability: {mode: kubernetes}

  - id: blocky
    name: Blocky DNS
    path: apps/blocky
    workload:
      namespace: network-services
      app: blocky
    homepage:
      group: Infrastructure
      icon: mdi-dns
      description: Filtering DNS on the Pi
      link: false
    placement:
      mode: raspberrypi
      manifest: apps/blocky/deployment.yaml
      reason: Preserves the established LAN resolver address and host-network binding.
    data:
      class: longhorn-observability
      protection: excluded-observability
      manifests: [apps/blocky/pvc.yaml]
      note: The denylist cache is reproducible and deliberately excluded from off-site backups.
    observability:
      mode: metrics
      manifests:
        - apps/blocky/metrics.yaml
        - infrastructure/observability/network-services-dashboard.yaml

  - id: kea
