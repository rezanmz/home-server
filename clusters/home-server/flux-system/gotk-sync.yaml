apiVersion: v1
kind: Namespace
metadata:
  name: flux-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  timeout: 60s
  url: https://github.com/rezanmz/home-server.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 20m
  path: ./clusters/home-server
  # Keep orphaned objects until an operator reviews the diff. This prevents a
  # bad or incomplete reconciliation from deleting live workloads, Secrets, or
  # PVCs. Cleanup is explicit and separately reviewed.
  prune: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
